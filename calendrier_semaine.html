<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feuille de semaine — Messes</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1108">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* ── Sélecteur de semaine ────────────────────────────────── */
    .week-picker-wrap {
        background: var(--vellum-light);
        border: 1px solid var(--border);
        border-top: 3px solid var(--gold);
        border-radius: 2px;
        padding: 20px 20px 18px;
        margin-bottom: 20px;
        box-shadow: 0 2px 10px var(--shadow);
    }
    .week-label {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .24em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 10px;
    }
    .week-nav {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
    }
    .week-nav input[type=date] {
        flex: 1;
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
    }
    .week-display {
        font-family: 'EB Garamond', serif;
        font-size: .95rem;
        font-style: italic;
        color: var(--ink-soft);
        text-align: center;
        min-height: 1.4em;
        margin-bottom: 14px;
    }
    .week-nav-btns {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
    }
    .btn-week-nav {
        flex: 1;
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: 9px 0;
        border: 1px solid var(--border-soft);
        background: var(--vellum);
        color: var(--ink-muted);
        border-radius: 2px;
        cursor: pointer;
        transition: all .2s;
    }
    .btn-week-nav:hover { border-color: var(--border); color: var(--ink); background: var(--gold-pale); }
    .btn-week-nav.active { border-color: var(--gold); color: var(--gold); }

    /* ── Aperçu semaine ──────────────────────────────────────── */
    .preview-section { margin-bottom: 20px; }
    .preview-day {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-left: 3px solid var(--border-soft);
        border-radius: 2px;
        margin-bottom: 8px;
        overflow: hidden;
        animation: fadeInUp .3s ease both;
    }
    .preview-day.has-messe { border-left-color: var(--rubric); }
    .preview-day-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px 9px 12px;
        border-bottom: 1px solid var(--border-soft);
        background: rgba(26,17,8,.025);
    }
    .preview-day-nom {
        font-family: 'Cinzel', serif;
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .08em;
        color: var(--ink);
    }
    .preview-day-fete {
        font-family: 'EB Garamond', serif;
        font-size: .78rem;
        font-style: italic;
        color: var(--ink-muted);
        text-align: right;
        max-width: 55%;
        line-height: 1.2;
    }
    .preview-events { padding: 6px 12px 8px 12px; }
    .preview-evt {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 2px 0;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink-soft);
    }
    .preview-evt.is-messe {
        color: var(--rubric);
        font-weight: 600;
    }
    .preview-evt-heure {
        font-family: 'Cinzel', serif;
        font-size: .68rem;
        min-width: 48px;
        color: var(--ink-muted);
    }
    .preview-evt.is-messe .preview-evt-heure { color: var(--rubric); }
    .preview-note {
        font-family: 'EB Garamond', serif;
        font-size: .8rem;
        font-style: italic;
        color: var(--rubric);
        padding: 3px 12px 4px;
        border-bottom: 1px solid var(--border-soft);
        background: rgba(139,26,26,.035);
    }
    .preview-empty {
        font-family: 'EB Garamond', serif;
        font-size: .82rem;
        font-style: italic;
        color: var(--ink-muted);
        opacity: .7;
        padding: 4px 0;
    }

    /* ── Bouton générer ──────────────────────────────────────── */
    .generate-zone {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-top: 3px solid var(--rubric);
        border-radius: 2px;
        padding: 20px;
        text-align: center;
    }
    .btn-generate {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Cinzel', serif;
        font-size: .72rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        padding: 14px 28px;
        background: var(--rubric);
        color: var(--ink);
        border: none;
        border-radius: 2px;
        cursor: pointer;
        transition: all .2s;
        width: 100%;
        justify-content: center;
    }
    .btn-generate:hover { background: var(--rubric-light); }
    .btn-generate:disabled { opacity: .5; cursor: not-allowed; }
    .btn-generate .icon { font-size: 1.1rem; }
    .generate-hint {
        font-family: 'EB Garamond', serif;
        font-size: .8rem;
        font-style: italic;
        color: var(--ink-muted);
        margin-top: 10px;
    }

    /* ── État chargement / erreur ────────────────────────────── */
    .loading-overlay {
        display: none;
        text-align: center;
        padding: 32px 0;
        color: var(--ink-muted);
        font-style: italic;
        font-size: .9rem;
    }
    .loading-overlay.visible { display: block; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    /* ── Drag-and-drop ───────────────────────────────────────── */
    .draggable-item {
        cursor: grab;
        position: relative;
        transition: opacity .15s, background .15s;
    }
    .draggable-item:active { cursor: grabbing; }
    .draggable-item .drag-handle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        color: var(--border-soft);
        font-size: .75rem;
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
        transition: color .15s;
        touch-action: none;
    }
    .draggable-item:hover .drag-handle { color: var(--ink-muted); }

    /* Item en cours de drag */
    .drag-ghost {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        background: var(--gold-pale);
        border: 1px solid var(--gold);
        border-radius: 3px;
        padding: 6px 10px;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink);
        box-shadow: 0 4px 20px rgba(0,0,0,.25);
        max-width: 220px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: .92;
    }

    /* Item source pendant le drag */
    .drag-source {
        opacity: .35;
    }

    /* Zone de dépôt active */
    .preview-day.drop-target {
        border-left-color: var(--gold) !important;
        background: rgba(184,150,42,.06);
        transition: background .15s, border-left-color .15s;
    }
    .preview-day.drop-target .preview-events {
        outline: 2px dashed rgba(184,150,42,.4);
        outline-offset: -3px;
        border-radius: 2px;
    }

    /* Indicateur de position d'insertion */
    .drop-indicator {
        height: 2px;
        background: var(--gold);
        border-radius: 1px;
        margin: 2px 0;
        display: none;
    }
    .drop-indicator.visible { display: block; }

    /* ── Toolbar de formatage flottant ──────────────────── */
    #fmt-toolbar {
        position: fixed;
        display: none;
        gap: 2px;
        background: #2a1f0e;
        border: 1px solid #b8962a;
        border-radius: 4px;
        padding: 3px 4px;
        box-shadow: 0 4px 16px rgba(0,0,0,.45);
        z-index: 10000;
        pointer-events: auto;
    }
    #fmt-toolbar.visible { display: flex; }
    #fmt-toolbar button {
        background: none;
        border: none;
        color: #e8d9b0;
        font-size: .78rem;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        padding: 4px 7px;
        border-radius: 3px;
        cursor: pointer;
        line-height: 1;
        transition: background .15s, color .15s;
        min-width: 26px;
    }
    #fmt-toolbar button:hover { background: rgba(184,150,42,.3); color: #fff; }
    #fmt-toolbar button.active { background: rgba(184,150,42,.5); color: #fff; }

    /* ── Mode sombre — semaine ───────────────────────────── */
    @media (prefers-color-scheme: dark) {
        .preview-week       { background: var(--vellum-light); border-color: var(--border-soft); }
        .preview-day        { background: var(--vellum);       border-color: var(--border-soft); }
        .preview-day-header { background: var(--vellum-light); border-color: var(--border-soft); }
        .preview-day.drop-target { background: rgba(184,150,42,.08); }
        .semaine-header     { background: var(--vellum-light); border-color: var(--border-soft); }
        .drag-ghost         { background: var(--vellum-light); border-color: var(--gold); color: var(--ink); }
    }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="page-header">
            <span class="rubric-tag">Génération</span>
            <h1>Feuille de semaine</h1>
            <div class="ornament">✦ ✦ ✦</div>
        </div>

        <!-- Sélecteur de semaine -->
        <div class="week-picker-wrap">
            <span class="week-label">Choisir la semaine</span>
            <div class="week-nav-btns">
                <button class="btn-week-nav" onclick="setSemaine(-1)">← Semaine précédente</button>
                <button class="btn-week-nav" id="btn-current" onclick="setSemaine(0)">Semaine en cours</button>
                <button class="btn-week-nav" onclick="setSemaine(1)">Semaine suivante →</button>
            </div>
            <div class="week-nav">
                <input type="date" id="date-debut" onchange="onDateChange(this.value)">
            </div>
            <div class="week-display" id="week-display">—</div>
        </div>

        <!-- Aperçu de la semaine -->
        <div class="preview-section">
            <div class="offices-header">
                <hr class="offices-rule offices-rule-left">
                <span class="offices-title">✝ Aperçu de la semaine</span>
                <hr class="offices-rule">
            </div>
            <div class="loading-overlay visible" id="loading-preview">
                <span class="spin">✦</span> Chargement…
            </div>
            <div id="preview-container"></div>
        </div>

        <!-- Bouton générer -->
        <div class="generate-zone">
            <div style="display:flex;gap:10px;margin-bottom:10px;">
                <button class="btn-generate" id="btn-generate" onclick="genererDocument()" disabled style="flex:1">
                    <span class="icon">📄</span>
                    Générer le .docx
                </button>
                <button class="btn-generate" id="btn-jpeg" onclick="genererJpeg()" disabled style="flex:1;background:var(--dark-bg);">
                    <span class="icon">🖼️</span>
                    Générer le .jpg
                </button>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:10px;">
                <button class="btn-generate" id="btn-html" onclick="copierHTML()" disabled style="flex:1;background:#2c4a2c;">
                    <span class="icon">📋</span>
                    Copier HTML (mail)
                </button>
            </div>
            <p class="generate-hint">Les fichiers seront téléchargés automatiquement</p>
        </div>
    </main>

    <!-- Toolbar de formatage flottant -->
    <div id="fmt-toolbar">
        <button id="fmt-caps"   title="Majuscules">AA</button>
        <button id="fmt-italic" title="Italique"><em>I</em></button>
        <button id="fmt-under"  title="Souligné"><u>U</u></button>
        <button id="fmt-center" title="Centrer">≡</button>
    </div>

    <div id="toast" class="toast"></div>

    <script src="ordo1962.js"></script>
<script src="data/messe/calendrier.js"></script>
<script src="titres.js"></script>
<script src="messe.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>

    <!-- Bibliothèque docx.js (génération Word côté client) -->
    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.3/dist/index.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
    const GOOGLE_API_KEY = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
    const CALENDAR_ID    = 'saintlouisenville67@gmail.com';


    const JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const MOIS_FR  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

    let lundiCourant = null;
    let semaineData  = null;

    // ── Initialisation ────────────────────────────────────────────────────
    // ── Utilitaire timezone-safe ─────────────────────────────────────────
    // Extrait "YYYY-MM-DD" en heure LOCALE (pas UTC) pour éviter les décalages
    function isoLocal(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const j = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${j}`;
    }

    function getLundiDeSemaine(d) {
        const date = new Date(d);
        date.setHours(12, 0, 0, 0); // midi pour éviter tout glissement DST
        const dow = date.getDay();
        const diff = dow === 0 ? -6 : 1 - dow;
        date.setDate(date.getDate() + diff);
        return isoLocal(date);
    }

    function setSemaine(offset) {
        if (offset === 0) {
            lundiCourant = getLundiDeSemaine(new Date());
        } else {
            const d = new Date((lundiCourant || getLundiDeSemaine(new Date())) + 'T12:00:00');
            d.setDate(d.getDate() + offset * 7);
            lundiCourant = isoLocal(d);
        }
        document.getElementById('date-debut').value = lundiCourant;
        updateWeekDisplay();
        chargerSemaine();
    }

    function onDateChange(val) {
        if (!val) return;
        lundiCourant = getLundiDeSemaine(val);
        document.getElementById('date-debut').value = lundiCourant;
        updateWeekDisplay();
        chargerSemaine();
    }

    function updateWeekDisplay() {
        if (!lundiCourant) return;
        const lundi = new Date(lundiCourant + 'T12:00:00');
        const dim   = new Date(lundi); dim.setDate(lundi.getDate() + 6);
        const fmt   = d => d.getDate() + ' ' + MOIS_FR[d.getMonth()];
        document.getElementById('week-display').textContent =
            `Lundi ${fmt(lundi)} → Dimanche ${fmt(dim)} ${dim.getFullYear()}`;
    }

    function fmtHeure(dateTime) {
        const d = new Date(dateTime);
        const h = d.getHours(), m = d.getMinutes();
        return m === 0 ? `${h}h` : `${h}h${String(m).padStart(2,'0')}`;
    }

    function parseHeure(h) {
        if (!h) return 999;
        const m = h.match(/(\d+)h(\d*)/);
        if (!m) return 999;
        return parseInt(m[1]) * 60 + (m[2] ? parseInt(m[2]) : 0);
    }

    function estMesse(label) {
        return /^(messe|grand'?messe)/i.test(label.trim());
    }

    // ── Charger et construire les données ─────────────────────────────────
    async function chargerSemaine() {
        if (!lundiCourant || typeof maConnexion === 'undefined') return;
        const container = document.getElementById('preview-container');
        const loading   = document.getElementById('loading-preview');
        container.innerHTML = '';
        loading.classList.add('visible');
        document.getElementById('btn-generate').disabled = true;
        document.getElementById('btn-jpeg').disabled = true;
        document.getElementById('btn-html').disabled = true;

        try {
            const lundi  = new Date(lundiCourant + 'T12:00:00');
            const dim    = new Date(lundi); dim.setDate(lundi.getDate() + 6);
            const dimISO = isoLocal(dim);
            dim.setHours(23, 59, 59);

            // Requêtes parallèles : Google Agenda + Intentions validées
            // L'ordo liturgique est calculé localement par Ordo1962 (missel de 1962)
            const [gcalResp, { data: intentions }] = await Promise.all([
                fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                    + `?key=${GOOGLE_API_KEY}`
                    + `&timeMin=${lundi.toISOString()}&timeMax=${dim.toISOString()}`
                    + `&singleEvents=true&orderBy=startTime&maxResults=200`),
                maConnexion.from('intentions')
                    .select('date_messe,heure_messe,nom_intention,type_intention,google_event_id')
                    .eq('statut','valide')
                    .gte('date_messe', lundiCourant).lte('date_messe', dimISO),
            ]);

            const gcal = await gcalResp.json();
            const events = gcal.items || [];

            // Ordo calculé dynamiquement (moteur Ordo1962 — missel de 1962)
            const ordoMap = {};
            for (let i = 0; i < 7; i++) {
                const dd = new Date(lundi); dd.setDate(lundi.getDate() + i);
                const iso = isoLocal(dd);
                ordoMap[iso] = Ordo1962.getDay(dd.getFullYear(), dd.getMonth()+1, dd.getDate());
            }
            const intentionsMap = {};
            (intentions || []).forEach(i => {
                const key = i.date_messe + '_' + (i.heure_messe || '').substring(0,5);
                intentionsMap[key] = i;
                if (i.google_event_id) intentionsMap['id_' + i.google_event_id] = i;
            });

            // Construire jour par jour
            semaineData = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(lundi); d.setDate(lundi.getDate() + i);
                const dow    = d.getDay();
                const iso    = isoLocal(d);
                const dateFr = `${JOURS_FR[dow]} ${d.getDate()} ${MOIS_FR[d.getMonth()]}`;
                const ordoJour = ordoMap[iso] || null;
                // ordoJour : { fete, rang, classe, couleur, saison, commemoration }

                // 100% Google Agenda — tous les événements du jour, triés par heure
                const evtsJour = events
                    .filter(e => (e.start.dateTime || e.start.date).startsWith(iso))
                    .sort((a,b) => (a.start.dateTime||a.start.date).localeCompare(b.start.dateTime||b.start.date));

                // Événements pour lesquels on affiche début–fin
                const AVEC_FIN = /adoration|confession/i;

                const horaires = evtsJour.map(e => {
                    const hDebut  = e.start.dateTime ? fmtHeure(e.start.dateTime) : '';
                    const hFin    = e.end && e.end.dateTime ? fmtHeure(e.end.dateTime) : '';
                    const avecFin = AVEC_FIN.test(e.summary) && hFin && hFin !== hDebut;
                    const heure   = avecFin ? hDebut + '–' + hFin : hDebut;

                    const isMesse = estMesse(e.summary);
                    let label     = e.summary.trim();
                    if (isMesse) {
                        const hdb  = e.start.dateTime
                            ? String(new Date(e.start.dateTime).getHours()).padStart(2,'0') + ':'
                              + String(new Date(e.start.dateTime).getMinutes()).padStart(2,'0')
                            : '';
                        const key1      = iso + '_' + hdb;
                        const intention = intentionsMap['id_'+e.id] || intentionsMap[key1] || null;
                        if (intention) {
                            const croix = intention.type_intention === 'Défunt' ? ' ✝' : '';
                            label += ' (' + intention.nom_intention + croix + ')';
                        }
                    }
                    return { heure, label, labelHtml: escHtml(label), bold: isMesse };
                });

                semaineData.push({
                    dateFr, iso, dow,
                    sousTitre: ordoJour ? ordoJour.fete : null,
                    couleur:   ordoJour ? ordoJour.couleur : null,
                    notes:     [],
                    horaires
                });
            }

            // Afficher l'aperçu
            renderPreview();
            initDragAndDrop();
            loading.classList.remove('visible');
            document.getElementById('btn-generate').disabled = false;
            document.getElementById('btn-jpeg').disabled = false;
            document.getElementById('btn-html').disabled = false;

        } catch(err) {
            loading.classList.remove('visible');
            container.innerHTML = `<div style="color:var(--rubric);font-style:italic;text-align:center;padding:20px;">Erreur de chargement : ${err.message}</div>`;
            console.error(err);
        }
    }

    // ── Rendu de l'aperçu ─────────────────────────────────────────────────
    const COULEUR_DOT = { Blanc:'#d4af37', Rouge:'#9b2020', Vert:'#3a6644', Violet:'#5c2d7a', Rose:'#d4688a', Noir:'#1a1108' };

    // ── Ajouter un événement ─────────────────────────────────────────────
    function ajouterLigne(jourIdx) {
        semaineData[jourIdx].horaires.push({ heure: '', label: 'Nouvel événement', labelHtml: 'Nouvel événement', bold: false });
        renderPreview();
        // Focus automatique sur le libellé de la nouvelle ligne
        const container = document.getElementById('preview-container');
        const labels = container.querySelectorAll(`[data-jour="${jourIdx}"][data-field="label"]`);
        const last = labels[labels.length - 1];
        if (last) { last.focus(); document.execCommand('selectAll', false, null); }
    }

    // ── Supprimer un événement ───────────────────────────────────────────
    function supprimerLigne(jourIdx, evtIdx) {
        semaineData[jourIdx].horaires.splice(evtIdx, 1);
        renderPreview();
    }

    // ── Ajouter une note ─────────────────────────────────────────────────
    function ajouterNote(jourIdx) {
        semaineData[jourIdx].notes.push({ html: 'Note…', textAlign: '' });
        renderPreview();
        const container = document.getElementById('preview-container');
        const notes = container.querySelectorAll(`[data-jour="${jourIdx}"][data-field="note"]`);
        const last = notes[notes.length - 1];
        if (last) { last.focus(); document.execCommand('selectAll', false, null); }
    }

    // ── Supprimer une note ───────────────────────────────────────────────
    function supprimerNote(jourIdx, noteIdx) {
        semaineData[jourIdx].notes.splice(noteIdx, 1);
        renderPreview();
    }

    function renderPreview() {
        const container = document.getElementById('preview-container');
        container.innerHTML = '';
        if (!semaineData) return;

        const btnStyle = 'background:none;border:none;cursor:pointer;font-size:.75rem;padding:2px 5px;border-radius:3px;line-height:1;color:var(--ink-muted);transition:color .15s,background .15s;';
        const editStyle = 'outline:none;cursor:text;border-bottom:1px dashed transparent;transition:border-color .15s,background .15s;padding:1px 3px;border-radius:2px;';

        semaineData.forEach((jour, jourIdx) => {
            const hasMesse = jour.horaires.some(e => e.bold);
            const dot = COULEUR_DOT[jour.couleur];
            const dotHtml = dot ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot};margin-right:6px;flex-shrink:0"></span>` : '';

            let h = `<div class="preview-day${hasMesse ? ' has-messe' : ''}" data-jour="${jourIdx}" style="animation-delay:${jourIdx*.05}s">`;

            // En-tête jour
            h += `<div class="preview-day-header">
                <div class="preview-day-nom">
                    <span contenteditable="true" data-jour="${jourIdx}" data-field="dateFr"
                        style="${editStyle}" title="Modifier">${escHtml(jour.dateFr)}</span>
                </div>
                <div class="preview-day-fete">${dotHtml}<span contenteditable="true" data-jour="${jourIdx}" data-field="sousTitre"
                        style="${editStyle}${!jour.sousTitre ? ';opacity:.4' : ''}" title="Modifier">${escHtml(jour.sousTitre || '—')}</span>
                </div>
            </div>`;

            // Notes
            jour.notes.forEach((n, ni) => {
                h += `<div class="preview-note draggable-item" style="display:flex;align-items:center;gap:4px;"
                        data-drag-type="note" data-drag-jour="${jourIdx}" data-drag-idx="${ni}">
                    <span class="drag-handle" title="Glisser vers un autre jour">⠿</span>
                    <span style="color:var(--rubric);">✦</span>
                    <span contenteditable="true" data-jour="${jourIdx}" data-field="note" data-note="${ni}"
                        style="${editStyle};flex:1;text-align:${noteAlign(n)||'left'};" title="Modifier">${noteHtml(n)}</span>
                    <button style="${btnStyle}" title="Supprimer cette note"
                        onmousedown="event.preventDefault();supprimerNote(${jourIdx},${ni})">✕</button>
                </div>`;
            });

            // Événements
            h += `<div class="preview-events">`;
            if (!jour.horaires.length) {
                h += `<div class="preview-empty">Aucun événement</div>`;
            } else {
                jour.horaires.forEach((evt, evtIdx) => {
                    const isMesse = evt.bold;
                    h += `<div class="preview-evt draggable-item${isMesse ? ' is-messe' : ''}" style="display:flex;align-items:center;gap:4px;"
                            data-drag-type="evt" data-drag-jour="${jourIdx}" data-drag-idx="${evtIdx}">
                        <span class="drag-handle" title="Glisser vers un autre jour">⠿</span>
                        <span contenteditable="true" class="preview-evt-heure" data-jour="${jourIdx}" data-evt="${evtIdx}" data-field="heure"
                            style="${editStyle}" title="Modifier">${escHtml(evt.heure || '')}</span>
                        <span style="flex:1;align-items:baseline;">${isMesse ? '<strong>' : ''}<span contenteditable="true" data-jour="${jourIdx}" data-evt="${evtIdx}" data-field="label"
                            style="${editStyle};width:100%;text-align:${evt.textAlign||'left'};" title="Modifier">${evt.labelHtml || escHtml(evt.label)}</span>${isMesse ? '</strong>' : ''}</span>
                        <button style="${btnStyle}" title="Supprimer cette ligne"
                            onmousedown="event.preventDefault();supprimerLigne(${jourIdx},${evtIdx})">✕</button>
                    </div>`;
                });
            }

            // Boutons d'ajout
            h += `<div style="display:flex;gap:6px;padding:6px 0 2px;border-top:1px dashed var(--border-soft);margin-top:6px;">
                <button style="${btnStyle};color:var(--rubric);font-size:.68rem;font-family:'Cinzel',serif;letter-spacing:.06em;"
                    onclick="ajouterLigne(${jourIdx})">+ événement</button>
                <button style="${btnStyle};color:var(--gold);font-size:.68rem;font-family:'Cinzel',serif;letter-spacing:.06em;"
                    onclick="ajouterNote(${jourIdx})">+ note</button>
            </div>`;

            h += `</div></div>`;
            container.innerHTML += h;
        });

        // Focus → surligner, blur → sync vers semaineData
        container.querySelectorAll('[contenteditable]').forEach(el => {
            el.addEventListener('focus', () => {
                el.style.background = 'var(--gold-pale)';
                el.style.borderBottomColor = '#b8962a';
            });
            el.addEventListener('blur', () => {
                el.style.background = '';
                el.style.borderBottomColor = 'transparent';
                if (!document.contains(el)) return;
                syncElToData(el);
            });
        });
    }

    // ── Sync un élément contenteditable → semaineData ───────────────────
    function syncElToData(el) {
        const j     = parseInt(el.dataset.jour);
        const field = el.dataset.field;
        const jour  = semaineData[j];
        if (!jour) return;

        // Pour les champs texte pur (dateFr, sousTitre, heure) → innerText
        // Pour label et note → innerHTML pour préserver les spans de formatage
        if (field === 'dateFr')    { jour.dateFr    = el.innerText.trim(); return; }
        if (field === 'sousTitre') { jour.sousTitre  = el.innerText.trim() === '—' ? '' : el.innerText.trim(); return; }
        if (field === 'heure') {
            const ei = parseInt(el.dataset.evt);
            if (jour.horaires[ei]) jour.horaires[ei].heure = el.innerText.trim();
            return;
        }
        if (field === 'label') {
            const ei = parseInt(el.dataset.evt);
            if (jour.horaires[ei]) {
                jour.horaires[ei].labelHtml  = el.innerHTML;
                jour.horaires[ei].textAlign  = el.style.textAlign || '';
            }
            return;
        }
        if (field === 'note') {
            const ni = parseInt(el.dataset.note);
            if (jour.notes[ni] !== undefined) {
                // On stocke un objet { html, textAlign } ou juste la string pour compat
                jour.notes[ni] = { html: el.innerHTML, textAlign: el.style.textAlign || '' };
            }
            return;
        }
    }

    // ── Toolbar de formatage ─────────────────────────────────────────────
    (function() {
        const toolbar = document.getElementById('fmt-toolbar');
        let activeEl  = null; // élément contenteditable qui a le focus
        let savedRange = null; // sélection sauvegardée avant le clic bouton

        function saveSelection() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
        }

        function restoreSelection() {
            if (!savedRange) return;
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
        }

        function hideToolbar() {
            toolbar.classList.remove('visible');
            savedRange = null;
        }

        function showToolbar(x, y) {
            toolbar.classList.add('visible');
            // Positionnement : au-dessus de la sélection, centré
            const tw = toolbar.offsetWidth  || 140;
            const th = toolbar.offsetHeight || 32;
            const vw = window.innerWidth;
            let left = x - tw / 2;
            let top  = y - th - 10;
            if (left < 4) left = 4;
            if (left + tw > vw - 4) left = vw - tw - 4;
            if (top < 4) top = y + 24; // si trop haut, afficher en dessous
            toolbar.style.left = left + 'px';
            toolbar.style.top  = top  + 'px';
        }

        // Écouter les sélections dans les éléments contenteditable
        document.addEventListener('selectionchange', () => {
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.toString().trim()) {
                // Pas de sélection — masquer sauf si on est en train de cliquer le toolbar
                // (le mousedown du toolbar sauvegarde la sélection avant que selectionchange tire)
                if (!toolbar.matches(':focus-within') && !toolbar.contains(document.activeElement)) {
                    hideToolbar();
                }
                return;
            }
            // Vérifier que la sélection est dans un contenteditable de la preview
            const anchor = sel.anchorNode;
            const ce = anchor && anchor.nodeType === Node.TEXT_NODE
                ? anchor.parentElement.closest('[contenteditable]')
                : anchor && anchor.closest && anchor.closest('[contenteditable]');
            if (!ce || !document.getElementById('preview-container').contains(ce)) {
                hideToolbar();
                return;
            }
            activeEl = ce;
            // Position du toolbar = milieu haut du rect de sélection
            const rect = sel.getRangeAt(0).getBoundingClientRect();
            showToolbar(rect.left + rect.width / 2, rect.top + window.scrollY);
        });

        // Chaque bouton : mousedown (pas click) pour conserver la sélection
        toolbar.addEventListener('mousedown', e => {
            e.preventDefault(); // ← empêche la perte de focus ET de sélection
            saveSelection();
        });

        document.getElementById('fmt-caps').addEventListener('mousedown', e => {
            e.preventDefault();
            saveSelection();
            restoreSelection();
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed) return;
            const range = sel.getRangeAt(0);
            const selectedText = range.toString();
            const isAllCaps = selectedText === selectedText.toUpperCase();
            const newText = isAllCaps ? selectedText.toLowerCase() : selectedText.toUpperCase();
            // Supprimer la sélection et insérer le nouveau texte dans un span si déjà stylisé
            // → on utilise insertHTML pour préserver les spans existants
            document.execCommand('insertText', false, newText);
            if (activeEl) syncElToData(activeEl);
        });

        document.getElementById('fmt-italic').addEventListener('mousedown', e => {
            e.preventDefault();
            saveSelection();
            restoreSelection();
            document.execCommand('italic', false, null);
            if (activeEl) syncElToData(activeEl);
        });

        document.getElementById('fmt-under').addEventListener('mousedown', e => {
            e.preventDefault();
            saveSelection();
            restoreSelection();
            document.execCommand('underline', false, null);
            if (activeEl) syncElToData(activeEl);
        });

        document.getElementById('fmt-center').addEventListener('mousedown', e => {
            e.preventDefault();
            saveSelection();
            restoreSelection();
            // Centrer = ajouter/retirer un style sur l'élément entier
            if (!activeEl) return;
            const isCentered = activeEl.style.textAlign === 'center';
            activeEl.style.textAlign = isCentered ? '' : 'center';
            if (activeEl) syncElToData(activeEl);
        });

        // Masquer le toolbar quand on clique ailleurs
        document.addEventListener('mousedown', e => {
            if (!toolbar.contains(e.target)) hideToolbar();
        });
    })();

    // ── Parse HTML inline → tableau de TextRun Word ──────────────────────
    // baseOpts : options de base appliquées à tous les runs (ex: { bold: true })
    function htmlToRuns(html, baseOpts = {}) {
        if (!html) return [window.docx ? new window.docx.TextRun({ text: '', ...baseOpts, font: 'Calibri', size: 24, color: '000000' }) : ''];
        const { TextRun } = window.docx;
        const r = (text, opts = {}) => new TextRun({ text, font: 'Calibri', size: 24, color: '000000', ...baseOpts, ...opts });

        // Transformer le HTML en texte segmenté avec styles
        // On parse via un div temporaire
        const div = document.createElement('div');
        div.innerHTML = html;

        const runs = [];
        function walk(node, inherited = {}) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                if (text) runs.push(r(text, { ...inherited }));
                return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;

            const tag = node.tagName.toLowerCase();
            const style = node.getAttribute('style') || '';
            const opts = { ...inherited };

            if (tag === 'strong' || tag === 'b') opts.bold = true;
            if (tag === 'em'     || tag === 'i') opts.italics = true;
            if (tag === 'u') opts.underline = { type: 'single', color: '000000' };
            if (tag === 'span') {
                if (/font-weight\s*:\s*bold/i.test(style)) opts.bold = true;
                if (/font-style\s*:\s*italic/i.test(style)) opts.italics = true;
                if (/text-decoration[^;]*underline/i.test(style)) opts.underline = { type: 'single', color: '000000' };
                // text-transform: uppercase → allCaps dans Word
                if (/text-transform\s*:\s*uppercase/i.test(style)) opts.allCaps = true;
            }

            node.childNodes.forEach(child => walk(child, opts));
        }

        div.childNodes.forEach(child => walk(child, {}));
        return runs.length ? runs : [r('')];
    }

    // ── Construit l'objet Document docx à partir de semaineData ─────────────
    function buildDocxDoc() {
        const {
            Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
            AlignmentType, WidthType, BorderStyle, VerticalAlign
        } = window.docx;

        const PAGE_W = 11906, PAGE_H = 16838, MARGIN_TB = 142, MARGIN_LR = 720;
        const CONTENT_W = PAGE_W - 2*MARGIN_LR;
        const COL_WIDTHS = [322,1143,2174,1903,2882,71,36];
        const scale = CONTENT_W / COL_WIDTHS.reduce((a,b)=>a+b,0);
        const COLS = COL_WIDTHS.map(c => Math.round(c*scale));
        COLS[COLS.length-1] += CONTENT_W - COLS.reduce((a,b)=>a+b,0);

        const noBorder  = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
        const noBorders = { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder };
        const cellMar   = { top: 15, bottom: 15, left: 115, right: 115 };

        const cell = (children, span=1) => new TableCell({
            width: { size: COLS.slice(0,span).reduce((a,b)=>a+b,0), type: WidthType.DXA },
            columnSpan: span, borders: noBorders, margins: cellMar,
            verticalAlign: VerticalAlign.CENTER, children
        });
        const para = runs => new Paragraph({ alignment: AlignmentType.LEFT, spacing: { after: 0, line: 240 }, children: runs });
        const r = (text, opts={}) => new TextRun({ text, font: 'Calibri', size: 24, color: '000000', ...opts });

        const tableRows = [];
        semaineData.forEach(jour => {
            const headRuns = [r(jour.dateFr + ' ', { bold: true })];
            if (jour.sousTitre) {
                headRuns.push(r('– ', { italics: true }));
                headRuns.push(r(jour.sousTitre, { italics: true }));
            }
            tableRows.push(new TableRow({ height: { value: 20, rule: 'auto' }, children: [
                cell([para(headRuns)], 5), cell([para([])], 1), cell([para([])], 1)
            ]}));

            jour.notes.forEach(note => {
                const nRuns  = htmlToRuns(noteHtml(note), { italics: true });
                const nAlign = noteAlign(note) === 'center' ? AlignmentType.CENTER : AlignmentType.LEFT;
                const nPara  = new Paragraph({ alignment: nAlign, spacing: { after: 0, line: 240 }, children: nRuns });
                tableRows.push(new TableRow({ height: { value: 20, rule: 'auto' }, children: [
                    cell([nPara], 5), cell([para([])], 1), cell([para([])], 1)
                ]}));
            });

            jour.horaires.forEach(evt => {
                const heureRuns = [r(evt.heure, { bold: evt.bold })];
                const labelRuns = htmlToRuns(evt.labelHtml || escHtml(evt.label || ''), { bold: evt.bold });
                const lAlign = (evt.textAlign === 'center') ? AlignmentType.CENTER : AlignmentType.LEFT;
                const lPara  = new Paragraph({ alignment: lAlign, spacing: { after: 0, line: 240 }, children: labelRuns });
                tableRows.push(new TableRow({ height: { value: 20, rule: 'auto' }, children: [
                    cell([para([])], 1),
                    cell([para(heureRuns)], 1),
                    cell([lPara], 4),
                    cell([para([])], 1),
                ]}));
            });
        });

        const table = new Table({
            width: { size: CONTENT_W, type: WidthType.DXA },
            columnWidths: COLS, rows: tableRows,
            borders: { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder, insideH: noBorder, insideV: noBorder }
        });

        return new Document({
            styles: { default: { document: { run: { font: 'Calibri', size: 24, color: '000000' } } } },
            sections: [{ properties: {
                    page: { size: { width: PAGE_W, height: PAGE_H }, margin: { top: MARGIN_TB, right: MARGIN_LR, bottom: MARGIN_TB, left: MARGIN_LR } }
                },
                children: [
                    new Paragraph({
                        alignment: AlignmentType.CENTER, spacing: { after: 80, line: 240 },
                        children: [new TextRun({ text: 'CALENDRIER DE LA SEMAINE', bold: true, font: 'Calibri', size: 32, color: '000000' })]
                    }),
                    table
                ]
            }]
        });
    }

    function nomFichier(ext) {
        const lundi = new Date(lundiCourant + 'T12:00:00');
        const dim   = new Date(lundi); dim.setDate(lundi.getDate() + 6);
        return `CALENDRIER_${lundi.getDate()}_${dim.getDate()}_${MOIS_FR[dim.getMonth()]}.${ext}`;
    }

    function telecharger(blob, nom) {
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href = url; a.download = nom;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── Génération DOCX ───────────────────────────────────────────────────
    async function genererDocument() {
        if (!semaineData) { showToast('⚠️ Chargez une semaine d\'abord'); return; }
        if (typeof window.docx === 'undefined') { showToast('⚠️ Bibliothèque non encore chargée, réessayez'); return; }

        const btn = document.getElementById('btn-generate');
        btn.disabled = true;
        btn.innerHTML = '<span class="spin">✦</span> Génération…';

        try {
            const doc  = buildDocxDoc();
            const blob = await window.docx.Packer.toBlob(doc);
            telecharger(blob, nomFichier('docx'));
            showToast('✅ Document Word téléchargé !');
        } catch(err) {
            showToast('❌ ' + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span class="icon">📄</span> Générer le .docx';
        }
    }

    // ── Génération JPEG ───────────────────────────────────────────────────
    // Rendu A4 portrait à 200dpi, fond blanc, typographie Calibri
    async function genererJpeg() {
        if (!semaineData) { showToast('⚠️ Chargez une semaine d\'abord'); return; }

        const btn = document.getElementById('btn-jpeg');
        btn.disabled = true;
        btn.innerHTML = '<span class="spin">✦</span> Rendu en cours…';

        try {
            // A4 à 100dpi base (scale×2 = 200dpi final) : 827×1169px
            const PAGE_W = 827;
            const PAGE_H = 1169;
            const ML     = 54;  // marges latérales ~0.5"
            const MT     = 14;  // marges haut/bas réduites (comme le docx)

            // Calculer font-size pour tenir sur une page
            const totalLignes = semaineData.reduce((acc, j) => acc + 1 + j.horaires.length + 1, 0);
            const espaceTable = PAGE_H - MT * 2 - 30; // 30px pour le titre
            const hLigne = espaceTable / totalLignes;
            const fs = Math.min(13, Math.max(8, Math.round(hLigne / 1.55)));

            // Construire les lignes HTML
            const rows = semaineData.flatMap(jour => {
                const lines = [];
                const sousTitreHtml = jour.sousTitre
                    ? ' <span style="font-style:italic">– ' + escHtml(jour.sousTitre) + '</span>'
                    : '';
                lines.push('<tr class="row-head"><td colspan="2"><strong>' + escHtml(jour.dateFr) + '</strong>' + sousTitreHtml + '</td></tr>');
                jour.notes.forEach(n => {
                    lines.push('<tr><td colspan="2" style="color:#8b1a1a;font-style:italic;padding-left:4px;">' + noteHtml(n) + '</td></tr>');
                });
                jour.horaires.forEach(evt => {
                    const heure = escHtml(evt.heure);
                    const lHtml = evt.labelHtml || escHtml(evt.label || '');
                    const hClass = evt.bold ? ' class="bold"' : '';
                    lines.push('<tr><td' + hClass + '>' + heure + '</td><td>' + lHtml + '</td></tr>');
                });
                lines.push('<tr class="row-sep"><td colspan="2"></td></tr>');
                return lines;
            }).join('');

            // Iframe isolée hors-écran
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + PAGE_W + 'px;height:' + PAGE_H + 'px;border:none;visibility:hidden';
            document.body.appendChild(iframe);
            const idoc = iframe.contentDocument;

            idoc.open();
            idoc.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: ${PAGE_W}px;
    height: ${PAGE_H}px;
    overflow: hidden;
    background: #ffffff;
    font-family: Calibri, 'Trebuchet MS', Arial, sans-serif;
    font-size: ${fs}px;
    color: #000000;
    padding: ${MT}px ${ML}px;
    line-height: 1.4;
  }
  h1 {
    text-align: center;
    font-size: ${fs + 4}px;
    font-weight: bold;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: ${fs}px;
    font-family: Calibri, Arial, sans-serif;
  }
  td { vertical-align: top; padding: 1px 3px; }
  td:first-child { width: 52px; white-space: nowrap; padding-right: 8px; }
  td.bold { font-weight: bold; }
  tr.row-head td {
    padding-top: 4px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border-soft);
    font-size: ${fs + 0.5}px;
  }
  tr.row-sep td { height: 4px; }
</style>
</head><body>
<h1>CALENDRIER DE LA SEMAINE</h1>
<table>${rows}</table>
</body></html>`);
            idoc.close();

            await new Promise(r => setTimeout(r, 150));
            iframe.style.height = PAGE_H + 'px';
            await new Promise(r => setTimeout(r, 50));

            const canvas = await html2canvas(idoc.body, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                width:  PAGE_W,
                height: PAGE_H,
                windowWidth:  PAGE_W,
                windowHeight: PAGE_H,
            });
            document.body.removeChild(iframe);

            canvas.toBlob(blob => {
                telecharger(blob, nomFichier('jpg'));
                showToast('✅ Image JPEG téléchargée !');
            }, 'image/jpeg', 0.93);

        } catch(err) {
            showToast('❌ ' + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span class="icon">🖼️</span> Générer le .jpg';
        }
    }
    function escHtml(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Note peut être string (texte brut) ou { html, textAlign }
    function noteHtml(n)      { return typeof n === 'object' ? (n.html || '') : (typeof n === 'string' && n.includes('<') ? n : escHtml(n||'')); }
    function noteAlign(n)     { return typeof n === 'object' ? (n.textAlign || '') : ''; }
    function noteText(n)      { const d = document.createElement('div'); d.innerHTML = noteHtml(n); return d.innerText || ''; }

    async function copierHTML() {
        if (!semaineData || semaineData.length === 0) {
            showToast('⚠️ Aucune donnée à copier');
            return;
        }

        const C_TITRE   = '#1a1a1a';
        const C_FETE    = '#555555';
        const C_HEURE   = '#888888';
        const C_TEXTE   = '#1a1a1a';
        const C_NOTE    = '#8b2020';
        const C_SEP     = '#dddddd';

        let html = '<table width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Georgia,serif;max-width:600px;">\n';

        semaineData.forEach((jour, idx) => {
            if (idx > 0) {
                // séparateur entre jours
                html += `  <tr><td style="padding:4px 0;border-bottom:1px solid ${C_SEP};font-size:1px;">&nbsp;</td></tr>\n`;
                html += `  <tr><td style="padding:4px 0;font-size:1px;">&nbsp;</td></tr>\n`;
            }

            // Entête du jour
            const dateParts = (jour.dateFr || '').split(' ');
            const jourNom   = dateParts[0] || '';
            const jourDate  = dateParts.slice(1).join(' ');
            const fete      = jour.sousTitre || '';

            html += `  <tr>\n    <td style="padding:6px 0 2px 0;">\n`;
            html += `      <span style="font-weight:bold;color:${C_TITRE};font-size:1.1em;">${escHtml(jourNom)} ${escHtml(jourDate)}</span>`;
            if (fete) {
                html += ` <span style="color:${C_FETE};font-size:0.9em;font-style:italic;">— ${escHtml(fete)}</span>`;
            }
            html += `\n    </td>\n  </tr>\n`;

            // Notes (rubrique) — affichées avant les horaires
            (jour.notes || []).forEach(note => {
                const nHtml  = noteHtml(note);
                const nAlign = noteAlign(note);
                const alignStyle = nAlign ? `text-align:${nAlign};` : '';
                html += `  <tr>\n    <td style="padding:1px 0 1px 16px;color:${C_NOTE};font-size:1em;font-style:italic;${alignStyle}">${nHtml}</td>\n  </tr>\n`;
            });

            // Horaires
            (jour.horaires || []).forEach(h => {
                const heureStr  = h.heure  ? `<span style="color:${C_HEURE};font-size:0.9em;min-width:36px;display:inline-block;">${escHtml(h.heure)}</span> ` : '';
                // labelHtml peut contenir des spans de formatage (gras, italique, souligné...)
                const labelContent = h.labelHtml || escHtml(h.label || '');
                const labelStyle = h.bold
                    ? `font-weight:bold;color:${C_TEXTE};font-size:1em;`
                    : `color:${C_TEXTE};font-size:1em;`;
                html += `  <tr>\n    <td style="padding:1px 0 1px 16px;">${heureStr}<span style="${labelStyle}">${labelContent}</span></td>\n  </tr>\n`;
            });
        });

        html += '</table>';

        try {
            await navigator.clipboard.writeText(html);
            showToast('✅ HTML copié dans le presse-papier');
        } catch(e) {
            // Fallback : textarea temporaire
            const ta = document.createElement('textarea');
            ta.value = html;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ HTML copié dans le presse-papier');
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ── Drag-and-drop ─────────────────────────────────────────────────────
    // Fonctionne souris ET tactile (mobile)
    let drag = null; // état courant du drag
    let ghost = null; // élément fantôme qui suit le curseur
    let dropInfo = null; // { jourDest, insertIdx } calculé en temps réel

    function initDragAndDrop() {
        const container = document.getElementById('preview-container');

        // ── Écoute souris ──────────────────────────────────────
        container.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup',   onDragEnd);

        // ── Écoute tactile ─────────────────────────────────────
        container.addEventListener('touchstart', onTouchStart, { passive: false });
        document.addEventListener('touchmove',  onTouchMove,  { passive: false });
        document.addEventListener('touchend',   onTouchEnd,   { passive: false });
    }

    function getHandleEl(e) {
        const target = e.target || e.touches[0].target;
        if (!target.classList.contains('drag-handle')) return null;
        return target.closest('.draggable-item');
    }

    function startDrag(el, clientX, clientY) {
        if (!el) return;
        drag = {
            type:    el.dataset.dragType,
            jourSrc: parseInt(el.dataset.dragJour),
            idx:     parseInt(el.dataset.dragIdx),
            el
        };
        dropInfo = null;

        const labelEl = el.querySelector('[data-field="label"]') || el.querySelector('[data-field="note"]');
        const labelTxt = labelEl ? labelEl.innerText.trim() : '…';
        const heurEl  = el.querySelector('[data-field="heure"]');
        const heurTxt = heurEl ? heurEl.innerText.trim() : '';

        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.textContent = (heurTxt ? heurTxt + ' — ' : '') + labelTxt;
        document.body.appendChild(ghost);
        moveGhost(clientX, clientY);

        el.classList.add('drag-source');
        el.querySelectorAll('[contenteditable]').forEach(c => c.setAttribute('contenteditable', 'false'));
    }

    function moveGhost(x, y) {
        if (!ghost) return;
        ghost.style.left = (x + 14) + 'px';
        ghost.style.top  = (y - 16) + 'px';
    }

    // Trouve le jour et la position d'insertion (entre quels éléments)
    function computeDropInfo(x, y) {
        const dayEls = document.querySelectorAll('.preview-day');
        let jourDest = null, insertIdx = null;

        for (const dayEl of dayEls) {
            const rect = dayEl.getBoundingClientRect();
            if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                jourDest = parseInt(dayEl.dataset.jour);

                // Trouver la position d'insertion parmi les items du même type
                const selector = drag.type === 'evt' ? '.draggable-item[data-drag-type="evt"]' : '.draggable-item[data-drag-type="note"]';
                const items = [...dayEl.querySelectorAll(selector)];
                insertIdx = items.length; // par défaut : à la fin

                for (let i = 0; i < items.length; i++) {
                    const ir = items[i].getBoundingClientRect();
                    const midY = ir.top + ir.height / 2;
                    if (y < midY) { insertIdx = i; break; }
                }
                break;
            }
        }
        return { jourDest, insertIdx };
    }

    function highlightTarget(info) {
        // Retirer anciens highlights et indicateurs
        document.querySelectorAll('.preview-day').forEach(d => d.classList.remove('drop-target'));
        document.querySelectorAll('.drop-indicator').forEach(d => d.remove());

        if (!info || info.jourDest === null) return;

        const dayEl = document.querySelector(`.preview-day[data-jour="${info.jourDest}"]`);
        if (!dayEl) return;
        dayEl.classList.add('drop-target');

        // Indicateur de position d'insertion
        const selector = drag.type === 'evt' ? '.draggable-item[data-drag-type="evt"]' : '.draggable-item[data-drag-type="note"]';
        const items = [...dayEl.querySelectorAll(selector)];

        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator visible';

        if (items.length === 0 || info.insertIdx >= items.length) {
            // Insérer à la fin — dans preview-events ou à la fin des notes
            const zone = drag.type === 'evt'
                ? dayEl.querySelector('.preview-events')
                : dayEl.querySelector('.preview-day-header');
            if (zone) zone.after(indicator);
        } else {
            items[info.insertIdx].before(indicator);
        }
    }

    function endDrag(x, y) {
        if (!drag) return;

        const info = computeDropInfo(x, y);

        // Nettoyer
        document.querySelectorAll('.preview-day').forEach(d => d.classList.remove('drop-target'));
        document.querySelectorAll('.drop-indicator').forEach(d => d.remove());
        if (ghost) { ghost.remove(); ghost = null; }
        if (drag.el) {
            drag.el.classList.remove('drag-source');
            drag.el.querySelectorAll('[contenteditable]').forEach(c => c.setAttribute('contenteditable', 'true'));
        }

        if (info.jourDest !== null && info.insertIdx !== null) {
            deplacerElement(drag.type, drag.jourSrc, drag.idx, info.jourDest, info.insertIdx);
        }

        drag = null;
        dropInfo = null;
    }

    function deplacerElement(type, jourSrc, idxSrc, jourDest, insertIdx) {
        const src  = semaineData[jourSrc];
        const dest = semaineData[jourDest];
        if (!src || !dest) return;

        const memeJour = jourSrc === jourDest;

        if (type === 'evt') {
            const item = src.horaires.splice(idxSrc, 1)[0];
            // Si même jour, ajuster l'index d'insertion après suppression
            let realIdx = insertIdx;
            if (memeJour && idxSrc < insertIdx) realIdx = Math.max(0, insertIdx - 1);
            dest.horaires.splice(realIdx, 0, item);
        } else {
            const item = src.notes.splice(idxSrc, 1)[0];
            let realIdx = insertIdx;
            if (memeJour && idxSrc < insertIdx) realIdx = Math.max(0, insertIdx - 1);
            dest.notes.splice(realIdx, 0, item);
        }

        renderPreview();
        initDragAndDrop();

        const nomDest = semaineData[jourDest].dateFr.split(' ')[0];
        showToast(memeJour ? '✓ Réorganisé' : `✓ Déplacé vers ${nomDest}`);
    }

    function onDragStart(e) {
        const el = getHandleEl(e);
        if (!el) return;
        e.preventDefault();
        startDrag(el, e.clientX, e.clientY);
    }

    function onDragMove(e) {
        if (!drag) return;
        moveGhost(e.clientX, e.clientY);
        dropInfo = computeDropInfo(e.clientX, e.clientY);
        highlightTarget(dropInfo);
    }

    function onDragEnd(e) {
        if (!drag) return;
        endDrag(e.clientX, e.clientY);
    }

    function onTouchStart(e) {
        const el = getHandleEl(e);
        if (!el) return;
        e.preventDefault();
        const t = e.touches[0];
        startDrag(el, t.clientX, t.clientY);
    }

    function onTouchMove(e) {
        if (!drag) return;
        e.preventDefault();
        const t = e.touches[0];
        moveGhost(t.clientX, t.clientY);
        dropInfo = computeDropInfo(t.clientX, t.clientY);
        highlightTarget(dropInfo);
    }

    function onTouchEnd(e) {
        if (!drag) return;
        const t = e.changedTouches[0];
        endDrag(t.clientX, t.clientY);
    }

    // ── Initialisation ────────────────────────────────────────────────────
    window.onload = function() {
        // Initialiser sur la semaine courante
        lundiCourant = getLundiDeSemaine(new Date());
        document.getElementById('date-debut').value = lundiCourant;
        updateWeekDisplay();

        // Attendre Supabase
        const wait = setInterval(() => {
            if (typeof maConnexion !== 'undefined') {
                clearInterval(wait);
                chargerSemaine();
            }
        }, 200);
    };
    </script>
</body>
