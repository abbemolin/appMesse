<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion des Intentions</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    .pretre-selector { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
    .pretre-btn {
        padding:8px 18px; border:1px solid #e8e0cc; border-radius:2px;
        background:#faf7f0; font-family:'Cinzel',serif; font-size:.6rem;
        letter-spacing:.12em; text-transform:uppercase; color:#8b7355; cursor:pointer; transition:all .2s;
    }
    .pretre-btn:hover { border-color:#b8962a; color:#b8962a; }
    .pretre-btn.actif { background:#f5edcf; border-color:#b8962a; color:#1a1108; }
    </style>
    <style>
    .pretre-selector-card {
        display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px;
    }
    .pretre-chip {
        padding: 5px 12px; border: 1px solid #e8e0cc; border-radius: 2px;
        background: #faf7f0; font-family: 'Cinzel', serif; font-size: .58rem;
        letter-spacing: .1em; text-transform: uppercase; color: #8b7355;
        cursor: pointer; transition: all .2s;
    }
    .pretre-chip:hover { border-color: #b8962a; color: #b8962a; }
    .pretre-chip.actif { background: #f5edcf; border-color: #b8962a; color: #1a1108; font-weight: 600; }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="page-header">
            <span class="rubric-tag">Administration</span>
            <h1>Intentions</h1>
            <div class="ornament">✦ ✦ ✦</div>
        </div>

        <div class="pretre-selector">
            <button class="pretre-btn actif" onclick="filtrerPretre('molin',this)">Abbé Molin</button>
            <button class="pretre-btn" onclick="filtrerPretre('carbonnieres',this)">Abbé de Carbonnières</button>
            <button class="pretre-btn" onclick="filtrerPretre('legall',this)">Abbé Le Gall</button>
            <button class="pretre-btn" onclick="filtrerPretre('',this)">Tous</button>
        </div>

        <div class="stats-banner">
            <div class="stats-count" id="annual-count">…</div>
            <div class="stats-label" id="label-annee-intentions">MESSES CÉLÉBRÉES EN 2026</div>
        </div>

        <!-- Recherche par nom -->
        <div class="search-bar">
            <input type="text" id="recherche-nom" placeholder="Rechercher par nom…" oninput="filtrerRecherche(this.value)">
        </div>

        <div id="loading-status" style="text-align:center;color:var(--ink-muted);font-style:italic;">Chargement des intentions&hellip;</div>
        <div id="table-body"></div>
    </main>

    <!-- Modal mail -->
    <div id="modal-mail">
        <div class="modal-mail-content">
            <h3 style="margin:0 0 14px;color:var(--ink);font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.07em;text-align:center;">📧 Vérification du courrier</h3>
            <label>Destinataire</label>
            <div id="mail-destinataire"></div>
            <label>Contenu (modifiable)</label>
            <textarea id="mail-corps"></textarea>
            <button class="btn-approuver" onclick="approuverMail()">✅ Approuver et autoriser l'envoi</button>
            <button class="btn-fermer-mail" onclick="fermerModalMail()">Fermer sans envoyer</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
    const GOOGLE_API_KEY = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
    const CALENDAR_ID    = 'saintlouisenville67@gmail.com';

    let googleEventsGlobal = [];
    let intentionsGlobal   = [];
    let pretreActif        = 'molin';

    function filtrerPretre(id, btn) {
        pretreActif = id;
        document.querySelectorAll('.pretre-btn').forEach(b => b.classList.remove('actif'));
        btn.classList.add('actif');
        renderIntentions();
    }
    let mailIdEnCours      = null;
    const mailsData        = {};

    const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    async function chargerDemandes() {
        if (typeof maConnexion === 'undefined') { setTimeout(chargerDemandes, 300); return; }
        try {
            // Google Calendar : toute l'année en cours ± 1 mois
            const tMin = new Date(); tMin.setMonth(tMin.getMonth() - 1);
            const tMax = new Date(); tMax.setFullYear(tMax.getFullYear() + 1);
            const urlGcal = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${GOOGLE_API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${tMin.toISOString()}&timeMax=${tMax.toISOString()}&maxResults=500`;
            const resp = await fetch(urlGcal);
            const googleData = await resp.json();
            googleEventsGlobal = googleData.items || [];

            // Charger TOUTES les intentions
            const { data } = await maConnexion.from('intentions').select('*')
                .order('date_messe', { ascending: true });
            intentionsGlobal = data || [];

            document.getElementById('loading-status').style.display = 'none';
            await renderIntentions();
        } catch (err) {
            console.error(err);
            document.getElementById('loading-status').innerHTML =
                '<p style="color:var(--rubric);text-align:center;padding:20px;font-style:italic;">' +
                'Erreur de connexion à la base.<br>' +
                '<button onclick="chargerDemandes()" class="btn-primary" style="margin-top:12px;width:auto;padding:10px 22px;">Réessayer</button></p>';
        }
    }

    async function renderIntentions(filtre = '') {
        const tbody = document.getElementById('table-body');
        let list = intentionsGlobal;
        if (pretreActif) list = list.filter(i => (i.pretre_id || 'molin') === pretreActif);
        tbody.innerHTML = '';

        const intentionsActives  = list.filter(i => i.statut !== 'refuse');
        const intentionsRefusees = list.filter(i => i.statut === 'refuse');

        // Filtrage par nom si recherche active
        const filtreLC = filtre.toLowerCase().trim();
        const filtrer = list => filtreLC
            ? list.filter(i => (i.nom_intention || '').toLowerCase().includes(filtreLC) || (i.nom_donateur || '').toLowerCase().includes(filtreLC))
            : list;

        const actifsFiltres  = filtrer(intentionsActives);
        const refusesFiltres = filtrer(intentionsRefusees);

        // Groupement par mois
        const groupes = {};
        actifsFiltres.forEach(item => {
            const key = item.date_messe.substring(0, 7);
            if (!groupes[key]) groupes[key] = [];
            groupes[key].push(item);
        });

        const moisTries = Object.keys(groupes).sort();
        // FIX accordéon : mois en cours ouvert par défaut
        const moisCourant = new Date().toISOString().substring(0, 7);

        moisTries.forEach(moisKey => {
            const [annee, moisNum] = moisKey.split('-');
            const labelMois = MOIS_FR[parseInt(moisNum) - 1] + ' ' + annee;
            const items = groupes[moisKey];
            const nbEnAttente = items.filter(i => i.statut === 'en_attente' || i.en_edition).length;
            const estOuvert = moisKey === moisCourant || filtre !== '';

            const accordeonId = 'mois-' + moisKey;
            const header = document.createElement('div');
            header.className = 'accord-header';
            header.innerHTML =
                '<div class="accord-title">'
                + '📅 ' + labelMois
                + '<span class="accord-badge">' + items.length + ' intention' + (items.length > 1 ? 's' : '') + '</span>'
                + (nbEnAttente > 0 ? '<span class="accord-badge-warn">⏳ ' + nbEnAttente + ' en attente</span>' : '')
                + '</div>'
                + '<span id="arrow-' + moisKey + '" class="accord-arrow' + (estOuvert ? ' open' : '') + '">▼</span>';
            header.onclick = () => toggleMois(moisKey);
            tbody.appendChild(header);

            const groupDiv = document.createElement('div');
            groupDiv.id = accordeonId;
            groupDiv.style.display = estOuvert ? 'block' : 'none';

            items.forEach(item => {
                const estEnCours = item.statut === 'en_attente' || item.en_edition === true;
                const dateObj = new Date(item.date_messe + 'T00:00:00');
                const mailPrepare = genererTexteMail(item);

                let badgeMail = '';
                if (!estEnCours) {
                    if (item.mail_envoye) {
                        badgeMail = '<span class="mail-badge mail-badge-sent">✅ Mail envoyé</span>';
                    } else if (item.mail_approuve) {
                        badgeMail = '<span class="mail-badge">⏳ En attente d\u2019envoi</span>';
                    } else {
                        badgeMail = '<span class="mail-badge">⚠️ Non approuvé</span>';
                    }
                }

                const card = document.createElement('div');
                card.className = 'intention-card ' + (estEnCours ? 'en-attente' : (item.statut === 'valide' ? 'valide' : 'refuse'));
                card.dataset.intentionId = item.id;

                card.innerHTML =
                    '<div>'
                    + '<span class="date-badge">' + dateObj.toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) + '</span>'
                    + '<div class="intention-nom" style="display:flex;align-items:center;gap:6px;">'
                    + '<span id="nom-display-' + item.id + '" style="flex:1;">' + item.nom_intention + '</span>'
                    + '<button title="Modifier le nom" style="background:none;border:none;cursor:pointer;color:var(--gold);font-size:.85rem;padding:0 2px;" onclick="editerNomIntention(' + item.id + ',this)">✏️</button>'
                    + '</div>'
                    + '<div class="intention-meta">Demandeur : ' + item.nom_donateur + ' &middot; ' + item.type_intention + '</div>'
                    + '<div style="color:var(--ink-muted);font-size:.72rem;font-style:italic;">' + (item.email_donateur || '') + '</div>'
                    + badgeMail
                    + (item.commentaire ? '<div style="margin-top:8px;padding:8px 12px;background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:2px;font-size:.82rem;color:var(--ink-soft);font-style:italic;">🗒 ' + item.commentaire + '</div>' : '')
                    + '</div>'
                    + (estEnCours ? renderActionGroup(item) : renderTraiteInfo(item));

                mailsData[item.id] = { texte: mailPrepare, email: item.email_donateur || '' };
                groupDiv.appendChild(card);
                if (estEnCours) setTimeout(() => refreshTimeChoices(item.id, item.heure_messe), 0);
            });

            tbody.appendChild(groupDiv);
        });

        // Section refusées
        if (refusesFiltres.length > 0) {
            const refHeader = document.createElement('div');
            refHeader.className = 'accord-header refused';
            refHeader.innerHTML =
                '<div class="accord-title">✖️ Demandes refusées <span class="accord-badge">' + refusesFiltres.length + '</span></div>'
                + '<span id="arrow-refuses" class="accord-arrow">▼</span>';
            refHeader.onclick = () => {
                const div = document.getElementById('groupe-refuses');
                const arrow = document.getElementById('arrow-refuses');
                const isOpen = div.style.display !== 'none';
                div.style.display = isOpen ? 'none' : 'block';
                arrow.classList.toggle('open', !isOpen);
            };
            tbody.appendChild(refHeader);

            const refGroup = document.createElement('div');
            refGroup.id = 'groupe-refuses';
            refGroup.style.display = 'none';

            refusesFiltres.forEach(item => {
                const dateObj = new Date(item.date_messe + 'T00:00:00');
                const card = document.createElement('div');
                card.className = 'intention-card refuse';
                card.dataset.intentionId = item.id;
                card.style.opacity = '.75';
                card.innerHTML =
                    '<div>'
                    + '<span class="date-badge" style="background:var(--ink-muted);">' + dateObj.toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) + '</span>'
                    + '<div class="intention-nom" style="color:var(--ink-muted);">' + item.nom_intention + '</div>'
                    + '<div class="intention-meta">Demandeur : ' + item.nom_donateur + '</div>'
                    + '</div>'
                    + '<div class="traite-info">Demande refusée'
                    + '<div style="margin-top:8px;">'
                    + '<button class="btn-danger-ghost" onclick="getIdAndCall(this, supprimerIntention)">🗑️ Supprimer</button>'
                    + '</div></div>';
                refGroup.appendChild(card);
            });
            tbody.appendChild(refGroup);
        }

        // Stats — calculé depuis intentionsGlobal déjà chargé
        const year = new Date().getFullYear();
        const n = intentionsGlobal.filter(i =>
            i.statut === 'valide' && (i.date_messe || '').startsWith(year)
        ).length;
        document.getElementById('annual-count').textContent = n;
        document.getElementById('label-annee-intentions').textContent = 'MESSES CÉLÉBRÉES EN ' + year;
    }

    function renderActionGroup(item) {
        return '<div class="action-group">'
            + '<div class="action-label">Disponibilités</div>'
            + '<input type="date" id="d-' + item.id + '" value="' + item.date_messe + '" onchange="refreshTimeChoicesFromInput(this)">'
            + '<div class="pretre-selector-card">'
            + Object.entries(PRETRES).map(([id, p]) =>
                `<button class="pretre-chip${(item.pretre_id||'molin')===id?' actif':''}" data-iid="${item.id}" data-pid="${id}"
                    onclick="setPretre(this,'${item.id}','${id}')">${p.nom}</button>`
              ).join('')
            + '</div>'
            + '<div id="times-' + item.id + '" class="time-selector-container"></div>'
            + '<button class="btn-valider" onclick="getIdAndCall(this, finaliser)">✅ Valider cet horaire</button>'
            + '<div class="inline-actions">'
            + '<button class="btn-danger-ghost" onclick="getIdAndCall(this, refuser)">✖️ Refuser</button>'
            + '<button class="btn-ghost" onclick="getIdAndCall(this, supprimerIntention)" style="color:var(--ink-muted);">🗑️ Supprimer</button>'
            + '</div></div>';
    }

    function renderTraiteInfo(item) {
        return '<div class="traite-info">'
            + '<strong style="font-style:normal;">Confirmé :</strong> ' + (item.reponse_pretre || '—')
            + '<div class="inline-actions" style="margin-top:10px;">'
            + '<button class="btn-ghost" onclick="getIdAndCall(this, editer)">✏️ Modifier</button>'
            + (!item.mail_envoye ? '<button class="btn-mail" onclick="getIdAndCall(this, ouvrirModalMailById)">📧 Vérifier le mail</button>' : '')
            + '<button class="btn-danger-ghost" onclick="getIdAndCall(this, supprimerIntention)">🗑️ Supprimer</button>'
            + '</div></div>';
    }

    async function filtrerRecherche(valeur) {
        await renderIntentions(valeur);
    }

    const PRETRES = {
        molin:        { nom: 'l'abbé Molin',           titre: 'Abbé MOLIN',           role: 'curé'    },
        carbonnieres: { nom: 'l'abbé de Carbonnières',  titre: 'Abbé de CARBONNIÈRES', role: 'vicaire' },
        legall:       { nom: 'l'abbé Le Gall',          titre: 'Abbé LE GALL',         role: 'vicaire' },
    };

    function getPretreInfo(item) {
        return PRETRES[item.pretre_id] || PRETRES.molin;
    }

    function genererTexteMail(item) {
        const nomDonateur   = (item.nom_donateur || '').trim();
        const texteIntention = (item.nom_intention || 'votre intention').trim();
        const d = item.date_messe.split('-');
        const dateFinaleFr = `${d[2]}/${d[1]}/${d[0]}`;
        const heureFinale  = (item.heure_messe || 'à confirmer').replace(':', 'h');
        const dateDemandee = item.date_originale_mail || '';

        let phraseIntroduction = '';
        if (dateDemandee && dateDemandee !== 'Non précisée' && dateDemandee !== dateFinaleFr) {
            phraseIntroduction = `Le créneau du ${dateDemandee} étant déjà réservé, nous avons dû décaler votre demande pour "${texteIntention}".`;
        } else {
            phraseIntroduction = `La Messe pour "${texteIntention}" a bien été enregistrée.`;
        }
        let messagePretre = (item.reponse_pretre || '').trim();
        // N'utiliser reponse_pretre que si c'est un court message personnel (< 120 car.)
        // et qu'il ne ressemble pas à un mail déjà formaté
        if (messagePretre
            && messagePretre.length < 120
            && !messagePretre.startsWith('La Messe')
            && !messagePretre.startsWith('Bonjour')
            && !messagePretre.includes('sera célébrée')) {
            phraseIntroduction = `Concernant votre demande pour "${texteIntention}", ${messagePretre}.`;
        }
        const p = getPretreInfo(item);
        return `Bonjour ${nomDonateur},\n\n${phraseIntroduction}\n\nLa Messe sera célébrée le ${dateFinaleFr} à ${heureFinale}.\n\nJe vous assure de ma prière,\n\n${p.titre},\n${p.role}\n\n---\n[Ce mail est envoyé automatiquement suite à l'accord de ${p.nom}.]`;
    }

    function ouvrirModalMailById(id) {
        const data = mailsData[id];
        if (!data) { AppModal.alert('⚠️', 'Données manquantes', 'Rechargez la page et réessayez.'); return; }
        mailIdEnCours = id;
        document.getElementById('mail-destinataire').innerText = data.email || '(email non renseigné)';
        document.getElementById('mail-corps').value = data.texte;
        document.getElementById('modal-mail').style.display = 'flex';
    }

    function fermerModalMail() {
        document.getElementById('modal-mail').style.display = 'none';
        mailIdEnCours = null;
    }

    async function approuverMail() {
        if (!mailIdEnCours) return;
        const texteModifie = document.getElementById('mail-corps').value.trim();
        if (!texteModifie) { AppModal.alert('⚠️', 'Mail vide', 'Le contenu du mail ne peut pas être vide.'); return; }
        const { error } = await maConnexion.from('intentions').update({
            reponse_pretre: texteModifie, mail_approuve: true, mail_envoye: false
        }).eq('id', mailIdEnCours);
        if (error) { AppModal.alert('❌', 'Erreur', error.message); return; }
        fermerModalMail();
        await AppModal.alert('✅', 'Mail approuvé', 'Le mail sera envoyé lors du prochain passage du script automatique.', 'OK', 'app-modal-btn-success');
        chargerDemandes();
    }

    async function refreshTimeChoices(id, selectedHeure = '') {
        const inputDate = document.getElementById(`d-${id}`).value;
        const container = document.getElementById(`times-${id}`);
        const estUneMesse = e => /messe/i.test((e.summary || '').trim());

        // 1. Chercher dans le cache global
        let matches = googleEventsGlobal.filter(e => {
            const d = (e.start.dateTime || e.start.date).split('T')[0];
            return d === inputDate && estUneMesse(e);
        });

        // 2. Si rien dans le cache, appel direct Google Calendar
        if (matches.length === 0 && inputDate) {
            container.innerHTML = '<p style="color:var(--ink-muted);font-size:.75rem;font-style:italic;">Chargement des créneaux…</p>';
            try {
                const tMin = new Date(inputDate + 'T00:00:00').toISOString();
                const tMax = new Date(inputDate + 'T23:59:59').toISOString();
                const url  = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                    + `?key=${GOOGLE_API_KEY}&timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=20`;
                const resp = await fetch(url);
                const data = await resp.json();
                matches = (data.items || []).filter(estUneMesse);
                // Ajouter au cache pour éviter les requêtes répétées
                googleEventsGlobal = [...googleEventsGlobal.filter(e => {
                    const d = (e.start.dateTime || e.start.date).split('T')[0];
                    return d !== inputDate;
                }), ...data.items || []];
            } catch(e) {
                console.error('Erreur GCal refreshTimeChoices:', e);
            }
        }

        if (matches.length === 0) {
            let heureDefaut = '09:00';
            if (selectedHeure && selectedHeure !== 'à confirmer' && /^\d{2}:\d{2}$/.test(selectedHeure)) heureDefaut = selectedHeure;
            container.innerHTML =
                '<p style="color:var(--gold);font-size:.75rem;font-weight:bold;margin-bottom:6px;font-family:\'Cinzel\',serif;">Messe privée — aucun créneau agenda</p>'
                + '<input type="time" id="heure-privee-' + id + '" value="' + heureDefaut + '"'
                + ' style="width:auto;padding:8px 10px;border:2px solid var(--gold);font-family:\'Cinzel\',serif;font-size:.9rem;">';
            container.dataset.privee = 'true';
            return;
        }
        container.dataset.privee = 'false';
        container.innerHTML = matches.map(m => {
            const timeStr = new Date(m.start.dateTime).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }).replace(':','h');
            const timeDb  = timeStr.replace('h',':');
            const estPris = intentionsGlobal.some(i => i.date_messe === inputDate && i.heure_messe === timeDb && i.statut === 'valide' && i.id !== id);
            if (estPris) return `<div class="time-chip taken" title="Déjà réservé">🔒 ${timeStr}</div>`;
            const isActive = selectedHeure && selectedHeure.replace(':','h') === timeStr ? 'active' : '';
            return `<div class="time-chip ${isActive}" onclick="selectChip(this,'${id}')">${timeStr}</div>`;
        }).join('');
        const available = container.querySelectorAll('.time-chip:not(.taken)');
        if (available.length === 1 && !selectedHeure) selectChip(available[0], id);
    }

    function selectChip(el, id) {
        document.getElementById(`times-${id}`).querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    async function editerNomIntention(id, btn) {
        const span = document.getElementById('nom-display-' + id);
        const ancienNom = span.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.value = ancienNom;
        input.style.cssText = 'font-family:inherit;font-size:inherit;border:1px solid var(--gold);border-radius:2px;padding:2px 6px;width:100%;background:var(--vellum-light);color:var(--ink);';
        span.replaceWith(input);
        btn.style.display = 'none';
        input.focus();
        input.select();

        async function validerNom() {
            const nouveauNom = input.value.trim();
            if (!nouveauNom || nouveauNom === ancienNom) {
                input.replaceWith(span);
                btn.style.display = '';
                return;
            }
            try {
                const { error } = await maConnexion.from('intentions').update({ nom_intention: nouveauNom }).eq('id', id);
                if (error) throw error;
                span.textContent = nouveauNom;
                // Mettre à jour le cache local
                const found = intentionsGlobal.find(i => String(i.id) === String(id));
                if (found) found.nom_intention = nouveauNom;
                showToast('✅ Nom modifié');
            } catch(e) {
                AppModal.alert('❌', 'Erreur', e.message);
            }
            input.replaceWith(span);
            btn.style.display = '';
        }

        input.addEventListener('blur', validerNom);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = ancienNom; input.blur(); }
        });
    }

    function setPretre(btn, intentionId, pretreId) {
        // Mettre à jour les chips visuellement
        const card = btn.closest('[data-intention-id]') || btn.closest('.intention-card');
        if (card) card.querySelectorAll('.pretre-chip').forEach(c => c.classList.remove('actif'));
        btn.classList.add('actif');
        // Stocker sur le bouton pour lecture dans finaliser
        btn.dataset.iid = intentionId;
        btn.dataset.pid = pretreId;
        // Mettre à jour pretre_id dans le cache local
        const found = intentionsGlobal.find(i => String(i.id) === String(intentionId));
        if (found) found.pretre_id = pretreId;
        // Régénérer le mail preview si la modal est ouverte
        if (mailIdEnCours == intentionId && found) {
            document.getElementById('mail-corps').value = genererTexteMail(found);
        }
    }

    async function finaliser(id) {
        const container = document.getElementById(`times-${id}`);
        const estPrivee = container.dataset.privee === 'true';
        let hLabel, hDb;
        if (estPrivee) {
            const inp = document.getElementById(`heure-privee-${id}`);
            if (!inp || !inp.value) { AppModal.alert('⚠️', 'Horaire manquant', 'Veuillez indiquer l\'horaire de la Messe privée.'); return; }
            const [hh, mm] = inp.value.split(':');
            hLabel = `${hh}h${mm}`; hDb = `${hh}:${mm}`;
        } else {
            const chip = document.querySelector(`#times-${id} .time-chip.active`);
            if (!chip) { AppModal.alert('⚠️', 'Horaire manquant', 'Veuillez sélectionner un horaire disponible.'); return; }
            hLabel = chip.innerText; hDb = hLabel.replace('h',':');
        }
        const d = document.getElementById(`d-${id}`).value;
        const dateFr = new Date(d + 'T00:00:00').toLocaleDateString('fr-FR');

        const { data: doublon } = await maConnexion.from('intentions')
            .select('id').eq('date_messe', d).eq('heure_messe', hDb).eq('statut', 'valide').neq('id', id).maybeSingle();
        if (doublon) { AppModal.alert('⛔', 'Créneau indisponible', 'Ce créneau vient d\'être pris par une autre intention.'); return; }

        const { data: info } = await maConnexion.from('intentions').select('nom_intention').eq('id', id).single();
        const libelle = estPrivee ? 'Messe privée' : 'Messe';
        const txt = `La ${libelle} à votre intention (${info.nom_intention}) sera célébrée le ${dateFr} à ${hLabel}.`;

        // FIX 3 : try/catch sur l'update final
        try {
            const pretreId = intentionsGlobal.find(i => String(i.id) === String(id))?.pretre_id || 'molin';
            const { error } = await maConnexion.from('intentions').update({
                date_messe: d, heure_messe: hDb, statut: 'valide',
                pretre_id: pretreId,
                reponse_pretre: txt, en_edition: false,
                mail_envoye: false, mail_approuve: false
            }).eq('id', id);
            if (error) throw error;
            showToast('✅ Intention validée');
            chargerDemandes();
        } catch (e) {
            AppModal.alert('❌', 'Erreur lors de la validation', e.message || 'Veuillez réessayer.');
        }
    }

    function getIdAndCall(btn, fn) {
        const card = btn.closest('[data-intention-id]');
        const id = card ? card.dataset.intentionId : null;
        if (!id) return console.error('ID introuvable');
        fn(id);
    }

    function refreshTimeChoicesFromInput(input) {
        const card = input.closest('[data-intention-id]');
        const id = card ? card.dataset.intentionId : null;
        if (id) refreshTimeChoices(id);
    }

    function toggleMois(moisKey) {
        const div   = document.getElementById('mois-' + moisKey);
        const arrow = document.getElementById('arrow-' + moisKey);
        const isOpen = div.style.display !== 'none';
        div.style.display = isOpen ? 'none' : 'block';
        arrow.classList.toggle('open', !isOpen);
    }

    async function supprimerIntention(id) {
        const ok = await AppModal.confirm('🗑️', "Supprimer l'intention ?", 'Cette action est irréversible. Aucun mail ne sera envoyé.', 'Supprimer', 'app-modal-btn-danger');
        if (!ok) return;
        try {
            const { error } = await maConnexion.from('intentions').delete().eq('id', id);
            if (error) throw error;
            showToast('🗑️ Intention supprimée');
            chargerDemandes();
        } catch (e) {
            AppModal.alert('❌', 'Erreur', e.message || 'Impossible de supprimer.');
        }
    }

    // FIX 3 : try/catch sur editer
    async function editer(id) {
        try {
            const { error } = await maConnexion.from('intentions').update({ en_edition: true, mail_approuve: false }).eq('id', id);
            if (error) throw error;
            chargerDemandes();
        } catch (e) {
            AppModal.alert('❌', 'Erreur', e.message || 'Impossible de passer en édition.');
        }
    }

    // FIX 3 + FIX 4 : refuser avec mail de notification au donateur
    async function refuser(id) {
        const okRefus = await AppModal.confirm('✖️', 'Refuser la demande ?',
            'Un mail de refus sera envoyé au donateur. La demande sera archivée.',
            'Refuser', 'app-modal-btn-danger');
        if (!okRefus) return;
        try {
            // FIX 4 : mail_approuve = true + statut = 'refuse'
            // → Code.gs doit filtrer aussi statut=refuse pour envoyer le mail de refus
            // On passe par un statut intermédiaire : on envoie d'abord le mail (approuve=true),
            // puis le GS marquera mail_envoye=true. On met statut='refuse' directement.
            const { error } = await maConnexion.from('intentions').update({
                statut: 'refuse',
                en_edition: false,
                reponse_pretre: 'Désolé, nous ne pouvons pas honorer cette demande pour la date demandée. N\'hésitez pas à nous recontacter pour une autre date.',
                mail_approuve: true,   // ← FIX 4 : le GS pourra envoyer le mail
                mail_envoye: false
            }).eq('id', id);
            if (error) throw error;
            showToast('✖️ Demande refusée — mail en attente d\'envoi');
            chargerDemandes();
        } catch (e) {
            AppModal.alert('❌', 'Erreur', e.message || 'Impossible de refuser la demande.');
        }
    }

    window.onload = chargerDemandes;
    </script>
</body>
</html>
