<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainte Bible — Crampon</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1108">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
    /* ═══════════════════════════════════════════════════════
       BIBLE — Layout général
    ═══════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background: var(--vellum);
        color: var(--ink);
        font-family: 'EB Garamond', serif;
        font-size: 17px;
        line-height: 1.65;
        padding-bottom: calc(72px + env(safe-area-inset-bottom));
    }

    /* ── Layout principal ─────────────────────────────── */
    .bible-layout {
        display: flex;
        height: calc(100vh - 65px - env(safe-area-inset-bottom));
        overflow: hidden;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* ── Sidebar ──────────────────────────────────────── */
    .bible-sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 2px solid var(--gold);
    }

    .sidebar-header {
        padding: 16px 14px 10px;
        border-bottom: 1px solid rgba(184,150,42,.25);
        flex-shrink: 0;
    }

    .sidebar-title {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .22em;
        color: var(--gold);
        text-transform: uppercase;
        margin: 0 0 8px;
        display: block;
    }

    /* Barre de recherche sidebar */
    .sidebar-search {
        position: relative;
    }
    .sidebar-search input {
        width: 100%;
        padding: 8px 32px 8px 10px;
        font-family: 'EB Garamond', serif;
        font-size: .92rem;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(184,150,42,.35);
        border-radius: 2px;
        color: var(--vellum);
        outline: none;
        transition: border-color .2s;
    }
    .sidebar-search input::placeholder { color: rgba(240,230,184,.35); font-style: italic; }
    .sidebar-search input:focus { border-color: var(--gold); }
    .sidebar-search-icon {
        position: absolute;
        right: 8px; top: 50%;
        transform: translateY(-50%);
        color: rgba(184,150,42,.5);
        font-size: .85rem;
        pointer-events: none;
    }

    /* ── Onglets AT/NT ────────────────────────────────── */
    .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid rgba(184,150,42,.2);
        flex-shrink: 0;
    }
    .sidebar-tab {
        flex: 1;
        padding: 8px 0;
        font-family: 'Cinzel', serif;
        font-size: .6rem;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: rgba(240,230,184,.45);
        background: none;
        border: none;
        cursor: pointer;
        transition: all .2s;
        border-bottom: 2px solid transparent;
    }
    .sidebar-tab.active {
        color: var(--gold);
        border-bottom-color: var(--gold);
    }

    /* ── Liste des livres ─────────────────────────────── */
    .sidebar-books {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
    }
    .sidebar-books::-webkit-scrollbar { width: 4px; }
    .sidebar-books::-webkit-scrollbar-track { background: transparent; }
    .sidebar-books::-webkit-scrollbar-thumb { background: rgba(184,150,42,.3); border-radius: 2px; }

    .sidebar-group-label {
        font-family: 'Cinzel', serif;
        font-size: .5rem;
        letter-spacing: .2em;
        color: rgba(184,150,42,.45);
        text-transform: uppercase;
        padding: 10px 14px 4px;
    }

    .sidebar-book {
        display: block;
        width: 100%;
        text-align: left;
        padding: 7px 14px;
        font-family: 'EB Garamond', serif;
        font-size: .92rem;
        color: rgba(240,230,184,.65);
        background: none;
        border: none;
        cursor: pointer;
        transition: all .15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .sidebar-book:hover { color: var(--vellum); background: rgba(184,150,42,.08); }
    .sidebar-book.active { color: var(--gold); background: rgba(184,150,42,.12); font-style: italic; }

    /* ── Zone principale ──────────────────────────────── */
    .bible-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--vellum);
    }

    /* ── En-tête du texte ─────────────────────────────── */
    .bible-topbar {
        padding: 12px 20px 10px;
        border-bottom: 1px solid var(--border-soft);
        background: var(--vellum-light);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .bible-breadcrumb {
        flex: 1;
        min-width: 0;
    }
    .bible-breadcrumb-book {
        font-family: 'Cinzel', serif;
        font-size: .65rem;
        letter-spacing: .14em;
        color: var(--rubric);
        text-transform: uppercase;
    }
    .bible-breadcrumb-chapter {
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
        color: var(--ink-muted);
        font-style: italic;
    }

    /* Navigation chapitres */
    .chapter-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    .chapter-btn {
        background: none;
        border: 1px solid var(--border-soft);
        color: var(--ink-muted);
        font-size: .85rem;
        width: 28px; height: 28px;
        border-radius: 2px;
        cursor: pointer;
        transition: all .15s;
        display: flex; align-items: center; justify-content: center;
    }
    .chapter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .chapter-btn:disabled { opacity: .25; cursor: default; }

    .chapter-select {
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .08em;
        padding: 5px 8px;
        border: 1px solid var(--border-soft);
        border-radius: 2px;
        background: var(--vellum);
        color: var(--ink);
        cursor: pointer;
        max-width: 120px;
    }
    .chapter-select:focus { outline: none; border-color: var(--gold); }

    /* ── Corps du texte ───────────────────────────────── */
    .bible-text-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 28px 32px 40px;
    }
    .bible-text-wrap::-webkit-scrollbar { width: 6px; }
    .bible-text-wrap::-webkit-scrollbar-track { background: transparent; }
    .bible-text-wrap::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

    .bible-chapter-title {
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .22em;
        color: var(--gold);
        text-transform: uppercase;
        margin: 0 0 20px;
        text-align: center;
        display: block;
    }
    .bible-chapter-ornament {
        text-align: center;
        color: var(--gold);
        font-size: .6rem;
        letter-spacing: .5em;
        opacity: .6;
        margin-bottom: 22px;
    }

    .bible-paragraph {
        margin: 0 0 1.1em;
        text-align: justify;
        font-size: 1.08rem;
        line-height: 1.8;
        hyphens: auto;
    }

    .verset-num {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        color: var(--gold);
        font-style: normal;
        vertical-align: super;
        margin-right: 3px;
        letter-spacing: .02em;
        opacity: .75;
        user-select: none;
        cursor: default;
    }

    .bible-loading, .bible-empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-muted);
        font-style: italic;
        font-size: 1rem;
    }
    .bible-loading::before { content: '✦'; display: block; color: var(--gold); font-size: 1.2rem; margin-bottom: 16px; animation: pulse-gold 1.5s ease-in-out infinite; }
    @keyframes pulse-gold { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

    /* ── Modale de recherche ──────────────────────────── */
    .search-modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 3000;
        background: rgba(26,17,8,.65);
        align-items: flex-start;
        justify-content: center;
        padding: 60px 16px 20px;
    }
    .search-modal-bg.open { display: flex; }

    .search-modal {
        background: var(--vellum-light);
        border-radius: 4px;
        width: 100%;
        max-width: 640px;
        box-shadow: 0 12px 48px rgba(0,0,0,.35);
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 100px);
        border-top: 3px solid var(--gold);
    }

    .search-modal-head {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--border-soft);
        flex-shrink: 0;
    }
    .search-modal-head-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .search-modal-input-wrap {
        flex: 1;
        position: relative;
    }
    .search-modal-input {
        width: 100%;
        padding: 10px 14px;
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
        border: 1px solid var(--border-soft);
        border-radius: 2px;
        background: var(--vellum);
        color: var(--ink);
        outline: none;
    }
    .search-modal-input:focus { border-color: var(--gold); }

    .search-modal-close {
        background: none;
        border: none;
        font-size: 1.3rem;
        color: var(--ink-muted);
        cursor: pointer;
        padding: 4px 8px;
    }
    .search-modal-close:hover { color: var(--rubric); }

    .search-hint {
        margin-top: 8px;
        font-family: 'EB Garamond', serif;
        font-size: .82rem;
        color: var(--ink-muted);
        font-style: italic;
    }

    .search-modal-results {
        flex: 1;
        overflow-y: auto;
        padding: 0;
    }
    .search-modal-results::-webkit-scrollbar { width: 4px; }
    .search-modal-results::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 2px; }

    .search-result-item {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-soft);
        cursor: pointer;
        transition: background .15s;
    }
    .search-result-item:hover { background: var(--vellum-dark, #ede5cc); }
    .search-result-ref {
        font-family: 'Cinzel', serif;
        font-size: .6rem;
        letter-spacing: .14em;
        color: var(--rubric);
        text-transform: uppercase;
        margin-bottom: 4px;
    }
    .search-result-text {
        font-size: .95rem;
        color: var(--ink);
        line-height: 1.55;
    }
    .search-result-text mark {
        background: var(--gold-pale);
        color: var(--ink);
        border-radius: 1px;
        padding: 0 1px;
    }
    .search-count {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .12em;
        color: var(--ink-muted);
        text-transform: uppercase;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border-soft);
        background: var(--vellum);
    }
    .search-empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--ink-muted);
        font-style: italic;
    }

    /* ── Mobile ───────────────────────────────────────── */
    @media (max-width: 700px) {
        .bible-sidebar {
            position: fixed;
            left: -244px;
            top: 0;
            bottom: calc(65px + env(safe-area-inset-bottom));
            z-index: 500;
            transition: left .25s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,.35);
        }
        .bible-sidebar.open { left: 0; }
        .bible-sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 499;
        }
        .bible-sidebar-overlay.open { display: block; }
        .bible-layout { height: auto; overflow: visible; }
        .bible-main { height: calc(100vh - 65px - env(safe-area-inset-bottom)); }
        .bible-text-wrap { padding: 18px 16px 30px; }
        /* Sur mobile : cacher le ⌕ topbar et les flèches ‹ › */
        .topbar-search-btn { display: none; }
        .chapter-arrows    { display: none; }
    }

    /* ── Bouton ouvrir sidebar (topbar mobile) ────────── */
    .sidebar-toggle {
        display: none;
        background: none;
        border: 1px solid var(--border-soft);
        color: var(--ink-muted);
        padding: 5px 10px;
        border-radius: 2px;
        cursor: pointer;
        font-size: .85rem;
        flex-shrink: 0;
    }
    @media (max-width: 700px) { .sidebar-toggle { display: flex; align-items: center; gap: 5px; } }
    </style>
</head>
<body>

<div id="bible-sidebar-overlay" class="bible-sidebar-overlay" onclick="toggleSidebar(false)"></div>

<div class="bible-layout">

    <!-- ═══ SIDEBAR ═══════════════════════════════════════ -->
    <aside class="bible-sidebar" id="bible-sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Sainte Bible · Crampon</span>
            <div class="sidebar-search">
                <input type="text" id="sidebar-search-input"
                    placeholder="Mt 5, 3  ou  miséricorde…"
                    autocomplete="off" autocorrect="off" spellcheck="false"
                    onkeydown="if(event.key==='Enter') lancerRecherche()">
                <span class="sidebar-search-icon">⌕</span>
            </div>
        </div>

        <div class="sidebar-tabs">
            <button class="sidebar-tab active" id="tab-at" onclick="setTab('AT')">Ancien Testament</button>
            <button class="sidebar-tab" id="tab-nt" onclick="setTab('NT')">Nouveau Testament</button>
        </div>

        <div class="sidebar-books" id="sidebar-books-list"></div>
    </aside>

    <!-- ═══ ZONE PRINCIPALE ════════════════════════════════ -->
    <main class="bible-main">

        <!-- Topbar -->
        <div class="bible-topbar">
            <button class="sidebar-toggle" onclick="toggleSidebar(true)">
                <span>☰</span>
            </button>
            <div class="bible-breadcrumb">
                <div class="bible-breadcrumb-book" id="breadcrumb-book">Choisissez un livre</div>
            </div>
            <div class="chapter-nav" id="chapter-nav" style="display:none;">
                <button class="chapter-btn chapter-arrows" id="btn-chap-prev" onclick="naviguerChapitre(-1)" title="Chapitre précédent">‹</button>
                <select class="chapter-select" id="chapter-select" onchange="chargerChapitre(this.value)"></select>
                <button class="chapter-btn chapter-arrows" id="btn-chap-next" onclick="naviguerChapitre(1)" title="Chapitre suivant">›</button>
            </div>
            <button class="topbar-search-btn" onclick="ouvrirRecherche()" title="Rechercher"
                style="background:none;border:1px solid var(--border-soft);border-radius:2px;padding:6px 12px;cursor:pointer;color:var(--ink-muted);font-size:.85rem;flex-shrink:0;transition:all .15s;"
                onmouseover="this.style.borderColor='var(--gold)';this.style.color='var(--gold)'"
                onmouseout="this.style.borderColor='var(--border-soft)';this.style.color='var(--ink-muted)'">
                ⌕
            </button>
        </div>

        <!-- Corps -->
        <div class="bible-text-wrap" id="bible-text">
            <div class="bible-empty">
                <div style="color:var(--gold);font-size:1.8rem;margin-bottom:16px;opacity:.4;">✝</div>
                <span style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);">Sélectionnez un livre</span>
            </div>
        </div>
    </main>
</div>

<!-- ═══ MODALE RECHERCHE ═══════════════════════════════════ -->
<div class="search-modal-bg" id="search-modal-bg" onclick="if(event.target===this) fermerRecherche()">
    <div class="search-modal">
        <div class="search-modal-head">
            <div class="search-modal-head-row">
                <div class="search-modal-input-wrap">
                    <input class="search-modal-input" id="search-modal-input" type="text"
                        placeholder="Mt 5, 3 — ou — miséricorde…"
                        autocomplete="off" autocorrect="off" spellcheck="false"
                        oninput="debouncerRecherche()" onkeydown="if(event.key==='Escape') fermerRecherche()">
                </div>
                <button class="search-modal-close" onclick="fermerRecherche()">✕</button>
            </div>
            <div class="search-hint" id="search-hint">Entrez une référence (Mt 5, 3) ou des mots-clés</div>
        </div>
        <div class="search-modal-results" id="search-results"></div>
    </div>
</div>

<!-- FAB supprimé : recherche accessible via la sidebar sur mobile -->
<div id="menu-container"></div>
<script src="menu.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// BIBLE — Moteur principal
// ═══════════════════════════════════════════════════════════

// ── Canon catholique AT/NT ─────────────────────────────────
const CANON = {
    AT: {
        'Pentateuque':  ['Genèse','Exode','Lévitique','Nombres','Deutéronome'],
        'Historiques':  ['Josué','Juges','Ruth','1 Samuel','2 Samuel','1 Rois','2 Rois',
                         '1 Chroniques','2 Chroniques','Esdras','Néhémie',
                         'Tobie','Judith','Esther','1 Macchabées','2 Macchabées'],
        'Sapientiaux':  ['Job','Psaumes','Proverbes','Ecclésiaste',
                         'Cantique des Cantiques','Sagesse','Ecclésiastique'],
        'Prophètes':    ['Isaïe','Jérémie','Lamentations','Baruch','Ézéchiel','Daniel',
                         'Osée','Joël','Amos','Abdias','Jonas','Michée','Nahum',
                         'Habacuc','Sophonie','Aggée','Zacharie','Malachie']
    },
    NT: {
        'Évangiles':    ['Matthieu','Marc','Luc','Jean'],
        'Actes & Paul': ['Actes','Romains','1 Corinthiens','2 Corinthiens',
                         'Galates','Éphésiens','Philippiens','Colossiens',
                         '1 Thessaloniciens','2 Thessaloniciens',
                         '1 Timothée','2 Timothée','Tite','Philémon','Hébreux'],
        'Épîtres cath.':['Jacques','1 Pierre','2 Pierre','1 Jean','2 Jean','3 Jean','Jude'],
        'Apocalypse':   ['Apocalypse']
    }
};

// ── État ───────────────────────────────────────────────────
let _tab        = 'AT';
let _livreActif = null;
let _chapActif  = null;
let _chapMax    = 1;
let _debounceTimer = null;

// ── Init Supabase ──────────────────────────────────────────
let db;
function initDB() {
    if (typeof maConnexion !== 'undefined') { db = maConnexion; return true; }
    return false;
}

// ── Sidebar : remplir les livres ───────────────────────────
function setTab(tab) {
    _tab = tab;
    document.getElementById('tab-at').classList.toggle('active', tab === 'AT');
    document.getElementById('tab-nt').classList.toggle('active', tab === 'NT');
    renderSidebarBooks();
}

function renderSidebarBooks() {
    const groups = CANON[_tab];
    let html = '';
    for (const [groupe, livres] of Object.entries(groups)) {
        html += `<div class="sidebar-group-label">${groupe}</div>`;
        for (const livre of livres) {
            const active = livre === _livreActif ? ' active' : '';
            html += `<button class="sidebar-book${active}" onclick="selectionnerLivre('${livre.replace(/'/g,"\\'")}')">
                ${livre}
            </button>`;
        }
    }
    document.getElementById('sidebar-books-list').innerHTML = html;
}

// ── Sélection d'un livre ───────────────────────────────────
async function selectionnerLivre(livre, chapitre) {
    _livreActif = livre;
    _chapActif  = chapitre || 1;
    toggleSidebar(false);
    renderSidebarBooks();

    // Compter les chapitres
    if (!initDB()) return;
    const { data } = await db.from('bible_crampon')
        .select('chapitre')
        .eq('livre', livre)
        .order('chapitre', { ascending: true });

    const chaps = [...new Set((data||[]).map(r => parseInt(r.chapitre)))].sort((a,b)=>a-b);
    _chapMax = chaps[chaps.length - 1] || 1;

    // Remplir le select
    const sel = document.getElementById('chapter-select');
    sel.innerHTML = chaps.map(c =>
        `<option value="${c}" ${c == _chapActif ? 'selected' : ''}>Chapitre ${c}</option>`
    ).join('');

    document.getElementById('chapter-nav').style.display = 'flex';
    actualiserBoutonsChapitre();
    await chargerChapitre(_chapActif);
}

// ── Chargement d'un chapitre ───────────────────────────────
async function chargerChapitre(chap) {
    _chapActif = parseInt(chap);
    document.getElementById('chapter-select').value = _chapActif;
    actualiserBoutonsChapitre();

    document.getElementById('breadcrumb-book').textContent = _livreActif;

    const textWrap = document.getElementById('bible-text');
    textWrap.innerHTML = '<div class="bible-loading">Chargement…</div>';

    if (!initDB()) return;
    const { data, error } = await db.from('bible_crampon')
        .select('verset_num, texte')
        .eq('livre', _livreActif)
        .eq('chapitre', _chapActif)
        .order('verset_num', { ascending: true });

    if (error || !data || !data.length) {
        textWrap.innerHTML = '<div class="bible-empty">Chapitre non disponible.</div>';
        return;
    }

    // Regrouper les versets en paragraphes naturels (toutes les ~5 versets)
    // et afficher le texte de façon continue
    let html = `<span class="bible-chapter-title">${_livreActif} ${_chapActif}</span>`;
    html += `<div class="bible-chapter-ornament">✦  ✦  ✦</div>`;
    html += `<p class="bible-paragraph">`;

    data.forEach((v, i) => {
        const num = parseInt(v.verset_num);
        // Nouveau paragraphe tous les 8 versets environ (aux multiples de 8)
        if (i > 0 && num % 8 === 1) {
            html += `</p><p class="bible-paragraph">`;
        }
        html += `<sup class="verset-num">${num}</sup>${escH(v.texte)} `;
    });

    html += `</p>`;
    textWrap.innerHTML = html;
    textWrap.scrollTop = 0;
}

function actualiserBoutonsChapitre() {
    document.getElementById('btn-chap-prev').disabled = (_chapActif <= 1);
    document.getElementById('btn-chap-next').disabled = (_chapActif >= _chapMax);
}

function naviguerChapitre(delta) {
    const n = _chapActif + delta;
    if (n < 1 || n > _chapMax) return;
    chargerChapitre(n);
}

// ── Sidebar mobile ─────────────────────────────────────────
function toggleSidebar(open) {
    document.getElementById('bible-sidebar').classList.toggle('open', open);
    document.getElementById('bible-sidebar-overlay').classList.toggle('open', open);
}

// ── Recherche ──────────────────────────────────────────────
function ouvrirRecherche() {
    // Copier le texte de la sidebar search dans la modale
    const sVal = document.getElementById('sidebar-search-input').value;
    document.getElementById('search-modal-input').value = sVal;
    document.getElementById('search-modal-bg').classList.add('open');
    document.getElementById('search-modal-input').focus();
    if (sVal.trim()) lancerRechercheModale();
}

function fermerRecherche() {
    document.getElementById('search-modal-bg').classList.remove('open');
}

function lancerRecherche() {
    ouvrirRecherche();
}

function debouncerRecherche() {
    clearTimeout(_debounceTimer);
    _debounceTimer = setTimeout(lancerRechercheModale, 350);
}

// Détecte si la requête est une référence biblique (ex: Mt 5, 3 ou Jn 3 ou Genèse 1)
const REF_RE = /^(.+?)\s+(\d+)(?:\s*[,;:]\s*(\d+))?$/;

async function lancerRechercheModale() {
    if (!initDB()) return;
    const q = document.getElementById('search-modal-input').value.trim();
    const hint = document.getElementById('search-hint');
    const results = document.getElementById('search-results');

    if (q.length < 2) {
        results.innerHTML = '';
        hint.textContent = 'Entrez une référence (Mt 5, 3) ou des mots-clés';
        return;
    }

    results.innerHTML = '<div class="search-empty">Recherche…</div>';

    // Essayer de détecter une référence
    const match = REF_RE.exec(q);
    if (match) {
        const livreQ = match[1].trim();
        const chapQ  = parseInt(match[2]);
        const versQ  = match[3] ? parseInt(match[3]) : null;

        // Chercher le livre correspondant (recherche floue sur le nom)
        const allLivres = [...Object.values(CANON.AT), ...Object.values(CANON.NT)].flat();
        const livreFound = allLivres.find(l =>
            l.toLowerCase().startsWith(livreQ.toLowerCase()) ||
            l.toLowerCase().replace(/é/g,'e').startsWith(livreQ.toLowerCase().replace(/é/g,'e'))
        );

        if (livreFound) {
            hint.textContent = `Référence : ${livreFound} ${chapQ}${versQ ? ', ' + versQ : ''}`;
            let qb = db.from('bible_crampon')
                .select('livre, chapitre, verset_num, texte')
                .eq('livre', livreFound)
                .eq('chapitre', chapQ);
            if (versQ) qb = qb.eq('verset_num', versQ);
            else qb = qb.order('verset_num', { ascending: true });

            const { data } = await qb;
            afficherResultats(data || [], q, true);
            return;
        }
    }

    // Plein texte
    hint.textContent = `Recherche plein texte : « ${q} »`;
    const { data } = await db.from('bible_crampon')
        .select('livre, chapitre, verset_num, texte')
        .ilike('texte', `%${q}%`)
        .order('id', { ascending: true })
        .limit(80);

    afficherResultats(data || [], q, false);
}

function afficherResultats(data, q, estRef) {
    const results = document.getElementById('search-results');
    if (!data.length) {
        results.innerHTML = '<div class="search-empty">Aucun résultat trouvé.</div>';
        return;
    }

    let html = `<div class="search-count">${data.length} résultat${data.length > 1 ? 's' : ''}</div>`;
    for (const r of data) {
        const ref = `${r.livre} ${r.chapitre}, ${r.verset_num}`;
        const texteHL = estRef
            ? escH(r.texte)
            : escH(r.texte).replace(new RegExp(escH(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
                m => `<mark>${m}</mark>`);
        html += `<div class="search-result-item" onclick="ouvrirDepuisRecherche('${escH(r.livre).replace(/'/g,"\\'")}', ${r.chapitre}, ${r.verset_num})">
            <div class="search-result-ref">${ref}</div>
            <div class="search-result-text">${texteHL}</div>
        </div>`;
    }
    results.innerHTML = html;
}

async function ouvrirDepuisRecherche(livre, chap, verset) {
    fermerRecherche();
    // Aller sur le bon onglet AT/NT
    const inAT = Object.values(CANON.AT).flat().includes(livre);
    setTab(inAT ? 'AT' : 'NT');
    await selectionnerLivre(livre, chap);
    // Scroller jusqu'au verset
    setTimeout(() => {
        const sups = document.querySelectorAll('.verset-num');
        for (const s of sups) {
            if (s.textContent.trim() == verset) {
                s.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // Flash discret sur le verset
                const parent = s.parentElement;
                parent.style.transition = 'background .3s';
                parent.style.background = 'var(--gold-pale)';
                setTimeout(() => { parent.style.background = ''; }, 1800);
                break;
            }
        }
    }, 400);
}

function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Démarrage ──────────────────────────────────────────────
(function init() {
    const ready = () => {
        renderSidebarBooks();

        // ── Swipe gauche/droite pour naviguer entre chapitres ──
        const textZone = document.getElementById('bible-text');
        let swipeStartX = null, swipeStartY = null;
        textZone.addEventListener('touchstart', e => {
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
        }, { passive: true });
        textZone.addEventListener('touchend', e => {
            if (swipeStartX === null || !_livreActif) return;
            const dx = e.changedTouches[0].clientX - swipeStartX;
            const dy = e.changedTouches[0].clientY - swipeStartY;
            if (Math.abs(dx) > 60 && Math.abs(dy) < 80) {
                if (dx < 0 && _chapActif < _chapMax) naviguerChapitre(1);
                else if (dx > 0 && _chapActif > 1)   naviguerChapitre(-1);
            }
            swipeStartX = null; swipeStartY = null;
        }, { passive: true });

        // ── Raccourcis clavier ──────────────────────────────────
        document.addEventListener('keydown', e => {
            if (e.key === '/' && !e.target.matches('input,textarea,select')) {
                e.preventDefault();
                ouvrirRecherche();
            }
            if (e.key === 'Escape') fermerRecherche();
            if (e.key === 'ArrowLeft'  && _livreActif) naviguerChapitre(-1);
            if (e.key === 'ArrowRight' && _livreActif) naviguerChapitre(1);
        });
    };
    if (typeof maConnexion !== 'undefined') { db = maConnexion; ready(); }
    else { const t = setInterval(() => { if (initDB()) { clearInterval(t); ready(); }}, 200); }
})();
</script>
