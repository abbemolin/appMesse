<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feuille de Messe</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1108">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bibliothèque docx.js (génération Word côté client) -->
    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.3/dist/index.iife.js"></script>
    <style>
    /* ── Conteneur principal ───────────────────────────────────── */
    .feuille-wrap {
        background: var(--vellum-light);
        border: 1px solid var(--border);
        border-top: 3px solid var(--rubric);
        border-radius: 2px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 10px var(--shadow);
    }
    .section-label {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .24em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 10px;
    }

    /* ── Sélecteur de date ─────────────────────────────────────── */
    .picker-wrap {
        background: var(--vellum-light);
        border: 1px solid var(--border);
        border-top: 3px solid var(--gold);
        border-radius: 2px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 10px var(--shadow);
    }
    .picker-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }
    .picker-row input[type=date] {
        flex: 1;
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
    }
    .picker-row button {
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: 9px 14px;
        border: 1px solid var(--border-soft);
        background: var(--vellum);
        color: var(--ink-muted);
        border-radius: 2px;
        cursor: pointer;
    }
    .picker-row button:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Info fête ─────────────────────────────────────────────── */
    .info-fete {
        background: var(--vellum);
        border: 1px solid var(--border-soft);
        border-left: 3px solid var(--rubric);
        border-radius: 2px;
        padding: 12px 16px;
        margin-bottom: 12px;
    }
    .info-fete-nom {
        font-family: 'EB Garamond', serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 4px;
    }
    .info-fete-meta {
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .1em;
        color: var(--rubric);
        text-transform: uppercase;
    }

    /* ── Calendrier chargé depuis localStorage ─────────────────── */
    .cal-status {
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        font-style: italic;
        color: var(--ink-muted);
        padding: 8px 0;
        margin-bottom: 12px;
    }
    .cal-status.ok { color: #3a6644; font-style: normal; }
    .cal-status.warn { color: var(--rubric); }

    /* ── Aperçu calendrier ─────────────────────────────────────── */
    .cal-preview {
        background: var(--vellum);
        border: 1px solid var(--border-soft);
        border-radius: 2px;
        padding: 10px 14px;
        margin-bottom: 12px;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
    }
    .cal-preview-jour {
        display: flex;
        gap: 10px;
        margin-bottom: 4px;
        align-items: baseline;
    }
    .cal-preview-date {
        font-family: 'Cinzel', serif;
        font-size: .68rem;
        min-width: 100px;
        color: var(--ink-muted);
    }
    .cal-preview-evts { color: var(--ink-soft); }

    /* ── Annonces ──────────────────────────────────────────────── */
    .annonce-item {
        background: var(--vellum);
        border: 1px solid var(--border-soft);
        border-radius: 2px;
        padding: 10px 14px;
        margin-bottom: 8px;
    }
    .annonce-titre {
        font-family: 'EB Garamond', serif;
        font-size: .92rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 2px;
    }
    .annonce-desc {
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink-soft);
        line-height: 1.4;
    }

    /* ── Bouton générer ────────────────────────────────────────── */
    .generate-zone {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-top: 3px solid var(--rubric);
        border-radius: 2px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
    }
    .btn-generate {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Cinzel', serif;
        font-size: .72rem;
        letter-spacing: .12em;
        text-transform: uppercase;
        padding: 14px 28px;
        background: var(--rubric);
        color: #fff;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        transition: background .2s;
    }
    .btn-generate:hover { background: var(--rubric-light); }
    .btn-generate:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Lien vers calendrier_semaine ─────────────────────────── */
    .link-cal {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--gold);
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        text-decoration: none;
        border: 1px solid var(--gold);
        padding: 8px 14px;
        border-radius: 2px;
        margin-top: 12px;
    }
    .link-cal:hover { background: var(--gold-pale); }

    /* ── Spinner ───────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin .8s linear infinite; }

    /* ── Toast ─────────────────────────────────────────────────── */
    #toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--vellum);
        font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .08em;
        padding: 10px 20px; border-radius: 2px;
        opacity: 0; transition: all .3s; z-index: 9999; white-space: nowrap;
        pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header class="app-header">
    <a href="index.html" class="app-back">←</a>
    <h1>Feuille de Messe</h1>
    <div></div>
</header>

<main class="app-main">

    <!-- ── Sélecteur de date ─────────────────────────────────── -->
    <div class="picker-wrap">
        <span class="section-label">Date de la Messe</span>
        <div class="picker-row">
            <input type="date" id="date-input">
            <button onclick="chargerJour()">Charger</button>
        </div>
        <div id="info-fete" class="info-fete" style="display:none">
            <div class="info-fete-nom" id="fete-nom"></div>
            <div class="info-fete-meta" id="fete-meta"></div>
        </div>
    </div>

    <!-- ── Calendrier depuis localStorage ───────────────────── -->
    <div class="feuille-wrap">
        <span class="section-label">Calendrier de la semaine</span>
        <div id="cal-status" class="cal-status warn">Aucun calendrier chargé — ouvrez d'abord calendrier_semaine.html et cliquez « Générer le .docx ».</div>
        <div id="cal-preview" style="display:none" class="cal-preview"></div>
        <div style="margin-top:8px">
            <a href="calendrier_semaine.html" class="link-cal">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Calendrier semaine
            </a>
        </div>
    </div>

    <!-- ── Annonces Supabase ─────────────────────────────────── -->
    <div class="feuille-wrap">
        <span class="section-label">Annonces</span>
        <div id="annonces-list">
            <div style="font-family:'EB Garamond',serif;font-style:italic;color:var(--ink-muted);font-size:.88rem;">Chargez une date pour voir les annonces.</div>
        </div>
    </div>

    <!-- ── Bouton génération .docx ───────────────────────────── -->
    <div class="generate-zone">
        <button class="btn-generate" id="btn-generate" onclick="genererFeuilleMesse()" disabled>
            <span class="icon">🕊</span> Générer la feuille de Messe (.docx)
        </button>
        <div style="margin-top:12px;font-family:'EB Garamond',serif;font-size:.82rem;font-style:italic;color:var(--ink-muted);" id="generate-hint">
            Chargez une date et validez le calendrier pour générer.
        </div>
    </div>

</main>

<div id="toast"></div>

<!-- Scripts liturgiques -->
<script src="config.js"></script>
<script src="ordo1962.js"></script>
<script src="messe.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// FEUILLE DE MESSE — génération .docx automatique
// Architecture :
//   - Date sélectionnée → fetchProper(YYYY, MM, DD) sur data/messe/
//   - Calendrier → lu depuis localStorage (sauvé par calendrier_semaine.html)
//   - Annonces → Supabase (table annonces)
//   - Génération → docx.js, mise en page comme 261108_24e_Dimanche...
// ═══════════════════════════════════════════════════════════════

// maConnexion est initialisé par config.js (Supabase)

const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

let dateSelectionnee = null;  // objet Date
let ordoJour         = null;  // résultat Ordo1962.getDay
let properData       = null;  // JSON de data/messe/YYYY/MM-DD.json
let annoncesData     = [];
let calData          = null;  // tableau lu depuis localStorage (semaineData)
let calLundi         = null;  // ISO string du lundi

// ── Initialisation ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    // Date par défaut : prochain dimanche
    const today = new Date();
    const jourSemaine = today.getDay(); // 0 = dim
    const joursDimanche = jourSemaine === 0 ? 0 : 7 - jourSemaine;
    const dimanche = new Date(today);
    dimanche.setDate(today.getDate() + joursDimanche);
    document.getElementById('date-input').value = isoDate(dimanche);

    lireCalendrierLocalStorage();
});

// ── Lecture localStorage calendrier ───────────────────────────
function lireCalendrierLocalStorage() {
    try {
        const raw   = localStorage.getItem('feuille_calendrier_data');
        const lundi = localStorage.getItem('feuille_calendrier_lundi');
        if (raw) {
            calData  = JSON.parse(raw);
            calLundi = lundi || '';
            afficherApercuCal();
        }
    } catch(e) { /* OK */ }
}

function afficherApercuCal() {
    const status  = document.getElementById('cal-status');
    const preview = document.getElementById('cal-preview');
    if (!calData || !calData.length) {
        status.className  = 'cal-status warn';
        status.textContent = 'Aucun calendrier chargé — ouvrez calendrier_semaine.html et cliquez « Générer le .docx ».';
        preview.style.display = 'none';
        return;
    }
    // Date du lundi pour affichage
    const dateRef = calData[0]?.dateFr || calLundi || '';
    status.className  = 'cal-status ok';
    status.textContent = `✓ Calendrier chargé (semaine du ${dateRef})`;

    // Aperçu simplifié
    preview.style.display = 'block';
    preview.innerHTML = calData.map(jour => {
        const evts = jour.horaires.map(h => `${h.heure}${h.heure ? ' ' : ''}${h.label}`).join(' · ');
        return `<div class="cal-preview-jour">
            <span class="cal-preview-date">${jour.dateFr}</span>
            <span class="cal-preview-evts">${evts || '<em>Aucun événement</em>'}</span>
        </div>`;
    }).join('');

    mettreAJourBouton();
}

// ── Chargement du jour ────────────────────────────────────────
async function chargerJour() {
    const val = document.getElementById('date-input').value;
    if (!val) return;

    const [y, m, d] = val.split('-').map(Number);
    dateSelectionnee = new Date(y, m - 1, d);

    // Ordo
    ordoJour = Ordo1962.getDay(y, m, d);
    afficherInfoFete();

    // Propre depuis Divinum Officium (fichiers JSON locaux)
    await chargerPropre(y, m, d);

    // Annonces Supabase
    await chargerAnnonces(val);

    mettreAJourBouton();
}

function afficherInfoFete() {
    const o = ordoJour;
    if (!o) return;
    document.getElementById('fete-nom').textContent = o.fete || '';
    const meta = [o.classe, o.couleur].filter(Boolean).join(' — ');
    document.getElementById('fete-meta').textContent = meta;
    document.getElementById('info-fete').style.display = 'block';
}

// ── Chargement du propre (Divinum Officium) ───────────────────
async function chargerPropre(y, m, d) {
    properData = null;
    try {
        const url = `data/messe/${y}/${pad(m)}-${pad(d)}.json`;
        const rep = await fetch(url);
        if (rep.ok) {
            properData = await rep.json();
        }
    } catch(e) {
        console.warn('Propre non disponible:', e);
    }
}

// ── Chargement des annonces Supabase ─────────────────────────
async function chargerAnnonces(dateIso) {
    annoncesData = [];
    const listEl = document.getElementById('annonces-list');
    listEl.innerHTML = '<div style="font-family:\'EB Garamond\',serif;font-style:italic;color:var(--ink-muted);font-size:.88rem;">Chargement…</div>';

    try {
        if (!maConnexion) throw new Error('Supabase non initialisé');
        const { data, error } = await maConnexion
            .from('annonces')
            .select('titre,description,prioritaire,ordre')
            .eq('actif', true)
            .eq('dans_feuille', true)
            .or(`date_debut.is.null,date_debut.lte.${dateIso}`)
            .or(`date_fin.is.null,date_fin.gte.${dateIso}`)
            .order('prioritaire', { ascending: false })
            .order('ordre', { ascending: true });

        if (error) throw error;
        annoncesData = data || [];
    } catch(e) {
        console.warn('Erreur annonces:', e);
        annoncesData = [];
    }

    if (!annoncesData.length) {
        listEl.innerHTML = '<div style="font-family:\'EB Garamond\',serif;font-style:italic;color:var(--ink-muted);font-size:.88rem;">Aucune annonce active pour cette date.</div>';
        return;
    }
    listEl.innerHTML = annoncesData.map(a => `
        <div class="annonce-item">
            <div class="annonce-titre">${escHtml(a.titre || '')}</div>
            ${a.description ? `<div class="annonce-desc">${escHtml(a.description)}</div>` : ''}
        </div>
    `).join('');
}

function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mettreAJourBouton() {
    const pret = dateSelectionnee && calData && calData.length > 0;
    document.getElementById('btn-generate').disabled = !pret;
    document.getElementById('generate-hint').textContent = pret
        ? `Prêt à générer la feuille du ${dateSelectionnee.toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'})}.`
        : 'Chargez une date et validez le calendrier pour générer.';
}

// ═══════════════════════════════════════════════════════════════
// GÉNÉRATION DOCX
// ═══════════════════════════════════════════════════════════════

async function genererFeuilleMesse() {
    if (!dateSelectionnee || !calData) return;
    if (typeof window.docx === 'undefined') { showToast('⚠️ Bibliothèque non encore chargée'); return; }

    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">✦</span> Génération…';

    try {
        const doc  = buildFeuilleMesse();
        const blob = await window.docx.Packer.toBlob(doc);
        telecharger(blob);
        showToast('✅ Feuille de Messe téléchargée !');
    } catch(err) {
        showToast('❌ ' + err.message);
        console.error(err);
    } finally {
        btn.disabled  = false;
        btn.innerHTML = '<span class="icon">🕊</span> Générer la feuille de Messe (.docx)';
    }
}

function telecharger(blob) {
    const y = dateSelectionnee.getFullYear();
    const m = pad(dateSelectionnee.getMonth() + 1);
    const d = pad(dateSelectionnee.getDate());
    const nom = `${y}${m}${d}_feuille_messe.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Construction du document Word ────────────────────────────
function buildFeuilleMesse() {
    const D     = window.docx;
    const o     = ordoJour || {};
    const y     = dateSelectionnee.getFullYear();
    const m     = dateSelectionnee.getMonth() + 1;
    const d     = dateSelectionnee.getDate();

    // ── Helpers de formatage ──────────────────────────────────
    const pt  = n => n * 20;        // points → twips (1pt = 20 twips en demi-pt ? non)
    // docx.js : font size en demi-points (half-points)
    const hp  = n => n * 2;

    const paraOpts = (opts = {}) => ({
        spacing: { after: 60, before: 0, ...opts.spacing },
        ...opts,
    });

    function run(text, opts = {}) {
        return new D.TextRun({ text: String(text || ''), ...opts });
    }

    function para(children, opts = {}) {
        return new D.Paragraph({
            ...paraOpts(opts),
            children: Array.isArray(children) ? children : [children],
        });
    }

    // ── HEADER ───────────────────────────────────────────────
    // "Paroisse La Croix glorieuse" (gras)
    // "Missel de saint Jean XXIII" (italique)
    // nom de la fête (gras, plus grand)
    // "rang — couleur"

    const rang   = o.classe  || '';
    const couleur = o.couleur || '';
    const rangCouleur = [rang, couleur].filter(Boolean).join('  —  ');
    const nomFete = o.fete || '';

    const header = [
        para([run('Paroisse La Croix glorieuse', { bold: true, size: hp(13) })],
             { alignment: D.AlignmentType.CENTER, spacing: { after: 20, before: 0 } }),
        para([run('Missel de saint Jean XXIII', { italics: true, size: hp(11) })],
             { alignment: D.AlignmentType.CENTER, spacing: { after: 20 } }),
        para([run(nomFete, { bold: true, size: hp(16) })],
             { alignment: D.AlignmentType.CENTER, spacing: { after: 20 } }),
        para([run(rangCouleur, { size: hp(11) })],
             { alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
    ];

    // ── PROPRE (table 3 colonnes) ────────────────────────────
    // Depuis data/messe/YYYY/MM-DD.json
    // Format: { messes: [{ titre, lignes: [ [latin_html, fr_html], ... ] }] }
    // Les pièces : INTROÏT, COLLECTE, GRADUEL, ALLÉLUIA, ÉVANGILE, OFFERTOIRE, SECRÈTE, COMMUNION, POSTCOMMUNION

    const LIBELLES_FR = {
        Introitus: 'INTROÏT', Oratio: 'COLLECTE', Graduale: 'GRADUEL',
        Tractus: 'TRAIT', Sequentia: 'SÉQUENCE', Alleluia: 'ALLÉLUIA',
        Evangelium: 'ÉVANGILE', Offertorium: 'OFFERTOIRE', Secreta: 'SECRÈTE',
        Communio: 'COMMUNION', Postcommunio: 'POSTCOMMUNION',
        'Oratio super populum': 'ORAISON SUR LE PEUPLE',
        Lectio: 'ÉPÎTRE', Gloria: 'GLORIA', Credo: 'CREDO', Prefatio: 'PRÉFACE',
    };

    // Nettoyage HTML → texte brut
    function htmlToText(html) {
        if (!html) return '';
        return html
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<[^>]+>/g, '')
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&nbsp;/g, ' ').replace(/&#160;/g, ' ')
            .replace(/\{[^}]*\}/g, '')  // supprimer les références {...}
            .replace(/\n{3,}/g, '\n\n')
            .trim();
    }

    // Extraire le nom de pièce depuis le HTML
    // Format: <span class="do-titre"><b><i>Introitus</i></b></span>
    function nomPiece(htmlLatin) {
        if (!htmlLatin) return '';
        const m = htmlLatin.match(/do-titre[^>]*><b><i>\s*([^<]+?)\s*<\/i>/);
        if (m) {
            const nom = m[1].trim();
            return LIBELLES_FR[nom] || nom.toUpperCase();
        }
        return '';
    }

    const propre_rows = [];

    // Ligne d'en-tête du tableau propre (valeurs en cinquantièmes de % : 5000=100%)
    propre_rows.push(new D.TableRow({
        tableHeader: true,
        children: [
            cellTitre('', 750),     // 15%
            cellTitre('LATIN', 2125),   // 42.5%
            cellTitre('FRANÇAIS', 2125), // 42.5%
        ]
    }));

    if (properData && properData.messes && properData.messes.length > 0) {
        const messe = properData.messes[properData.principal || 0];
        const lignes = messe.lignes || [];

        lignes.forEach(ligneArr => {
            const latinHtml = ligneArr[0] || '';
            const frHtml    = ligneArr[1] || '';

            // Pièce omise ?
            if (/omit\.?/i.test(htmlToText(latinHtml))) return;

            const label   = nomPiece(latinHtml);
            const latinTx = htmlToText(latinHtml);
            const frTx    = htmlToText(frHtml);

            if (!latinTx && !frTx) return;

            propre_rows.push(new D.TableRow({
                children: [
                    cellLabel(label),
                    cellTexte(latinTx),
                    cellTexte(frTx),
                ]
            }));
        });
    } else {
        // Pas de propre disponible
        propre_rows.push(new D.TableRow({
            children: [
                cellLabel(''),
                cellTexteItalique('Propre non disponible pour ce jour.'),
                cellTexte(''),
            ]
        }));
    }

    // Largeurs en cinquantièmes de % (OOXML) : 5000 = 100%
    // col label: 15% = 750 | col latin: 42.5% = 2125 | col fr: 42.5% = 2125
    function cellTitre(text, widthFifties) {
        return new D.TableCell({
            width: { size: widthFifties, type: D.WidthType.PERCENTAGE },
            shading: { fill: 'F2EDE4' },
            children: [new D.Paragraph({
                spacing: { after: 40, before: 40 },
                children: [new D.TextRun({ text, bold: true, size: hp(9), allCaps: true })]
            })]
        });
    }
    function cellLabel(text) {
        return new D.TableCell({
            width: { size: 750, type: D.WidthType.PERCENTAGE },   // 15%
            margins: { top: 60, bottom: 60, left: 60, right: 60 },
            children: [new D.Paragraph({
                spacing: { after: 0 },
                children: [new D.TextRun({ text, bold: true, size: hp(8), allCaps: true, color: '8B1A1A' })]
            })]
        });
    }
    function cellTexte(text) {
        const lignes = text.split('\n');
        const children = [];
        lignes.forEach((ligne, i) => {
            children.push(new D.TextRun({ text: ligne, size: hp(10), break: i > 0 ? 1 : 0 }));
        });
        return new D.TableCell({
            width: { size: 2125, type: D.WidthType.PERCENTAGE },  // 42.5%
            margins: { top: 60, bottom: 60, left: 80, right: 80 },
            children: [new D.Paragraph({ spacing: { after: 0 }, children })]
        });
    }
    function cellTexteItalique(text) {
        return new D.TableCell({
            width: { size: 2125, type: D.WidthType.PERCENTAGE },  // 42.5%
            margins: { top: 60, bottom: 60, left: 80, right: 80 },
            children: [new D.Paragraph({
                spacing: { after: 0 },
                children: [new D.TextRun({ text, italics: true, size: hp(10), color: '666666' })]
            })]
        });
    }

    const tableauPropre = new D.Table({
        width: { size: 100, type: D.WidthType.PERCENTAGE },
        borders: {
            top:    { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            bottom: { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            left:   { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            right:  { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            insideH:{ style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            insideV:{ style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
        },
        rows: propre_rows,
    });

    // ── ANNONCES ─────────────────────────────────────────────
    const annonces_paras = [
        para([run('ANNONCES', { bold: true, size: hp(13), allCaps: true })],
             { spacing: { before: 240, after: 120 } }),
    ];
    if (annoncesData.length === 0) {
        annonces_paras.push(para([run('Aucune annonce.', { italics: true, size: hp(10), color: '666666' })]));
    } else {
        annoncesData.forEach(a => {
            annonces_paras.push(para([run(a.titre || '', { bold: true, size: hp(11) })],
                                     { spacing: { before: 60, after: 20 } }));
            if (a.description) {
                annonces_paras.push(para([run(a.description, { size: hp(10) })],
                                         { spacing: { before: 0, after: 60 } }));
            }
        });
    }

    // ── CALENDRIER (table 2 colonnes) ────────────────────────
    // Col gauche : "Lundi 2 novembre\nFête du jour"
    // Col droite : "12h15  Messe — Marie DUPONT\n19h  Vêpres"

    const cal_header = para([run('CALENDRIER DE LA SEMAINE', { bold: true, size: hp(13), allCaps: true })],
                             { spacing: { before: 240, after: 120 } });

    const cal_rows = [];
    if (calData && calData.length > 0) {
        calData.forEach(jour => {
            const jourFete = jour.sousTitre ? `${jour.dateFr}\n${jour.sousTitre}` : jour.dateFr;
            const evtsLignes = jour.horaires
                .map(h => `${h.heure}${h.heure ? '  ' : ''}${h.label}`)
                .join('\n');

            cal_rows.push(new D.TableRow({
                children: [
                    cellCalJour(jourFete),
                    cellCalEvts(evtsLignes || ''),
                ]
            }));
        });
    }

    // Calendrier : col gauche 35% = 1750, col droite 65% = 3250
    function cellCalJour(text) {
        const lignes = text.split('\n');
        const children = [];
        lignes.forEach((ligne, i) => {
            if (i === 0) {
                children.push(new D.TextRun({ text: ligne, bold: true, size: hp(10), break: i > 0 ? 1 : 0 }));
            } else {
                children.push(new D.TextRun({ text: ligne, italics: true, size: hp(9.5), break: 1 }));
            }
        });
        return new D.TableCell({
            width: { size: 1750, type: D.WidthType.PERCENTAGE },  // 35%
            margins: { top: 60, bottom: 60, left: 80, right: 80 },
            children: [new D.Paragraph({ spacing: { after: 0 }, children })]
        });
    }
    function cellCalEvts(text) {
        const lignes = text.split('\n');
        const children = [];
        lignes.forEach((ligne, i) => {
            children.push(new D.TextRun({ text: ligne, size: hp(10), break: i > 0 ? 1 : 0 }));
        });
        return new D.TableCell({
            width: { size: 3250, type: D.WidthType.PERCENTAGE },  // 65%
            margins: { top: 60, bottom: 60, left: 80, right: 80 },
            children: [new D.Paragraph({ spacing: { after: 0 }, children })]
        });
    }

    const tableauCal = cal_rows.length > 0 ? new D.Table({
        width: { size: 100, type: D.WidthType.PERCENTAGE },
        borders: {
            top:    { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            bottom: { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            left:   { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            right:  { style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            insideH:{ style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
            insideV:{ style: D.BorderStyle.SINGLE, size: 1, color: 'CCBFAA' },
        },
        rows: cal_rows,
    }) : null;

    // ── Assemblage du document ────────────────────────────────
    const children = [
        ...header,
        tableauPropre,
        ...annonces_paras,
        cal_header,
        ...(tableauCal ? [tableauCal] : [
            para([run('Calendrier non disponible. Générez d\'abord depuis calendrier_semaine.html.', { italics: true, color: '666666', size: hp(10) })])
        ]),
    ];

    return new D.Document({
        sections: [{
            properties: {
                page: {
                    margin: { top: 720, right: 720, bottom: 720, left: 720 },
                    size: { width: 11906, height: 16838 },  // A4
                },
            },
            children,
        }]
    });
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}
</script>

</body>
</html>
