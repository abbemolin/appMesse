<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feuille de Messe</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1108">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bibliothèque docx.js (génération Word côté client) -->
    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.3/dist/index.iife.js"></script>
    <style>
    /* ── Sélecteur de date ─────────────────────────────────────── */
    .picker-wrap {
        background: var(--vellum-light);
        border: 1px solid var(--border);
        border-top: 3px solid var(--gold);
        border-radius: 2px;
        padding: 20px 20px 18px;
        margin-bottom: 20px;
        box-shadow: 0 2px 10px var(--shadow);
    }
    .picker-label {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .24em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 10px;
    }
    .picker-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }
    .picker-row input[type=date] {
        flex: 1;
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
    }
    .fete-display {
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
        font-style: italic;
        color: var(--ink-soft);
        min-height: 1.4em;
        margin-bottom: 14px;
        line-height: 1.5;
    }
    .fete-display strong {
        font-style: normal;
        font-weight: 600;
        color: var(--ink);
    }
    .fete-display .rang-badge {
        display: inline-block;
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: var(--rubric);
        border: 1px solid var(--rubric);
        border-radius: 2px;
        padding: 1px 6px;
        margin-left: 6px;
        vertical-align: middle;
    }
    .propers-not-found {
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--rubric);
        font-style: italic;
        padding: 8px 0;
    }

    /* ── Aperçu proprium ──────────────────────────────────────── */
    .preview-section { margin-bottom: 20px; }
    .section-title {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .24em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin: 20px 0 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
    }
    .proprium-table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        margin-bottom: 12px;
    }
    .proprium-table td {
        padding: 6px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--border-soft);
        line-height: 1.5;
    }
    .proprium-table td:first-child {
        font-family: 'Cinzel', serif;
        font-size: .68rem;
        letter-spacing: .06em;
        color: var(--rubric);
        text-transform: uppercase;
        white-space: nowrap;
        width: 110px;
        font-weight: 600;
    }
    .proprium-table td:nth-child(2) {
        font-style: italic;
        color: var(--ink-muted);
        width: 44%;
    }
    .proprium-table td:nth-child(3) {
        color: var(--ink-soft);
        width: 44%;
    }
    .proprium-table tr:hover td { background: rgba(26,17,8,.025); }
    .long-text {
        display: block;
        max-height: 2.8em;
        overflow: hidden;
        cursor: pointer;
        transition: max-height .3s;
    }
    .long-text.expanded { max-height: none; }
    .long-text::after {
        content: '…';
        display: inline;
    }
    .long-text.expanded::after { content: ''; }

    /* ── Annonces aperçu ──────────────────────────────────────── */
    .annonce-preview {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-left: 3px solid var(--gold);
        border-radius: 2px;
        padding: 10px 14px;
        margin-bottom: 8px;
        font-family: 'EB Garamond', serif;
        font-size: .9rem;
        line-height: 1.6;
    }
    .annonce-preview .ann-titre {
        font-weight: 600;
        color: var(--ink);
        display: block;
        margin-bottom: 2px;
    }
    .annonce-preview .ann-desc {
        color: var(--ink-soft);
    }

    /* ── Calendrier aperçu ───────────────────────────────────── */
    .cal-day-preview {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 5px 0;
        border-bottom: 1px solid var(--border-soft);
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink-soft);
    }
    .cal-day-preview .jour-label {
        font-family: 'Cinzel', serif;
        font-size: .68rem;
        letter-spacing: .05em;
        color: var(--ink-muted);
        min-width: 100px;
        text-transform: uppercase;
    }
    .cal-day-preview .fete-label {
        font-style: italic;
        color: var(--rubric);
    }

    /* ── Spinner ──────────────────────────────────────────────── */
    .loading-bar {
        display: none;
        text-align: center;
        padding: 16px 0;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        font-style: italic;
        color: var(--ink-muted);
    }
    .loading-bar.visible { display: block; }

    /* ── Bouton génération ───────────────────────────────────── */
    .generate-wrap {
        position: sticky;
        bottom: 0;
        background: var(--vellum);
        border-top: 1px solid var(--border);
        padding: 12px 20px;
        margin: 0 -20px;
        display: flex;
        gap: 10px;
        z-index: 10;
    }
    .btn-gen {
        flex: 1;
        font-family: 'Cinzel', serif;
        font-size: .68rem;
        letter-spacing: .15em;
        text-transform: uppercase;
        padding: 13px 0;
        background: var(--rubric);
        color: #fff;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        transition: opacity .2s;
    }
    .btn-gen:disabled { opacity: .4; cursor: default; }
    .btn-gen:not(:disabled):hover { opacity: .88; }
    .btn-gen.secondary {
        background: var(--vellum);
        color: var(--ink-muted);
        border: 1px solid var(--border);
    }
    .btn-gen.secondary:not(:disabled):hover { border-color: var(--gold); color: var(--gold); }

    /* ── Back button ─────────────────────────────────────────── */
    .back-row {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
    }
    .btn-back {
        background: none;
        border: none;
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink-muted);
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color .2s;
    }
    .btn-back:hover { color: var(--gold); }
    </style>
</head>
<body>

<div id="menu-container"></div>

<main class="page-content" style="max-width:700px; margin:0 auto; padding: 20px;">

    <!-- Bouton retour -->
    <div class="back-row">
        <button class="btn-back" onclick="history.back()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Retour
        </button>
    </div>

    <h1 class="page-title">Feuille de Messe</h1>
    <p class="page-subtitle">Générer la feuille imprimable en Word (.docx)</p>

    <!-- Sélecteur de date -->
    <div class="picker-wrap">
        <span class="picker-label">Date de la Messe</span>
        <div class="picker-row">
            <input type="date" id="date-messe" onchange="onDateChange(this.value)">
            <button class="btn" onclick="changerDate(-7)" style="font-size:.8rem;padding:8px 12px;">◀ −1 sem.</button>
            <button class="btn" onclick="changerDate(7)" style="font-size:.8rem;padding:8px 12px;">+1 sem. ▶</button>
        </div>
        <div class="fete-display" id="fete-display">—</div>
    </div>

    <!-- Proprium -->
    <span class="section-title">Textes liturgiques</span>
    <div id="loading-propers" class="loading-bar">Chargement des textes…</div>
    <div id="propers-container"></div>

    <!-- Annonces -->
    <span class="section-title">Annonces</span>
    <div id="loading-annonces" class="loading-bar">Chargement des annonces…</div>
    <div id="annonces-container"></div>

    <!-- Calendrier de la semaine -->
    <span class="section-title">Calendrier de la semaine</span>
    <div id="loading-cal" class="loading-bar">Chargement du calendrier…</div>
    <div id="cal-container"></div>

    <!-- Bouton génération -->
    <div class="generate-wrap">
        <button class="btn-gen" id="btn-generate" disabled onclick="genererDocx()">
            ⬇ Télécharger la feuille .docx
        </button>
    </div>

</main>

<div id="modal-container"></div>

<script src="ordo1962.js"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="modal.js"></script>

<script>
/* ── Constantes ────────────────────────────────────────────────── */
const GOOGLE_API_KEY = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
const CALENDAR_ID    = 'saintlouisenville67@gmail.com';
const SUPABASE_URL   = 'https://pmeaimfcwtykhqtueomd.supabase.co';
const SUPABASE_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtZWFpbWZjd3R5a2hxdHVlb21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MzA4MzIsImV4cCI6MjA4MzMwNjgzMn0.X91Usnq8WtZYuY40UFIo7Xl8P1O46LKqe1GvJ7RIWYE';

const JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS_FR  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

// État global
let dateCourante   = null;  // ISO "YYYY-MM-DD" de la Messe
let ordoCourant    = null;  // résultat Ordo1962.getDay()
let propersCourants= null;  // tableau de parts {part, label, la, fr}
let annoncesCourantes = [];
let semaineData    = null;  // [{date, fete, events, intentions}, …] pour 7 jours
let propersDB      = null;  // cache du JSON chargé une fois

/* ── Utilitaires ───────────────────────────────────────────────── */
function isoLocal(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDateLocal(iso) {
    // évite les décalages UTC sur iOS
    const [y,m,j] = iso.split('-').map(Number);
    return new Date(y, m-1, j, 12, 0, 0);
}
function fmtHeure(dateTime) {
    const d = new Date(dateTime);
    const h = d.getHours(), m = d.getMinutes();
    return m === 0 ? `${h}h` : `${h}h${String(m).padStart(2,'0')}`;
}
function getLundiDeSemaine(d) {
    const date = new Date(d);
    date.setHours(12,0,0,0);
    const dow  = date.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    date.setDate(date.getDate() + diff);
    return date;
}

/* ── Mapping clé propers_db ─────────────────────────────────────
   getProperKey() → "sanctoral/M/D" ou "temporal/X/Y"
   propers_db.json → "mass/M/D" (préfixe "mass/" remplace l'autre)
*/
function getDBKey(ordo) {
    if (!ordo) return null;
    try {
        const key = Ordo1962.getProperKey(ordo);
        if (!key) return null;
        // Remplace le premier segment par "mass"
        const parts = key.split('/');
        parts[0] = 'mass';
        return parts.join('/');
    } catch(e) {
        return null;
    }
}

/* ── Chargement propers_db.json (une seule fois) ─────────────── */
async function chargerPropersDB() {
    if (propersDB) return propersDB;
    const resp = await fetch('propers_db.json');
    propersDB  = await resp.json();
    return propersDB;
}

/* ── Événement : changement de date ─────────────────────────────*/
async function onDateChange(val) {
    if (!val) return;
    dateCourante = val;
    document.getElementById('btn-generate').disabled = true;
    afficherFete();
    await chargerTout();
}

function changerDate(deltaJours) {
    const base = dateCourante ? parseDateLocal(dateCourante) : new Date();
    base.setDate(base.getDate() + deltaJours);
    const iso = isoLocal(base);
    document.getElementById('date-messe').value = iso;
    onDateChange(iso);
}

/* ── Afficher la fête ─────────────────────────────────────────── */
function afficherFete() {
    const el = document.getElementById('fete-display');
    if (!dateCourante) { el.textContent = '—'; return; }
    const d = parseDateLocal(dateCourante);
    ordoCourant = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());
    const fete = ordoCourant.fete || '—';
    const rang = ordoCourant.rang  ? ` <span class="rang-badge">${ordoCourant.rang}</span>` : '';
    const com  = ordoCourant.commemoration ? `<br><em style="font-size:.82em;color:var(--ink-muted)">Commémoraison : ${ordoCourant.commemoration}</em>` : '';
    el.innerHTML = `<strong>${fete}</strong>${rang}${com}`;
}

/* ── Charger tout ─────────────────────────────────────────────── */
async function chargerTout() {
    await Promise.all([
        chargerPropers(),
        chargerAnnonces(),
        chargerSemaine(),
    ]);
    mettreAJourBouton();
}

function mettreAJourBouton() {
    document.getElementById('btn-generate').disabled =
        !dateCourante || !ordoCourant;
}

/* ── Proprium ────────────────────────────────────────────────── */
async function chargerPropers() {
    const container = document.getElementById('propers-container');
    const loading   = document.getElementById('loading-propers');
    container.innerHTML = '';
    loading.classList.add('visible');
    propersCourants = null;

    try {
        const db  = await chargerPropersDB();
        const key = getDBKey(ordoCourant);
        const parts = key ? db[key] : null;

        if (!parts || parts.length === 0) {
            container.innerHTML = `<p class="propers-not-found">Proprium introuvable pour la clé « ${key || '—'} ».</p>`;
            return;
        }

        propersCourants = parts;

        // Affichage aperçu en tableau 3 colonnes
        const LONG = 220; // caractères avant troncature
        let html = `<table class="proprium-table"><tbody>`;
        for (const p of parts) {
            const laLong = (p.la || '').length > LONG;
            const frLong = (p.fr || '').length > LONG;
            const la = p.la
                ? `<span class="long-text${laLong ? '' : ' expanded'}" onclick="this.classList.toggle('expanded')">${esc(p.la)}</span>`
                : '';
            const fr = p.fr
                ? `<span class="long-text${frLong ? '' : ' expanded'}" onclick="this.classList.toggle('expanded')">${esc(p.fr)}</span>`
                : '';
            const ref = p.ref ? `<small style="display:block;color:var(--ink-muted);font-size:.75em">${esc(p.ref)}</small>` : '';
            html += `<tr><td>${esc(p.label || p.part)}</td><td>${la}</td><td>${fr}${ref}</td></tr>`;
        }
        html += `</tbody></table>`;
        container.innerHTML = html;

    } catch(e) {
        container.innerHTML = `<p class="propers-not-found">Erreur lors du chargement : ${e.message}</p>`;
    } finally {
        loading.classList.remove('visible');
    }
}

function esc(str) {
    return String(str || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/\n/g,'<br>');
}

/* ── Annonces ────────────────────────────────────────────────── */
async function chargerAnnonces() {
    const container = document.getElementById('annonces-container');
    const loading   = document.getElementById('loading-annonces');
    container.innerHTML = '';
    loading.classList.add('visible');
    annoncesCourantes = [];

    try {
        const today = dateCourante || isoLocal(new Date());
        const url   = SUPABASE_URL + '/rest/v1/annonces'
            + '?select=*'
            + '&actif=eq.true'
            + '&dans_newsletter=eq.true'
            + `&or=(date_debut.is.null,date_debut.lte.${today})`
            + `&or=(date_fin.is.null,date_fin.gte.${today})`
            + '&order=prioritaire.desc,ordre.asc,created_at.desc';

        const resp = await fetch(url, {
            headers: {
                apikey:        SUPABASE_KEY,
                Authorization: 'Bearer ' + SUPABASE_KEY,
            }
        });
        const annonces = await resp.json();
        annoncesCourantes = annonces || [];

        if (annoncesCourantes.length === 0) {
            container.innerHTML = `<p style="font-family:'EB Garamond',serif;font-style:italic;color:var(--ink-muted);font-size:.88rem">Aucune annonce active.</p>`;
            return;
        }

        let html = '';
        for (const a of annoncesCourantes) {
            const lien = a.lien ? `<a href="${esc(a.lien)}" target="_blank" style="color:var(--gold);font-size:.82em">↗ Lien</a>` : '';
            html += `<div class="annonce-preview">
                <span class="ann-titre">${esc(a.titre || '')}</span>
                <span class="ann-desc">${esc(a.description || '')} ${lien}</span>
            </div>`;
        }
        container.innerHTML = html;

    } catch(e) {
        container.innerHTML = `<p class="propers-not-found">Erreur annonces : ${e.message}</p>`;
    } finally {
        loading.classList.remove('visible');
    }
}

/* ── Calendrier de la semaine ────────────────────────────────── */
async function chargerSemaine() {
    const container = document.getElementById('cal-container');
    const loading   = document.getElementById('loading-cal');
    container.innerHTML = '';
    loading.classList.add('visible');
    semaineData = null;

    try {
        const dateMesse = dateCourante ? parseDateLocal(dateCourante) : new Date();
        const lundi     = getLundiDeSemaine(dateMesse);
        const dim       = new Date(lundi); dim.setDate(lundi.getDate() + 6);
        const lundiISO  = isoLocal(lundi);
        const dimISO    = isoLocal(dim);

        const dimEnd = new Date(dim); dimEnd.setHours(23,59,59);

        const [gcalResp, { data: intentions }] = await Promise.all([
            fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                + `?key=${GOOGLE_API_KEY}`
                + `&timeMin=${lundi.toISOString()}&timeMax=${dimEnd.toISOString()}`
                + `&singleEvents=true&orderBy=startTime&maxResults=200`),
            maConnexion.from('intentions')
                .select('date_messe,heure_messe,nom_intention,type_intention,google_event_id')
                .eq('statut','valide')
                .gte('date_messe', lundiISO).lte('date_messe', dimISO),
        ]);

        const gcal   = await gcalResp.json();
        const events = gcal.items || [];

        // Regrouper intentions par google_event_id
        const intentionsMap = {};
        for (const int of (intentions || [])) {
            if (int.google_event_id) {
                if (!intentionsMap[int.google_event_id]) intentionsMap[int.google_event_id] = [];
                intentionsMap[int.google_event_id].push(int);
            }
        }

        // Construire les 7 jours
        const jours = [];
        for (let i = 0; i < 7; i++) {
            const d   = new Date(lundi); d.setDate(lundi.getDate() + i);
            const iso = isoLocal(d);
            const ordo = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());

            // Filtrer les événements du jour
            const joursEvents = events.filter(ev => {
                const start = ev.start.dateTime || ev.start.date;
                return start.startsWith(iso);
            });

            jours.push({ date: d, iso, ordo, events: joursEvents, intentionsMap });
        }

        semaineData = jours;

        // Aperçu
        let html = '';
        for (const j of jours) {
            const nomJour = JOURS_FR[j.date.getDay()];
            const dateFmt = `${j.date.getDate()} ${MOIS_FR[j.date.getMonth()]}`;
            const fete    = j.ordo.fete || '';
            const evtsHtml = j.events.map(ev => {
                const heure  = ev.start.dateTime ? fmtHeure(ev.start.dateTime) : 'Journée';
                const label  = ev.summary || '';
                const ints   = j.intentionsMap[ev.id] || [];
                const intTxt = ints.map(it => it.nom_intention).filter(Boolean).join(', ');
                return `<div class="cal-day-preview">
                    <span class="jour-label" style="min-width:60px">${heure}</span>
                    <span>${esc(label)}${intTxt ? ` — <em>${esc(intTxt)}</em>` : ''}</span>
                </div>`;
            }).join('');

            html += `<div style="margin-bottom:14px">
                <div class="cal-day-preview" style="font-weight:600;border-bottom:1px solid var(--border)">
                    <span class="jour-label" style="min-width:120px;font-weight:700;color:var(--ink)">${nomJour} ${dateFmt}</span>
                    <span class="fete-label">${esc(fete)}</span>
                </div>
                ${evtsHtml || '<div class="cal-day-preview"><span class="jour-label" style="min-width:60px"></span><span style="color:var(--ink-muted);font-style:italic">—</span></div>'}
            </div>`;
        }
        container.innerHTML = html;

    } catch(e) {
        container.innerHTML = `<p class="propers-not-found">Erreur calendrier : ${e.message}</p>`;
    } finally {
        loading.classList.remove('visible');
    }
}

/* ════════════════════════════════════════════════════════════════
   GÉNÉRATION DOCX
   ════════════════════════════════════════════════════════════════ */

async function genererDocx() {
    if (!dateCourante || !ordoCourant) return;

    const btn = document.getElementById('btn-generate');
    btn.disabled  = true;
    btn.textContent = '⏳ Génération en cours…';

    try {
        const {
            Document, Packer, Paragraph, Table, TableRow, TableCell,
            TextRun, WidthType, HeadingLevel, AlignmentType, BorderStyle,
            ShadingType, convertInchesToTwip, PageOrientation,
            TableLayoutType, VerticalAlign
        } = docx;

        // ── Dimensions de page (A4 portrait, petites marges) ─────────────
        // Twips : 1 inch = 1440 twips. A4 = 11906 × 16838 twips
        const PAGE_W    = 11906;
        const PAGE_H    = 16838;
        const MARGIN_TB = 720;   // ~1.3 cm
        const MARGIN_LR = 720;   // ~1.3 cm
        const contentW  = PAGE_W - 2 * MARGIN_LR;  // 10466 twips

        // Largeurs colonnes proprium
        const COL_LABEL = 1600;   // ~2.8 cm
        const COL_TEXT  = Math.floor((contentW - COL_LABEL) / 2);  // reste / 2

        // ── Helpers ───────────────────────────────────────────────────────
        const NOIR    = '000000';
        const ROUGE   = '8B0000';  // rubric liturgique
        const GRIS    = '555555';
        const BEIGE_L = 'F5F0E8';  // fond léger pour entêtes

        function run(text, opts = {}) {
            return new TextRun({
                text: String(text || ''),
                font: opts.font  || 'Garamond',
                size: opts.size  || 20,  // demi-points
                bold: opts.bold  || false,
                italics: opts.italics || false,
                color: opts.color || NOIR,
                break: opts.break || undefined,
            });
        }

        function para(children, opts = {}) {
            return new Paragraph({
                children: Array.isArray(children) ? children : [children],
                alignment: opts.align || AlignmentType.LEFT,
                spacing: {
                    before: opts.spaceBefore || 0,
                    after:  opts.spaceAfter  || 0,
                    line:   opts.line        || 276,  // 1.15 interligne
                },
            });
        }

        function emptyPara() { return para([run('')]); }

        // Cellule de table
        function cell(paragraphs, opts = {}) {
            return new TableCell({
                children: Array.isArray(paragraphs) ? paragraphs : [paragraphs],
                width: opts.width ? { size: opts.width, type: WidthType.DXA } : undefined,
                verticalAlign: VerticalAlign.TOP,
                shading: opts.shading ? { fill: opts.shading, type: ShadingType.CLEAR } : undefined,
                borders: opts.noBorder ? {
                    top:    { style: BorderStyle.NONE, size: 0 },
                    bottom: { style: BorderStyle.NONE, size: 0 },
                    left:   { style: BorderStyle.NONE, size: 0 },
                    right:  { style: BorderStyle.NONE, size: 0 },
                } : undefined,
            });
        }

        // ── 1. EN-TÊTE ────────────────────────────────────────────────────
        const d = parseDateLocal(dateCourante);
        const nomJourMesse  = JOURS_FR[d.getDay()];
        const dateMesseStr  = `${nomJourMesse} ${d.getDate()} ${MOIS_FR[d.getMonth()]} ${d.getFullYear()}`;
        const feteName      = ordoCourant.fete || dateMesseStr;
        const couleur       = ordoCourant.couleur || '';
        const rang          = ordoCourant.rang || '';

        const header = [
            para([run('Paroisse La Croix glorieuse', { bold: true, size: 24, font: 'Cinzel' })], { align: AlignmentType.CENTER, spaceAfter: 60 }),
            para([run('Missel de saint Jean XXIII', { size: 20, italics: true })], { align: AlignmentType.CENTER }),
            para([
                run(feteName, { bold: true, size: 26, font: 'Garamond' }),
            ], { align: AlignmentType.CENTER, spaceBefore: 160, spaceAfter: 80 }),
        ];

        if (rang) {
            header.push(para([run(`${rang}${couleur ? '  —  ' + couleur : ''}`, { size: 18, italics: true, color: ROUGE })], { align: AlignmentType.CENTER, spaceAfter: 200 }));
        }

        // ── 2. TEXTES LITURGIQUES ─────────────────────────────────────────
        const properRows = [];

        // Ligne d'en-tête colonnes
        properRows.push(new TableRow({
            children: [
                cell(para([run('', { size: 18 })], {}), { width: COL_LABEL, shading: BEIGE_L }),
                cell(para([run('Latin', { bold: true, size: 18, color: ROUGE })], { align: AlignmentType.CENTER }), { width: COL_TEXT, shading: BEIGE_L }),
                cell(para([run('Français', { bold: true, size: 18, color: GRIS })], { align: AlignmentType.CENTER }), { width: COL_TEXT, shading: BEIGE_L }),
            ],
            tableHeader: true,
        }));

        const LONGS = ['epitre','evangile','secrete','preface','postcommunion'];
        const GRAND_TEXTE_PARTS = ['secrete','preface'];

        for (const p of (propersCourants || [])) {
            const label = (p.label || p.part || '').toUpperCase();
            const ref   = p.ref ? `\n(${p.ref})` : '';

            // Parties longues : 1 colonne, pleine largeur sous étiquette
            if (GRAND_TEXTE_PARTS.includes(p.part)) {
                // Étiquette rouge seule
                properRows.push(new TableRow({
                    children: [
                        cell(para([
                            run(label, { bold: true, size: 17, color: ROUGE, font: 'Cinzel' }),
                        ], {}), { width: COL_LABEL }),
                        cell(para([run('')], {}), { width: COL_TEXT }),
                        cell(para([run('')], {}), { width: COL_TEXT }),
                    ],
                }));
                // Texte latin + français côte à côte (normal)
                properRows.push(new TableRow({
                    children: [
                        cell(para([run('')], {}), { width: COL_LABEL }),
                        cell(splitRuns(p.la, { italics: true, size: 18, color: GRIS }), { width: COL_TEXT }),
                        cell(splitRuns(p.fr + ref, { size: 18 }), { width: COL_TEXT }),
                    ],
                }));
            } else {
                properRows.push(new TableRow({
                    children: [
                        cell(para([
                            run(label, { bold: true, size: 17, color: ROUGE, font: 'Cinzel' }),
                        ], {}), { width: COL_LABEL }),
                        cell(splitRuns(p.la, { italics: true, size: 18, color: GRIS }), { width: COL_TEXT }),
                        cell(splitRuns((p.fr || '') + ref, { size: 18 }), { width: COL_TEXT }),
                    ],
                }));
            }
        }

        const properTable = new Table({
            rows: properRows,
            width: { size: contentW, type: WidthType.DXA },
            layout: TableLayoutType.FIXED,
        });

        // ── 3. ANNONCES ───────────────────────────────────────────────────
        const annoncesParas = [
            para([run('ANNONCES', { bold: true, size: 24, font: 'Cinzel', color: NOIR })], { spaceBefore: 300, spaceAfter: 120 }),
        ];

        for (const a of annoncesCourantes) {
            const titre = a.titre ? a.titre.trim() : '';
            const desc  = a.description ? a.description.trim() : '';
            if (titre) {
                annoncesParas.push(para([
                    run(titre, { bold: true, size: 20 }),
                ], { spaceBefore: 100, spaceAfter: 20 }));
            }
            if (desc) {
                // multi-ligne
                const lignes = desc.split('\n');
                for (const lig of lignes) {
                    annoncesParas.push(para([run(lig, { size: 19 })], { spaceAfter: 20 }));
                }
            }
        }

        // ── 4. CALENDRIER DE LA SEMAINE ───────────────────────────────────
        const calParas = [
            para([run('CALENDRIER DE LA SEMAINE', { bold: true, size: 24, font: 'Cinzel', color: NOIR })], { spaceBefore: 300, spaceAfter: 120 }),
        ];

        const calRows = [];
        const COL_JOUR  = Math.floor(contentW * 0.38);
        const COL_EVTS  = contentW - COL_JOUR;

        if (semaineData) {
            for (const jour of semaineData) {
                const nomJ   = JOURS_FR[jour.date.getDay()];
                const dateJ  = `${jour.date.getDate()} ${MOIS_FR[jour.date.getMonth()]}`;
                const feteJ  = jour.ordo.fete || '';
                const jourLabel = `${nomJ} ${dateJ}${feteJ ? '\n' + feteJ : ''}`;

                const evtParas = [];
                if (jour.events.length === 0) {
                    evtParas.push(para([run('—', { size: 18, color: GRIS })], {}));
                } else {
                    for (const ev of jour.events) {
                        const heure = ev.start.dateTime ? fmtHeure(ev.start.dateTime) : '';
                        const label = ev.summary || '';
                        const ints  = (jour.intentionsMap[ev.id] || []).map(it => it.nom_intention).filter(Boolean).join(', ');
                        const texte = `${heure}  ${label}${ints ? '  — ' + ints : ''}`;
                        evtParas.push(para([run(texte, { size: 18 })], { spaceAfter: 40 }));
                    }
                }

                calRows.push(new TableRow({
                    children: [
                        cell(splitRuns(jourLabel, { bold: true, size: 18 }), { width: COL_JOUR, shading: BEIGE_L }),
                        cell(evtParas, { width: COL_EVTS }),
                    ],
                }));
            }
        }

        const calTable = new Table({
            rows: calRows,
            width: { size: contentW, type: WidthType.DXA },
            layout: TableLayoutType.FIXED,
        });

        // ── Assemblage du document ─────────────────────────────────────────
        const doc = new Document({
            sections: [{
                properties: {
                    page: {
                        size: { width: PAGE_W, height: PAGE_H, orientation: PageOrientation.PORTRAIT },
                        margin: { top: MARGIN_TB, bottom: MARGIN_TB, left: MARGIN_LR, right: MARGIN_LR },
                    },
                },
                children: [
                    ...header,
                    emptyPara(),
                    properTable,
                    ...annoncesParas,
                    ...calParas,
                    calTable,
                ],
            }],
        });

        // ── Téléchargement ────────────────────────────────────────────────
        const blob = await Packer.toBlob(doc);
        const a    = document.createElement('a');
        a.href     = URL.createObjectURL(blob);

        // Nom de fichier : YYMMDD_FesteName.docx
        const yy = String(d.getFullYear()).slice(2);
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const jj = String(d.getDate()).padStart(2,'0');
        const nomFete = (ordoCourant.fete || 'Messe')
            .normalize('NFD').replace(/[̀-ͯ]/g,'')
            .replace(/[^a-zA-Z0-9 ]/g,'').trim()
            .replace(/\s+/g,'_');
        a.download = `${yy}${mm}${jj}_${nomFete}.docx`;
        a.click();
        URL.revokeObjectURL(a.href);

    } catch(e) {
        alert('Erreur lors de la génération : ' + e.message);
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.textContent = '⬇ Télécharger la feuille .docx';
    }
}

/* ── Convertit un texte multi-lignes en Paragraph avec TextRuns ── */
function splitRuns(text, opts = {}) {
    if (!text) return new Paragraph({ children: [new docx.TextRun({ text: '' })] });
    const lignes = String(text).split('\n');
    const children = [];
    for (let i = 0; i < lignes.length; i++) {
        if (i > 0) children.push(new docx.TextRun({ text: '', break: 1 }));
        children.push(new docx.TextRun({
            text:    lignes[i],
            font:    opts.font    || 'Garamond',
            size:    opts.size    || 20,
            bold:    opts.bold    || false,
            italics: opts.italics || false,
            color:   opts.color   || '000000',
        }));
    }
    return new docx.Paragraph({ children, spacing: { before: 0, after: 40, line: 276 } });
}

/* ── Initialisation au chargement ───────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    // Par défaut : prochain dimanche
    const now = new Date();
    const dow  = now.getDay();
    const diff = dow === 0 ? 0 : 7 - dow;
    const dim  = new Date(now); dim.setDate(now.getDate() + diff);
    const iso  = isoLocal(dim);
    document.getElementById('date-messe').value = iso;
    onDateChange(iso);
});
</script>
