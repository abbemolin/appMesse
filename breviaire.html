<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bréviaire — Officium Divinum</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1108">
    <link rel="stylesheet" href="style.css">
    <style>
    /* ════════════════════════════════════════════════════════
       BRÉVIAIRE
    ════════════════════════════════════════════════════════ */

    /* ── Hero ────────────────────────────────────────────── */
    .brev-hero {
        background: #1a1108;
        padding: calc(env(safe-area-inset-top,0px) + 8px) 0 0;
        position: relative; overflow: hidden;
    }
    .brev-hero-cross {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%,-50%);
        opacity: .05; pointer-events: none; width: 160px; height: 200px;
    }
    .brev-hero-body {
        position: relative; z-index: 2;
        text-align: center; padding: 0 44px 8px;
    }
    .brev-hero-fete {
        font-family: 'Cinzel', serif; font-size: .82rem; font-weight: 600;
        color: #f0e8d5; letter-spacing: .03em; line-height: 1.25;
        display: block; margin-bottom: 2px;
    }
    .brev-hero-date {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .82rem; color: rgba(240,232,213,.5);
    }

    /* Navigation ±jour */
    .brev-nav-jour {
        position: absolute; top: 0; bottom: 0; width: 50px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; opacity: 0; transition: opacity .2s; z-index: 10;
    }
    .brev-nav-jour:hover, .brev-nav-jour:active { opacity: 1; }
    @media (hover: none) { .brev-nav-jour { opacity: .6; } }
    .brev-nav-jour-left  { left: 0; }
    .brev-nav-jour-right { right: 0; }
    .brev-nav-arrow { color: #c9a840; font-family: 'Cinzel',serif; font-size: 1.3rem; }

    .brev-hero-bar { height: 3px; background: linear-gradient(to right,transparent,rgba(184,150,42,.4),transparent); }

    /* ── Onglets heures canoniales ───────────────────────── */
    .heures-tabs {
        display: flex; overflow-x: auto; padding: 10px 16px 0;
        gap: 4px; background: var(--vellum-light);
        border-bottom: 1px solid var(--border-soft);
        scrollbar-width: none;
    }
    .heures-tabs::-webkit-scrollbar { display: none; }
    .heure-tab {
        font-family: 'Cinzel', serif; font-size: .54rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 7px 12px; border: none; cursor: pointer;
        border-radius: 3px 3px 0 0; white-space: nowrap;
        color: var(--ink-muted); background: none;
        border-bottom: 2px solid transparent; transition: all .2s;
        flex-shrink: 0;
    }
    .heure-tab.active {
        color: var(--rubric); border-bottom-color: var(--rubric);
        background: rgba(139,26,26,.04);
    }
    .heure-tab:hover:not(.active) { color: var(--ink); }

    /* ── Barre langue + options ──────────────────────────── */
    .brev-toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 16px; background: var(--vellum);
        border-bottom: 1px solid var(--border-soft);
        position: sticky; top: 0; z-index: 40;
        box-shadow: 0 2px 8px var(--shadow);
    }
    .lang-toggle {
        display: flex; border: 1px solid var(--border-soft); border-radius: 3px; overflow: hidden;
    }
    .lang-btn {
        font-family: 'Cinzel', serif; font-size: .54rem; letter-spacing: .1em;
        padding: 6px 12px; border: none; cursor: pointer; transition: all .15s;
        background: none; color: var(--ink-muted);
    }
    .lang-btn.active { background: #1a1108; color: #c9a840; }
    .brev-toolbar-filler { flex: 1; }

    /* ── Corps du texte ──────────────────────────────────── */
    .brev-content {
        padding: 20px 16px 40px; max-width: 720px; margin: 0 auto;
    }

    /* Bloc de section liturgique */
    .brev-section {
        margin-bottom: 22px; animation: fadeInUp .3s ease both;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    .brev-section-title {
        font-family: 'Cinzel', serif; font-size: .58rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--rubric); border-bottom: 1px solid rgba(139,26,26,.15);
        padding-bottom: 4px; margin-bottom: 10px;
        display: flex; align-items: center; gap: 8px;
    }
    .brev-section-title .no-fr {
        font-family: 'Cinzel', serif; font-size: .44rem;
        letter-spacing: .1em; color: var(--ink-muted);
        background: var(--vellum-light); border: 1px solid var(--border-soft);
        border-radius: 10px; padding: 1px 8px; flex-shrink: 0;
    }

    .brev-text {
        font-family: 'EB Garamond', serif; font-size: calc(1.06rem * var(--brev-k, 1));
        line-height: 1.8; color: var(--ink);
        white-space: pre-wrap; hyphens: auto;
    }
    .brev-text.francais { color: var(--ink); }

    /* ── Antienne ────────────────────────────────────────── */
    .brev-antienne {
        margin-bottom: 6px;
        padding: 8px 12px;
        background: rgba(184,150,42,.06);
        border-left: 3px solid var(--gold);
        border-radius: 2px;
    }
    .brev-ant-label {
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .18em; text-transform: uppercase;
        color: var(--gold); display: block; margin-bottom: 4px;
    }
    .brev-ant-text {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        font-style: italic; display: block; line-height: 1.6;
        color: var(--ink);
    }
    .brev-ant-text.francais { color: var(--ink-soft); margin-top: 4px; }

    /* ── Psaume complet ──────────────────────────────────── */
    .psaume-section { margin-bottom: 20px; }
    .brev-psalm-text {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        line-height: 1.85; color: var(--ink);
    }
    .brev-psalm-text.latin { font-style: italic; color: var(--ink-soft); }
    .brev-psalm-text.muted { opacity: .6; }
    .brev-ps-verset { display: block; }
    .brev-ps-verset sup.vnum {
        font-family: 'Cinzel', serif; font-size: .54rem;
        color: var(--gold); opacity: .7; margin-right: 3px;
        vertical-align: super; user-select: none;
    }

    @media (prefers-color-scheme: dark) {
        .brev-antienne { background: rgba(184,150,42,.08); }
    }

    /* Répons et versicules */
    .brev-resp {
        display: block; font-family: 'EB Garamond', serif;
        font-size: 1rem; color: var(--rubric); line-height: 1.7;
        font-style: italic;
    }

    /* Verset d'hymne */
    .brev-hymne-v {
        display: block; font-family: 'EB Garamond', serif;
        font-size: 1rem; color: var(--ink); line-height: 1.7;
    }

    /* Section majeure (titre plus visible) */
    .brev-section-title.majeur {
        color: var(--ink); font-size: .65rem;
        border-bottom-color: rgba(26,17,8,.2);
    }
    @media (prefers-color-scheme:dark) {
        .brev-section-title.majeur { color: var(--ink-soft); border-bottom-color: var(--border-soft); }
    }

    /* Texte muted (latin affiché en fallback) */
    .brev-text.muted, .brev-psaume.muted { opacity: .6; }
    .no-fr-txt { color: var(--ink-muted); font-size: .88rem; }

    /* Textes générés depuis Divinum Officium */
    .do-rubr  { color: var(--rubric); }
    .do-titre { color: var(--rubric); font-family: 'Cinzel', serif; font-size: .72rem;
                letter-spacing: .12em; text-transform: uppercase; font-style: normal; }
    .do-titre b, .do-titre i { font-style: normal; font-weight: 600; }
    .do-petit { color: var(--rubric); font-size: .82em; }
    .lang-btn[hidden] { display: none; }
    .brev-content { --brev-encre: var(--ink); }
    @media (prefers-color-scheme: dark) { .brev-content { --brev-encre: #fff; } }
    .brev-content .brev-text { color: var(--brev-encre); }
    .brev-text sup.vnum { color: var(--brev-encre) !important; opacity: .7; }
    .gregorien-score { margin: 8px 0 10px; overflow: hidden; color: var(--brev-encre); }
    .gregorien-score svg { display: block; max-width: 100%; height: auto; fill: currentColor; }
    .gregorien-score svg [stroke="#000"] { stroke: currentColor; }
    .gregorien-score svg [fill="#000"], .gregorien-score svg text { fill: currentColor; }
    .gregorien-score svg text.dropCap { fill: var(--rubric); }
    .gregorien-versets { margin: 4px 0 8px; }
    .gregorien-versets .verset { display: block; margin-bottom: 4px; }
    .gregorien-versets b { font-weight: 700; }
    .gregorien-versets i { font-style: italic; color: var(--rubric); }
    .greg-options { display: flex; justify-content: flex-end; padding: 10px 16px 0; max-width: 720px; margin: 0 auto; }
    .greg-options[hidden] { display: none; }
    .greg-btn {
        font-family: 'Cinzel', serif; font-size: .54rem; letter-spacing: .08em;
        padding: 7px 10px; cursor: pointer; color: var(--ink-muted);
        background: none; border: 1px solid var(--border-soft); border-radius: 3px;
    }
    .greg-btn.active { color: var(--gold); border-color: var(--gold); }
    .greg-ecoute {
        display: block; margin: 6px 0 -2px auto; padding: 2px 0;
        font-family: 'Cinzel', serif; font-size: .5rem; letter-spacing: .08em;
        color: var(--ink-muted); opacity: .6; background: none; border: none; cursor: pointer;
    }
    .greg-trad {
        margin: 2px 0 12px; padding-left: 10px; border-left: 2px solid var(--border-soft);
        font-size: .92em; line-height: 1.55; opacity: .85;
    }
    .brev-horsligne {
        display: block; margin: 0 auto; padding: 0 16px 24px; text-align: center;
        font-family: 'EB Garamond', serif; font-style: italic; font-size: .8rem;
        color: var(--ink-muted); opacity: .7; background: none; border: none;
    }
    #brev-content { transition: opacity .16s ease; }
    #brev-content.brev-fondu { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #brev-content { transition: none; } }
    .do-initiale { color: var(--rubric); font-weight: 700; }
    .do-partie {
        display: block; margin: 18px 0 6px;
        font-family: 'Cinzel', serif; font-size: .72rem; font-weight: 600;
        letter-spacing: .12em; text-transform: uppercase; color: var(--rubric);
    }
    .brev-text > .do-partie:first-child { margin-top: 0; }
    /* Titre de psaume ou de cantique : grand, référence à droite */
    .do-psaume {
        display: block; margin: 18px 0 14px;
        font-family: 'EB Garamond', serif; font-size: 1.75em; font-weight: 500;
        line-height: 1.15; color: var(--brev-encre); letter-spacing: 0;
    }
    .brev-text > .do-psaume:first-child { margin-top: 4px; }
    .do-psaume .ps-ref {
        display: block; text-align: right; margin-top: 2px;
        font-size: .58em; font-style: italic; color: var(--rubric);
    }
    /* Versets : numéro dans la marge, verset coupé à l'astérisque */
    .brev-text .v { display: grid; grid-template-columns: 2.1em 1fr; margin: 0 0 .75em; }
    .brev-text .vn {
        color: var(--rubric); font-size: .68em; line-height: 2.5; text-align: left;
        user-select: none; font-variant-numeric: tabular-nums;
    }
    .brev-text .v1, .brev-text .v2 { display: block; }
    .brev-text .ast { color: var(--rubric); }

    /* Parties de l'heure : une par écran */
    .brev-parties {
        display: flex; overflow-x: auto; gap: 2px; padding: 0 10px;
        position: sticky; top: var(--haut-barre, 52px); z-index: 39;
        background: var(--vellum); border-bottom: 1px solid var(--border-soft);
        scrollbar-width: none;
    }
    .brev-parties::-webkit-scrollbar { display: none; }
    .brev-parties[hidden] { display: none; }
    .partie-tab {
        flex-shrink: 0; white-space: nowrap; cursor: pointer;
        font-family: 'EB Garamond', serif; font-size: .95rem; color: var(--rubric); opacity: .75;
        padding: 9px 10px 7px; background: none; border: none; border-bottom: 2px solid transparent;
    }
    .partie-tab.active { opacity: 1; border-bottom-color: var(--rubric); }
    #brev-content.par-partie .brev-ligne { display: none; border-bottom: none; }
    #brev-content.par-partie .brev-ligne.active { display: block; }
    .brev-ligne.entre-g { animation: entreG .22s ease both; }
    .brev-ligne.entre-d { animation: entreD .22s ease both; }
    @keyframes entreG { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes entreD { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .brev-ligne.entre-g, .brev-ligne.entre-d { animation: none; } }
    .brev-text sup.vnum {
        font-size: .62em; color: var(--ink-muted); margin-right: 3px;
        font-style: normal; user-select: none;
    }
    .taille-btn {
        font-family: 'EB Garamond', serif; font-size: .95rem; line-height: 1;
        min-width: 34px; padding: 6px 8px; cursor: pointer; color: var(--ink-muted);
        background: none; border: 1px solid var(--border-soft); border-radius: 3px;
    }
    .taille-btn:disabled { opacity: .35; cursor: default; }
    .brev-ligne { padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
    .brev-ligne:last-child { border-bottom: none; }
    .brev-ligne .brev-text { white-space: normal; }

    /* Référence biblique */
    .brev-ref {
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .12em; color: var(--gold);
        display: block; margin-bottom: 5px; font-style: normal;
    }

    /* ── Chargement / vide ───────────────────────────────── */
    .brev-loading {
        text-align: center; padding: 50px 20px;
        color: var(--ink-muted); font-family: 'EB Garamond', serif;
        font-style: italic;
    }
    .brev-loading::before {
        content: '✦'; display: block; color: var(--gold);
        font-size: 1.2rem; margin-bottom: 14px;
        animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }

    .brev-empty {
        text-align: center; padding: 40px 20px;
        color: var(--ink-muted); font-style: italic;
        font-family: 'EB Garamond', serif;
    }

    /* ── Mode sombre ─────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
        .heures-tabs { background: var(--vellum-light); border-color: var(--border-soft); }
        .brev-toolbar { background: var(--vellum); border-color: var(--border-soft); }
        .lang-btn.active { background: #0e0c08; }
    }
    </style>
</head>
<body>
<div id="menu-container"></div>

<!-- ════════════ HERO ════════════ -->
<div class="brev-hero" id="brev-hero">
    <svg class="brev-hero-cross" viewBox="0 0 160 200" fill="none">
        <rect x="64" y="0" width="32" height="200" fill="#b8962a"/>
        <rect x="0" y="60" width="160" height="32" fill="#b8962a"/>
    </svg>
    <div class="brev-nav-jour brev-nav-jour-left" onclick="naviguerJour(-1)">
        <span class="brev-nav-arrow">‹</span>
    </div>
    <div class="brev-nav-jour brev-nav-jour-right" onclick="naviguerJour(1)">
        <span class="brev-nav-arrow">›</span>
    </div>
    <div class="brev-hero-body">
        <span class="brev-hero-fete" id="brev-fete">Chargement…</span>
        <span class="brev-hero-date" id="brev-date"></span>
    </div>
    <div class="brev-hero-bar"></div>
</div>

<!-- ════════════ ONGLETS HEURES ════════════ -->
<div class="heures-tabs" id="heures-tabs">
    <button class="heure-tab" data-heure="Matutinum" onclick="setHeure(this)">Matines</button>
    <button class="heure-tab active" data-heure="Laudes" onclick="setHeure(this)">Laudes</button>
    <button class="heure-tab"        data-heure="Prima" onclick="setHeure(this)">Prime</button>
    <button class="heure-tab"        data-heure="Tertia" onclick="setHeure(this)">Tierce</button>
    <button class="heure-tab"        data-heure="Sexta" onclick="setHeure(this)">Sexte</button>
    <button class="heure-tab"        data-heure="Nona" onclick="setHeure(this)">None</button>
    <button class="heure-tab"        data-heure="Vespera" onclick="setHeure(this)">Vêpres</button>
    <button class="heure-tab"        data-heure="Completorium" onclick="setHeure(this)">Complies</button>
</div>

<!-- ════════════ TOOLBAR ════════════ -->
<div class="brev-toolbar">
    <div class="lang-toggle">
        <button class="lang-btn active" id="btn-Latin" onclick="setLang('Latin')">Latin</button>
        <button class="lang-btn"        id="btn-Francais" onclick="setLang('Francais')">Français</button>
        <button class="lang-btn" id="btn-Gregorien" onclick="setGregorien()" hidden>Grégorien</button>
    </div>
    <div class="brev-toolbar-filler"></div>
    <button class="taille-btn" id="btn-moins" onclick="changerTaille(-1)" aria-label="Réduire le texte">A−</button>
    <button class="taille-btn" id="btn-plus"  onclick="changerTaille(1)"  aria-label="Agrandir le texte">A+</button>
</div>

<div class="greg-options" id="greg-options" hidden>
    <button class="greg-btn" id="btn-trad" onclick="basculerTraduction()">Traduction française</button>
</div>

<nav class="brev-parties" id="brev-parties" hidden></nav>

<!-- ════════════ CONTENU ════════════ -->
<div class="brev-content" id="brev-content">
    <div class="brev-loading">Chargement de l'office…</div>
</div>

<button class="brev-horsligne" id="brev-horsligne" onclick="prechargerOffices()" hidden></button>

<script src="menu.js"></script>
<script src="exsurge.js"></script>
<script src="titres.js"></script>
<script>

// ══════════════════════════════════════════════════════════
// BRÉVIAIRE — lit data/breviaire/AAAA/MM-JJ/<Heure>.json
// (généré par .github/workflows/breviaire.yml)
// ══════════════════════════════════════════════════════════

const MOIS = ['janvier','février','mars','avril','mai','juin',
              'juillet','août','septembre','octobre','novembre','décembre'];
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const LANGUES = ['Latin','Francais'];

let _offset = 0;
let _heure  = 'Laudes';
let _lang   = 'Latin';
let _gregorien = false;
let _traduction = false;
let _dessin = 0;
let _requete = 0;
const _cache = {};

try {
    const l = localStorage.getItem('breviaire-langue');
    if (LANGUES.includes(l)) _lang = l;
    _gregorien = localStorage.getItem('breviaire-gregorien') === '1';
    _traduction = localStorage.getItem('breviaire-traduction') === '1';
} catch (e) {}

function dateNav() {
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + _offset);
    return d;
}

const deux = n => String(n).padStart(2, '0');

function naviguerJour(delta) {
    _offset += delta;
    chargerOffice();
}

function setHeure(btn) {
    document.querySelectorAll('.heure-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _heure = btn.dataset.heure;
    majBoutonsLangue();
    chargerOffice();
}

const enGregorien = () => _gregorien && _heure === 'Vespera';

function majBoutonsLangue() {
    LANGUES.forEach(l => document.getElementById('btn-' + l).classList.toggle('active', l === _lang && !enGregorien()));
    const g = document.getElementById('btn-Gregorien');
    g.hidden = _heure !== 'Vespera';
    g.classList.toggle('active', enGregorien());
    document.getElementById('greg-options').hidden = !enGregorien();
    document.getElementById('btn-trad').classList.toggle('active', _traduction);
    majEveil();
}

// ── Écran allumé pendant les Vêpres en grégorien ──────────
let _eveil = null;
async function majEveil() {
    try {
        if (enGregorien() && document.visibilityState === 'visible') {
            if (!_eveil && navigator.wakeLock) {
                _eveil = await navigator.wakeLock.request('screen');
                _eveil.addEventListener('release', () => { _eveil = null; });
            }
        } else if (_eveil) {
            await _eveil.release();
            _eveil = null;
        }
    } catch (e) { _eveil = null; }
}
document.addEventListener('visibilitychange', majEveil);

function memoriserGregorien() {
    try { localStorage.setItem('breviaire-gregorien', _gregorien ? '1' : '0'); } catch (e) {}
}

// Mémorise la partie lue, pour la retrouver après le changement de langue
function positionLecture() {
    const l = document.querySelector('#brev-content .brev-ligne.active');
    if (!l) return null;
    const r = l.getBoundingClientRect();
    return { i: l.dataset.i, part: r.height ? Math.max(0, (hautBarres() - r.top) / r.height) : 0 };
}

function restaurerLecture(pos) {
    if (!pos) return;
    const l = document.querySelector(`#brev-content .brev-ligne[data-i="${pos.i}"]`);
    if (!l) return;
    const r = l.getBoundingClientRect();
    if (pos.part > 0) window.scrollTo({ top: window.scrollY + r.top + r.height * pos.part - hautBarres(), behavior: 'instant' });
}

function changerLangueEnFondu(office) {
    const box = document.getElementById('brev-content');
    const pos = positionLecture();
    const requete = ++_requete;
    const sansEffet = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    box.classList.add('brev-fondu');
    setTimeout(() => {
        if (requete !== _requete) { box.classList.remove('brev-fondu'); return; }
        afficher(office, true);
        restaurerLecture(pos);
        box.classList.remove('brev-fondu');
    }, sansEffet ? 0 : 160);
}

function setGregorien() {
    _gregorien = true;
    arreterSon();
    memoriserGregorien();
    majBoutonsLangue();
    chargerOffice();
}

function setLang(lang) {
    _lang = lang;
    _gregorien = false;
    memoriserGregorien();
    try { localStorage.setItem('breviaire-langue', lang); } catch (e) {}
    majBoutonsLangue();
    const o = _cache[cleOffice()];
    arreterSon();
    if (o) changerLangueEnFondu(o); else chargerOffice();
}

function cleOffice() {
    const d = dateNav();
    const fichier = enGregorien() ? 'Vespera-gregorien' : _heure;
    return `${d.getFullYear()}/${deux(d.getMonth()+1)}-${deux(d.getDate())}/${fichier}`;
}

async function chargerOffice() {
    arreterSon();
    const d = dateNav();
    const cle = cleOffice();
    const requete = ++_requete;

    document.getElementById('brev-date').textContent =
        JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();

    if (_cache[cle]) { afficher(_cache[cle]); return; }

    document.getElementById('brev-content').classList.remove('brev-fondu');
    document.getElementById('brev-parties').hidden = true;
    document.getElementById('brev-content').innerHTML =
        '<div class="brev-loading">Chargement de l\'office…</div>';

    try {
        let rep;
        try {
            rep = await fetch(`data/breviaire/${cle}.json`);
        } catch (e) {
            // Sans service worker actif : on cherche quand même dans les offices préchargés
            rep = 'caches' in window && await caches.match(new URL(`data/breviaire/${cle}.json`, location.href).href);
            if (!rep) throw e;
        }
        if (requete !== _requete) return;
        if (rep.status === 404) { afficherVide('Office non disponible pour ce jour.'); return; }
        if (!rep.ok) throw new Error('HTTP ' + rep.status);
        const office = await rep.json();
        if (requete !== _requete) return;
        _cache[cle] = office;
        afficher(office);
    } catch (e) {
        if (requete !== _requete) return;
        console.error(e);
        afficherVide('Impossible de charger cet office. Vérifiez la connexion : hors ligne, seuls les offices déjà téléchargés sont disponibles.');
    }
}

function afficherVide(message) {
    document.getElementById('brev-fete').textContent = 'Bréviaire';
    document.getElementById('brev-parties').hidden = true;
    const box = document.getElementById('brev-content');
    box.innerHTML = '<div class="brev-empty"></div>';
    box.firstChild.textContent = message;
}

// ── Mise en forme des cellules (HTML déjà nettoyé par tools/breviaire/generate.py) ──
const RE_TITRE = /<span class="do-titre"><b><i>([^<]*)<\/i><\/b><\/span>/;
const RE_RUBR = l => '<span class="do-rubr"><i>' + l + '</i></span>';

// « Capitule Hymne Verset » : un titre pour chaque partie
function separerParties(html) {
    const m = html.match(RE_TITRE);
    if (!m) return html;
    const mots = m[1].trim().split(/\s+/);
    if (mots.length !== 3 || !/^Capit/.test(mots[0])) return html;
    const [cap, milieu, verset] = mots;
    const blocs = html.replace(RE_TITRE, '').split(/<br>\s*<br>/);
    let vuMilieu = false;
    const sortie = blocs.map((b, i) => {
        const t = b.trim().replace(/^(?:<br>\s*)+/, '');
        if (i === 0) return `<span class="do-partie">${cap}</span>${t}`;
        if (t.startsWith(RE_RUBR(milieu))) {
            vuMilieu = true;
            return `<span class="do-partie">${milieu}</span>` + t.slice(RE_RUBR(milieu).length).replace(/^\s*<br>\s*/, '');
        }
        if (!vuMilieu && /^<span class="do-rubr"><i>(R\.br|℟)/.test(t)) {
            vuMilieu = true;
            return `<span class="do-partie">${milieu}</span>${t}`;
        }
        if (i === blocs.length - 1 && (/^<span class="do-rubr"><i>℣/.test(t) || (t.startsWith('<div class="gabc">') && /V\/\./.test(t)))) {
            return `<span class="do-partie">${verset}</span>${t}`;
        }
        return t;
    });
    return sortie.join('<br><br>').replace(/<\/span><br><br><span class="do-partie">/g, '</span><span class="do-partie">')
        .replace(/<br><br>(<span class="do-partie">)/g, '$1');
}

// « Psalmus 127; Tonus: 1g2 » → « Psaume 127 · 1er ton (g2) »
function nomTon(ton) {
    const altere = /\balteratus\b/.test(ton);
    ton = ton.replace(/\s*alteratus/, '').trim();
    if (/^peregrinus$/i.test(ton)) return 'ton pérégrin';
    if (/^solemn/i.test(ton)) return 'ton solennel';
    const m = ton.match(/^(\d)(.*)$/);
    if (!m) return 'ton ' + ton;
    const rang = m[1] === '1' ? '1er' : m[1] + 'e';
    return `${rang} ton${m[2] ? ` (${m[2].replace(/^\./, '')})` : ''}${altere ? ' altéré' : ''}`;
}

function titreClair(t) {
    const ton = (t.match(/;\s*Tonus:\s*([^;]+)/) || [])[1];
    const base = t.split(';')[0].trim();
    const m = base.match(/^Psalmus\s+(\d+)\s*(\([^)]*\))?/);
    const nom = m ? `Psaume ${m[1]}${m[2] ? ' ' + m[2] : ''}`
              : /Mari/.test(base) ? 'Magnificat' : base;
    return ton ? `${nom} · ${nomTon(ton)}` : nom;
}

function mettreEnForme(cellule) {
    return cellule.split(/(<div class="gabc">[^]*?<\/div>)/)
        .map(p => p.startsWith('<div class="gabc">') ? p : versetsPsaume(mettreEnFormeTexte(p))).join('');
}

// « Psaume 118(1-16) » → titre « Psaume 118 », référence « Ps 118, 1-16 »
function titrePsaume(t) {
    return t.replace(/\s*\([^)]*\)\s*$/, '').trim();
}
function refPsaume(t) {
    const m = t.match(/(\d+)\s*(?:\(([^)]*)\))?/);
    return m ? `Ps ${m[1]}${m[2] ? ', ' + m[2] : ''}` : t;
}

// Chaque verset : numéro dans la marge, première moitié jusqu'à l'astérisque, seconde moitié en dessous
function versetsPsaume(html) {
    if (!html.includes('class="do-psaume"')) return html;
    const morceaux = html.split(/<br>/);
    const sortie = [];
    let dans = false;
    for (const brut of morceaux) {
        const m = brut.trim();
        if (m.includes('class="do-psaume"')) {
            const fin = m.lastIndexOf('</span></span>');
            const titre = fin >= 0 ? m.slice(0, fin + 14) : m;
            sortie.push({ bloc: true, h: titre });
            const reste = fin >= 0 ? m.slice(fin + 14).trim() : '';
            dans = true;
            if (reste) sortie.push(verset(reste));
            continue;
        }
        if (dans && (!m || /^<span class="do-(?:rubr|titre|partie)"><i>Ant\.|^<span class="do-(?:titre|partie)">/.test(m))) dans = false;
        if (dans) { sortie.push(verset(m)); continue; }
        sortie.push({ bloc: false, h: brut });
    }
    let out = '';
    sortie.forEach((x, i) => {
        const prec = sortie[i - 1];
        if (i && !x.bloc && !prec.bloc) out += '<br>';
        out += x.h;
    });
    return out;
}

function verset(m) {
    const n = m.match(/^<sup class="vnum">(\w+)<\/sup>\s*/);
    const texte = n ? m.slice(n[0].length) : m;
    const coupe = texte.search(/\s\*\s/);
    const corps = coupe < 0 ? `<span class="v1">${texte}</span>`
        : `<span class="v1">${texte.slice(0, coupe)} <span class="ast">*</span></span><span class="v2">${texte.slice(coupe + 3)}</span>`;
    return { bloc: true, h: `<div class="v"><span class="vn">${n ? n[1] : ''}</span><span class="vt">${corps}</span></div>` };
}

function mettreEnFormeTexte(html) {
    return html
        // Notes {du Commun ou de la Fête}, {Per Annum}…
        .replace(/\s*\{[^{}]*\}/g, '')
        // Initiales des strophes : une lettre, pas un titre
        .replace(/<span class="do-titre"><b><i>(.)<\/i><\/b><\/span>/gu, '<span class="do-initiale">$1</span>')
        .replace(/<span class="do-rubr"><b><i>(.)<\/i><\/b><\/span>/gu, '<span class="do-initiale">$1</span>')
        // Psaumes : numéro de verset discret, titre détaché, sans le rang [1]
        .replace(/<span class="do-petit">\d+:(\w+)<\/span>\s*/g, '<sup class="vnum">$1</sup>')
        .replace(/<span class="do-rubr"><i>((?:Psalmus|Psaume|Canticum|Cantique)\b[^<]*)<\/i><\/span>(?:\s*\[\d+\])?\s*(?:<br>\s*)?(?:<span class="do-rubr"><i>([^<]*\d[^<]*)<\/i><\/span>\s*(?:<br>\s*)?)?/g,
                 (_, t, ref) => enGregorien()
                    ? (([n, ton]) => `<span class="do-psaume">${n}${ton ? `<span class="ps-ref">${ton}</span>` : ''}</span>`)(titreClair(t).split(' · '))
                    : `<span class="do-psaume">${titrePsaume(t)}<span class="ps-ref">— ${ref || refPsaume(t)}</span></span>`)
        .replace(/<br>\s*(<span class="do-psaume">)/g, '$1');
}

function buildLigne(ligne) {
    if (typeof ligne === 'string') {
        return `<div class="brev-ligne"><div class="brev-text latin">${mettreEnForme(separerParties(ligne))}</div></div>`;
    }
    let [la, fr] = ligne;
    la = mettreEnForme(separerParties(la)); fr = mettreEnForme(separerParties(fr));
    return _lang === 'Francais'
        ? `<div class="brev-ligne"><div class="brev-text francais">${fr}</div></div>`
        : `<div class="brev-ligne"><div class="brev-text latin">${la}</div></div>`;
}

function afficher(office, garderPosition = false) {
    document.getElementById('brev-fete').textContent =
        titreFrancais(office.titre_fr || (office.titre || 'Bréviaire').split(' ~ ')[0]);
    // Les rubriques « omittitur » signalent une partie qui n'est pas dite : on ne les affiche pas
    const garde = l => !/\{omittitur\}\s*(<[^>]+>\s*)*$/.test(typeof l === 'string' ? l : l[0]);
    const box = document.getElementById('brev-content');
    box.innerHTML = office.lignes
        .map((l, i) => garde(l) ? buildLigne(l).replace('class="brev-ligne', `data-i="${i}" class="brev-ligne`) : '').join('');
    box.classList.add('par-partie');
    construireParties(garderPosition ? _partie : null);
    dessinerPartitions(office);
    if (!garderPosition) window.scrollTo(0, 0);
}

// ── Parties de l'heure : une par écran ────────────────────
let _partie = null;
const NOMS_PARTIES = { Incipit: 'Début', Invitatorium: 'Invitatoire', Hymnus: 'Hymne', Psalmi: 'Psaumes',
    'Psalmi cum lectionibus': 'Psaumes', Capitulum: 'Capitule', 'Lectio brevis': 'Leçon brève', Responsorium: 'Répons',
    Versus: 'Verset', Oratio: 'Oraison', Conclusio: 'Conclusion', Martyrologium: 'Martyrologe',
    'De Officio Capituli': 'Office du chapitre', 'Antiphona finalis B.M.V.': 'Antienne à la Vierge',
    'Preces Feriales': 'Prières', 'Canticum: Benedictus': 'Benedictus', 'Canticum: Magnificat': 'Magnificat',
    'Canticum: Nunc dimittis': 'Nunc dimittis', 'Cantique : Benedictus': 'Benedictus',
    'Cantique : Magnificat': 'Magnificat', 'Cantique : Nunc dimittis': 'Nunc dimittis' };

function nomPartie(el) {
    const ps = el.querySelector('.do-psaume');
    if (ps) {
        const t = (ps.firstChild ? ps.firstChild.textContent : ps.textContent).split(' · ')[0].trim();
        return t.replace(/^Psalmus/, 'Psaume').replace(/^Canticum B\. Mariæ Virginis/, 'Magnificat')
                .replace(/^Canticum Zachariæ/, 'Benedictus').replace(/^Canticum Simeonis/, 'Nunc dimittis')
                .replace(/^Canticum Trium Puerorum/i, 'Cantique des trois enfants')
                .replace(/^Canticum/, 'Cantique');
    }
    const titres = [...el.querySelectorAll('.do-titre, .do-partie')].map(t => t.textContent.trim()).filter(t => t.length > 1);
    if (titres.length) {
        const n = titres.slice(0, 2).map(t => NOMS_PARTIES[t] || t.replace(/^Lectio (\d)/, 'Leçon $1'));
        return n.join(' · ');
    }
    const m = el.textContent.match(/(?:Lectio|Leçon)\s*(\d+)/);
    if (m) return 'Leçon ' + m[1];
    const t = el.textContent.trim();
    if (/^℣/.test(t)) return 'Verset';
    if (/Pater\s*Noster|Notre Père/i.test(t)) return 'Pater';
    return t.split(/\s+/).slice(0, 3).join(' ');
}

function construireParties(garder) {
    const lignes = [...document.querySelectorAll('#brev-content .brev-ligne')];
    const barre = document.getElementById('brev-parties');
    barre.innerHTML = '';
    barre.hidden = lignes.length < 2;
    lignes.forEach((l, k) => {
        const b = document.createElement('button');
        b.className = 'partie-tab';
        b.textContent = nomPartie(l);
        b.onclick = () => allerPartie(k);
        barre.appendChild(b);
    });
    const idx = Math.max(0, lignes.findIndex(l => l.dataset.i === garder));
    allerPartie(idx, 0, true);
}

function allerPartie(k, sens = 0, silencieux = false) {
    const lignes = [...document.querySelectorAll('#brev-content .brev-ligne')];
    if (!lignes.length || k < 0 || k >= lignes.length) return;
    const tabs = [...document.querySelectorAll('#brev-parties .partie-tab')];
    lignes.forEach((l, j) => l.classList.toggle('active', j === k));
    tabs.forEach((t, j) => t.classList.toggle('active', j === k));
    _partie = lignes[k].dataset.i;
    const tab = tabs[k];
    if (tab) tab.parentElement.scrollTo({ left: tab.offsetLeft - (tab.parentElement.clientWidth - tab.offsetWidth) / 2, behavior: silencieux ? 'instant' : 'smooth' });
    if (silencieux) return;
    lignes[k].classList.remove('entre-g', 'entre-d');
    void lignes[k].offsetWidth;
    if (sens) lignes[k].classList.add(sens > 0 ? 'entre-g' : 'entre-d');
    const haut = hautBarres();
    const top = document.getElementById('brev-content').getBoundingClientRect().top + window.scrollY - haut;
    if (window.scrollY > top) window.scrollTo({ top, behavior: 'instant' });
}

function partieActive() {
    const l = [...document.querySelectorAll('#brev-content .brev-ligne')];
    return l.findIndex(x => x.classList.contains('active'));
}

function hautBarres() {
    const b = document.getElementById('brev-parties');
    return b.hidden ? document.querySelector('.brev-toolbar').getBoundingClientRect().bottom : b.getBoundingClientRect().bottom;
}

    document.documentElement.style.setProperty('--haut-barre', document.querySelector('.brev-toolbar').offsetHeight + 'px');
}

majHautBarre();

// Glisser le doigt : partie suivante ou précédente
(function () {
    const box = document.getElementById('brev-content');
    let x0 = null, y0 = 0, t0 = 0;
    box.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) { x0 = null; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    box.addEventListener('touchend', e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        x0 = null;
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - t0 > 700) return;
        const k = partieActive();
        if (dx < 0) allerPartie(k + 1, 1); else allerPartie(k - 1, -1);
    }, { passive: true });
})();

// ── Partitions grégoriennes (Exsurge) ─────────────────────
const RE_VERSET = /\s*(?:\^?(\d+)\.\^?|V\/\.|R\/\.)\s*\(::\)/g;

function dessinerScore(source, boite) {
    const ctxt = new exsurge.ChantContext();
    ctxt.lyricTextFont = ctxt.dropCapTextFont = ctxt.annotationTextFont = "'EB Garamond', serif";
    ctxt.lyricTextSize *= 1.2;
    ctxt.spaceBetweenSystems = 0;
    const tete = (source.match(/^annotation:\s*([^;]*);/m) || [])[1];
    const lettrine = !/initial-style:\s*0/.test(source);
    const mapping = exsurge.Gabc.createMappingsFromSource(ctxt, source);
    const score = new exsurge.ChantScore(ctxt, mapping, lettrine);
    if (lettrine && tete) score.annotation = new exsurge.Annotation(ctxt, tete);
    boite._mapping = mapping;
    return new Promise(fin => score.performLayoutAsync(ctxt, () =>
        score.layoutChantLines(ctxt, boite.clientWidth || (document.getElementById('brev-content').clientWidth - 32), () => {
            boite.innerHTML = score.createSvg(ctxt);
            fin();
        })));
}

// Psaume ou cantique : le ton sur le premier verset, puis le texte avec ses repères
function decouperPsaume(source) {
    if (!/^name:\s*(?:\d+[-,]|Magnificat-)/m.test(source)) return null;
    const pos = source.search(/%%/);
    const corps = source.slice(pos + 2);
    const debut = corps.search(/\s*(?:\^?\d+\.\^?|V\/\.|R\/\.)\s*\(::\)/);
    if (debut < 0) return null;
    const entete = source.slice(0, pos + 2);
    const ton = entete + corps.slice(0, debut) + ' (::)';
    const versets = [];
    let m, reg = new RegExp(RE_VERSET.source, 'g'), dernier = null, n = 0;
    const blocs = [];
    while ((m = reg.exec(corps))) {
        if (dernier) blocs.push({ num: dernier.num, txt: corps.slice(dernier.fin, m.index) });
        dernier = { num: m[1] || '', fin: reg.lastIndex };
    }
    if (dernier) blocs.push({ num: dernier.num, txt: corps.slice(dernier.fin) });
    const html = blocs.map(b => {
        const t = b.txt
            .replace(/\*\(:\)/g, '\u0001')
            .replace(/\^†\^|†\([^)]*\)/g, '†')
            .replace(/\([^)]*\)/g, '')
            .replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
            .replace(/\*([^*\s]+)\*/g, '<b>$1</b>')
            .replace(/_([^_\s]+)_/g, '<i>$1</i>')
            .replace(/\u0001/g, '*')
            .replace(/\s+/g, ' ').trim();
        return t ? `<span class="verset">${b.num ? `<sup class="vnum">${b.num}</sup>` : ''}${t}</span>` : '';
    }).join('');
    return { ton, html };
}

// ── Écoute : mélodie reconstituée à partir des notes ──────
function evenementsDe(mapping) {
    const evts = [];
    let bemols = new Set();
    for (const mp of mapping) for (const n of mp.notations) {
        const nom = n.constructor.name;
        if (n.notes) {
            n.notes.forEach((x, i) => {
                let hauteur = x.pitch.toInt();
                if (bemols.has(x.staffPosition)) hauteur -= 1;
                let duree = .3;
                if (x.morae && x.morae.length) duree *= 2;
                if (x.epismata && x.epismata.length) duree *= 1.4;
                evts.push({ hauteur, duree });
            });
        } else if (nom === 'Accidental') {
            if (n.accidentalType === -1) bemols.add(n.staffPosition);
            else bemols.delete(n.staffPosition);
        } else if (n.isDivider) {
            bemols = new Set();
            if (evts.length) {
                const pause = /Quarter|Virgula/.test(nom) ? .12 : /Half/.test(nom) ? .3 : .5;
                evts[evts.length - 1].pause = pause;
                if (!/Quarter|Virgula/.test(nom)) evts[evts.length - 1].duree *= 1.5;
            }
        }
    }
    return evts;
}

let _audio = null;
let _boutonSon = null;

function arreterSon() {
    if (_audio) { try { _audio.close(); } catch (e) {} _audio = null; }
    if (_boutonSon) { _boutonSon.textContent = _boutonSon.dataset.libelle; _boutonSon = null; }
}

function jouer(evts, decalage, bouton) {
    const memeBouton = _boutonSon === bouton;
    arreterSon();
    if (memeBouton || !evts.length) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = _audio = new Ctx();
    _boutonSon = bouton;
    bouton.textContent = '■ Arrêter';
    // Son d'orgue très doux : presque uniquement la fondamentale, filtrée, attaque lente
    const reel = new Float32Array(4);
    const imag = new Float32Array([0, 1, .12, .03]);
    const onde = ctx.createPeriodicWave(reel, imag);
    const filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1000;
    filtre.connect(ctx.destination);
    const VOLUME = .1, ATTAQUE = .1, RELACHE = .18;
    let t = ctx.currentTime + .08;
    for (const e of evts) {
        const frequence = 440 * Math.pow(2, (e.hauteur + decalage - 69) / 12);
        const gain = ctx.createGain();
        const fin = t + e.duree + (e.pause ? 0 : RELACHE * .6);   // notes légèrement liées
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(VOLUME, t + ATTAQUE);
        gain.gain.setValueAtTime(VOLUME, Math.max(t + ATTAQUE, fin - RELACHE));
        gain.gain.linearRampToValueAtTime(0, fin);
        gain.connect(filtre);
        // deux tuyaux très légèrement désaccordés pour un son plus ample
        for (const desaccord of [-2, 2]) {
            const osc = ctx.createOscillator();
            osc.setPeriodicWave(onde);
            osc.frequency.value = frequence;
            osc.detune.value = desaccord;
            osc.connect(gain);
            osc.start(t);
            osc.stop(fin + .01);
        }
        t += e.duree + (e.pause || 0);
    }
    const fin = (t - ctx.currentTime + .1) * 1000;
    setTimeout(() => { if (_audio === ctx) arreterSon(); }, fin);
}

// Hauteur de la teneur : la note la plus fréquente du psaume
function teneurDe(source) {
    const compte = new Map();
    const mapping = exsurge.Gabc.createMappingsFromSource(new exsurge.ChantContext(), source);
    for (const e of evenementsDe(mapping)) compte.set(e.hauteur, (compte.get(e.hauteur) || 0) + 1);
    return [...compte].sort((a, b) => b[1] - a[1])[0][0];
}

// MIDI sonnant = hauteur écrite + 48 + décalage. Cibles : sol4 (67), la4 (69)
function plusProche(valeur, cibles) {
    return cibles.reduce((m, c) => Math.abs(c - valeur) <= Math.abs(m - valeur) ? c : m);
}

// La teneur sonne toujours sur sol4 (392 Hz)
const decalageTeneur = t => 67 - t;

// Sans teneur (hymne, antienne sans psaume noté) : la note la plus haute vers si bémol4 ou do5
function decalageTessiture(evts) {
    const haut = Math.max(...evts.map(e => e.hauteur));
    return plusProche(haut + 48, [70, 72]) - haut;
}

function typePiece(el) {
    let n = el.previousSibling;
    while (n && (n.nodeName === 'BR' || (n.nodeType === 3 && !n.textContent.trim()))) n = n.previousSibling;
    if (!n || n.nodeType !== 1) return null;
    const t = n.textContent.trim();
    if (/^Ant\./.test(t)) return 'antienne';
    if (/^Hymn/i.test(t)) return 'hymne';
    return null;
}

function boutonEcouter(boite, type, teneur) {
    const evts = evenementsDe(boite._mapping || []);
    if (!evts.length) return null;
    const decalage = type === 'antienne' && teneur !== null ? decalageTeneur(teneur) : decalageTessiture(evts);
    const b = document.createElement('button');
    b.className = 'greg-ecoute';
    b.textContent = b.dataset.libelle = '▶ Écouter';
    b.onclick = () => jouer(evts, decalage, b);
    return b;
}

// ── Traduction française sous les pièces ──────────────────
function basculerTraduction() {
    _traduction = !_traduction;
    try { localStorage.setItem('breviaire-traduction', _traduction ? '1' : '0'); } catch (e) {}
    majBoutonsLangue();
    arreterSon();
    const o = _cache[cleOffice()];
    if (o) afficher(o);
}

async function chargerFrancais(office) {
    if (office._francais) return office._francais;
    const d = office.date.split('-');
    const chemin = `data/breviaire/${d[0]}/${d[1]}-${d[2]}/Vespera.json`;
    const rep = await fetch(chemin).catch(() => caches.match(new URL(chemin, location.href).href));
    if (!rep) throw new Error('Traduction indisponible hors ligne');
    if (!rep.ok) throw new Error('HTTP ' + rep.status);
    office._francais = (await rep.json()).lignes.map(r => r[1]);
    return office._francais;
}

// Découpe une cellule française en morceaux correspondant aux pièces chantées
function morceauxFrancais(cellule) {
    const html = mettreEnForme(separerParties(cellule));
    return html.split(/(?=<span class="do-partie">|<span class="do-rubr"><i>Ant\.|<span class="do-psaume">)/)
        .map(m => m
            .replace(/<span class="do-(?:partie|psaume|titre)">[^]*?<\/span>/g, '')
            .replace(/^(?:\s*<br>\s*)+|(?:\s*<br>\s*)+$/g, '').trim())
        .filter(m => m.replace(/<[^>]+>/g, '').trim());
}

function blocTraduction(html) {
    const d = document.createElement('div');
    d.className = 'greg-trad';
    d.lang = 'fr';
    d.innerHTML = html;
    return d;
}

async function dessinerPartitions(office) {
    const dessin = ++_dessin;
    let francais = null;
    if (enGregorien() && _traduction && office) {
        try { francais = await chargerFrancais(office); } catch (e) { console.error(e); }
        if (dessin !== _dessin) return;
    }

    for (const ligne of document.querySelectorAll('#brev-content .brev-ligne')) {
        const pieces = [...ligne.querySelectorAll('.gabc')];
        const fr = francais ? morceauxFrancais(francais[+ligne.dataset.i] || '') : [];
        const parPiece = fr.length === pieces.length;
        const psaumes = pieces.map(p => decouperPsaume(p.textContent) ? p.textContent : null);

        for (let i = 0; i < pieces.length; i++) {
            const el = pieces[i];
            el.style.display = 'none';
            const source = el.textContent;
            const boite = document.createElement('div');
            boite.className = 'gregorien-score';
            el.after(boite);
            const psaume = decouperPsaume(source);
            try {
                await dessinerScore(psaume ? psaume.ton : source, boite);
            } catch (e) {
                console.error(e);
                boite.textContent = 'Partition indisponible.';
            }
            if (dessin !== _dessin) return;
            let dernier = boite;
            const type = typePiece(el);
            if (type) {
                let suivant = psaumes.slice(i + 1).find(Boolean);
                if (!suivant) suivant = psaumes.slice(0, i).reverse().find(Boolean);
                let teneur = null;
                if (type === 'antienne' && suivant) {
                    try { teneur = teneurDe(suivant); } catch (e) { console.error(e); }
                }
                const bouton = boutonEcouter(boite, type, teneur);
                if (bouton) boite.before(bouton);
            }
            if (psaume) {
                const v = document.createElement('div');
                v.className = 'gregorien-versets';
                v.innerHTML = psaume.html;
                dernier.after(v);
                dernier = v;
            }
            if (parPiece && fr[i]) dernier.after(blocTraduction(fr[i]));
        }
        if (francais && !parPiece && fr.length) {
            const zone = ligne.querySelector('.brev-text') || ligne;
            zone.appendChild(blocTraduction(fr.join('<br>')));
        }
    }
}

// ── Taille du texte ───────────────────────────────────────
const TAILLES = [.88, 1, 1.12, 1.25, 1.4];
let _taille = 1;
try {
    const t = parseInt(localStorage.getItem('breviaire-taille'), 10);
    if (TAILLES[t]) _taille = t;
} catch (e) {}

function appliquerTaille() {
    document.getElementById('brev-content').style.setProperty('--brev-k', TAILLES[_taille]);
    document.getElementById('btn-moins').disabled = _taille === 0;
    document.getElementById('btn-plus').disabled  = _taille === TAILLES.length - 1;
}

function changerTaille(delta) {
    _taille = Math.min(TAILLES.length - 1, Math.max(0, _taille + delta));
    try { localStorage.setItem('breviaire-taille', _taille); } catch (e) {}
    appliquerTaille();
}

// ── À l'ouverture : l'heure correspondant au moment de la journée ──
function heureDuMoment(d = new Date()) {
    const h = d.getHours() + d.getMinutes() / 60;
    if (h < 6)    return 'Matutinum';
    if (h < 8)    return 'Laudes';
    if (h < 9)    return 'Prima';
    if (h < 11)   return 'Tertia';
    if (h < 14)   return 'Sexta';
    if (h < 16.5) return 'Nona';
    if (h < 20)   return 'Vespera';
    return 'Completorium';
}

_heure = heureDuMoment();
document.querySelectorAll('.heure-tab').forEach(b => {
    const actif = b.dataset.heure === _heure;
    b.classList.toggle('active', actif);
    if (actif) b.parentElement.scrollLeft = b.offsetLeft - (b.parentElement.clientWidth - b.offsetWidth) / 2;
});

// ── Hors ligne : les 30 prochains jours, téléchargés automatiquement ──
const JOURS_HORS_LIGNE = 30;
const CACHE_OFFICES = 'breviaire-offices-v1';
const FICHIERS_JOUR = ['Matutinum','Laudes','Prima','Tertia','Sexta','Nona','Vespera','Vespera-gregorien','Completorium'];
let _prechargement = false;

function etatHorsLigne(texte) {
    const b = document.getElementById('brev-horsligne');
    b.hidden = !texte;
    b.textContent = texte || '';
}

function urlOffice(date, fichier) {
    const chemin = `data/breviaire/${date.getFullYear()}/${deux(date.getMonth()+1)}-${deux(date.getDate())}/${fichier}.json`;
    return new URL(chemin, location.href).href;
}

async function prechargerOffices() {
    if (_prechargement || !('caches' in window)) return;
    _prechargement = true;
    try {
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        const cache = await caches.open(CACHE_OFFICES);
        const auj = new Date();
        auj.setHours(0,0,0,0);

        // Retire les jours passés
        const hier = new Date(auj); hier.setDate(hier.getDate() - 1);
        const limite = `${hier.getFullYear()}/${deux(hier.getMonth()+1)}-${deux(hier.getDate())}`;
        for (const req of await cache.keys()) {
            const m = req.url.match(/data\/breviaire\/(\d{4}\/\d{2}-\d{2})\//);
            if (m && m[1] < limite) await cache.delete(req);
        }

        // Liste de ce qui manque ; un jour non encore généré n'est pas une erreur
        const manquants = [];
        const jours = [];
        for (let i = 0; i < JOURS_HORS_LIGNE; i++) {
            const d = new Date(auj); d.setDate(auj.getDate() + i);
            jours.push(d);
            for (const f of FICHIERS_JOUR) {
                const u = urlOffice(d, f);
                if (!(await cache.match(u))) manquants.push(u);
            }
            // La Messe du jour voyage avec le Bréviaire
            const uMesse = new URL(`data/messe/${d.getFullYear()}/${deux(d.getMonth()+1)}-${deux(d.getDate())}.json`, location.href).href;
            if (!(await cache.match(uMesse))) manquants.push(uMesse);
        }

        let enEchec = 0, faits = 0;
        const total = manquants.length;
        if (total) etatHorsLigne(`Hors ligne : téléchargement… 0 sur ${total}`);
        const ouvrier = async () => {
            while (manquants.length) {
                const u = manquants.shift();
                try {
                    const r = await fetch(u, { cache: 'no-cache' });
                    if (r.ok) await cache.put(u, r.clone());
                    else if (r.status !== 404) enEchec++;
                } catch (e) { enEchec++; }
                faits++;
                if (faits % 10 === 0 || faits === total) etatHorsLigne(`Hors ligne : téléchargement… ${faits} sur ${total}`);
            }
        };
        await Promise.all([ouvrier(), ouvrier(), ouvrier()]);

        // Compte les jours réellement complets
        let prets = 0;
        for (const d of jours) {
            const ok = await Promise.all(FICHIERS_JOUR.map(f => cache.match(urlOffice(d, f))));
            if (ok.every(Boolean)) prets++; else break;
        }
        etatHorsLigne(enEchec || prets < JOURS_HORS_LIGNE
            ? `Hors ligne : ${prets} jour${prets > 1 ? 's' : ''} prêt${prets > 1 ? 's' : ''} · toucher pour réessayer`
            : `Hors ligne : ${prets} jours prêts`);
    } catch (e) {
        console.error(e);
        etatHorsLigne('Hors ligne : téléchargement impossible · toucher pour réessayer');
    } finally {
        _prechargement = false;
    }
}

appliquerTaille();
majBoutonsLangue();
chargerOffice();
if (navigator.onLine !== false) prechargerOffices();
else etatHorsLigne('Sans connexion : offices déjà téléchargés disponibles');

// Le service worker garde aussi cette page, même si elle est ouverte directement
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
