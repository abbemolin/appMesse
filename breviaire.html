<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bréviaire — Officium Divinum</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
    /* ════════════════════════════════════════════════════════
       BRÉVIAIRE
    ════════════════════════════════════════════════════════ */

    /* ── Hero ────────────────────────────────────────────── */
    .brev-hero {
        background: #1a1108;
        padding: calc(env(safe-area-inset-top,0px) + 16px) 0 0;
        position: relative; overflow: hidden;
    }
    .brev-hero-cross {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%,-50%);
        opacity: .05; pointer-events: none; width: 160px; height: 200px;
    }
    .brev-hero-body {
        position: relative; z-index: 2;
        text-align: center; padding: 0 20px 16px;
    }
    .brev-hero-label {
        font-family: 'Cinzel', serif; font-size: .46rem;
        letter-spacing: .32em; text-transform: uppercase;
        color: rgba(184,150,42,.5); display: block; margin-bottom: 6px;
    }
    .brev-hero-fete {
        font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
        color: #f0e8d5; letter-spacing: .04em; line-height: 1.25;
        display: block; margin-bottom: 4px;
    }
    .brev-hero-date {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .9rem; color: rgba(240,232,213,.5);
    }

    /* Navigation ±jour */
    .brev-nav-jour {
        position: absolute; top: 0; bottom: 0; width: 50px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; opacity: 0; transition: opacity .2s; z-index: 10;
    }
    .brev-nav-jour:hover, .brev-nav-jour:active { opacity: 1; }
    .brev-nav-jour-left  { left: 0; }
    .brev-nav-jour-right { right: 0; }
    .brev-nav-arrow { color: #c9a840; font-family: 'Cinzel',serif; font-size: 1.3rem; }

    .brev-hero-bar { height: 3px; background: linear-gradient(to right,transparent,rgba(184,150,42,.4),transparent); }

    /* ── Onglets heures canoniales ───────────────────────── */
    .heures-tabs {
        display: flex; overflow-x: auto; padding: 10px 16px 0;
        gap: 4px; background: var(--vellum-light);
        border-bottom: 1px solid var(--border-soft);
        scrollbar-width: none;
    }
    .heures-tabs::-webkit-scrollbar { display: none; }
    .heure-tab {
        font-family: 'Cinzel', serif; font-size: .54rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 7px 12px; border: none; cursor: pointer;
        border-radius: 3px 3px 0 0; white-space: nowrap;
        color: var(--ink-muted); background: none;
        border-bottom: 2px solid transparent; transition: all .2s;
        flex-shrink: 0;
    }
    .heure-tab.active {
        color: var(--rubric); border-bottom-color: var(--rubric);
        background: rgba(139,26,26,.04);
    }
    .heure-tab:hover:not(.active) { color: var(--ink); }

    /* ── Barre langue + options ──────────────────────────── */
    .brev-toolbar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 16px; background: var(--vellum);
        border-bottom: 1px solid var(--border-soft);
        position: sticky; top: 0; z-index: 40;
        box-shadow: 0 2px 8px var(--shadow);
    }
    .lang-toggle {
        display: flex; border: 1px solid var(--border-soft); border-radius: 3px; overflow: hidden;
    }
    .lang-btn {
        font-family: 'Cinzel', serif; font-size: .54rem; letter-spacing: .1em;
        padding: 6px 12px; border: none; cursor: pointer; transition: all .15s;
        background: none; color: var(--ink-muted);
    }
    .lang-btn.active { background: #1a1108; color: #c9a840; }
    .brev-toolbar-filler { flex: 1; }
    .brev-search-btn {
        background: none; border: 1px solid var(--border-soft);
        border-radius: 3px; padding: 6px 10px; cursor: pointer;
        color: var(--ink-muted); font-size: .85rem; transition: all .15s;
    }
    .brev-search-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Corps du texte ──────────────────────────────────── */
    .brev-content {
        padding: 20px 16px 40px; max-width: 720px; margin: 0 auto;
    }

    /* Bloc de section liturgique */
    .brev-section {
        margin-bottom: 22px; animation: fadeInUp .3s ease both;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    .brev-section-title {
        font-family: 'Cinzel', serif; font-size: .58rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--rubric); border-bottom: 1px solid rgba(139,26,26,.15);
        padding-bottom: 4px; margin-bottom: 10px;
        display: flex; align-items: center; gap: 8px;
    }
    .brev-section-title .no-fr {
        font-family: 'Cinzel', serif; font-size: .44rem;
        letter-spacing: .1em; color: var(--ink-muted);
        background: var(--vellum-light); border: 1px solid var(--border-soft);
        border-radius: 10px; padding: 1px 8px; flex-shrink: 0;
    }

    .brev-text {
        font-family: 'EB Garamond', serif; font-size: 1.06rem;
        line-height: 1.8; color: var(--ink);
        white-space: pre-wrap; hyphens: auto;
    }
    .brev-text.latin { font-style: italic; color: var(--ink-soft); }
    .brev-text.francais { color: var(--ink); }

    /* Mode bilingue côte à côte (desktop) */
    .brev-bilingue {
        display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .brev-bilingue-col-la { border-right: 1px solid var(--border-soft); padding-right: 20px; }
    .brev-bilingue-col-fr { padding-left: 0; }
    .brev-bilingue-label {
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .18em; text-transform: uppercase;
        color: var(--ink-muted); display: block; margin-bottom: 6px;
    }
    @media (max-width: 600px) {
        .brev-bilingue { grid-template-columns: 1fr; gap: 10px; }
        .brev-bilingue-col-la { border-right: none; padding-right: 0;
            border-bottom: 1px solid var(--border-soft); padding-bottom: 10px; }
    }

    /* ── Antienne ────────────────────────────────────────── */
    .brev-antienne {
        margin-bottom: 6px;
        padding: 8px 12px;
        background: rgba(184,150,42,.06);
        border-left: 3px solid var(--gold);
        border-radius: 2px;
    }
    .brev-ant-label {
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .18em; text-transform: uppercase;
        color: var(--gold); display: block; margin-bottom: 4px;
    }
    .brev-ant-text {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        font-style: italic; display: block; line-height: 1.6;
        color: var(--ink);
    }
    .brev-ant-text.francais { color: var(--ink-soft); margin-top: 4px; }

    /* ── Psaume complet ──────────────────────────────────── */
    .psaume-section { margin-bottom: 20px; }
    .brev-psalm-text {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        line-height: 1.85; color: var(--ink);
    }
    .brev-psalm-text.latin { font-style: italic; color: var(--ink-soft); }
    .brev-psalm-text.muted { opacity: .6; }
    .brev-ps-verset { display: block; }
    .brev-ps-verset sup.vnum {
        font-family: 'Cinzel', serif; font-size: .54rem;
        color: var(--gold); opacity: .7; margin-right: 3px;
        vertical-align: super; user-select: none;
    }

    @media (prefers-color-scheme: dark) {
        .brev-antienne { background: rgba(184,150,42,.08); }
    }

    /* Répons et versicules */
    .brev-resp {
        display: block; font-family: 'EB Garamond', serif;
        font-size: 1rem; color: var(--rubric); line-height: 1.7;
        font-style: italic;
    }

    /* Verset d'hymne */
    .brev-hymne-v {
        display: block; font-family: 'EB Garamond', serif;
        font-size: 1rem; color: var(--ink); line-height: 1.7;
    }

    /* Section majeure (titre plus visible) */
    .brev-section-title.majeur {
        color: var(--ink); font-size: .65rem;
        border-bottom-color: rgba(26,17,8,.2);
    }
    @media (prefers-color-scheme:dark) {
        .brev-section-title.majeur { color: var(--ink-soft); border-bottom-color: var(--border-soft); }
    }

    /* Texte muted (latin affiché en fallback) */
    .brev-text.muted, .brev-psaume.muted { opacity: .6; }
    .no-fr-txt { color: var(--ink-muted); font-size: .88rem; }
        font-family: 'Cinzel', serif; font-size: .58rem;
        color: var(--gold); vertical-align: super; margin-right: 2px;
        opacity: .7; user-select: none;
    }

    /* Référence biblique */
    .brev-ref {
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .12em; color: var(--gold);
        display: block; margin-bottom: 5px; font-style: normal;
    }

    /* ── Chargement / vide ───────────────────────────────── */
    .brev-loading {
        text-align: center; padding: 50px 20px;
        color: var(--ink-muted); font-family: 'EB Garamond', serif;
        font-style: italic;
    }
    .brev-loading::before {
        content: '✦'; display: block; color: var(--gold);
        font-size: 1.2rem; margin-bottom: 14px;
        animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }

    .brev-empty {
        text-align: center; padding: 40px 20px;
        color: var(--ink-muted); font-style: italic;
        font-family: 'EB Garamond', serif;
    }

    /* ── Modale de recherche ─────────────────────────────── */
    .brev-modal-bg {
        display: none; position: fixed; inset: 0; z-index: 3000;
        background: rgba(0,0,0,.6);
        align-items: flex-start; justify-content: center;
        padding: 60px 16px 20px;
    }
    .brev-modal-bg.open { display: flex; }
    .brev-modal {
        background: var(--vellum-light); border-radius: 4px;
        width: 100%; max-width: 600px;
        box-shadow: 0 12px 48px rgba(0,0,0,.3);
        max-height: calc(100vh - 100px);
        display: flex; flex-direction: column;
        border-top: 3px solid var(--gold);
    }
    .brev-modal-head {
        padding: 14px 18px; border-bottom: 1px solid var(--border-soft);
        display: flex; gap: 10px; align-items: center;
    }
    .brev-modal-input {
        flex: 1; padding: 9px 12px;
        font-family: 'EB Garamond', serif; font-size: 1rem;
        border: 1px solid var(--border-soft); border-radius: 2px;
        background: var(--vellum); color: var(--ink);
    }
    .brev-modal-input:focus { outline: none; border-color: var(--gold); }
    .brev-modal-close {
        background: none; border: none; color: var(--ink-muted);
        font-size: 1.2rem; cursor: pointer; padding: 4px 8px;
    }
    .brev-modal-results {
        flex: 1; overflow-y: auto; padding: 0;
    }
    .brev-result {
        padding: 12px 18px; border-bottom: 1px solid var(--border-soft);
        cursor: pointer; transition: background .15s;
    }
    .brev-result:hover { background: var(--vellum); }
    .brev-result-ref {
        font-family: 'Cinzel', serif; font-size: .54rem;
        letter-spacing: .12em; color: var(--rubric);
        text-transform: uppercase; display: block; margin-bottom: 3px;
    }
    .brev-result-text {
        font-family: 'EB Garamond', serif; font-size: .92rem;
        color: var(--ink); line-height: 1.5;
    }
    .brev-result-text mark {
        background: var(--gold-pale); color: var(--ink); border-radius: 1px;
    }
    .brev-modal-count {
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .12em; color: var(--ink-muted);
        text-transform: uppercase; padding: 8px 18px;
        border-bottom: 1px solid var(--border-soft);
        background: var(--vellum);
    }

    /* ── Mode sombre ─────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
        .heures-tabs { background: var(--vellum-light); border-color: var(--border-soft); }
        .brev-toolbar { background: var(--vellum); border-color: var(--border-soft); }
        .lang-btn.active { background: #0e0c08; }
        .brev-modal { background: var(--vellum-light); }
        .brev-modal-input { background: var(--vellum); color: var(--ink); border-color: var(--border-soft); }
        .brev-result:hover { background: var(--vellum); }
        .brev-modal-count { background: var(--vellum); }
        .brev-bilingue-col-la { border-color: var(--border-soft); }
    }
    </style>
</head>
<body>
<div id="menu-container"></div>

<!-- ════════════ HERO ════════════ -->
<div class="brev-hero" id="brev-hero">
    <svg class="brev-hero-cross" viewBox="0 0 160 200" fill="none">
        <rect x="64" y="0" width="32" height="200" fill="#b8962a"/>
        <rect x="0" y="60" width="160" height="32" fill="#b8962a"/>
    </svg>
    <div class="brev-nav-jour brev-nav-jour-left" onclick="naviguerJour(-1)">
        <span class="brev-nav-arrow">‹</span>
    </div>
    <div class="brev-nav-jour brev-nav-jour-right" onclick="naviguerJour(1)">
        <span class="brev-nav-arrow">›</span>
    </div>
    <div class="brev-hero-body">
        <span class="brev-hero-label">Officium Divinum · 1962</span>
        <span class="brev-hero-fete" id="brev-fete">Chargement…</span>
        <span class="brev-hero-date" id="brev-date"></span>
    </div>
    <div class="brev-hero-bar"></div>
</div>

<!-- ════════════ ONGLETS HEURES ════════════ -->
<div class="heures-tabs" id="heures-tabs">
    <button class="heure-tab active" data-heure="Matines"   onclick="setHeure(this)">Matines</button>
    <button class="heure-tab"        data-heure="Laudes"    onclick="setHeure(this)">Laudes</button>
    <button class="heure-tab"        data-heure="Prime"     onclick="setHeure(this)">Prime</button>
    <button class="heure-tab"        data-heure="Tierce"    onclick="setHeure(this)">Tierce</button>
    <button class="heure-tab"        data-heure="Sexte"     onclick="setHeure(this)">Sexte</button>
    <button class="heure-tab"        data-heure="None"      onclick="setHeure(this)">None</button>
    <button class="heure-tab"        data-heure="Vêpres"    onclick="setHeure(this)">Vêpres</button>
    <button class="heure-tab"        data-heure="Complies"  onclick="setHeure(this)">Complies</button>
</div>

<!-- ════════════ TOOLBAR ════════════ -->
<div class="brev-toolbar">
    <div class="lang-toggle">
        <button class="lang-btn active" id="btn-la" onclick="setLang('la')">Latin</button>
        <button class="lang-btn"        id="btn-fr" onclick="setLang('fr')">Français</button>
        <button class="lang-btn"        id="btn-bi" onclick="setLang('bi')">Bilingue</button>
    </div>
    <div class="brev-toolbar-filler"></div>
    <button class="brev-search-btn" onclick="ouvrirRecherche()" title="Rechercher (/)">⌕</button>
</div>

<!-- ════════════ CONTENU ════════════ -->
<div class="brev-content" id="brev-content">
    <div class="brev-loading">Chargement de l'office…</div>
</div>

<!-- ════════════ MODALE RECHERCHE ════════════ -->
<div class="brev-modal-bg" id="brev-modal-bg" onclick="if(event.target===this)fermerRecherche()">
    <div class="brev-modal">
        <div class="brev-modal-head">
            <input class="brev-modal-input" id="brev-search-input" type="text"
                placeholder="Rechercher dans le bréviaire…"
                oninput="debounceSearch()" autocomplete="off"
                onkeydown="if(event.key==='Escape')fermerRecherche()">
            <button class="brev-modal-close" onclick="fermerRecherche()">✕</button>
        </div>
        <div class="brev-modal-results" id="brev-search-results">
            <div class="brev-empty">Entrez un mot ou une référence liturgique</div>
        </div>
    </div>
</div>

<script src="ordo1962.js"></script>
<script src="menu.js"></script>
<script>

// ── Calcul de Pâques ──────────────────────────────────────
function getEaster(year) {
    const a = year % 19;
    const b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19*a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2*e + 2*i - h - k) % 7;
    const m = Math.floor((a + 11*h + 22*l) / 451);
    const month = Math.floor((h + l - 7*m + 114) / 31);
    const day   = ((h + l - 7*m + 114) % 31) + 1;
    return new Date(year, month-1, day);
}

function addDays(d, n) {
    const r = new Date(d); r.setDate(r.getDate() + n); return r;
}
function diffDays(a, b) {
    return Math.round((a - b) / 86400000);
}
// Dimanche précédant ou égal à d
function prevSunday(d) {
    const r = new Date(d);
    r.setDate(r.getDate() - r.getDay());
    return r;
}

// Mapping semaine après la Pentecôte → fichier de lectures scripturaires
const PENT_TO_NUM = {
    1:'081',2:'082',3:'083',4:'084',5:'085',
    6:'091',7:'092',8:'093',9:'094',10:'095',
    11:'101',12:'102',13:'103',14:'104',15:'105',
    16:'111',17:'112',18:'113',19:'114',20:'115',
    21:'112',22:'113',23:'114',24:'115',
};

// ── Mapping date → fichiers Tempora ───────────────────────
function getBrevFiles(d) {
    const year  = d.getFullYear();
    const month = d.getMonth() + 1;
    const day   = d.getDate();
    // Convention DO : 0=dim, 1=lun, …, 6=sam
    const dow   = d.getDay();  // 0=dim natif JS ✓

    const easter      = getEaster(year);
    const pentecost   = addDays(easter, 49);
    const ashWed      = addDays(easter, -46);
    const christmas   = new Date(year, 11, 25);
    const epiphany    = new Date(year, 0, 6);

    // 1er dimanche de l'Avent (4 dimanches avant Noël)
    const adv1 = addDays(prevSunday(addDays(christmas, -1)), -21);

    // 1er dimanche après l'Épiphanie
    let epi1Sun = addDays(epiphany, (7 - epiphany.getDay()) % 7);
    if (epi1Sun <= epiphany) epi1Sun = addDays(epi1Sun, 7);

    // Septuagésime = dimanche -63j avant Pâques
    const septuagesima = addDays(prevSunday(addDays(ashWed, -1)), -14);

    // Fichier sancti MM-DD
    const sanctiFile = String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');

    let temporaFile = null;
    let scripturaFile = null;  // fichier de lectures scripturaires numérique

    const dDate = new Date(year, month-1, day);

    if (dDate >= adv1 || month === 12 && day >= 25) {
        // ── Avent ──────────────────────────────────────────
        const weekSun = prevSunday(dDate);
        const wk = Math.floor(diffDays(weekSun, adv1) / 7) + 1;
        const w = Math.min(Math.max(wk, 1), 4);
        temporaFile = `Adv${w}-${dow}`;

    } else if (dDate >= new Date(year, 11, 25) || dDate < epiphany) {
        // ── Noël ───────────────────────────────────────────
        const nat = diffDays(dDate, new Date(year-1,11,25));
        temporaFile = nat <= 7 ? 'Nat1-0' : 'Nat2-0';

    } else if (dDate < epi1Sun) {
        temporaFile = null;

    } else if (dDate < septuagesima) {
        // ── Temps après l'Épiphanie ─────────────────────────
        const weekSun = prevSunday(dDate);
        const wk = Math.floor(diffDays(weekSun, epi1Sun) / 7) + 1;
        temporaFile = `Epi${Math.min(wk,6)}-${dow}`;

    } else if (dDate < ashWed) {
        // ── Septuagésime / Sexagésime / Quinquagésime ───────
        const weekSun = prevSunday(dDate);
        const wk = Math.floor(diffDays(weekSun, septuagesima) / 7) + 1;
        const prefixes = ['Quadp1','Quadp2','Quadp3'];
        temporaFile = `${prefixes[Math.min(wk,3)-1]}-${dow}`;

    } else if (dDate < easter) {
        // ── Carême ─────────────────────────────────────────
        const weekSun = prevSunday(dDate);
        const lentStart = addDays(ashWed, (7 - ashWed.getDay()) % 7);
        const wk = Math.max(1, Math.floor(diffDays(weekSun, lentStart) / 7) + 1);
        temporaFile = `Quad${Math.min(wk,6)}-${dow}`;

    } else if (dDate < pentecost) {
        // ── Temps pascal ───────────────────────────────────
        const wk = Math.floor(diffDays(dDate, easter) / 7);
        temporaFile = `Pasc${wk}-${dow}`;

    } else if (diffDays(dDate, pentecost) < 7) {
        // ── Octave de Pentecôte ─────────────────────────────
        temporaFile = `Pasc7-${dow}`;

    } else {
        // ── Temps après la Pentecôte ────────────────────────
        const weekSun = prevSunday(dDate);
        const wkAfterPent = Math.floor(diffDays(weekSun, pentecost) / 7);
        const wkNum = String(wkAfterPent).padStart(2,'0');
        temporaFile = `Pent${wkNum}-${dow}`;

        // Fichier de lectures scripturaires (081-115)
        const numKey = PENT_TO_NUM[wkAfterPent];
        if (numKey) scripturaFile = `${numKey}-${dow}`;
    }

    const ordo = (typeof Ordo1962 !== 'undefined')
        ? Ordo1962.getDay(year, month, day) : null;
    const feteName = ordo && ordo.fete ? ordo.fete
        : temporaFile ? temporaFile : '—';

    return { sanctiFile, temporaFile, scripturaFile, ordo, feteName };
}

function naviguerJour(delta) {
    _offset += delta;
    chargerOffice();
}

function setHeure(btn) {
    document.querySelectorAll('.heure-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _heure = btn.dataset.heure;
    afficherHeure();
}

function setLang(lang) {
    _lang = lang;
    ['la','fr','bi'].forEach(l => {
        const b = document.getElementById('btn-'+l);

// ── Chargement depuis Supabase ────────────────────────────
async function chargerOffice() {
    if (typeof maConnexion === 'undefined') { setTimeout(chargerOffice, 300); return; }

    const d = dateNav();
    document.getElementById('brev-date').textContent =
        JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();

    const { sanctiFile, temporaFile, scripturaFile, ordo, feteName } = getBrevFiles(d);
    document.getElementById('brev-fete').textContent = feteName;

    document.getElementById('brev-content').innerHTML =
        '<div class="brev-loading">Chargement de l\'office…</div>';

    const cacheKey = [sanctiFile, temporaFile, scripturaFile].join('|');
    if (_cache[cacheKey]) { _currentSections = _cache[cacheKey]; afficherHeure(); return; }

    const EXCL = '("Rank","Rule","Name","Officium","Comment")';

    // Convention jour DO : Day1=dim, Day2=lun, Day3=mar, Day4=mer, Day5=jeu, Day6=ven, Day7=sam
    // dow JS : 0=dim, 1=lun...6=sam → doDay = dow+1 (1=dim...7=sam)
    const doDay = d.getDay() + 1; // 1=dim...7=sam
    const dayKey = `Day${doDay}`;
    // Antiennes fériaux : Feria2=lun, Feria3=mar...Feria7=sam
    const feriaKey = ['', '', 'Feria2', 'Feria3', 'Feria4', 'Feria5', 'Feria6', 'Feria7'][d.getDay() + 1] || '';

    try {
        const queries = [
            // 1. Sancti du jour
            maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Sancti').eq('fichier', sanctiFile)
                .not('section','in',EXCL),

            // 2. Temporal propre (antiennes propres, oraison de la semaine)
            temporaFile ? maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Tempora').eq('fichier', temporaFile)
                .not('section','in',EXCL) : Promise.resolve({data:[]}),

            // 3. Lectures scripturaires (081-115)
            scripturaFile ? maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Tempora').eq('fichier', scripturaFile)
                .not('section','in',EXCL) : Promise.resolve({data:[]}),

            // 4. Antiennes du jour (contiennent numéros de psaumes)
            maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Psalterium')
                .in('fichier',['Psalmi/Psalmi major','Psalmi/Psalmi minor','Psalmi/Psalmi matutinum'])
                .ilike('section', `${dayKey}%`),

            // 5. Hymnes et versicules du jour (Major + Minor Special)
            maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Psalterium')
                .in('fichier',['Special/Major Special','Special/Minor Special','Special/Matutinum Special'])
                .or(`section.ilike.${dayKey}%,section.ilike.Hymnus ${dayKey}%,section.ilike.HymnusM ${dayKey}%,section.ilike.${feriaKey}%`)
                .not('section','in',EXCL),

            // 6. Antiennes fériaux du Magnificat/Benedictus
            feriaKey ? maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Psalterium')
                .eq('fichier','Special/Major Special')
                .ilike('section', `${feriaKey}%`) : Promise.resolve({data:[]}),
        ];

        const results = await Promise.all(queries);
        let sections = [];
        results.forEach(r => { if (r && !r.error && r.data) sections = sections.concat(r.data); });

        // Extraire les numéros de psaumes depuis les antiennes
        const psNums = new Set();
        sections.forEach(s => {
            if (s.fichier && s.fichier.includes('Psalmi')) {
                s.text_la.split('\n').forEach(line => {
                    if (line.includes(';;')) {
                        const num = line.split(';;')[1].split('(')[0].split(';')[0].trim();
                        if (num && /^\d+$/.test(num) && parseInt(num) <= 266) {
                            psNums.add(num);
                        }
                    }
                });
            }
        });

        // Charger les textes complets des psaumes identifiés
        if (psNums.size > 0) {
            const fichiersPsaumes = [...psNums].map(n => `Psalmorum/Psalm${n}`);
            const { data: psData } = await maConnexion.from('breviaire')
                .select('dossier,fichier,section,text_la,text_fr')
                .eq('dossier','Psalterium')
                .in('fichier', fichiersPsaumes);
            if (psData) sections = sections.concat(psData);
        }

        // Dédupliquer : Sancti > Tempora > Psalterium
        const seen = new Set();
        const PRIORITY_ORDER = ['Sancti','Tempora','Psalterium'];
        sections.sort((a,b) => PRIORITY_ORDER.indexOf(a.dossier) - PRIORITY_ORDER.indexOf(b.dossier));
        sections = sections.filter(s => {
            if (seen.has(s.section)) return false;
            seen.add(s.section);
            return true;
        });

        _cache[cacheKey] = sections;
        _currentSections = sections;
        afficherHeure();

    } catch(e) {
        console.error(e);
        document.getElementById('brev-content').innerHTML =
            '<div class="brev-empty">Erreur de chargement.</div>';
    }
}

 et confirmásti me in conspéctu tuo.","ant_fr":"Vous m’avez soutenu, * Seigneur, et fortifié en votre présence.","psaumes":["40","41","41"]}],"None":[{"ant_la":"Salvásti nos, * Dómine, et in nómine tuo confitébimur in sǽcula.","ant_fr":"Vous nous avez sauvés, * Seigneur, et en votre nom, toujours nous louerons.","psaumes":["43","43","43"]}],"Complies":[{"ant_la":"Tu, Dómine, * servábis nos: et custódies nos in ætérnum.","ant_fr":"C’est vous, Seigneur, * qui nous sauverez et nous garderez pour l’éternité.","psaumes":["11","12","15"]}],"Laudes":[{"ant_la":"Cantáte * Dómino et benedícite nómini ejus.","ant_fr":"Chantez * au Seigneur, et bénissez Son Nom.","psaumes":["95"]},{"ant_la":"Salutáre vultus mei, * Deus meus.","ant_fr":"Le salut de mon visage * et mon Dieu.","psaumes":["42"]},{"ant_la":"Illúmina, Dómine, * vultum tuum super nos.","ant_fr":"Faites briller Seigneur * Votre visage sur nous.","psaumes":["66"]},{"ant_la":"Exaltáte * Regem sæculórum in opéribus vestris.","ant_fr":"Exaltez * le Roi des siècles par vos œuvres.","psaumes":["212"]},{"ant_la":"Laudáte * nomen Dómini, qui statis in domo Dómini.","ant_fr":"Louez * le Nom du Seigneur vous qui demeurez dans la maison du Seigneur.","psaumes":["134"]},{"ant_la":"Dele iniquitátem meam, * Dómine, secúndum multitúdinem miseratiónum tuárum.","ant_fr":"Effacez mon iniquité * ô Dieu selon la multitude de Vos bontés.","psaumes":["50"]},{"ant_la":"Discérne causam meam, * Deus, de gente non sancta.","ant_fr":"Séparez ma cause * ô Dieu de celle d’une nation qui n’est pas sainte.","psaumes":["42"]},{"ant_la":"Deus misereátur * nostri, et benedícat nobis.","ant_fr":"Que Dieu ait pitié * de nous, et nous bénisse.","psaumes":["66"]},{"ant_la":"Corrípies me, Dómine, * et vivificábis me.","ant_fr":"Vous me châtieriez, Seigneur, * et Vous me rendrez la vie.","psaumes":["222"]},{"ant_la":"Laudáte * Dóminum quia benígnus est, et in servis suis deprecábitur.","ant_fr":"Louez * le Seigneur car Il est bon et Il aura pitié de Ses serviteurs.","psaumes":["134"]},{"ant_la":"Roráte, cæli, désuper, * et nubes pluant justum: aperiátur terra, et gérminet Salvatórem.","ant_fr":"","psaumes":[]},{"ant_la":"Emítte Agnum, Dómine, * Dominatórem terræ, de Petra desérti, ad montem fíliæ Sion.","ant_fr":"","psaumes":[]},{"ant_la":"Ut cognoscámus, Dómine, * in terra viam tuam, in ómnibus géntibus salutáre tuum.","ant_fr":"","psaumes":[]},{"ant_la":"Da mercédem, Dómine, * sustinéntibus te, ut prophétæ tui fidéles inveniántur.","ant_fr":"","psaumes":[]},{"ant_la":"Lex per Móysen data est, * grátia et véritas per Jesum Christum facta est.","ant_fr":"","psaumes":[]}],"Vêpres":[{"ant_la":"Qui hábitas in cælis, * miserére nobis.","ant_fr":"Vous qui habitez dans les cieux, * ayez pitié de nous.","psaumes":["122"]},{"ant_la":"Adjutórium nostrum * in nómine Dómini.","ant_fr":"Notre secours * est dans le Nom du Seigneur.","psaumes":["123"]},{"ant_la":"In circúitu pópuli sui * Dóminus, ex hoc nunc et usque in sǽculum.","ant_fr":"Autour de Son peuple * est le Seigneur, dès maintenant et à jamais.","psaumes":["124"]},{"ant_la":"Magnificávit Dóminus * fácere nobíscum: facti sumus lætántes.","ant_fr":"Le Seigneur a fait de grandes choses * pour nous : nous en avons été remplis de joie.","psaumes":["125"]},{"ant_la":"Dóminus ædíficet * nobis domum, et custódiat civitátem.","ant_fr":"Que le Seigneur bâtisse * une maison pour nous et qu’Il garde la cité.","psaumes":["126"]}],"Matines":[{"ant_la":"Expúgna, Dómine, * impugnántes me.","ant_fr":"Combattez, Seigneur, * ceux qui me combattent.","psaumes":["34"]},{"ant_la":"Exsúrge, Dómine, * et inténde judício meo.","ant_fr":"Guérissez mon âme * des coups qu’ils m’ont portés, Seigneur.","psaumes":["34"]},{"ant_la":"Noli æmulári * in eo qui prosperátur et facit iniquitátem.","ant_fr":"Levez-vous, Seigneur, * et veillez à mon jugement.","psaumes":["36"]},{"ant_la":"Brácchia peccatórum * conteréntur, confírmat autem justos Dóminus.","ant_fr":"N’envie point * la postérité de celui qui co ns le Ciel.","psaumes":["35"]},{"ant_la":"Pópulus meus, * ait Dóminus, bonis meis adimplébitur.","ant_fr":"Mon peuple, * dit le Seigneur, sera rempli de Mes biens.","psaumes":["214"]},{"ant_la":"Deo nostro * jucúnda sit laudátio.","ant_fr":"À notre Dieu * agréable soit la louange.","psaumes":["146"]},{"ant_la":"Tibi soli peccávi, * Dómine, miserére mei.","ant_fr":"J’ai péché contre Vous seul, * Seigneur ; ayez pitié de moi.","psaumes":["50"]},{"ant_la":"Convértere, Dómine, * et deprecábilis esto super servos tuos.","ant_fr":"Revenez, Seigneur * laissez-Vous fléchir en faveur de Vos serviteurs.","psaumes":["89"]},{"ant_la":"Multiplicásti, Deus, * misericórdiam tuam.","ant_fr":"Vous avez multiplié ô Dieu, * Votre miséricorde !","psaumes":["35"]},{"ant_la":"Fortitúdo mea * et laus mea Dóminus: et factus est mihi in salútem.","ant_fr":"Ma force * et le sujet de mes louanges c’est le Seigneur, c’est Lui qui m’a sauvé.","psaumes":["224"]},{"ant_la":"Laudáte * Dóminum qui sanat contrítos corde, et álligat contritiónes eórum.","ant_fr":"Louez * le Seigneur, Il guérit ceux dont le cœur est brisé, et Il bande leurs plaies.","psaumes":["146"]},{"ant_la":"De Sion * véniet Dóminus omnípotens, ut salvum fáciat pópulum suum.","ant_fr":"","psaumes":[]},{"ant_la":"Convértere, Dómine, * aliquántulum, et ne tardes veníre ad servos tuos.","ant_fr":"","psaumes":[]},{"ant_la":"De Sion * véniet, qui regnatúrus est Dóminus, Emmánuel magnum nomen ejus.","ant_fr":"","psaumes":[]},{"ant_la":"Ecce Deus meus, * et honorábo eum: Deus patris mei, et exaltábo eum.","ant_fr":"","psaumes":[]},{"ant_la":"Dóminus * légifer noster, Dóminus Rex noster, ipse véniet, et salvábit nos.","ant_fr":"","psaumes":[]}],"Vêpres":[{"ant_la":"Ecce quam bonum * et quam jucúndum habitáre fratres in unum.","ant_fr":"Ah ! qu’il est bon et agréable * pour des frères d’habiter ensemble !","psaumes":["132"]},{"ant_la":"Confitémini Dómino * quóniam in ætérnum misericórdia ejus.","ant_fr":"Célébrez le Seigneur * car Sa miséricorde est éternelle.","psaumes":["135"]},{"ant_la":"Confitémini Dómino * quia in humilitáte nostra memor fuit nostri.","ant_fr":"Célébrez le Seigneur * car Il s’est souvenu de nous dans notre humiliation.","psaumes":["135"]},{"ant_la":"Adhǽreat lingua mea * fáucibus meis, si non memínero tui Jerúsalem.","ant_fr":"Que ma langue s’attache * à mon palais, si je ne me souviens point de toi, Jérusalem.","psaumes":["136"]},{"ant_la":"Confitébor * nómini tuo, Dómine, super misericórdia et veritáte tua.","ant_fr":"Je célébrerai * Votre Nom, Seigneur à cause de Votre miséricorde et de Votre vérité.","psaumes":["137"]}],"Matines":[{"ant_la":"In Deo salutáre meum * et glória mea: et spes mea in Deo est.","ant_fr":"En Dieu mon salut * et ma gloire : et mon espoir est en Dieu.","psaumes":["61"]},{"ant_la":"Audíte, omnes * qui timétis Deum, quanta fecit ánimæ meæ.","ant_fr":"Voyez les œuvres du Seigneur, * et faites entendre sa voix de louange.","psaumes":["65"]},{"ant_la":"Exsúrgat Deus, * et dissipéntur inimíci ejus.","ant_fr":"Écoutez tous * vous qui craignez Dieu, les grandes choses qu’il a faites à mon âme.","psaumes":["67"]},{"ant_la":"Deus noster, * Deus salvos faciéndi: et Dómini sunt éxitus mortis.","ant_fr":"Que Dieu se lève, * et que ses ennemis soient dispersés.","psaumes":["67"]},{"ant_la":"In ecclésiis * benedícite Dómino Deo.","ant_fr":"Notre Dieu, * est un Dieu qui sauve : et le Seigneur délivre de la mort.","psaumes":["67"]},{"ant_la":"Salvum me fac, * Deus, quóniam intravérunt aquæ usque ad ánimam meam.","ant_fr":"Dans les assemblées * bénissez le Seigneur Dieu.","psaumes":["68"]},{"ant_la":"Propter inimícos meos * éripe me, Dómine.","ant_fr":"Sauvez-moi, * ô Dieu, car les eaux sont entrées jusqu’à mon âme.","psaumes":["68"]},{"ant_la":"Quǽrite Dóminum, * et vivet ánima vestra.","ant_fr":"À cause de mes ennemis, * délivrez-moi, Seigneur.","psaumes":["68"]}]},"6":{"Prime":[{"ant_la":"Ne discédas a me, * Dómine: quóniam tribulátio próxima est: quóniam non est qui ,"psaumes":["144"]}],"Matines":[{"ant_la":"Memor fuit in sǽculum * testaménti sui Dóminus Deus noster.","ant_fr":"Il s’est toujours souvenu * de son alliance, le Seigneur notre Dieu.","psaumes":["104"]},{"ant_la":"Auxit Dóminus * pópulum suum: et firmávit eum super inimícos ejus.","ant_fr":"Le Seigneur fit croître * son peuple : et le rendit plus fort que ses ennemis.","psaumes":["104"]},{"ant_la":"Edúxit Deus * pópulum suum in exsultatióne, et eléctos suos in lætítia.","ant_fr":"Dieu fit sortir * son peuple dans l’exultation, et les élus dans la joie.","psaumes":["104"]},{"ant_la":"Salvávit eos Dóminus * propter nomen suum.","ant_fr":"Le Seigneur les a sauvés * à cause de son nom.","psaumes":["105"]},{"ant_la":"Oblíti sunt Deum * qui salvávit eos.","ant_fr":"Ils ont oublié Dieu * qui les a sauvés.","psaumes":["105"]},{"ant_la":"Cum tribularéntur * vidit Dóminus: et audívit oratiónem eórum.","ant_fr":"Quand ils étaient dans l’épreuve * le Seigneur le vit : et il exauça leur prière.","psaumes":["105"]},{"ant_la":"Clamavérunt ad Dóminum * et de necessitátibus eórum liberávit eos.","ant_fr":"Ils ont crié vers le Seigneur * et il les a délivrés de leurs angoisses.","psaumes":["106"]},{"ant_la":"Ipsi vidérunt * ópera Dei et mirabília ejus.","ant_fr":"Ils ont vu de leurs yeux * les œuvres de Dieu et ses merveilles.","psaumes":["106"]},{"ant_la":"Clamor meus * ad te véniat, Deus","ant_fr":"Les hommes droits verront * et se réjouiront, et ils comprendront les miséricordes du Seigneur.","psaumes":["101","102"]},{"ant_la":"Bénedic, * ánima mea Dómino","ant_fr":"","psaumes":["103","103"]},{"ant_la":"Lætétur cor * quæréntium Dóminum","ant_fr":"","psaumes":["104","104"]},{"ant_la":"","ant_fr":"","psaumes":["105"]},{"ant_la":"De necessitátibus meis * éripe me, Dómine","ant_fr":"","psaumes":["106","106"]},{"ant_la":"Confitébor * Dómino nimis in ore meo","ant_fr":"","psaumes":["107","108"]}]}};

// ── État ──────────────────────────────────────────────────
let _offset = 0;
let _heure = 'Matines';
let _lang = 'la';
let _searchTimer = null;
let _cache = {};  // {cacheKey: [{section, text_la, text_fr}, ...]}

function dateNav() {
    const d = new Date();
    d.setDate(d.getDate() + _offset);
    d.setHours(0,0,0,0);
    return d;
}

// ── Trouver le fichier bréviaire pour une date ────────────
let _currentSections = [];

// ── Enrichir une section d'antiennes avec les psaumes complets ──
function enrichirAvecPsaumes(sectionAnt, allSections) {
    const blocs = [];
    const lignes = sectionAnt.text_la.split('\n');
    const lignesFr = (sectionAnt.text_fr || '').split('\n');

    lignes.forEach((ligne, i) => {
        if (!ligne.trim() || !ligne.includes(';;')) return;

        const parts = ligne.split(';;');
        const antLA = parts[0].trim();
        const num   = parts[1].split('(')[0].split(';')[0].trim();

        // Antienne FR correspondante
        const antFR = (lignesFr[i] || '').split(';;')[0].trim();

        // Chercher le psaume complet
        const psSection = allSections.find(s => s.section === `Psalm${num}`);

        // Bloc antienne
        blocs.push({
            dossier: 'Psalterium',
            fichier: sectionAnt.fichier,
            section: `${sectionAnt.section}_ant${num}`,
            _label: `Antienne · Ps ${num}`,
            _type: 'antienne',
            text_la: antLA,
            text_fr: antFR,
        });

        // Bloc psaume complet
        if (psSection) {
            blocs.push({
                ...psSection,
                section: `${sectionAnt.section}_ps${num}`,
                _label: `Psaume ${num}`,
                _type: 'psaume',
            });
        }
    });

    return blocs.length ? blocs : [sectionAnt];
}


function afficherHeure() {
    const sections = _currentSections;
    const d = dateNav();
    const doDay = d.getDay() + 1; // 1=dim...7=sam (convention DO)
    const content = document.getElementById('brev-content');

    // Blocs psalmodiques depuis la table pré-calculée
    const psBlocs = (PSALMODIE[String(doDay)] || {})[_heure] || [];

    // Sections propres par heure (hymne, lectures, capitule, oraison...)
    const doD = doDay;
    const PROPRES = {
        'Matines':  ['Day'+doD+' Hymnus','HymnusM Matutinum','Hymnus Matutinum',
                     'Lectio1','Lectio2','Lectio3','Lectio4','Lectio5','Lectio6',
                     'Lectio7','Lectio8','Lectio9',
                     'Responsory1','Responsory2','Responsory3',
                     'Responsory4','Responsory5','Responsory6',
                     'Responsory7','Responsory8','Responsory9',
                     'Oratio'],
        'Laudes':   ['Hymnus Day'+doD+' Laudes','HymnusM Day'+doD+' Laudes',
                     'Hymnus Laudes','HymnusM Laudes',
                     'Capitulum Laudes','Versum Laudes',
                     'Ant Benedictus','Benedictus','Oratio'],
        'Prime':    ['Hymnus Prima','HymnusM Prima','Capitulum Prima','Oratio'],
        'Tierce':   ['Hymnus Tertia','HymnusM Tertia','Capitulum Tertia',
                     'Responsory Breve Tertia','Oratio'],
        'Sexte':    ['Hymnus Sexta','HymnusM Sexta','Capitulum Sexta',
                     'Responsory Breve Sexta','Oratio'],
        'None':     ['Hymnus Nona','HymnusM Nona','Capitulum Nona',
                     'Responsory Breve Nona','Oratio'],
        'Vêpres':   ['Hymnus Day'+doD+' Vespera','HymnusM Day'+doD+' Vespera',
                     'Hymnus Vespera','HymnusM Vespera',
                     'Capitulum Vespera','Versum Vespera',
                     'Ant Magnificat','Magnificat','Oratio'],
        'Complies': ['Hymnus Completorium','HymnusM Completorium',
                     'Capitulum Completorium','Oratio'],
    };
    const propresVoulus = PROPRES[_heure] || [];
    const disponibles = [];
    const seenSec = new Set();

    // ── 1. Hymne ──────────────────────────────────────────
    for (const sName of propresVoulus.slice(0,3)) {
        const found = sections.find(s => s.section === sName);
        if (found && !seenSec.has(found.section)) {
            disponibles.push(found); seenSec.add(found.section); break;
        }
    }

    // ── 2. Blocs psalmodiques (antienne + psaume complet) ─
    const psVus = new Set();
    for (const bloc of psBlocs) {
        if (!bloc) continue;
        const psNums = [...new Set(bloc.psaumes)];
        const labelAnt = psNums.length ? 'Antienne — Ps ' + psNums.join(', ') : 'Antienne';

        // Antienne
        if (bloc.ant_la && bloc.ant_la.trim()) {
            disponibles.push({
                dossier:'Psalterium', fichier:'psalmodie',
                section:'_ant_' + psNums.join('_') + '_' + disponibles.length,
                _label: labelAnt, _type:'antienne',
                text_la: bloc.ant_la, text_fr: bloc.ant_fr || '',
            });
        }

        // Psaume(s) complet(s)
        for (const num of psNums) {
            if (psVus.has(num)) continue;
            psVus.add(num);
            const ps = sections.find(s => s.section === 'Psalm' + num);
            if (ps) {
                disponibles.push({...ps,
                    section: '_ps_' + num + '_' + disponibles.length,
                    _label: 'Psaume ' + num, _type:'psaume'});
            }
        }
    }

    // ── 3. Reste des sections propres ─────────────────────
    for (const sName of propresVoulus.slice(3)) {
        const found = sections.find(s =>
            s.section === sName || s.section.startsWith(sName + ' '));
        if (found && !seenSec.has(found.section)) {
            disponibles.push(found); seenSec.add(found.section);
        }
    }

    if (!disponibles.length) {
        content.innerHTML = `<div class="brev-empty">
            <div style="color:var(--gold);font-size:1.4rem;opacity:.35;margin-bottom:12px;">✦</div>
            Aucune section disponible pour les ${_heure}<br>
            <span style="font-size:.85rem;color:var(--ink-muted);">${_heure} — ${dateNav().toLocaleDateString('fr-FR')}</span>
        </div>`;
        return;
    }

    content.innerHTML = disponibles.map((s, idx) => buildSection(s, idx)).join('');
}

function escH(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Nettoyage et formatage du texte DivinumOfficium ──────
function nettoyer(raw) {
    if (!raw) return '';
    // Supprimer le tag de style {:H-xxx:}
    raw = raw.replace(/\{:H-[^:]+:\}/g, '');
    // Supprimer les lignes de directives/rubricales
    const lines = raw.split('\n').filter(l => {
        const t = l.trim();
        if (!t) return true;
        if (t.startsWith('@') || t.startsWith('$') || t.startsWith('_') || t.startsWith('~')) return false;
        if (t.startsWith('(sed ') || t.startsWith('(rubrica') || t.startsWith('(mon')) return false;
        return true;
    });
    return lines.join('\n').trim();
}

// Déterminer si une section est un groupe de psaumes (format antienne;;numéro)
function estGroupePsaumes(texte) {
    return texte && texte.includes(';;') && !texte.includes('\n\n');
}

// Formater un groupe de psaumes (antiennes + numéros)
function formaterPsaumes(texte) {
    if (!texte) return '';
    let html = '';
    const lignes = texte.split('\n');
    for (const ligne of lignes) {
        if (!ligne.trim()) continue;
        if (ligne.includes(';;')) {
            const [ant, num] = ligne.split(';;');
            const antClean = ant.trim();
            const numClean = num.trim();
            // Afficher : numéro de psaume en or + antienne
            html += `<div class="brev-psaume-ligne">
                <span class="brev-ps-num">Ps ${escH(numClean)}</span>
                <span class="brev-ps-ant">${escH(antClean)}</span>
            </div>`;
        } else {
            html += `<div class="brev-psaume-ligne"><span class="brev-ps-ant">${escH(ligne.trim())}</span></div>`;
        }
    }
    return html;
}

function formaterTexte(raw) {
    if (!raw) return '';
    raw = nettoyer(raw);
    if (!raw) return '';

    // Psaumes (format antienne;;numéro)
    if (estGroupePsaumes(raw)) return formaterPsaumes(raw);

    let html = '';
    const lignes = raw.split('\n');
    for (const ligne of lignes) {
        const t = ligne.trim();
        if (!t) { html += '<br>'; continue; }

        // Référence biblique !Livre X:Y
        if (t.startsWith('!')) {
            html += `<span class="brev-ref">📖 ${escH(t.slice(1).trim())}</span>`;
            continue;
        }

        // Répons R. / Verset V. / R.br.
        if (t.match(/^R\.br\.|^R\.|^V\.|^℟|^℣/)) {
            html += `<span class="brev-resp">${escH(t)}</span>`;
            continue;
        }

        // Numéro de verset au début (ex: "1 Ecce factum est")
        const mVerset = t.match(/^(\d+)\s+(.+)/);
        if (mVerset) {
            html += `<span class="brev-verset"><sup class="vnum">${mVerset[1]}</sup>${escH(mVerset[2])}</span>\n`;
            continue;
        }

        // Ligne d'hymne commençant par v. (verset)
        if (t.startsWith('v. ')) {
            html += `<span class="brev-hymne-v">${escH(t.slice(3))}</span>`;
            continue;
        }

        // Ligne normale
        html += escH(t) + '\n';
    }
    return html.replace(/(<br>\s*){3,}/g, '<br><br>').trim();
}

// ── Formatage psaume complet (versets N:V texte) ──────────
function formaterPsaume(raw) {
    if (!raw) return '';
    let html = '';
    for (const ligne of raw.split('\n')) {
        const t = ligne.trim();
        if (!t) continue;
        // Format : "1:1 Beátus vir..." ou "1:3a Et erit..."
        const m = t.match(/^(\d+:\w+)\s+(.+)/);
        if (m) {
            const versetNum = m[1].split(':')[1]; // "1", "3a"...
            const texte = m[2];
            html += `<span class="brev-ps-verset"><sup class="vnum">${escH(versetNum)}</sup>${escH(texte)}</span>\n`;
        } else {
            // Suite d'un verset (ligne sans numéro)
            html += escH(t) + '\n';
        }
    }
    return html.trim();
}

function getSectionLabel(section) {
    if (SECTION_LABELS[section]) return SECTION_LABELS[section];
    if (section.startsWith('Day')) return 'Psaumes — ' + section.replace(/Day\d+ /,'');
    if (section.startsWith('Psalm')) return 'Psaume ' + section.replace('Psalm','');
    return section;
}

function buildSection(s, idx) {
    const label = s._label || getSectionLabel(s.section);
    const type  = s._type || 'normal';
    const noFr  = !s.text_fr || !s.text_fr.trim();
    const delay = `animation-delay:${idx*40}ms`;

    // ── Antienne ──────────────────────────────────────────
    if (type === 'antienne') {
        const aLA = escH(s.text_la || '');
        const aFR = s.text_fr ? escH(s.text_fr) : null;
        let inner = '';
        if (_lang === 'la' || _lang === 'bi')
            inner += `<span class="brev-ant-text latin">Ant. ${aLA}</span>`;
        if (_lang === 'fr' || _lang === 'bi')
            inner += aFR
                ? `<span class="brev-ant-text francais">Ant. ${aFR}</span>`
                : (_lang==='fr' ? `<span class="brev-ant-text latin muted">Ant. ${aLA}</span>` : '');
        return `<div class="brev-antienne" style="${delay}">
            <span class="brev-ant-label">${escH(label)}</span>${inner}</div>`;
    }

    // ── Psaume complet ────────────────────────────────────
    if (type === 'psaume') {
        const laH = formaterPsaume(s.text_la);
        const frH = s.text_fr ? formaterPsaume(s.text_fr) : null;
        let textHtml = '';
        if (_lang === 'la') {
            textHtml = `<div class="brev-psalm-text latin">${laH}</div>`;
        } else if (_lang === 'fr') {
            textHtml = frH
                ? `<div class="brev-psalm-text francais">${frH}</div>`
                : `<div class="brev-psalm-text latin muted">${laH}</div>`;
        } else {
            textHtml = `<div class="brev-bilingue">
                <div class="brev-bilingue-col-la"><span class="brev-bilingue-label">Latin</span>
                    <div class="brev-psalm-text latin">${laH}</div></div>
                <div class="brev-bilingue-col-fr"><span class="brev-bilingue-label">Français</span>
                    <div class="brev-psalm-text francais">${frH||'<em class="no-fr-txt">Traduction non disponible</em>'}</div></div>
            </div>`;
        }
        return `<div class="brev-section psaume-section" style="${delay}">
            <div class="brev-section-title">${escH(label)}</div>${textHtml}</div>`;
    }

    // ── Section liturgique normale ─────────────────────────
    const la = formaterTexte(s.text_la);
    const fr = formaterTexte(s.text_fr);
    const isMajeur = ['Lectio1','Lectio2','Lectio3','Lectio4','Lectio5','Lectio6',
        'Lectio7','Lectio8','Lectio9','Benedictus','Magnificat','Oratio'].includes(s.section);
    const cls = 'brev-text';

    let textHtml = '';
    if (_lang === 'la') {
        textHtml = `<div class="${cls} latin">${la}</div>`;
    } else if (_lang === 'fr') {
        textHtml = noFr ? `<div class="${cls} latin muted">${la}</div>`
                        : `<div class="${cls} francais">${fr}</div>`;
    } else {
        textHtml = `<div class="brev-bilingue">
            <div class="brev-bilingue-col-la"><span class="brev-bilingue-label">Latin</span>
                <div class="${cls} latin">${la}</div></div>
            <div class="brev-bilingue-col-fr"><span class="brev-bilingue-label">Français</span>
                <div class="${cls} francais">${noFr?'<em class="no-fr-txt">Traduction non disponible</em>':fr}</div></div>
        </div>`;
    }

    return `<div class="brev-section" style="${delay}">
        <div class="brev-section-title${isMajeur?' majeur':''}" style="${delay}">
            ${escH(label)}${noFr&&_lang!=='la'?'<span class="no-fr">lat.</span>':''}
        </div>${textHtml}</div>`;
}

// ── Recherche ─────────────────────────────────────────────
function ouvrirRecherche() {
    document.getElementById('brev-modal-bg').classList.add('open');
    setTimeout(() => document.getElementById('brev-search-input').focus(), 100);
}
function fermerRecherche() {
    document.getElementById('brev-modal-bg').classList.remove('open');
}
function debounceSearch() {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(lancerRecherche, 350);
}

async function lancerRecherche() {
    if (typeof maConnexion === 'undefined') return;
    const q = document.getElementById('brev-search-input').value.trim();
    const results = document.getElementById('brev-search-results');
    if (q.length < 2) {
        results.innerHTML = '<div class="brev-empty">Entrez au moins 2 caractères</div>';
        return;
    }
    results.innerHTML = '<div class="brev-empty">Recherche…</div>';

    const lang = _lang === 'fr' ? 'text_fr' : 'text_la';
    const { data } = await maConnexion.from('breviaire')
        .select('dossier,fichier,section,text_la,text_fr')
        .ilike(lang, `%${q}%`)
        .not('section','in','("Rank","Rule","Name","Officium")')
        .limit(60);

    if (!data || !data.length) {
        results.innerHTML = '<div class="brev-empty">Aucun résultat.</div>';
        return;
    }

    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const hi = (t, q) => t ? t.replace(new RegExp(esc(q),'gi'), m => `<mark>${m}</mark>`) : '';
    const txt = s => _lang === 'fr' ? (s.text_fr || s.text_la) : s.text_la;

    results.innerHTML =
        `<div class="brev-modal-count">${data.length} résultat${data.length>1?'s':''}</div>` +
        data.map(s => {
            const label = SECTION_LABELS[s.section] || s.section;
            const preview = (txt(s)||'').replace(/^[!@$].+\n?/gm,'').trim().substring(0,120);
            return `<div class="brev-result" onclick="allerVersSection('${s.dossier}','${s.fichier}','${s.section}')">
                <span class="brev-result-ref">${escH(s.dossier)} · ${escH(s.fichier)} · ${escH(label)}</span>
                <span class="brev-result-text">${hi(escH(preview), escH(q))}…</span>
            </div>`;
        }).join('');
}

async function allerVersSection(dossier, fichier, section) {
    fermerRecherche();
    // Charger ce fichier directement
    const { data } = await maConnexion.from('breviaire')
        .select('dossier,fichier,section,text_la,text_fr')
        .eq('dossier', dossier)
        .eq('fichier', fichier)
        .not('section','in','("Rank","Rule","Name","Officium","Comment")');
    if (!data) return;
    _currentSections = data;
    // Trouver quelle heure correspond à cette section
    for (const [heure, secs] of Object.entries(HEURE_SECTIONS)) {
        if (secs.some(s => section.startsWith(s) || section === s)) {
            document.querySelectorAll('.heure-tab').forEach(b => {
                b.classList.toggle('active', b.dataset.heure === heure);
            });
            _heure = heure;
            break;
        }
    }
    afficherHeure();
    // Scroller vers la section
    setTimeout(() => {
        const label = SECTION_LABELS[section] || section;
        const titles = [...document.querySelectorAll('.brev-section-title')];
        const el = titles.find(t => t.textContent.includes(label.substring(0,10)));
        if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
}

// ── Raccourcis clavier ────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === '/' && !e.target.matches('input,textarea')) {
        e.preventDefault(); ouvrirRecherche();
    }
    if (e.key === 'Escape') fermerRecherche();
});

// ── Démarrage ─────────────────────────────────────────────
function init() {
    if (typeof maConnexion === 'undefined') { setTimeout(init, 200); return; }
    chargerOffice();
}
init();
</script>
