<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gérer — Annonces</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1108">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* ════════════════════════════════════════════════════════
       ANNONCES — Styles spécifiques
    ════════════════════════════════════════════════════════ */

    /* ── Header admin ─────────────────────────────────────── */
    .admin-header {
        background: #1a1108;
        padding: calc(env(safe-area-inset-top,0px) + 16px) 0 0;
        position: relative; overflow: hidden;
    }
    .admin-header-cross {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%,-50%);
        opacity: .05; pointer-events: none;
        width: 180px; height: 220px;
    }
    .admin-header-body {
        position: relative; z-index: 2;
        padding: 0 18px 0;
        display: flex; align-items: center; gap: 12px;
    }
    .admin-header-title { flex: 1; }
    .admin-header-paroisse {
        font-family: 'Cinzel', serif; font-size: .46rem;
        letter-spacing: .28em; text-transform: uppercase;
        color: rgba(184,150,42,.5); display: block; margin-bottom: 4px;
    }
    .admin-header-name {
        font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700;
        color: #f0e8d5; letter-spacing: .04em; line-height: 1.2;
    }
    .admin-header-sub {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .85rem; color: rgba(240,232,213,.5);
        display: block; margin-top: 3px;
    }
    .admin-stat-pill {
        display: flex; flex-direction: column; align-items: center;
        background: rgba(184,150,42,.12); border: 1px solid rgba(184,150,42,.25);
        border-radius: 4px; padding: 8px 14px; flex-shrink: 0;
    }
    .admin-stat-num {
        font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 700;
        color: #c9a840; line-height: 1;
    }
    .admin-stat-label {
        font-family: 'Cinzel', serif; font-size: .42rem;
        letter-spacing: .14em; text-transform: uppercase;
        color: rgba(184,150,42,.6); margin-top: 3px; white-space: nowrap;
    }
    .admin-header-bar {
        height: 3px; margin-top: 12px;
        background: linear-gradient(to right, transparent, rgba(184,150,42,.4), transparent);
    }

    /* ── Barre actions sticky ─────────────────────────────── */
    .actions-sticky {
        position: sticky; top: 0; z-index: 50;
        background: var(--vellum); border-bottom: 1px solid var(--border-soft);
        padding: 10px 16px; display: flex; gap: 8px; align-items: center;
        box-shadow: 0 2px 12px var(--shadow);
    }
    .btn-new-annonce {
        display: flex; align-items: center; gap: 7px;
        padding: 9px 16px;
        background: var(--rubric); color: #f0e8d5;
        border: none; border-radius: 3px; cursor: pointer;
        font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .12em; text-transform: uppercase;
        transition: background .2s; flex-shrink: 0;
    }
    .btn-new-annonce:hover { background: #6b1414; }
    .sync-btn {
        padding: 9px 12px; border: 1px solid var(--border-soft);
        border-radius: 3px; background: var(--vellum-light);
        color: var(--ink-muted); cursor: pointer;
        display: flex; align-items: center; gap: 5px;
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .08em; text-transform: uppercase;
        transition: all .15s; flex-shrink: 0;
    }
    .sync-btn:active { border-color: var(--gold); color: var(--gold); }
    .sync-btn.spinning span { display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .filtre-wrap { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .filtre-chip {
        padding: 6px 12px; border-radius: 20px;
        border: 1px solid var(--border-soft);
        background: var(--vellum-light); color: var(--ink-muted);
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .1em; text-transform: uppercase;
        cursor: pointer; white-space: nowrap; transition: all .15s;
        flex-shrink: 0;
    }
    .filtre-chip.actif { background: var(--gold-pale); border-color: var(--gold); color: var(--ink); }

    /* ── Sections prioritaire / normal ───────────────────── */
    .section-label {
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--ink-muted); padding: 14px 16px 6px;
        display: flex; align-items: center; gap: 10px;
    }
    .section-label::after {
        content: ''; flex: 1; height: 1px; background: var(--border-soft);
    }
    .section-label.prioritaire { color: var(--rubric); }

    /* ── Carte annonce ────────────────────────────────────── */
    .annonce-card {
        margin: 0 12px 10px;
        border: 1px solid var(--border-soft);
        border-radius: 4px;
        background: var(--vellum-light);
        overflow: hidden;
        animation: fadeInUp .25s ease both;
        transition: opacity .2s;
    }
    .annonce-card.inactif { opacity: .45; }
    .annonce-card.prioritaire-card {
        border-color: rgba(139,26,26,.35);
        background: rgba(139,26,26,.03);
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    .annonce-card-head {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 12px 14px 10px;
    }
    .annonce-card-prio {
        font-size: 1rem; flex-shrink: 0; margin-top: 1px;
        line-height: 1;
    }
    .annonce-card-body { flex: 1; min-width: 0; }
    .annonce-card-titre {
        font-family: 'Cinzel', serif; font-size: .82rem;
        font-weight: 600; color: var(--ink); letter-spacing: .02em;
        line-height: 1.3; margin-bottom: 4px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .annonce-card.prioritaire-card .annonce-card-titre { color: var(--rubric); }
    .annonce-card-desc {
        font-family: 'EB Garamond', serif; font-size: .9rem;
        color: var(--ink-soft); font-style: italic;
        line-height: 1.4; display: -webkit-box;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        margin-bottom: 5px;
    }
    .annonce-card-meta {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .annonce-chip {
        font-family: 'Cinzel', serif; font-size: .44rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 2px 7px; border-radius: 2px;
        border: 1px solid var(--border-soft); color: var(--ink-muted);
    }
    .annonce-chip.date { border-color: rgba(184,150,42,.3); color: var(--gold); }
    .annonce-chip.lien { border-color: rgba(58,102,68,.3); color: var(--green); }
    .annonce-chip.image { border-color: rgba(80,80,180,.3); color: #6060c0; }
    .annonce-chip.newsletter { border-color: rgba(30,100,160,.3); color: #3a7ab8; }
    .annonce-chip.feuille { border-color: rgba(100,70,20,.3); color: #8a6020; }
    .annonce-chip.inactif-badge { border-color: rgba(139,26,26,.25); color: var(--rubric); }

    /* Miniature image */
    .annonce-card-img {
        width: 60px; height: 60px; object-fit: cover;
        border-radius: 3px; flex-shrink: 0;
        border: 1px solid var(--border-soft);
    }

    /* ── Pied de carte — actions ──────────────────────────── */
    .annonce-card-foot {
        display: flex; border-top: 1px solid var(--border-soft);
    }
    /* Handle drag-and-drop */
    .annonce-drag-handle {
        display: flex; align-items: center; justify-content: center;
        width: 36px; flex-shrink: 0;
        cursor: grab; touch-action: none;
        color: var(--ink-muted); font-size: 1rem;
        border-right: 1px solid var(--border-soft);
        transition: color .15s, background .15s;
        user-select: none;
    }
    .annonce-drag-handle:active { cursor: grabbing; }
    .annonce-drag-handle:hover { color: var(--gold); background: rgba(0,0,0,.03); }
    .annonce-card.dragging {
        opacity: .4; background: rgba(184,150,42,.06);
    }
    .annonce-card.drag-over {
        border-top: 2px solid var(--gold);
    }
    .annonce-action {
        flex: 1; padding: 9px 6px;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        cursor: pointer; border: none; background: none;
        font-family: 'Cinzel', serif; font-size: .42rem;
        letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted);
        transition: background .15s; border-right: 1px solid var(--border-soft);
    }
    .annonce-action:last-child { border-right: none; }
    .annonce-action:hover { background: rgba(0,0,0,.03); }
    .annonce-action .ico { font-size: .95rem; }
    .annonce-action.danger:hover { background: rgba(139,26,26,.05); color: var(--rubric); }
    .annonce-action.prio-on { color: var(--rubric); }
    .annonce-action.actif-on { color: var(--green); }

    /* ── Vide ─────────────────────────────────────────────── */
    .vide-msg {
        text-align: center; padding: 48px 20px;
        font-family: 'EB Garamond', serif; font-style: italic;
        color: var(--ink-muted); font-size: .95rem;
    }
    .vide-msg .vide-ico { font-size: 2rem; display: block; margin-bottom: 10px; opacity: .4; }

    /* ── Modal ────────────────────────────────────────────── */
    .modal-overlay {
        position: fixed; inset: 0; z-index: 200;
        background: rgba(10,8,4,.7); backdrop-filter: blur(3px);
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: auto; }
    .modal-sheet {
        background: var(--vellum); width: 100%; max-width: 560px;
        border-radius: 12px 12px 0 0;
        max-height: 92vh; display: flex; flex-direction: column;
        transform: translateY(30px); transition: transform .25s cubic-bezier(.2,.8,.3,1);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .modal-overlay.visible .modal-sheet { transform: translateY(0); }
    .modal-handle {
        width: 36px; height: 4px; border-radius: 2px;
        background: var(--border); margin: 10px auto 0;
    }
    .modal-head {
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--border-soft);
        display: flex; align-items: center; gap: 10px;
    }
    .modal-title {
        font-family: 'Cinzel', serif; font-size: .9rem;
        font-weight: 600; color: var(--ink); flex: 1;
    }
    .modal-close {
        width: 32px; height: 32px; border-radius: 50%;
        border: 1px solid var(--border-soft); background: none;
        cursor: pointer; font-size: 1rem; color: var(--ink-muted);
        display: flex; align-items: center; justify-content: center;
        transition: all .15s;
    }
    .modal-close:hover { border-color: var(--rubric); color: var(--rubric); }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    .modal-foot {
        padding: 12px 18px; border-top: 1px solid var(--border-soft);
        display: flex; gap: 8px;
    }

    /* ── Champs formulaire modal ──────────────────────────── */
    .form-field { margin-bottom: 16px; }
    .form-label {
        display: block; font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .18em; text-transform: uppercase;
        color: var(--rubric); margin-bottom: 6px;
    }
    .form-label .opt {
        font-family: 'EB Garamond', serif; font-style: italic;
        text-transform: none; letter-spacing: 0; font-size: .75rem;
        color: var(--ink-muted);
    }
    .form-input, .form-textarea {
        width: 100%; padding: 10px 13px;
        background: var(--vellum-light); border: 1px solid var(--border);
        border-radius: 3px; font-family: 'EB Garamond', serif;
        font-size: 1rem; color: var(--ink); outline: none;
        transition: border-color .2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-toggle {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 13px; border: 1px solid var(--border);
        border-radius: 3px; background: var(--vellum-light);
        cursor: pointer; user-select: none; transition: all .15s;
    }
    .form-toggle.on { border-color: var(--gold); background: var(--gold-pale); }
    .form-toggle.prio-on { border-color: rgba(139,26,26,.4); background: rgba(139,26,26,.05); }
    .form-toggle-box {
        width: 20px; height: 20px; border-radius: 3px;
        border: 2px solid var(--border); background: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: .85rem; transition: all .15s; flex-shrink: 0;
    }
    .form-toggle.on .form-toggle-box,
    .form-toggle.prio-on .form-toggle-box {
        border-color: var(--gold); background: var(--gold); color: #fff;
    }
    .form-toggle-label {
        font-family: 'EB Garamond', serif; font-size: .9rem; color: var(--ink-soft);
    }

    /* Boutons modal */
    .btn-sauver {
        flex: 1; padding: 12px; background: var(--rubric); color: #f0e8d5;
        border: none; border-radius: 3px; cursor: pointer;
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .12em; text-transform: uppercase;
        transition: background .2s; display: flex; align-items: center;
        justify-content: center; gap: 8px;
    }
    .btn-sauver:hover { background: #6b1414; }
    .btn-sauver:disabled { opacity: .5; cursor: not-allowed; }
    .btn-annuler {
        padding: 12px 16px; border: 1px solid var(--border-soft);
        border-radius: 3px; background: none; color: var(--ink-muted);
        cursor: pointer; font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .1em; text-transform: uppercase;
        transition: all .15s;
    }
    .btn-annuler:hover { border-color: var(--gold); color: var(--gold); }

    /* Bouton upload image */
    .btn-upload-img {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 9px 14px; border: 1px solid var(--border);
        border-radius: 3px; background: var(--vellum-light);
        color: var(--ink-muted); cursor: pointer; white-space: nowrap;
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .1em; text-transform: uppercase;
        transition: all .15s; flex-shrink: 0;
    }
    .btn-upload-img:hover { border-color: var(--gold); color: var(--gold); }
    .btn-upload-img.loading { opacity: .6; pointer-events: none; }

    /* Preview image URL */
    .img-preview {
        margin-top: 8px; border-radius: 4px; overflow: hidden;
        display: none; max-height: 120px;
    }
    .img-preview img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .img-preview.visible { display: block; }

    /* Toast */
    #toast {
        position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
        left: 50%; transform: translateX(-50%) translateY(20px);
        background: #1a1108; color: #f0e8d5;
        font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .12em; text-transform: uppercase;
        padding: 10px 20px; border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,.35);
        opacity: 0; transition: opacity .2s, transform .2s;
        pointer-events: none; z-index: 300; white-space: nowrap;
    }
    #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Modal confirmation suppression */
    .confirm-overlay {
        position: fixed; inset: 0; z-index: 300;
        background: rgba(10,8,4,.8); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .2s; padding: 20px;
    }
    .confirm-overlay.visible { opacity: 1; pointer-events: auto; }
    .confirm-box {
        background: var(--vellum); border-radius: 6px; padding: 24px 20px;
        max-width: 320px; width: 100%; text-align: center;
        transform: scale(.95); transition: transform .2s;
    }
    .confirm-overlay.visible .confirm-box { transform: scale(1); }
    .confirm-ico { font-size: 2rem; display: block; margin-bottom: 12px; }
    .confirm-title {
        font-family: 'Cinzel', serif; font-size: .9rem; font-weight: 600;
        color: var(--rubric); margin-bottom: 8px;
    }
    .confirm-text {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .9rem; color: var(--ink-muted); margin-bottom: 20px;
        line-height: 1.5;
    }
    .confirm-btns { display: flex; gap: 8px; }
    .confirm-btn-oui {
        flex: 1; padding: 10px; background: var(--rubric); color: #f0e8d5;
        border: none; border-radius: 3px; cursor: pointer;
        font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .1em; text-transform: uppercase;
    }
    .confirm-btn-non {
        flex: 1; padding: 10px; border: 1px solid var(--border);
        border-radius: 3px; background: none; color: var(--ink-muted);
        cursor: pointer; font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .1em; text-transform: uppercase;
    }

    /* Nav tabs header */
    .admin-tabs {
        display: flex; padding: 12px 18px 0; gap: 6px; position: relative; z-index: 2;
    }
    .admin-tab {
        font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .12em; text-transform: uppercase;
        padding: 7px 14px; border: none; cursor: pointer;
        border-radius: 3px 3px 0 0; transition: all .2s;
        color: rgba(240,230,184,.45); background: rgba(255,255,255,.04);
        border-bottom: 2px solid transparent; text-decoration: none; display: block;
    }
    .admin-tab.actif { color: #c9a840; background: rgba(184,150,42,.1); border-bottom-color: #c9a840; }
    </style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════ -->
<div class="admin-header">
    <svg class="admin-header-cross" viewBox="0 0 100 120" fill="none">
        <rect x="38" y="0" width="24" height="120" rx="3" fill="white"/>
        <rect x="0" y="36" width="100" height="24" rx="3" fill="white"/>
    </svg>
    <div class="admin-header-body">
        <div class="admin-header-title">
            <span class="admin-header-paroisse">La Croix Glorieuse · Strasbourg</span>
            <span class="admin-header-name">Annonces</span>
            <span class="admin-header-sub">Paroissiales</span>
        </div>
        <div class="admin-stat-pill">
            <span class="admin-stat-num" id="stat-count">—</span>
            <span class="admin-stat-label">actives</span>
        </div>
    </div>
    <div class="admin-header-bar"></div>
</div>

<!-- ══ BARRE ACTIONS ════════════════════════════════════════ -->
<div class="actions-sticky">
    <button class="btn-new-annonce" onclick="ouvrirModal()">
        <span>✦</span> Nouvelle
    </button>
    <div class="filtre-wrap">
        <div class="filtre-chip actif" data-filtre="toutes" onclick="setFiltre('toutes',this)">Toutes</div>
        <div class="filtre-chip" data-filtre="actives" onclick="setFiltre('actives',this)">Actives</div>
        <div class="filtre-chip" data-filtre="prioritaires" onclick="setFiltre('prioritaires',this)">⚑ Prioritaires</div>
        <div class="filtre-chip" data-filtre="inactives" onclick="setFiltre('inactives',this)">Inactives</div>
    </div>
    <button class="sync-btn" id="btn-sync" onclick="charger()">
        <span>↻</span>
    </button>
</div>

<!-- ══ LISTE ════════════════════════════════════════════════ -->
<div id="liste-container" style="padding: 8px 0 80px;">
    <div class="vide-msg"><span class="vide-ico">📋</span>Chargement…</div>
</div>

<!-- ══ MODAL FORMULAIRE ════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="fermerModalSiOverlay(event)">
    <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-head">
            <span class="modal-title" id="modal-titre-label">Nouvelle annonce</span>
            <button class="modal-close" onclick="fermerModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-id">

            <div class="form-field">
                <label class="form-label">Titre</label>
                <input class="form-input" id="f-titre" type="text" placeholder="Titre de l'annonce" maxlength="120">
            </div>

            <div class="form-field">
                <label class="form-label">Description <span class="opt">(facultatif)</span></label>
                <textarea class="form-textarea" id="f-desc" placeholder="Texte de l'annonce…" maxlength="1000"></textarea>
            </div>

            <div class="form-row form-field">
                <div>
                    <label class="form-label">Date de début <span class="opt">(facultatif)</span></label>
                    <input class="form-input" id="f-debut" type="date">
                </div>
                <div>
                    <label class="form-label">Date de fin <span class="opt">(facultatif)</span></label>
                    <input class="form-input" id="f-fin" type="date">
                </div>
            </div>

            <div class="form-field">
                <label class="form-label">Image <span class="opt">(facultatif)</span></label>
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                    <label class="btn-upload-img" for="f-image-fichier" id="btn-upload-label">
                        <span id="btn-upload-ico">📁</span> Choisir un fichier
                    </label>
                    <input type="file" id="f-image-fichier" accept="image/*" style="display:none" onchange="uploadImage(this)">
                    <span style="font-family:'EB Garamond',serif;font-style:italic;font-size:.8rem;color:var(--ink-muted)">ou</span>
                    <input class="form-input" id="f-image" type="url" placeholder="https://… (URL directe)" oninput="previewImage()" style="flex:1;margin-bottom:0">
                </div>
                <div class="img-preview" id="img-preview">
                    <img id="img-preview-el" src="" alt="">
                </div>
                <div id="upload-progress" style="display:none;margin-top:6px;font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)">
                    Envoi en cours…
                </div>
            </div>

            <div class="form-row form-field">
                <div>
                    <label class="form-label">Lien URL <span class="opt">(facultatif)</span></label>
                    <input class="form-input" id="f-lien" type="url" placeholder="https://…">
                </div>
                <div>
                    <label class="form-label">Texte du lien <span class="opt">(facultatif)</span></label>
                    <input class="form-input" id="f-lien-label" type="text" placeholder="En savoir plus…" maxlength="60">
                </div>
            </div>

            <div class="form-row form-field">
                <div class="form-toggle" id="toggle-prio" onclick="togglePrio()">
                    <div class="form-toggle-box" id="toggle-prio-box"></div>
                    <span class="form-toggle-label">⚑ Prioritaire</span>
                </div>
                <div class="form-toggle" id="toggle-actif" onclick="toggleActif()">
                    <div class="form-toggle-box" id="toggle-actif-box"></div>
                    <span class="form-toggle-label">✓ Active</span>
                </div>
            </div>

            <div class="form-field">
                <label class="form-label">Publication</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-toggle" id="toggle-newsletter" onclick="toggleNewsletter()">
                        <div class="form-toggle-box" id="toggle-newsletter-box"></div>
                        <span class="form-toggle-label">✉ Newsletter</span>
                    </div>
                    <div class="form-toggle" id="toggle-feuille" onclick="toggleFeuille()">
                        <div class="form-toggle-box" id="toggle-feuille-box"></div>
                        <span class="form-toggle-label">🖨 Feuille imprimée</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn-annuler" onclick="fermerModal()">Annuler</button>
            <button class="btn-sauver" id="btn-sauver" onclick="sauver()">
                <span id="btn-sauver-ico">✦</span>
                <span id="btn-sauver-label">Enregistrer</span>
            </button>
        </div>
    </div>
</div>

<!-- ══ CONFIRM SUPPRESSION ═════════════════════════════════ -->
<div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
        <span class="confirm-ico">🗑</span>
        <div class="confirm-title">Supprimer cette annonce ?</div>
        <p class="confirm-text" id="confirm-text">Cette action est irréversible.</p>
        <div class="confirm-btns">
            <button class="confirm-btn-non" onclick="fermerConfirm()">Annuler</button>
            <button class="confirm-btn-oui" onclick="confirmerSuppr()">Supprimer</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="config.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  DONNÉES
// ══════════════════════════════════════════════════════════════
let annonces = [];
let filtreActuel = 'toutes';
let idASupprimer = null;

// État formulaire
let _prio        = false;
let _actif       = true;
let _newsletter  = false;
let _feuille     = false;

// ── Chargement ────────────────────────────────────────────────
async function charger() {
    const btn = document.getElementById('btn-sync');
    btn.classList.add('spinning');
    try {
        const { data, error } = await maConnexion.from('annonces')
            .select('*')
            .order('prioritaire', { ascending: false })
            .order('ordre', { ascending: true })
            .order('created_at', { ascending: false });
        if (error) throw error;
        annonces = data || [];
        rendreListe();
    } catch(e) {
        console.error(e);
        toast('Erreur de chargement');
    } finally {
        btn.classList.remove('spinning');
    }
}

// ── Filtrage ──────────────────────────────────────────────────
function setFiltre(f, el) {
    filtreActuel = f;
    document.querySelectorAll('.filtre-chip').forEach(c => c.classList.remove('actif'));
    el.classList.add('actif');
    rendreListe();
}

function annocesFiltrees() {
    const today = new Date().toISOString().split('T')[0];
    return annonces.filter(a => {
        if (filtreActuel === 'actives')      return a.actif;
        if (filtreActuel === 'inactives')    return !a.actif;
        if (filtreActuel === 'prioritaires') return a.prioritaire;
        return true;
    });
}

// ── Rendu ─────────────────────────────────────────────────────
function rendreListe() {
    const container = document.getElementById('liste-container');
    const liste = annocesFiltrees();

    // Stat
    const nbActives = annonces.filter(a => a.actif).length;
    document.getElementById('stat-count').textContent = nbActives;

    if (!liste.length) {
        container.innerHTML = `<div class="vide-msg"><span class="vide-ico">📋</span>Aucune annonce${filtreActuel !== 'toutes' ? ' dans ce filtre' : ''}.</div>`;
        return;
    }

    const prioritaires = liste.filter(a => a.prioritaire);
    const normales     = liste.filter(a => !a.prioritaire);
    let html = '';

    if (prioritaires.length) {
        html += `<div class="section-label prioritaire">⚑ Prioritaires</div>`;
        html += prioritaires.map(renderCard).join('');
    }
    if (normales.length) {
        if (prioritaires.length) html += `<div class="section-label">Annonces</div>`;
        html += normales.map(renderCard).join('');
    }

    container.innerHTML = html;
}

function renderCard(a) {
    const today = new Date().toISOString().split('T')[0];
    const expired = a.date_fin && a.date_fin < today;
    const chips = [];
    if (a.date_debut || a.date_fin) {
        const d1 = a.date_debut ? fmtDate(a.date_debut) : '…';
        const d2 = a.date_fin   ? fmtDate(a.date_fin)   : '…';
        chips.push(`<span class="annonce-chip date">${d1} → ${d2}</span>`);
    }
    if (a.lien) chips.push(`<span class="annonce-chip lien">🔗 Lien</span>`);
    if (a.image_url) chips.push(`<span class="annonce-chip image">🖼 Image</span>`);
    if (a.dans_newsletter) chips.push(`<span class="annonce-chip newsletter">✉ Newsletter</span>`);
    if (a.dans_feuille) chips.push(`<span class="annonce-chip feuille">🖨 Feuille</span>`);
    if (!a.actif) chips.push(`<span class="annonce-chip inactif-badge">Inactive</span>`);
    if (expired) chips.push(`<span class="annonce-chip inactif-badge">Expirée</span>`);

    const imgHtml = a.image_url
        ? `<img class="annonce-card-img" src="${escHtml(a.image_url)}" alt="" onerror="this.style.display='none'">`
        : '';

    return `
    <div class="annonce-card${a.prioritaire ? ' prioritaire-card' : ''}${!a.actif ? ' inactif' : ''}"
         draggable="true" data-id="${a.id}"
         ondragstart="dndStart(event)" ondragover="dndOver(event)" ondragend="dndEnd(event)" ondrop="dndDrop(event)">
        <div class="annonce-card-head">
            <div class="annonce-card-prio">${a.prioritaire ? '⚑' : '📌'}</div>
            <div class="annonce-card-body">
                <div class="annonce-card-titre">${escHtml(a.titre)}</div>
                ${a.description ? `<div class="annonce-card-desc">${escHtml(a.description)}</div>` : ''}
                <div class="annonce-card-meta">${chips.join('')}</div>
            </div>
            ${imgHtml}
        </div>
        <div class="annonce-card-foot">
            <div class="annonce-drag-handle" title="Glisser pour réordonner"
                 ontouchstart="dndTouchStart(event)" ontouchmove="dndTouchMove(event)" ontouchend="dndTouchEnd(event)">⠿</div>
            <button class="annonce-action${a.prioritaire ? ' prio-on' : ''}" onclick="togglePrioCard(${a.id})">
                <span class="ico">⚑</span>${a.prioritaire ? 'Prioritaire' : 'Priorité'}
            </button>
            <button class="annonce-action${a.actif ? ' actif-on' : ''}" onclick="toggleActifCard(${a.id})">
                <span class="ico">${a.actif ? '✓' : '○'}</span>${a.actif ? 'Active' : 'Inactive'}
            </button>
            <button class="annonce-action" onclick="ouvrirModal(${a.id})">
                <span class="ico">✏️</span>Modifier
            </button>
            <button class="annonce-action danger" onclick="demanderSuppr(${a.id}, '${escHtml(a.titre).replace(/'/g,"\\'")}')">
                <span class="ico">🗑</span>Supprimer
            </button>
        </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  MODAL FORMULAIRE
// ══════════════════════════════════════════════════════════════
function ouvrirModal(id) {
    const overlay = document.getElementById('modal-overlay');
    const a = id ? annonces.find(x => x.id === id) : null;

    document.getElementById('modal-titre-label').textContent = a ? 'Modifier l\'annonce' : 'Nouvelle annonce';
    document.getElementById('edit-id').value      = a ? a.id : '';
    document.getElementById('f-titre').value      = a ? (a.titre || '') : '';
    document.getElementById('f-desc').value       = a ? (a.description || '') : '';
    document.getElementById('f-debut').value      = a ? (a.date_debut || '') : '';
    document.getElementById('f-fin').value        = a ? (a.date_fin || '') : '';
    document.getElementById('f-image').value      = a ? (a.image_url || '') : '';
    document.getElementById('f-lien').value       = a ? (a.lien || '') : '';
    document.getElementById('f-lien-label').value = a ? (a.lien_label || '') : '';

    _prio       = a ? !!a.prioritaire     : false;
    _actif      = a ? !!a.actif          : true;
    _newsletter = a ? !!a.dans_newsletter : false;
    _feuille    = a ? !!a.dans_feuille   : false;
    majToggle('toggle-prio',        'toggle-prio-box',        _prio,       'prio-on');
    majToggle('toggle-actif',       'toggle-actif-box',       _actif,      'on');
    majToggle('toggle-newsletter',  'toggle-newsletter-box',  _newsletter, 'on');
    majToggle('toggle-feuille',     'toggle-feuille-box',     _feuille,    'on');

    previewImage();
    overlay.classList.add('visible');
    setTimeout(() => document.getElementById('f-titre').focus(), 300);
}

function fermerModal() {
    document.getElementById('modal-overlay').classList.remove('visible');
}

function fermerModalSiOverlay(e) {
    if (e.target === document.getElementById('modal-overlay')) fermerModal();
}

function togglePrio() {
    _prio = !_prio;
    majToggle('toggle-prio', 'toggle-prio-box', _prio, 'prio-on');
}
function toggleActif() {
    _actif = !_actif;
    majToggle('toggle-actif', 'toggle-actif-box', _actif, 'on');
}
function toggleNewsletter() {
    _newsletter = !_newsletter;
    majToggle('toggle-newsletter', 'toggle-newsletter-box', _newsletter, 'on');
}
function toggleFeuille() {
    _feuille = !_feuille;
    majToggle('toggle-feuille', 'toggle-feuille-box', _feuille, 'on');
}
function majToggle(wrapId, boxId, etat, cls) {
    const wrap = document.getElementById(wrapId);
    const box  = document.getElementById(boxId);
    wrap.classList.toggle(cls, etat);
    box.textContent = etat ? '✓' : '';
}

// ── Upload image vers Supabase Storage ───────────────────────
async function uploadImage(input) {
    const file = input.files[0];
    if (!file) return;

    const btn      = document.getElementById('btn-upload-label');
    const progress = document.getElementById('upload-progress');
    btn.classList.add('loading');
    btn.querySelector('#btn-upload-ico').textContent = '⏳';
    progress.style.display = 'block';

    try {
        const ext  = file.name.split('.').pop().toLowerCase();
        const nom  = `annonce_${Date.now()}.${ext}`;
        const { data, error } = await maConnexion.storage
            .from('annonces-images')
            .upload(nom, file, { cacheControl: '3600', upsert: false });

        if (error) throw error;

        const { data: urlData } = maConnexion.storage
            .from('annonces-images')
            .getPublicUrl(nom);

        document.getElementById('f-image').value = urlData.publicUrl;
        previewImage();
        toast('Image chargée ✓');
    } catch(e) {
        console.error(e);
        toast('Erreur upload : ' + (e.message || 'inconnue'));
    } finally {
        btn.classList.remove('loading');
        btn.querySelector('#btn-upload-ico').textContent = '📁';
        progress.style.display = 'none';
        input.value = '';
    }
}

function previewImage() {
    const url = document.getElementById('f-image').value.trim();
    const preview = document.getElementById('img-preview');
    const img = document.getElementById('img-preview-el');
    if (url) {
        img.src = url;
        preview.classList.add('visible');
        img.onerror = () => preview.classList.remove('visible');
    } else {
        preview.classList.remove('visible');
    }
}

// ── Sauvegarder ───────────────────────────────────────────────
async function sauver() {
    const titre = document.getElementById('f-titre').value.trim();
    if (!titre) { document.getElementById('f-titre').focus(); toast('Le titre est obligatoire'); return; }

    const btn   = document.getElementById('btn-sauver');
    const ico   = document.getElementById('btn-sauver-ico');
    const label = document.getElementById('btn-sauver-label');
    btn.disabled = true; ico.textContent = '…'; label.textContent = 'Enregistrement…';

    const payload = {
        titre,
        description: document.getElementById('f-desc').value.trim() || null,
        date_debut:  document.getElementById('f-debut').value || null,
        date_fin:    document.getElementById('f-fin').value || null,
        image_url:   document.getElementById('f-image').value.trim() || null,
        lien:        document.getElementById('f-lien').value.trim() || null,
        lien_label:  document.getElementById('f-lien-label').value.trim() || null,
        prioritaire:      _prio,
        actif:            _actif,
        dans_newsletter:  _newsletter,
        dans_feuille:     _feuille,
    };

    const id = document.getElementById('edit-id').value;
    try {
        if (id) {
            const { error } = await maConnexion.from('annonces').update(payload).eq('id', id);
            if (error) throw error;
            toast('Annonce modifiée ✓');
        } else {
            const { error } = await maConnexion.from('annonces').insert([payload]);
            if (error) throw error;
            toast('Annonce créée ✓');
        }
        fermerModal();
        await charger();
    } catch(e) {
        console.error(e);
        toast('Erreur lors de l\'enregistrement');
    } finally {
        btn.disabled = false; ico.textContent = '✦'; label.textContent = 'Enregistrer';
    }
}

// ══════════════════════════════════════════════════════════════
//  ACTIONS RAPIDES SUR CARTE
// ══════════════════════════════════════════════════════════════
async function togglePrioCard(id) {
    const a = annonces.find(x => x.id === id);
    if (!a) return;
    const { error } = await maConnexion.from('annonces').update({ prioritaire: !a.prioritaire }).eq('id', id);
    if (!error) { toast(a.prioritaire ? 'Priorité retirée' : 'Annonce prioritaire ✓'); await charger(); }
}

async function toggleActifCard(id) {
    const a = annonces.find(x => x.id === id);
    if (!a) return;
    const { error } = await maConnexion.from('annonces').update({ actif: !a.actif }).eq('id', id);
    if (!error) { toast(a.actif ? 'Annonce désactivée' : 'Annonce activée ✓'); await charger(); }
}

// ══════════════════════════════════════════════════════════════
//  RÉORDONNEMENT — DRAG AND DROP
// ══════════════════════════════════════════════════════════════
let _dndSrcId = null;

function dndStart(e) {
    _dndSrcId = parseInt(e.currentTarget.dataset.id);
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function dndOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    // Marquer la carte cible
    document.querySelectorAll('.annonce-card').forEach(c => c.classList.remove('drag-over'));
    const card = e.currentTarget;
    if (parseInt(card.dataset.id) !== _dndSrcId) card.classList.add('drag-over');
}

function dndEnd(e) {
    document.querySelectorAll('.annonce-card').forEach(c => {
        c.classList.remove('dragging', 'drag-over');
    });
}

function dndDrop(e) {
    e.preventDefault();
    const destId = parseInt(e.currentTarget.dataset.id);
    if (!_dndSrcId || _dndSrcId === destId) return;
    sauvegarderOrdre(_dndSrcId, destId);
}

async function sauvegarderOrdre(srcId, destId) {
    const liste = annocesFiltrees();
    const srcIdx  = liste.findIndex(x => x.id === srcId);
    const destIdx = liste.findIndex(x => x.id === destId);
    if (srcIdx === -1 || destIdx === -1) return;

    // Réordonner localement
    const reordonee = [...liste];
    const [item] = reordonee.splice(srcIdx, 1);
    reordonee.splice(destIdx, 0, item);

    // Sauvegarder les nouveaux indices en BDD
    const updates = reordonee.map((a, i) =>
        maConnexion.from('annonces').update({ ordre: i }).eq('id', a.id)
    );
    const results = await Promise.all(updates);
    const erreur = results.find(r => r.error);

    if (!erreur) {
        toast('Ordre enregistré ✓');
        await charger();
    } else {
        toast('Erreur lors du réordonnement');
    }
}

/* ── Touch events (mobile) ── */
let _touchCard = null, _touchClone = null, _touchStartY = 0;

function dndTouchStart(e) {
    const card = e.currentTarget.closest('.annonce-card');
    _touchCard = card;
    _touchStartY = e.touches[0].clientY;
    _dndSrcId = parseInt(card.dataset.id);
    card.classList.add('dragging');

    // Clone fantôme
    _touchClone = card.cloneNode(true);
    _touchClone.style.cssText = `
        position:fixed; left:${card.getBoundingClientRect().left}px;
        top:${card.getBoundingClientRect().top}px;
        width:${card.offsetWidth}px; opacity:.75; pointer-events:none;
        z-index:9999; box-shadow:0 8px 24px rgba(0,0,0,.25);
        transition:none;
    `;
    document.body.appendChild(_touchClone);
    e.preventDefault();
}

function dndTouchMove(e) {
    if (!_touchClone) return;
    e.preventDefault();
    const dy = e.touches[0].clientY - _touchStartY;
    _touchClone.style.transform = `translateY(${dy}px)`;

    // Trouver la carte sous le doigt
    _touchClone.style.display = 'none';
    const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    _touchClone.style.display = '';
    const targetCard = el && el.closest('.annonce-card');
    document.querySelectorAll('.annonce-card').forEach(c => c.classList.remove('drag-over'));
    if (targetCard && targetCard !== _touchCard) targetCard.classList.add('drag-over');
}

function dndTouchEnd(e) {
    if (!_touchClone) return;
    _touchClone.remove(); _touchClone = null;

    const destCard = document.querySelector('.annonce-card.drag-over');
    document.querySelectorAll('.annonce-card').forEach(c => c.classList.remove('dragging','drag-over'));

    if (destCard) {
        const destId = parseInt(destCard.dataset.id);
        if (destId !== _dndSrcId) sauvegarderOrdre(_dndSrcId, destId);
    }
    _touchCard = null; _dndSrcId = null;
}

// ══════════════════════════════════════════════════════════════
//  SUPPRESSION
// ══════════════════════════════════════════════════════════════
function demanderSuppr(id, titre) {
    idASupprimer = id;
    document.getElementById('confirm-text').textContent = `Supprimer « ${titre} » ? Cette action est irréversible.`;
    document.getElementById('confirm-overlay').classList.add('visible');
}

function fermerConfirm() {
    idASupprimer = null;
    document.getElementById('confirm-overlay').classList.remove('visible');
}

async function confirmerSuppr() {
    if (!idASupprimer) return;
    const { error } = await maConnexion.from('annonces').delete().eq('id', idASupprimer);
    fermerConfirm();
    if (!error) { toast('Annonce supprimée'); await charger(); }
    else toast('Erreur lors de la suppression');
}

// ══════════════════════════════════════════════════════════════
//  UTILITAIRES
// ══════════════════════════════════════════════════════════════
function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}

let _toastTimer;
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('visible'), 2500);
}

// ── Init ──────────────────────────────────────────────────────
charger();
</script>

<div id="menu-container"></div>
<script src="menu.js"></script>
