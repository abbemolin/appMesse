name: Essai Messe
on:
  push:
    branches: ["claude/messe-essai"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DivinumOfficium/divinum-officium
          ref: a7b3f34e142c9760087c3e5342501e231fccce5b
          path: _do
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcgi-pm-perl libcgi-session-perl libdate-calc-perl libtimedate-perl liburi-perl libalgorithm-diff-perl cpanminus
          sudo cpanm -q --notest URL::Encode
      - run: python3 tools/messe/essai.py
      - run: |
          rm -rf _do
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/messe/essai
          git diff --cached --quiet || git commit -qm "Essai Messe : résultats"
          for e in 1 2 3 4; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 45; done; exit 1
