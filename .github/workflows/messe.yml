name: Générer la Messe
on:
  workflow_dispatch:
    inputs:
      debut: { description: "Premier jour (AAAA-MM-JJ) — vide : aujourd'hui", required: false }
      fin: { description: "Dernier jour (AAAA-MM-JJ) — vide : 31 décembre de l'an prochain", required: false }
  schedule:
    - cron: "47 3 1 12 *"
permissions:
  contents: write
concurrency:
  group: generation
  cancel-in-progress: false
jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DivinumOfficium/divinum-officium
          ref: a7b3f34e142c9760087c3e5342501e231fccce5b
          path: _do
      - name: Installer Perl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcgi-pm-perl libcgi-session-perl libdate-calc-perl libtimedate-perl liburi-perl libalgorithm-diff-perl cpanminus
          sudo cpanm -q --notest URL::Encode
      - name: Générer
        env:
          DEBUT: ${{ github.event.inputs.debut }}
          FIN: ${{ github.event.inputs.fin }}
        run: |
          python3 tools/messe/generate.py --do-root _do/web --from "${DEBUT:-$(date +%F)}" --to "${FIN:-$(( $(date +%Y) + 1 ))-12-31}"
      - name: Publier
        if: always()
        run: |
          rm -rf _do
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/messe
          git diff --cached --quiet || git commit -qm "Messe : calendrier et propre générés"
          for essai in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $(( essai * 60 ))
          done
          exit 1
