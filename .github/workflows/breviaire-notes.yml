name: Chercher les notes manquantes (essai)
on:
  push:
    branches: ["claude/breviaire-notes"]
permissions:
  contents: write
jobs:
  chercher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/breviaire/chercher_notes.py
      - name: Publier sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/breviaire/candidats
          git diff --cached --quiet || git commit -qm "Bréviaire : candidats GregoBase"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
