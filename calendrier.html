<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planification — Messes</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* ── Badge ordo dans les items du calendrier ──────────── */
    .ordo-badge {
        display:inline-flex; align-items:center; gap:5px;
        font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.1em;
        padding:2px 7px 2px 5px; border-radius:2px; margin-top:4px;
        border:1px solid transparent; white-space:nowrap;
    }
    .ordo-pip-sm {
        width:7px; height:7px; border-radius:50%; flex-shrink:0;
        display:inline-block;
    }
    /* Couleurs de fond des badges */
    .ordo-badge.Blanc  { background:rgba(240,230,184,.35); border-color:rgba(201,168,64,.4); color:var(--ink-soft); }
    .ordo-badge.Blanc .ordo-pip-sm  { background:#d4af37; box-shadow:0 0 0 1px rgba(184,150,42,.5); }
    .ordo-badge.Rouge  { background:rgba(155,32,32,.08);  border-color:rgba(139,26,26,.25);  color:var(--rubric); }
    .ordo-badge.Rouge .ordo-pip-sm  { background:#9b2020; }
    .ordo-badge.Vert   { background:rgba(58,102,68,.08);  border-color:rgba(58,102,68,.25);  color:var(--green); }
    .ordo-badge.Vert .ordo-pip-sm   { background:#3a6644; }
    .ordo-badge.Violet { background:rgba(92,45,122,.08);  border-color:rgba(92,45,122,.25);  color:#5c2d7a; }
    .ordo-badge.Violet .ordo-pip-sm { background:#5c2d7a; }
    .ordo-badge.Rose   { background:rgba(212,104,138,.09);border-color:rgba(212,104,138,.3); color:#a04060; }
    .ordo-badge.Rose .ordo-pip-sm   { background:#d4688a; }
    .ordo-badge.Noir   { background:rgba(26,17,8,.06);    border-color:rgba(26,17,8,.2);     color:var(--ink-soft); }
    .ordo-badge.Noir .ordo-pip-sm   { background:#1a1108; }

    /* Légende couleurs liturgiques */
    .legende-couleurs {
        display:flex; flex-wrap:wrap; gap:7px; padding:12px 16px 14px;
        background:var(--vellum-light); border:1px solid var(--border-soft);
        border-radius:2px; margin-bottom:18px;
    }
    .legende-titre {
        font-family:'Cinzel',serif; font-size:.55rem; letter-spacing:.2em;
        color:var(--rubric); text-transform:uppercase; width:100%; margin-bottom:4px;
    }
    .legende-item {
        display:inline-flex; align-items:center; gap:5px;
        font-family:'EB Garamond',serif; font-size:.8rem; font-style:italic; color:var(--ink-muted);
    }
    .legende-pip {
        width:8px; height:8px; border-radius:50%; flex-shrink:0;
    }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="page-header">
            <span class="rubric-tag">Planification</span>
            <h1>Calendrier</h1>
            <div class="ornament">✦ ✦ ✦</div>
        </div>

        <!-- Légende couleurs liturgiques -->
        <div class="legende-couleurs">
            <span class="legende-titre">Couleurs liturgiques</span>
            <span class="legende-item"><span class="legende-pip" style="background:#d4af37;box-shadow:0 0 0 1px rgba(184,150,42,.5)"></span>Blanc</span>
            <span class="legende-item"><span class="legende-pip" style="background:#9b2020"></span>Rouge</span>
            <span class="legende-item"><span class="legende-pip" style="background:#3a6644"></span>Vert</span>
            <span class="legende-item"><span class="legende-pip" style="background:#5c2d7a"></span>Violet</span>
            <span class="legende-item"><span class="legende-pip" style="background:#d4688a"></span>Rose</span>
            <span class="legende-item"><span class="legende-pip" style="background:#1a1108"></span>Noir</span>
        </div>

        <h2 class="section-title">📅 Prochains 15 jours</h2>
        <div id="liste-proche"></div>

        <div class="search-container">
            <h2 style="text-align:left;margin-bottom:10px;">🔍 Trouver une autre date</h2>
            <input type="date" id="date-picker" style="margin-bottom:10px;">
            <button class="btn-primary" onclick="validerRecherche()">Rechercher</button>
            <div id="no-result" class="no-result-zone">
                <p style="color:var(--rubric);font-weight:600;margin:0 0 8px 0;font-family:'Cinzel',serif;font-size:.82rem;">Aucune messe à cette date</p>
                <p style="color:var(--ink-muted);font-size:.82rem;margin:0 0 12px 0;font-style:italic;">Vous pouvez créer une Messe privée :</p>
                <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
                    <input type="time" id="heure-privee-recherche" value="09:00"
                        style="padding:8px 12px;width:auto;border:2px solid var(--gold);font-family:'Cinzel',serif;font-size:.9rem;color:var(--ink);">
                    <button class="btn-primary" style="width:auto;padding:10px 18px;" onclick="ouvrirModalPrivee()">Messe privée</button>
                </div>
            </div>
        </div>

        <div id="liste-globale"></div>
        <div id="chargement" style="color:var(--ink-muted);font-size:.9rem;text-align:center;padding:40px;font-style:italic;">
            Chargement du calendrier&hellip;
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <!-- Modal saisie -->
    <div id="modal-saisie">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0 0 4px;color:var(--ink);font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.06em;text-align:center;"></h3>
            <input type="hidden" id="input-date-iso">
            <input type="hidden" id="input-google-id">
            <input type="hidden" id="input-heure">
            <label>Intention pour</label>
            <input type="text" id="nom_intention" placeholder="ex : Défunts Famille Dupont">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;">
                    <label>Type</label>
                    <select id="type_intention">
                        <option value="Défunt">✝️ Défunt</option>
                        <option value="Vivant">🙏 Vivant</option>
                        <option value="Action de grâce">✨ Action de grâce</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Demandeur</label>
                    <input type="text" id="nom_donateur" placeholder="Mme Dupont">
                </div>
            </div>
            <label>Note privée</label>
            <textarea id="commentaire" rows="2"></textarea>
            <button class="btn-save" onclick="enregistrerIntention()">✅ Confirmer l'intention</button>
            <button onclick="fermerModal()" style="background:none;border:none;color:var(--ink-muted);cursor:pointer;width:100%;margin-top:14px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;min-height:36px;">Fermer</button>
        </div>
    </div>

    <script src="ordo1962.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
        const GOOGLE_API_KEY = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
        const CALENDAR_ID    = 'saintlouisenville67@gmail.com';

        // Extrait "YYYY-MM-DD" en heure locale (évite le décalage UTC)
        function isoLocal(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const j = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${j}`;
        }

        // Cache ordo : { 'YYYY-MM-DD': { fete, classe, couleur }, ... }
        let ordoCache = {};

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ── Charge les données ordo via le moteur Ordo1962 (missel 1962) ──
        function chargerOrdo(dateMin, dateMax) {
            // Calcul local — pas de requête réseau
            const d = new Date(dateMin + 'T12:00:00');
            const end = new Date(dateMax + 'T12:00:00');
            while (d <= end) {
                const iso = isoLocal(d);
                const o = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());
                if (o && o.fete) ordoCache[iso] = o;
                d.setDate(d.getDate() + 1);
            }
            return Promise.resolve();
        }

        // ── Génère le badge ordo pour une date ISO ──────────
        function badgeOrdo(dateISO) {
            const o = ordoCache[dateISO];
            if (!o) return '';
            const couleurs = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];
            const c = couleurs.includes(o.couleur) ? o.couleur : null;
            if (!c) return '';
            const feteLabel = o.fete.length > 36 ? o.fete.substring(0,34) + '…' : o.fete;
            return `<div class="ordo-badge ${c}">` +
                `<span class="ordo-pip-sm" style="background:${pipColor(c)}"></span>` +
                `<span>${feteLabel}</span>` +
                `</div>`;
        }

        function pipColor(c) {
            return {Blanc:'#d4af37',Rouge:'#9b2020',Vert:'#3a6644',Violet:'#5c2d7a',Rose:'#d4688a',Noir:'#1a1108'}[c] || '#999';
        }

        async function chargerAgenda() {
            if (typeof maConnexion === 'undefined') { setTimeout(chargerAgenda, 500); return; }
            try {
                const [{ data: intentions }, gcalResp] = await Promise.all([
                    maConnexion.from('intentions').select('*').neq('statut','refuse'),
                    fetch(`https://www.googleapis.com/calendar/v3/calendars/${CALENDAR_ID}/events`
                        + `?key=${GOOGLE_API_KEY}`
                        + `&timeMin=${new Date().toISOString()}`
                        + `&timeMax=${(() => { const d = new Date(); d.setFullYear(d.getFullYear()+1); return d.toISOString(); })()}`
                        + `&singleEvents=true&orderBy=startTime&maxResults=500`)
                ]);

                const now      = new Date();
                const limite15 = new Date(); limite15.setDate(now.getDate() + 15);
                const data     = await gcalResp.json();

                document.getElementById('chargement').style.display = 'none';
                if (!data.items) return;

                const estUneMesse = e => ['messe','messe chantée','messe anticipée']
                    .includes(e.summary.toLowerCase().trim());
                const messes = data.items.filter(estUneMesse);
                if (!messes.length) return;

                // Charger l'ordo pour toute la plage
                const dates   = messes.map(e => (e.start.dateTime || e.start.date).split('T')[0]);
                const dateMin = dates[0];
                const dateMax = dates[dates.length-1];
                await chargerOrdo(dateMin, dateMax);

                const divProche  = document.getElementById('liste-proche');
                const divGlobale = document.getElementById('liste-globale');
                divProche.innerHTML = ''; divGlobale.innerHTML = '';

                messes.forEach(event => {
                    const start      = event.start.dateTime || event.start.date;
                    const dateObj    = new Date(start);
                    const dateISO    = isoLocal(dateObj);
                    const dateFr     = dateObj.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
                    const heureBrute = dateObj.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
                    const heureFr    = heureBrute.replace(':','h');

                    const intention = intentions ? intentions.find(i => {
                        const memeId       = i.google_event_id === event.id;
                        const estPrise     = i.statut === 'valide' || i.en_edition === true;
                        const memeDateHeure = i.date_messe === dateISO && i.heure_messe === heureBrute && estPrise;
                        return memeId || memeDateHeure;
                    }) : null;

                    const estLibre = !intention;
                    let contenuAction = '';
                    if (estLibre) {
                        contenuAction = '<button class="btn-action"'
                            + ' data-iso="'     + dateISO + '"'
                            + ' data-datefr="'  + dateFr  + '"'
                            + ' data-googleid="'+ event.id + '"'
                            + ' data-heure="'   + heureFr + '"'
                            + ' onclick="ouvrirModalFromBtn(this)">✍️ Attribuer</button>';
                    } else {
                        const icone = intention.type_intention === 'Défunt' ? '✝️'
                                    : intention.type_intention === 'Vivant' ? '🙏' : '✨';
                        contenuAction =
                            '<div style="display:flex;align-items:center;">'
                            + '<div style="text-align:right;margin-right:8px;">'
                            + '<span class="nom-intention-display">' + intention.nom_intention + '</span>'
                            + '<span class="type-intention-badge">' + icone + ' ' + intention.type_intention + '</span>'
                            + (intention.commentaire ? '<span style="font-size:.68rem;color:var(--gold);display:block;font-style:italic;">🗒 ' + intention.commentaire + '</span>' : '')
                            + '</div>'
                            + '<div style="display:flex;flex-direction:column;gap:3px;">'
                            + '<button class="btn-copy" title="Copier"'
                            + ' data-nom="' + intention.nom_intention.replace(/"/g,'&quot;') + '"'
                            + ' data-datefr="' + dateFr + '" data-heure="' + heureFr + '"'
                            + ' onclick="copierMessageFromBtn(this)">📋</button>'
                            + '<button class="btn-delete" title="Supprimer"'
                            + ' data-id="' + intention.id + '"'
                            + ' onclick="supprimerFromBtn(this)">🗑️</button>'
                            + '</div></div>';
                    }

                    // Badge ordo inséré sous la date
                    const ordo = badgeOrdo(dateISO);

                    const html = '<div class="messe-item ' + (estLibre ? 'libre' : 'prise') + '" data-iso="' + dateISO + '">'
                        + '<div>'
                        + '<div class="date-principale">' + dateFr + '</div>'
                        + '<div class="horaire">🕒 ' + heureFr + ' — ' + event.summary + '</div>'
                        + ordo
                        + '</div>'
                        + '<div>' + contenuAction + '</div></div>';

                    if (dateObj <= limite15) divProche.innerHTML += html;
                    else divGlobale.innerHTML += html;
                });

                document.querySelectorAll('#liste-globale .messe-item').forEach(item => item.style.display = 'none');
            } catch (e) { console.error(e); }
        }

        function ouvrirModalFromBtn(btn) {
            ouvrirModal(btn.dataset.iso, btn.dataset.datefr, btn.dataset.googleid, btn.dataset.heure);
        }

        function copierMessageFromBtn(btn) {
            const texte = 'Bonjour,\n\nLa Messe à votre intention (' + btn.dataset.nom + ') sera célébrée le ' + btn.dataset.datefr + ' à ' + btn.dataset.heure + '.\n\nJe vous assure de ma prière,\nAbbé Molin';
            navigator.clipboard.writeText(texte)
                .then(() => AppModal.alert('📋','Copié !','Le message a été copié dans le presse-papiers.'))
                .catch(() => AppModal.alert('❌','Erreur','Impossible de copier. Vérifiez les permissions du navigateur.'));
        }

        async function supprimerFromBtn(btn) {
            const id = btn.dataset.id;
            const ok = await AppModal.confirm('🗑️',"Supprimer l'intention ?",'Cette messe sera libérée.','Supprimer','app-modal-btn-danger');
            if (!ok) return;
            const { error } = await maConnexion.from('intentions').delete().eq('id', id);
            if (error) { AppModal.alert('❌','Erreur',error.message); return; }
            chargerAgenda();
        }

        function ouvrirModal(iso, dateFr, googleId, heure) {
            document.getElementById('nom_intention').value  = '';
            document.getElementById('nom_donateur').value   = '';
            document.getElementById('commentaire').value    = '';
            document.getElementById('input-date-iso').value = iso;
            document.getElementById('input-google-id').value= googleId;
            document.getElementById('input-heure').value    = heure;
            document.getElementById('modal-title').innerText = dateFr + ' à ' + heure;
            document.getElementById('modal-saisie').style.display = 'flex';
        }

        function fermerModal() { document.getElementById('modal-saisie').style.display = 'none'; }

        async function enregistrerIntention() {
            const date_messe      = document.getElementById('input-date-iso').value;
            const google_event_id = document.getElementById('input-google-id').value;
            const nom_intention   = document.getElementById('nom_intention').value.trim();
            const heure_brute     = document.getElementById('input-heure').value.replace('h',':');
            const commentaire     = document.getElementById('commentaire').value.trim();
            if (!nom_intention) { AppModal.alert('⚠️','Champ manquant',"Veuillez indiquer l'intention."); return; }
            const { error } = await maConnexion.from('intentions').insert([{
                date_messe, google_event_id,
                heure_messe:    heure_brute,
                nom_intention,
                type_intention: document.getElementById('type_intention').value,
                nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
                commentaire,
                statut:         'valide',
                email_donateur: 'non@renseigne.fr',
                mail_envoye:    true
            }]);
            if (error) { AppModal.alert('❌','Erreur',error.message); return; }
            fermerModal();
            showToast('✅ Intention enregistrée');
            chargerAgenda();
        }

        function validerRecherche() {
            const val = document.getElementById('date-picker').value;
            if (!val) return;
            let trouve = false;
            document.querySelectorAll('#liste-globale .messe-item').forEach(item => {
                const match = item.getAttribute('data-iso') === val;
                item.style.display = match ? '' : 'none';
                if (match) trouve = true;
            });
            const noResult = document.getElementById('no-result');
            if (trouve) { noResult.classList.remove('visible'); }
            else {
                noResult.classList.add('visible');
                const dateObj = new Date(val + 'T00:00:00');
                noResult.dataset.dateIso = val;
                noResult.dataset.dateFr  = dateObj.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
            }
        }

        function ouvrirModalPrivee() {
            const noResult   = document.getElementById('no-result');
            const iso        = noResult.dataset.dateIso;
            const dateFr     = noResult.dataset.dateFr;
            const heureInput = document.getElementById('heure-privee-recherche').value || '09:00';
            const [hh, mm]   = heureInput.split(':');
            ouvrirModal(iso, dateFr + ' (Messe privée)', 'prive_' + iso, `${hh}h${mm}`);
        }

        window.onload = chargerAgenda;
    </script>
</body>
</html>
