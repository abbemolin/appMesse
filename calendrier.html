<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planification — Messes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>

    /* ═══════════════════════════════════════════════════════
       CALENDRIER — Styles spécifiques
    ═══════════════════════════════════════════════════════ */

    /* ── Couleurs liturgiques : badge ordo ───────────────── */
    .ordo-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: 'Cinzel', serif; font-size: .52rem; letter-spacing: .1em;
        padding: 3px 8px 3px 6px; border-radius: 2px;
        border: 1px solid transparent; white-space: nowrap;
    }
    .ordo-pip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ordo-badge.Blanc  { background: rgba(240,230,184,.3);  border-color: rgba(201,168,64,.35); color: var(--ink-soft); }
    .ordo-badge.Blanc .ordo-pip  { background: #d4af37; }
    .ordo-badge.Rouge  { background: rgba(139,26,26,.07);   border-color: rgba(139,26,26,.22);  color: var(--rubric); }
    .ordo-badge.Rouge .ordo-pip  { background: #9b2020; }
    .ordo-badge.Vert   { background: rgba(58,102,68,.07);   border-color: rgba(58,102,68,.22);  color: var(--green); }
    .ordo-badge.Vert .ordo-pip   { background: #3a6644; }
    .ordo-badge.Violet { background: rgba(92,45,122,.07);   border-color: rgba(92,45,122,.22);  color: #5c2d7a; }
    .ordo-badge.Violet .ordo-pip { background: #5c2d7a; }
    .ordo-badge.Rose   { background: rgba(212,104,138,.08); border-color: rgba(212,104,138,.28); color: #a04060; }
    .ordo-badge.Rose .ordo-pip   { background: #d4688a; }
    .ordo-badge.Noir   { background: rgba(26,17,8,.05);     border-color: rgba(26,17,8,.18);     color: var(--ink-soft); }
    .ordo-badge.Noir .ordo-pip   { background: #1a1108; }

    /* ── Séparateur de date ──────────────────────────────── */
    .date-sep {
        display: flex; align-items: center; gap: 10px;
        margin: 20px 0 10px;
    }
    .date-sep:first-child { margin-top: 0; }
    .date-sep-label {
        font-family: 'Cinzel', serif; font-size: .62rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--rubric); white-space: nowrap; flex-shrink: 0;
    }
    .date-sep-line {
        flex: 1; height: 1px; background: var(--border-soft);
    }

    /* ── Carte de messe ──────────────────────────────────── */
    .messe-card {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-radius: 3px;
        box-shadow: 0 1px 6px var(--shadow);
        margin-bottom: 10px;
        overflow: hidden;
        position: relative;
    }
    .messe-card::before {
        content: '';
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px;
    }
    .messe-card.libre::before  { background: var(--border-soft); }
    .messe-card.prise::before  { background: var(--gold); }

    /* En-tête de carte : heure + titre messe */
    .messe-card-head {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px 10px 16px;
        border-bottom: 1px solid var(--border-soft);
        background: var(--vellum);
    }
    .messe-card-heure {
        font-family: 'Cinzel', serif; font-size: 1.05rem;
        font-weight: 700; color: var(--ink); line-height: 1;
        flex-shrink: 0; min-width: 44px;
    }
    .messe-card-heure small {
        font-size: .55rem; font-weight: 400;
        letter-spacing: .08em; color: var(--ink-muted);
        display: block; margin-top: 1px;
    }
    .messe-card-titre {
        flex: 1; min-width: 0;
    }
    .messe-card-type {
        font-family: 'EB Garamond', serif; font-size: .88rem;
        color: var(--ink); font-style: italic; line-height: 1.2;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .messe-card-libre-label {
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .16em; text-transform: uppercase;
        color: var(--ink-muted); margin-top: 2px;
    }

    /* Corps : ordo + intention */
    .messe-card-body { padding: 10px 14px 12px 16px; }

    /* Bloc ordo */
    .messe-card-ordo { margin-bottom: 8px; }

    /* Bloc intention */
    .intention-bloc {
        background: var(--vellum);
        border: 1px solid var(--border-soft);
        border-left: 3px solid var(--gold);
        border-radius: 2px;
        padding: 10px 12px;
        margin-top: 8px;
    }
    .intention-rubric {
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--gold); display: block; margin-bottom: 5px;
    }
    .intention-nom {
        font-family: 'EB Garamond', serif; font-size: 1.05rem;
        color: var(--ink); line-height: 1.3; font-weight: 500;
    }
    .intention-nom-input {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        border: 1px solid var(--gold); border-radius: 2px;
        padding: 3px 8px; background: var(--vellum-light);
        color: var(--ink); width: 100%;
    }
    .intention-type {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .14em; text-transform: uppercase;
        padding: 2px 8px; border-radius: 10px; margin-top: 4px;
    }
    .intention-type.Défunt  { background: rgba(26,17,8,.08);    color: var(--ink-soft);  border: 1px solid rgba(26,17,8,.15); }
    .intention-type.Vivant  { background: rgba(58,102,68,.09);  color: var(--green);     border: 1px solid rgba(58,102,68,.2); }
    .intention-type.grace   { background: rgba(184,150,42,.1);  color: #8a6a00;          border: 1px solid rgba(184,150,42,.25); }
    .intention-type-dot {
        width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    }
    .intention-type.Défunt  .intention-type-dot { background: var(--ink-soft); }
    .intention-type.Vivant  .intention-type-dot { background: var(--green); }
    .intention-type.grace   .intention-type-dot { background: #b8962a; }

    .intention-commentaire {
        font-family: 'EB Garamond', serif; font-size: .82rem;
        color: var(--ink-muted); font-style: italic;
        margin-top: 5px; line-height: 1.4;
    }

    /* Pied de carte : actions */
    .messe-card-actions {
        display: flex; align-items: center; gap: 6px;
        padding: 8px 14px 10px 16px;
        border-top: 1px solid var(--border-soft);
        background: var(--vellum);
        flex-wrap: wrap;
    }
    .btn-attribuer {
        flex: 1; min-width: 0;
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 8px 12px; border-radius: 2px; cursor: pointer;
        background: var(--ink); color: var(--gold);
        border: none; transition: opacity .2s; min-height: 36px;
    }
    .btn-attribuer:active { opacity: .75; }

    .btn-propre {
        flex: 1; min-width: 0;
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 8px 12px; border-radius: 2px; cursor: pointer;
        background: transparent; color: var(--ink-muted);
        border: 1px solid var(--border-soft); transition: all .2s;
        min-height: 36px;
    }
    .btn-propre:active { border-color: var(--gold); color: var(--gold); }

    .btn-icon {
        width: 36px; height: 36px; border-radius: 2px;
        border: 1px solid var(--border-soft); background: none;
        cursor: pointer; display: flex; align-items: center;
        justify-content: center; font-size: .9rem; flex-shrink: 0;
        transition: all .15s; color: var(--ink-muted);
    }
    .btn-icon:active { border-color: var(--rubric); color: var(--rubric); }
    .btn-icon.edit:active { border-color: var(--gold); color: var(--gold); }

    /* ── Section recherche ───────────────────────────────── */
    .search-section {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-top: 2px solid var(--border);
        border-radius: 3px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .search-section-title {
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--rubric); margin-bottom: 12px; display: block;
    }
    .search-row {
        display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
    }
    .search-row input[type="date"],
    .search-row input[type="time"] {
        flex: 1; min-width: 110px; margin: 0;
        font-family: 'Cinzel', serif; font-size: .78rem;
        padding: 10px 10px; height: 42px;
    }
    .search-row .btn-search {
        font-family: 'Cinzel', serif; font-size: .62rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 0 16px; height: 42px; background: var(--ink);
        color: var(--vellum-light); border: none; border-radius: 2px;
        cursor: pointer; white-space: nowrap; flex-shrink: 0;
        min-width: 100px;
    }

    /* Zone aucune messe */
    .no-messe-zone {
        display: none; margin-top: 12px;
        border: 1px dashed var(--border-soft);
        border-radius: 3px; padding: 14px 16px;
        background: var(--vellum);
    }
    .no-messe-zone.visible { display: block; }
    .no-messe-label {
        font-family: 'Cinzel', serif; font-size: .58rem;
        letter-spacing: .14em; text-transform: uppercase;
        color: var(--rubric); margin-bottom: 8px; display: block;
    }
    .no-messe-sub {
        font-family: 'EB Garamond', serif; font-size: .88rem;
        color: var(--ink-muted); font-style: italic; margin-bottom: 10px;
    }
    .no-messe-actions {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .no-messe-actions input[type="time"] {
        width: 100px; margin: 0; flex-shrink: 0;
        font-family: 'Cinzel', serif; font-size: .78rem; padding: 8px 10px;
    }
    .no-messe-actions .btn-search {
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .1em; text-transform: uppercase;
        padding: 9px 16px; background: var(--rubric);
        color: #fff; border: none; border-radius: 2px; cursor: pointer;
    }

    /* ── Bouton ajouter intention ─────────────────────────── */
    .btn-ajouter {
        display: flex; align-items: center; justify-content: center;
        gap: 8px; width: 100%; padding: 13px 16px;
        font-family: 'Cinzel', serif; font-size: .65rem;
        letter-spacing: .14em; text-transform: uppercase;
        background: var(--rubric); color: #fff;
        border: none; border-radius: 3px; cursor: pointer;
        min-height: 46px; transition: opacity .2s;
        margin-bottom: 16px;
    }
    .btn-ajouter:active { opacity: .8; }

    /* ── Modale saisie ───────────────────────────────────── */
    #modal-saisie {
        display: none; position: fixed; inset: 0; z-index: 1000;
        background: rgba(26,17,8,.55);
        align-items: flex-end; justify-content: center;
    }
    #modal-saisie.open { display: flex; }
    .modal-content {
        background: var(--vellum-light);
        border-radius: 12px 12px 0 0;
        padding: 20px 18px 30px;
        width: 100%; max-width: 520px;
        max-height: 90vh; overflow-y: auto;
        box-shadow: 0 -4px 32px rgba(0,0,0,.25);
    }
    .modal-content::before {
        content: '✦  ✦  ✦'; display: block; text-align: center;
        color: var(--gold); font-size: .55rem; letter-spacing: .6em;
        margin-bottom: 16px; opacity: .55;
    }
    .modal-content h3 {
        margin: 0 0 16px; color: var(--ink);
        font-family: 'Cinzel', serif; font-size: .9rem;
        letter-spacing: .06em; text-align: center;
    }
    .modal-content label {
        display: block; font-family: 'Cinzel', serif;
        font-size: .56rem; font-weight: 600; color: var(--rubric);
        margin-top: 14px; margin-bottom: 4px;
        text-transform: uppercase; letter-spacing: .14em;
    }
    .modal-row { display: flex; gap: 10px; }
    .modal-row > div { flex: 1; }
    .btn-save {
        margin-top: 18px; width: 100%;
        font-family: 'Cinzel', serif; font-size: .7rem;
        letter-spacing: .14em; text-transform: uppercase;
        padding: 14px; background: var(--ink); color: var(--gold);
        border: none; border-radius: 3px; cursor: pointer; min-height: 48px;
    }
    .btn-close-modal {
        background: none; border: none; color: var(--ink-muted);
        cursor: pointer; width: 100%; margin-top: 12px;
        font-family: 'Cinzel', serif; font-size: .6rem;
        letter-spacing: .1em; text-transform: uppercase; min-height: 36px;
    }
    #libre-date-heure { gap: 10px; margin-bottom: 10px; }

    /* ── Zone chargement ──────────────────────────────────── */
    .loading-zone {
        text-align: center; padding: 40px 20px;
        color: var(--ink-muted); font-style: italic;
        font-family: 'EB Garamond', serif; font-size: 1rem;
    }
    </style>
</head>
<body>
<div id="menu-container"></div>

<main>
    <div class="page-header">
        <span class="rubric-tag">Planification</span>
        <h1>Calendrier</h1>
        <div class="ornament">✦ ✦ ✦</div>
    </div>

    <!-- Bouton ajout libre -->
    <button class="btn-ajouter" onclick="ouvrirModalLibre()">
        ✦ Ajouter une intention — date libre
    </button>

    <!-- Section 15 prochains jours -->
    <h2 class="section-title">Prochains 15 jours</h2>
    <div id="liste-proche"></div>

    <!-- Section recherche -->
    <div class="search-section">
        <span class="search-section-title">Trouver une date</span>
        <div class="search-row">
            <input type="date" id="date-picker">
            <input type="time" id="heure-libre" value="09:00">
            <button class="btn-search" onclick="validerRecherche()">Rechercher</button>
        </div>
        <div class="no-messe-zone" id="no-result">
            <span class="no-messe-label">Aucune messe programmée ce jour</span>
            <p class="no-messe-sub">Vous pouvez créer une messe privée :</p>
            <div class="no-messe-actions">
                <input type="time" id="heure-privee-recherche" value="09:00">
                <button class="btn-search" onclick="ouvrirModalPrivee()">Messe privée</button>
            </div>
        </div>
    </div>

    <!-- Liste globale -->
    <div id="liste-globale"></div>

    <div id="chargement" class="loading-zone">Chargement du calendrier…</div>
</main>

<div id="toast" class="toast"></div>

<!-- ── Modale saisie intention ─────────────────────────── -->
<div id="modal-saisie">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <input type="hidden" id="input-date-iso">
        <input type="hidden" id="input-google-id">
        <input type="hidden" id="input-heure">
        <div id="libre-date-heure" style="display:none;flex-direction:column;">
            <div class="modal-row">
                <div>
                    <label>Date</label>
                    <input type="date" id="libre-date" style="width:100%">
                </div>
                <div>
                    <label>Heure</label>
                    <input type="time" id="libre-heure" value="09:00" style="width:100%">
                </div>
            </div>
        </div>
        <label>Intention pour</label>
        <input type="text" id="nom_intention" placeholder="ex : Défunts famille Dupont">
        <div class="modal-row">
            <div>
                <label>Type</label>
                <select id="type_intention">
                    <option value="Défunt">✝ Défunt</option>
                    <option value="Vivant">🙏 Vivant</option>
                    <option value="Action de grâce">✨ Action de grâce</option>
                </select>
            </div>
            <div>
                <label>Demandeur</label>
                <input type="text" id="nom_donateur" placeholder="Mme Dupont">
            </div>
        </div>
        <label>Note privée</label>
        <textarea id="commentaire" rows="2"></textarea>
        <button class="btn-save" onclick="enregistrerIntention()">✅ Confirmer l'intention</button>
        <button class="btn-close-modal" onclick="fermerModal()">Fermer</button>
    </div>
</div>

<script src="ordo1962.js"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="modal.js"></script>
<script>
const GOOGLE_API_KEY  = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
const CALENDAR_ID     = 'saintlouisenville67@gmail.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzA4wI1QmU4s8fVx8Nd3yeLxheo1kifLyQpuxNLvlxl4g1Q3yXAQ3pyuGKVSR40JT1/exec';

function isoLocal(d) {
    return d.getFullYear() + '-'
        + String(d.getMonth()+1).padStart(2,'0') + '-'
        + String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Ordo ──────────────────────────────────────────────────
let ordoCache = {};

function chargerOrdo(dateMin, dateMax) {
    const d = new Date(dateMin + 'T12:00:00');
    const end = new Date(dateMax + 'T12:00:00');
    while (d <= end) {
        const iso = isoLocal(d);
        const o = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());
        if (o && o.fete) ordoCache[iso] = o;
        d.setDate(d.getDate()+1);
    }
    return Promise.resolve();
}

function pipColor(c) {
    return {Blanc:'#d4af37',Rouge:'#9b2020',Vert:'#3a6644',Violet:'#5c2d7a',Rose:'#d4688a',Noir:'#1a1108'}[c]||'#999';
}

function badgeOrdo(iso) {
    const o = ordoCache[iso];
    if (!o) return '';
    const valides = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];
    const c = valides.includes(o.couleur) ? o.couleur : null;
    if (!c) return '';
    const label = o.fete.length > 42 ? o.fete.slice(0,40)+'…' : o.fete;
    return `<span class="ordo-badge ${c}"><span class="ordo-pip" style="background:${pipColor(c)}"></span>${label}</span>`;
}

// ── Rendu d'une carte de messe ─────────────────────────────
function renderCarteDate(dateFr) {
    return `<div class="date-sep">
        <span class="date-sep-line"></span>
        <span class="date-sep-label">${dateFr}</span>
        <span class="date-sep-line"></span>
    </div>`;
}

function renderCarte(dateISO, dateFr, heureFr, summary, estLibre, intention) {
    // En-tête heure
    const [h, m] = heureFr.includes('h') ? heureFr.split('h') : heureFr.split(':');
    const typeLabel = summary.toLowerCase().includes('chantée') ? 'Messe chantée'
                    : summary.toLowerCase().includes('anticipée') ? 'Messe anticipée'
                    : 'Messe lue';

    const dfEsc = dateFr.replace(/'/g,"&#39;");
    const libreLabel = estLibre ? `<div class="messe-card-libre-label">✦ Libre</div>` : '';

    // Corps : ordo
    const ordo = badgeOrdo(dateISO);
    const ordoblock = ordo ? `<div class="messe-card-ordo">${ordo}</div>` : '';

    // Corps : intention
    let intentionBlock = '';
    if (!estLibre && intention) {
        const typeClass = intention.type_intention === 'Défunt' ? 'Défunt'
                        : intention.type_intention === 'Vivant' ? 'Vivant' : 'grace';
        const typeLabel2 = intention.type_intention === 'Action de grâce' ? 'Action de grâce' : intention.type_intention;
        const dotStyle = `background:${typeClass==='Défunt'?'var(--ink-soft)':typeClass==='Vivant'?'var(--green)':'#b8962a'}`;
        const comm = intention.commentaire
            ? `<div class="intention-commentaire">🗒 ${escH(intention.commentaire)}</div>` : '';
        intentionBlock = `
        <div class="intention-bloc">
            <span class="intention-rubric">Intention de Messe</span>
            <div class="intention-nom" id="cal-nom-${intention.id}">${escH(intention.nom_intention)}</div>
            <div>
                <span class="intention-type ${typeClass}">
                    <span class="intention-type-dot" style="${dotStyle}"></span>
                    ${escH(typeLabel2)}
                </span>
            </div>
            ${comm}
        </div>`;
    }

    // Actions
    let actions = '';
    if (estLibre) {
        actions = `<button class="btn-attribuer"
            data-iso="${dateISO}" data-datefr="${dfEsc}"
            data-googleid="${escH(intention ? intention.google_event_id||'' : '')}"
            data-heure="${heureFr}"
            onclick="ouvrirModalFromBtn(this)">✍️ Attribuer une intention</button>`;
    } else {
        actions = `
        <button class="btn-icon edit" title="Modifier le nom"
            onclick="editerNomCal(${intention.id})">✏️</button>
        <button class="btn-icon" title="Copier le message"
            data-nom="${escH(intention.nom_intention).replace(/"/g,'&quot;')}"
            data-datefr="${dfEsc}" data-heure="${heureFr}"
            onclick="copierMessageFromBtn(this)">📋</button>
        <button class="btn-icon" title="Supprimer"
            data-id="${intention.id}"
            onclick="supprimerFromBtn(this)">🗑</button>`;
    }

    const btnPropre = `<button class="btn-propre"
        onclick="ouvrirPropre('${dateISO}','${dfEsc}')">✦ Propre</button>`;

    return `<div class="messe-card ${estLibre?'libre':'prise'}" data-iso="${dateISO}" data-recherche="1">
        <div class="messe-card-head">
            <div class="messe-card-heure">${h}<small>h${m&&m!=='00'?m:''}</small></div>
            <div class="messe-card-titre">
                <div class="messe-card-type">${escH(typeLabel)}</div>
                ${libreLabel}
            </div>
        </div>
        <div class="messe-card-body">
            ${ordoblock}
            ${intentionBlock}
        </div>
        <div class="messe-card-actions">
            ${estLibre ? actions + btnPropre : btnPropre + actions}
        </div>
    </div>`;
}

function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Édition inline du nom ──────────────────────────────────
async function editerNomCal(id) {
    const el = document.getElementById('cal-nom-'+id);
    if (!el) return;
    const ancien = el.textContent.trim();
    const input = document.createElement('input');
    input.className = 'intention-nom-input';
    input.value = ancien;
    el.replaceWith(input);
    input.focus(); input.select();
    async function valider() {
        const nouveau = input.value.trim();
        if (!nouveau || nouveau === ancien) { input.replaceWith(el); return; }
        try {
            const { error } = await maConnexion.from('intentions').update({nom_intention:nouveau}).eq('id',id);
            if (error) throw error;
            el.textContent = nouveau;
        } catch(e) { AppModal.alert('❌','Erreur',e.message); }
        input.replaceWith(el);
    }
    input.addEventListener('blur', valider);
    input.addEventListener('keydown', e => {
        if (e.key==='Enter') { e.preventDefault(); input.blur(); }
        if (e.key==='Escape') { input.value=ancien; input.blur(); }
    });
}

// ── Chargement agenda ─────────────────────────────────────
async function chargerAgenda() {
    if (typeof maConnexion === 'undefined') { setTimeout(chargerAgenda, 500); return; }
    try {
        const tMaxInit = new Date(); tMaxInit.setDate(tMaxInit.getDate()+60);
        const [{ data: intentions }, gcalResp] = await Promise.all([
            maConnexion.from('intentions').select('*').neq('statut','refuse'),
            fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                + `?key=${GOOGLE_API_KEY}&timeMin=${new Date().toISOString()}`
                + `&timeMax=${tMaxInit.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=100`)
        ]);

        const now = new Date();
        const limite15 = new Date(); limite15.setDate(now.getDate()+15);
        const data = await gcalResp.json();
        document.getElementById('chargement').style.display = 'none';
        if (!data.items) return;

        const messes = data.items.filter(e => /messe/i.test((e.summary||'').trim()));
        if (!messes.length) return;

        const dates  = messes.map(e => (e.start.dateTime||e.start.date).split('T')[0]);
        await chargerOrdo(dates[0], dates[dates.length-1]);

        const divProche  = document.getElementById('liste-proche');
        const divGlobale = document.getElementById('liste-globale');
        divProche.innerHTML = ''; divGlobale.innerHTML = '';

        let dernDateProche = null, dernDateGlobale = null;

        messes.forEach(event => {
            const start    = event.start.dateTime || event.start.date;
            const dateObj  = new Date(start);
            const dateISO  = isoLocal(dateObj);
            const dateFr   = dateObj.toLocaleDateString('fr-FR', {weekday:'short',day:'numeric',month:'short'}).replace('.',' ').toUpperCase();
            const hh       = dateObj.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            const heureFr  = hh.replace(':','h');

            const intention = intentions ? intentions.find(i => {
                return i.google_event_id===event.id
                    || (i.date_messe===dateISO && i.heure_messe===hh && (i.statut==='valide'||i.en_edition));
            }) : null;

            const carte = renderCarte(dateISO, dateFr, heureFr, event.summary, !intention, intention);

            if (dateObj <= limite15) {
                if (dateISO !== dernDateProche) {
                    divProche.innerHTML += renderCarteDate(dateFr);
                    dernDateProche = dateISO;
                }
                divProche.innerHTML += carte;
            } else {
                if (dateISO !== dernDateGlobale) {
                    divGlobale.innerHTML += renderCarteDate(dateFr);
                    dernDateGlobale = dateISO;
                }
                divGlobale.innerHTML += carte;
            }
        });

        document.querySelectorAll('#liste-globale .messe-card').forEach(c => c.style.display='none');
        document.querySelectorAll('#liste-globale .date-sep').forEach(c => c.style.display='none');
    } catch(e) { console.error(e); }
}

async function enregistrerIntention() {
    let date_messe      = document.getElementById('input-date-iso').value;
    const google_event_id = document.getElementById('input-google-id').value;
    const nom_intention   = document.getElementById('nom_intention').value.trim();
    let heure_brute     = document.getElementById('input-heure').value.replace('h',':');
    if (!date_messe || google_event_id === 'libre') {
        date_messe  = document.getElementById('libre-date').value;
        heure_brute = document.getElementById('libre-heure').value;

    const commentaire = document.getElementById('commentaire').value.trim();
    if (!nom_intention) { AppModal.alert('⚠️','Champ manquant',"Veuillez indiquer l'intention."); return; }
    const { error } = await maConnexion.from('intentions').insert([{
        date_messe, google_event_id,
        heure_messe:    heure_brute,
        nom_intention,
        type_intention: document.getElementById('type_intention').value,
        nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
        commentaire,
        statut:         'valide',

        mail_envoye:    true
    }]);
    if (error) { AppModal.alert('❌','Erreur',error.message); return; }
    fermerModal();
    showToast('✅ Intention enregistrée');
    chargerAgenda();
}

// ── Recherche date ────────────────────────────────────────
async function validerRecherche() {
    const val = document.getElementById('date-picker').value;
    if (!val) return;
    const noResult = document.getElementById('no-result');
    noResult.classList.remove('visible');
    document.querySelectorAll('#liste-globale [data-recherche]').forEach(e => e.remove());
    document.querySelectorAll('#liste-globale .messe-card').forEach(i => i.style.display='none');
    document.querySelectorAll('#liste-globale .date-sep').forEach(i => i.style.display='none');
    try {
        const tMin = new Date(val+'T00:00:00').toISOString();
        const tMax = new Date(val+'T23:59:59').toISOString();
        const url  = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
            + `?key=${GOOGLE_API_KEY}&timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=50`;
        const [gcalResp, { data: prises }] = await Promise.all([
            fetch(url),
            maConnexion.from('intentions').select('*').eq('date_messe',val).eq('statut','valide')
        ]);
        const gcalData = await gcalResp.json();
        const messes   = (gcalData.items||[]).filter(e => /messe/i.test((e.summary||'')));
        const liste    = document.getElementById('liste-globale');
        if (messes.length > 0) {
            await chargerOrdo(val, val);
            messes.forEach(e => {
                const dt  = new Date(e.start.dateTime||e.start.date);
                const hh  = String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
                const hFr = hh.replace(':','h');
                const dateFr = dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}).replace('.',' ').toUpperCase();
                const intention = (prises||[]).find(i=>i.heure_messe===hh)||null;
                liste.insertAdjacentHTML('beforeend', renderCarteDate(dateFr) + renderCarte(val,dateFr,hFr,e.summary||'Messe',!intention,intention));
            });
        } else {
            noResult.dataset.dateIso = val;
            noResult.dataset.dateFr  = new Date(val+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
            noResult.classList.add('visible');
        }
    } catch(e) { console.error(e); }
}

function ajouterIntentionLibre() {
    const val   = document.getElementById('date-picker').value;
    const heure = document.getElementById('heure-libre').value || '09:00';
    if (!val) { AppModal.alert('⚠️','Date manquante','Veuillez sélectionner une date.'); return; }
    const dateObj = new Date(val+'T00:00:00');
    const dateFr  = dateObj.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const [hh,mm] = heure.split(':');
    ouvrirModal(val, dateFr, 'libre_'+val, `${hh}h${mm==='00'?'':mm}`);
}

}

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
var _propresLang = 'la', _propresData = null, _propresDateISO = null;

var PIECE_COLORS = {
    introit:'#1a1108',collecte:'#5a3e1b',epitre:'#1a4a2a',
    graduel:'#3a1a4a',trait:'#3a1a4a',alleluia:'#3a1a4a',
    evangile:'#8b1a1a',offertoire:'#1a3a5a',secrete:'#5a3e1b',
    preface:'#4a2a1a',communion:'#1a1108',postcommunion:'#5a3e1b'
};

var MULTI_MESSES = {
    'temporal/1/0':[
        {key:'temporal/1/0',label:'Messe de Minuit'},
        {key:'temporal/1/0b',label:"Messe de l'Aurore"},
        {key:'temporal/1/0c',label:'Messe du Jour'}
    ],
    'sanctoral/11/2':[
        {key:'sanctoral/11/2',label:'1re Messe'},
        {key:'sanctoral/11/2b',label:'2e Messe'},
        {key:'sanctoral/11/2c',label:'3e Messe'}
    ]
};
var _currentMultiKey = null;

function renderMultiSelector(baseKey, activeKey) {
    var sel = document.getElementById('multi-messe-selector');
    var cfg = MULTI_MESSES[baseKey];
    if (!cfg) { sel.style.display='none'; return; }
    sel.style.display='flex';
    sel.innerHTML = cfg.map(function(m){
        var a = m.key===activeKey;
        return '<button onclick="switchMesse(\''+m.key+'\',\''+baseKey+'\')" style="padding:6px 12px;border:none;cursor:pointer;font-family:\'Cinzel\',serif;font-size:.62rem;letter-spacing:.06em;background:'+(a?'#8b1a1a':'transparent')+';color:'+(a?'#fff':'#8b1a1a')+';">'+m.label+'</button>';
    }).join('');
}

async function switchMesse(newKey, baseKey) {
    _currentMultiKey = newKey;
    renderMultiSelector(baseKey, newKey);
    document.getElementById('propre-pieces').innerHTML = '<div style="text-align:center;padding:40px;color:#8b7355;">Chargement…</div>';
    try {
        var resp = await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',newKey).order('display_order',{ascending:true});
        if (resp.error) throw resp.error;
        _propresData = resp.data&&resp.data.length?resp.data:null;
        var cfg = MULTI_MESSES[baseKey];
        var m = cfg&&cfg.find(function(x){return x.key===newKey;});
        if (m) document.getElementById('propre-fete-input').value = (document.getElementById('propre-fete-input').value.split(' — ')[0])+' — '+m.label;
        renderProprePieces();
    } catch(e) {
        document.getElementById('propre-pieces').innerHTML='<div style="color:#8b1a1a;padding:20px;">Erreur : '+escH(String(e.message||e))+'</div>';
    }
}

var COMMUN_KEYS = {
    martyr:'sanctoral/1/13',martyrs:'sanctoral/1/15',
    confesseur_pont:'sanctoral/1/4',confesseur:'sanctoral/1/1',
    vierge:'sanctoral/10/3',veuve:'sanctoral/10/8'
};

function getCommunKey(ordo) {
    if (!ordo||ordo.source!=='sanctoral') return null;
    var f=(ordo.fete||'').toLowerCase(), c=(ordo.couleur||'').toLowerCase();
    if (c==='rouge') return f.includes('martyrs')||f.includes('et compagnons')?COMMUN_KEYS.martyrs:COMMUN_KEYS.martyr;
    if (f.includes('pape')||f.includes('évêque')||f.includes('archevêque')) return COMMUN_KEYS.confesseur_pont;
    if (f.includes('vierge')&&!f.includes('martyr')) return COMMUN_KEYS.vierge;
    if (f.includes('reine')||f.includes('veuve')) return COMMUN_KEYS.veuve;
    return COMMUN_KEYS.confesseur;
}

async function ouvrirPropre(dateISO, dateFr) {
    var parts = dateISO.split('-').map(Number);
    var ordo  = Ordo1962.getDay(parts[0],parts[1],parts[2]);
    var massKey = (typeof Ordo1962.getProperKey==='function')?Ordo1962.getProperKey(ordo):null;
    document.getElementById('propre-date-label').textContent = dateFr;
    document.getElementById('propre-fete-input').value = (ordo&&ordo.fete)?ordo.fete:'';
    _propresDateISO = dateISO;
    document.getElementById('propre-pieces').innerHTML='<div style="text-align:center;padding:40px;color:#8b7355;">Chargement…</div>';
    document.getElementById('modal-propre').style.display='flex';
    if (!massKey) {
        document.getElementById('multi-messe-selector').style.display='none';
        document.getElementById('propre-pieces').innerHTML='<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;">Propre non disponible pour ce jour.</div>';
        return;
    }
    _currentMultiKey = massKey;
    renderMultiSelector(massKey, massKey);
    if (MULTI_MESSES[massKey]) {
        document.getElementById('propre-fete-input').value=((ordo&&ordo.fete)?ordo.fete:'')+' — '+MULTI_MESSES[massKey][0].label;
    }
    try {
        var resp = await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',massKey).order('display_order',{ascending:true});
        if (resp.error) throw resp.error;
        var propData = resp.data&&resp.data.length?resp.data:null;
        if (propData&&ordo&&ordo.source==='sanctoral') {
            var codes=new Set(propData.map(function(p){return p.part_code;}));
            var attendus=['introit','collecte','epitre','graduel','evangile','offertoire','secrete','communion','postcommunion'];
            var manquants=attendus.filter(function(p){return !codes.has(p);});
            if (manquants.length>0) {
                var cKey=getCommunKey(ordo);
                if (cKey) {
                    var rc=await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',cKey).in('part_code',manquants);
                    if (!rc.error&&rc.data&&rc.data.length) {
                        var cp=rc.data.map(function(p){return Object.assign({},p,{_du_commun:true,part_label:p.part_label+' (commun)'});});
                        propData=propData.concat(cp).sort(function(a,b){return a.display_order-b.display_order;});
                    }
                }
            }
        }
        _propresData = propData;
        renderProprePieces();
    } catch(e) {
        document.getElementById('propre-pieces').innerHTML='<div style="color:#8b1a1a;padding:20px;">Erreur : '+escH(String(e.message||e))+'</div>';
    }
}

function setPropreLang(lang) {
    _propresLang=lang;
    document.getElementById('btn-lang-la').style.background=lang==='la'?'#b8962a':'transparent';
    document.getElementById('btn-lang-la').style.color=lang==='la'?'#fff':'#b8962a';
    document.getElementById('btn-lang-fr').style.background=lang==='fr'?'#b8962a':'transparent';
    document.getElementById('btn-lang-fr').style.color=lang==='fr'?'#fff':'#b8962a';
    renderProprePieces();
}

function renderProprePieces() {
    var c=document.getElementById('propre-pieces');
    if (!_propresData){c.innerHTML='<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;">Propre non disponible.</div>';return;}
    var lang=_propresLang;
    c.innerHTML=_propresData.map(function(p){
        var txt=(lang==='la'?p.text_la:p.text_fr)||(lang==='la'?p.text_fr:p.text_la)||'';
        var col=PIECE_COLORS[p.part_code]||'#1a1108';
        var ref=p.reference?'<span style="font-size:.85em;color:#8b7355;font-style:italic;margin-left:8px;">'+escH(p.reference)+'</span>':'';
        var badge=p._du_commun?'<span style="font-size:.7em;color:#8b7355;font-style:italic;margin-left:8px;">du commun</span>':'';
        return '<div>'
            +'<div style="font-family:\'Cinzel\',serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:'+col+';border-bottom:1px solid '+col+'22;padding-bottom:4px;margin-bottom:8px;display:flex;align-items:baseline;gap:4px;">'
            +'<span>'+escH(p.part_label.replace(' (commun)',''))+'</span>'+ref+badge+'</div>'
            +'<div style="font-size:1.05rem;line-height:1.75;color:#1a1108;white-space:pre-wrap;">'+escH(txt)+'</div>'
            +'</div>';
    }).join('');
}

function fermerModalPropre() {
    document.getElementById('modal-propre').style.display='none';
    _propresData=null;
}

function exportPropreDocx() {
    if (!_propresData||typeof docx==='undefined') return;
    var D=docx,fete=document.getElementById('propre-fete-input').value||'Propre',dateFr=document.getElementById('propre-date-label').textContent,lang=_propresLang;
    var children=[
        new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:80},children:[new D.TextRun({text:fete.toUpperCase(),bold:true,size:28,font:'Calibri'})]}),
        new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:300},children:[new D.TextRun({text:dateFr,italics:true,size:22,font:'Calibri',color:'5a3e1b'})]})
    ];
    _propresData.forEach(function(p){
        var txt=(lang==='la'?p.text_la:p.text_fr)||(lang==='la'?p.text_fr:p.text_la)||'';
        var titre=p.reference?(p.part_label.toUpperCase()+' \u2014 '+p.reference):p.part_label.toUpperCase();
        children.push(new D.Paragraph({spacing:{before:240,after:80},children:[new D.TextRun({text:titre,bold:true,size:20,font:'Calibri',color:'8b1a1a'})]}));
        children.push(new D.Paragraph({spacing:{after:160},children:[new D.TextRun({text:txt,size:22,font:'Calibri'})]}));
    });
    D.Packer.toBlob(new D.Document({sections:[{properties:{},children:children}]})).then(function(blob){
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PROPRE_'+_propresDateISO+'.docx';a.click();
    });
}

function exportPropreJpeg() {
    if (!_propresData) return;
    var fete=document.getElementById('propre-fete-input').value||'Propre',dateFr=document.getElementById('propre-date-label').textContent,lang=_propresLang,PAGE_W=827;
    var rows=_propresData.map(function(p){
        var txt=(lang==='la'?p.text_la:p.text_fr)||(lang==='la'?p.text_fr:p.text_la)||'';
        var col=PIECE_COLORS[p.part_code]||'#1a1108';
        var ref=p.reference?' \u2014 '+p.reference:'';
        return '<div style="margin-bottom:14px;"><div style="font-family:Cinzel,serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:'+col+';border-bottom:0.5px solid '+col+'33;padding-bottom:3px;margin-bottom:6px;">'+escH(p.part_label)+escH(ref)+'</div><div style="font-family:Georgia,serif;font-size:12px;line-height:1.65;white-space:pre-wrap;">'+escH(txt)+'</div></div>';
    }).join('');
    var iframe=document.createElement('iframe');
    iframe.style.cssText='position:absolute;left:-9999px;top:0;width:'+PAGE_W+'px;height:1px;border:none;visibility:hidden';
    document.body.appendChild(iframe);
    var idoc=iframe.contentDocument;
    idoc.open();
    idoc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{width:'+PAGE_W+'px;background:#fff;color:#1a1108;padding:38px 52px;font-family:Georgia,serif;}</style></head><body><div style="font-family:Cinzel,serif;font-size:17px;font-weight:700;text-align:center;letter-spacing:.18em;margin-bottom:4px;">'+escH(fete)+'</div><div style="font-style:italic;text-align:center;color:#8b7355;font-size:13px;margin-bottom:12px;">'+escH(dateFr)+'</div><div style="text-align:center;color:#b8962a;letter-spacing:.5em;margin-bottom:14px;font-size:10px;">&#10022; &nbsp; &#10022; &nbsp; &#10022;</div><div style="border-top:1.5px solid #b8962a;margin-bottom:18px;"></div>'+rows+'</body></html>');
    idoc.close();
    setTimeout(function(){
        var bodyH=idoc.body.scrollHeight;
        iframe.style.height=bodyH+'px';
        setTimeout(function(){
            html2canvas(idoc.body,{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false,width:PAGE_W,height:bodyH,windowWidth:PAGE_W,windowHeight:bodyH}).then(function(canvas){
                document.body.removeChild(iframe);
                canvas.toBlob(function(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PROPRE_'+_propresDateISO+'.jpg';a.click();},'image/jpeg',0.93);
            });
        },50);
    },900);
}
</script>

</html>
