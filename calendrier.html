<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planification — Messes</title>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* ── Badge ordo dans les items du calendrier ──────────── */
    .ordo-badge {
        display:inline-flex; align-items:center; gap:5px;
        font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.1em;
        padding:2px 7px 2px 5px; border-radius:2px; margin-top:4px;
        border:1px solid transparent; white-space:nowrap;
    }
    .ordo-pip-sm {
        width:7px; height:7px; border-radius:50%; flex-shrink:0;
        display:inline-block;
    }
    /* Couleurs de fond des badges */
    .ordo-badge.Blanc  { background:rgba(240,230,184,.35); border-color:rgba(201,168,64,.4); color:var(--ink-soft); }
    .ordo-badge.Blanc .ordo-pip-sm  { background:#d4af37; box-shadow:0 0 0 1px rgba(184,150,42,.5); }
    .ordo-badge.Rouge  { background:rgba(155,32,32,.08);  border-color:rgba(139,26,26,.25);  color:var(--rubric); }
    .ordo-badge.Rouge .ordo-pip-sm  { background:#9b2020; }
    .ordo-badge.Vert   { background:rgba(58,102,68,.08);  border-color:rgba(58,102,68,.25);  color:var(--green); }
    .ordo-badge.Vert .ordo-pip-sm   { background:#3a6644; }
    .ordo-badge.Violet { background:rgba(92,45,122,.08);  border-color:rgba(92,45,122,.25);  color:#5c2d7a; }
    .ordo-badge.Violet .ordo-pip-sm { background:#5c2d7a; }
    .ordo-badge.Rose   { background:rgba(212,104,138,.09);border-color:rgba(212,104,138,.3); color:#a04060; }
    .ordo-badge.Rose .ordo-pip-sm   { background:#d4688a; }
    .ordo-badge.Noir   { background:rgba(26,17,8,.06);    border-color:rgba(26,17,8,.2);     color:var(--ink-soft); }
    .ordo-badge.Noir .ordo-pip-sm   { background:#1a1108; }

    /* Légende couleurs liturgiques */
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="page-header">
            <span class="rubric-tag">Planification</span>
            <h1>Calendrier</h1>
            <div class="ornament">✦ ✦ ✦</div>
        </div>
        <h2 class="section-title">📅 Prochains 15 jours</h2>
        <div id="liste-proche"></div>

        <div class="search-container">
            <h2 style="text-align:left;margin-bottom:10px;">🔍 Trouver une autre date</h2>
            <input type="date" id="date-picker" style="margin-bottom:10px;">
            <button class="btn-primary" onclick="validerRecherche()">Rechercher</button>
            <div id="no-result" class="no-result-zone">
                <p style="color:var(--rubric);font-weight:600;margin:0 0 8px 0;font-family:'Cinzel',serif;font-size:.82rem;">Aucune messe à cette date</p>
                <p style="color:var(--ink-muted);font-size:.82rem;margin:0 0 12px 0;font-style:italic;">Vous pouvez créer une Messe privée :</p>
                <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
                    <input type="time" id="heure-privee-recherche" value="09:00"
                        style="padding:8px 12px;width:auto;border:2px solid var(--gold);font-family:'Cinzel',serif;font-size:.9rem;color:var(--ink);">
                    <button class="btn-primary" style="width:auto;padding:10px 18px;" onclick="ouvrirModalPrivee()">Messe privée</button>
                </div>
            </div>
        </div>

        <div id="liste-globale"></div>
        <div id="chargement" style="color:var(--ink-muted);font-size:.9rem;text-align:center;padding:40px;font-style:italic;">
            Chargement du calendrier&hellip;
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <!-- Modal saisie -->
    <div id="modal-saisie">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0 0 4px;color:var(--ink);font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.06em;text-align:center;"></h3>
            <input type="hidden" id="input-date-iso">
            <input type="hidden" id="input-google-id">
            <input type="hidden" id="input-heure">
            <label>Intention pour</label>
            <input type="text" id="nom_intention" placeholder="ex : Défunts Famille Dupont">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;">
                    <label>Type</label>
                    <select id="type_intention">
                        <option value="Défunt">✝️ Défunt</option>
                        <option value="Vivant">🙏 Vivant</option>
                        <option value="Action de grâce">✨ Action de grâce</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Demandeur</label>
                    <input type="text" id="nom_donateur" placeholder="Mme Dupont">
                </div>
            </div>
            <label>Note privée</label>
            <textarea id="commentaire" rows="2"></textarea>
            <button class="btn-save" onclick="enregistrerIntention()">✅ Confirmer l'intention</button>
            <button onclick="fermerModal()" style="background:none;border:none;color:var(--ink-muted);cursor:pointer;width:100%;margin-top:14px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;min-height:36px;">Fermer</button>
        </div>
    </div>

    <script src="ordo1962.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
        const GOOGLE_API_KEY = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
        const CALENDAR_ID    = 'saintlouisenville67@gmail.com';

        // Extrait "YYYY-MM-DD" en heure locale (évite le décalage UTC)
        function isoLocal(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const j = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${j}`;
        }

        // Cache ordo : { 'YYYY-MM-DD': { fete, classe, couleur }, ... }
        let ordoCache = {};

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ── Charge les données ordo via le moteur Ordo1962 (missel 1962) ──
        function chargerOrdo(dateMin, dateMax) {
            // Calcul local — pas de requête réseau
            const d = new Date(dateMin + 'T12:00:00');
            const end = new Date(dateMax + 'T12:00:00');
            while (d <= end) {
                const iso = isoLocal(d);
                const o = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());
                if (o && o.fete) ordoCache[iso] = o;
                d.setDate(d.getDate() + 1);
            }
            return Promise.resolve();
        }

        // ── Génère le badge ordo pour une date ISO ──────────
        function badgeOrdo(dateISO) {
            const o = ordoCache[dateISO];
            if (!o) return '';
            const couleurs = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];
            const c = couleurs.includes(o.couleur) ? o.couleur : null;
            if (!c) return '';
            const feteLabel = o.fete.length > 36 ? o.fete.substring(0,34) + '…' : o.fete;
            return `<div class="ordo-badge ${c}">` +
                `<span class="ordo-pip-sm" style="background:${pipColor(c)}"></span>` +
                `<span>${feteLabel}</span>` +
                `</div>`;
        }

        function pipColor(c) {
            return {Blanc:'#d4af37',Rouge:'#9b2020',Vert:'#3a6644',Violet:'#5c2d7a',Rose:'#d4688a',Noir:'#1a1108'}[c] || '#999';
        }

        async function editerNomCal(id) {
        const span = document.getElementById('cal-nom-' + id);
        if (!span) return;
        const ancienNom = span.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.value = ancienNom;
        input.style.cssText = 'font-family:inherit;font-size:inherit;border:1px solid var(--gold);border-radius:2px;padding:2px 6px;width:140px;background:var(--vellum-light);color:var(--ink);';
        span.replaceWith(input);
        input.focus(); input.select();

        async function valider() {
            const nouveau = input.value.trim();
            if (!nouveau || nouveau === ancienNom) { input.replaceWith(span); return; }
            try {
                const { error } = await maConnexion.from('intentions').update({ nom_intention: nouveau }).eq('id', id);
                if (error) throw error;
                span.textContent = nouveau;
            } catch(e) { alert('Erreur : ' + e.message); }
            input.replaceWith(span);
        }
        input.addEventListener('blur', valider);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = ancienNom; input.blur(); }
        });
    }

    async function chargerAgenda() {
            if (typeof maConnexion === 'undefined') { setTimeout(chargerAgenda, 500); return; }
            try {
                const [{ data: intentions }, gcalResp] = await Promise.all([
                    maConnexion.from('intentions').select('*').neq('statut','refuse'),
                    fetch(`https://www.googleapis.com/calendar/v3/calendars/${CALENDAR_ID}/events`
                        + `?key=${GOOGLE_API_KEY}`
                        + `&timeMin=${new Date().toISOString()}`
                        + `&timeMax=${(() => { const d = new Date(); d.setFullYear(d.getFullYear()+1); return d.toISOString(); })()}`
                        + `&singleEvents=true&orderBy=startTime&maxResults=500`)
                ]);

                const now      = new Date();
                const limite15 = new Date(); limite15.setDate(now.getDate() + 15);
                const data     = await gcalResp.json();

                document.getElementById('chargement').style.display = 'none';
                if (!data.items) return;

                const estUneMesse = e => /messe/i.test((e.summary || '').trim());
                const messes = data.items.filter(estUneMesse);
                if (!messes.length) return;

                // Charger l'ordo pour toute la plage
                const dates   = messes.map(e => (e.start.dateTime || e.start.date).split('T')[0]);
                const dateMin = dates[0];
                const dateMax = dates[dates.length-1];
                await chargerOrdo(dateMin, dateMax);

                const divProche  = document.getElementById('liste-proche');
                const divGlobale = document.getElementById('liste-globale');
                divProche.innerHTML = ''; divGlobale.innerHTML = '';

                messes.forEach(event => {
                    const start      = event.start.dateTime || event.start.date;
                    const dateObj    = new Date(start);
                    const dateISO    = isoLocal(dateObj);
                    const dateFr     = dateObj.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
                    const heureBrute = dateObj.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
                    const heureFr    = heureBrute.replace(':','h');

                    const intention = intentions ? intentions.find(i => {
                        const memeId       = i.google_event_id === event.id;
                        const estPrise     = i.statut === 'valide' || i.en_edition === true;
                        const memeDateHeure = i.date_messe === dateISO && i.heure_messe === heureBrute && estPrise;
                        return memeId || memeDateHeure;
                    }) : null;

                    const estLibre = !intention;
                    let contenuAction = '';
                    if (estLibre) {
                        contenuAction = '<button class="btn-action"'
                            + ' data-iso="'     + dateISO + '"'
                            + ' data-datefr="'  + dateFr  + '"'
                            + ' data-googleid="'+ event.id + '"'
                            + ' data-heure="'   + heureFr + '"'
                            + ' onclick="ouvrirModalFromBtn(this)">✍️ Attribuer</button>';
                    } else {
                        const icone = intention.type_intention === 'Défunt' ? '✝️'
                                    : intention.type_intention === 'Vivant' ? '🙏' : '✨';
                        contenuAction =
                            '<div style="display:flex;align-items:center;">'
                            + '<div style="text-align:right;margin-right:8px;">'
                            + '<span class="nom-intention-display" id="cal-nom-' + intention.id + '">' + intention.nom_intention + '</span>'
                            + '<button title="Modifier" style="background:none;border:none;cursor:pointer;color:var(--gold);font-size:.8rem;padding:0 2px;margin-left:4px;" onclick="editerNomCal(' + intention.id + ')">✏️</button>'
                            + '<span class="type-intention-badge">' + icone + ' ' + intention.type_intention + '</span>'
                            + (intention.commentaire ? '<span style="font-size:.68rem;color:var(--gold);display:block;font-style:italic;">🗒 ' + intention.commentaire + '</span>' : '')
                            + '</div>'
                            + '<div style="display:flex;flex-direction:column;gap:3px;">'
                            + '<button class="btn-copy" title="Copier"'
                            + ' data-nom="' + intention.nom_intention.replace(/"/g,'&quot;') + '"'
                            + ' data-datefr="' + dateFr + '" data-heure="' + heureFr + '"'
                            + ' onclick="copierMessageFromBtn(this)">📋</button>'
                            + '<button class="btn-delete" title="Supprimer"'
                            + ' data-id="' + intention.id + '"'
                            + ' onclick="supprimerFromBtn(this)">🗑️</button>'
                            + '</div></div>';
                    }

                    // Badge ordo inséré sous la date
                    const ordo = badgeOrdo(dateISO);
                    const _dfEsc = dateFr.replace(/'/g,"&#39;");
                    const btnPropre = '<button onclick="ouvrirPropre(\'' + dateISO + '\',\'' + _dfEsc + '\')" '
                        + 'style="margin-top:6px;font-family:\'Cinzel\',serif;font-size:.6rem;letter-spacing:.1em;padding:4px 10px;background:transparent;border:1px solid #b8962a44;color:#b8962a;border-radius:4px;cursor:pointer;width:100%;">'
                        + '✦ Propre de la Messe</button>';

                    const html = '<div class="messe-item ' + (estLibre ? 'libre' : 'prise') + '" data-iso="' + dateISO + '">'
                        + '<div>'
                        + '<div class="date-principale">' + dateFr + '</div>'
                        + '<div class="horaire">🕒 ' + heureFr + ' — ' + event.summary + '</div>'
                        + ordo
                        + btnPropre
                        + '</div>'
                        + '<div>' + contenuAction + '</div></div>';

                    if (dateObj <= limite15) divProche.innerHTML += html;
                    else divGlobale.innerHTML += html;
                });

                document.querySelectorAll('#liste-globale .messe-item').forEach(item => item.style.display = 'none');
            } catch (e) { console.error(e); }
        }

        function ouvrirModalFromBtn(btn) {
            ouvrirModal(btn.dataset.iso, btn.dataset.datefr, btn.dataset.googleid, btn.dataset.heure);
        }

        function copierMessageFromBtn(btn) {
            const texte = 'Bonjour,\n\nLa Messe à votre intention (' + btn.dataset.nom + ') sera célébrée le ' + btn.dataset.datefr + ' à ' + btn.dataset.heure + '.\n\nJe vous assure de ma prière,\nAbbé Molin';
            navigator.clipboard.writeText(texte)
                .then(() => AppModal.alert('📋','Copié !','Le message a été copié dans le presse-papiers.'))
                .catch(() => AppModal.alert('❌','Erreur','Impossible de copier. Vérifiez les permissions du navigateur.'));
        }

        async function supprimerFromBtn(btn) {
            const id = btn.dataset.id;
            const ok = await AppModal.confirm('🗑️',"Supprimer l'intention ?",'Cette messe sera libérée.','Supprimer','app-modal-btn-danger');
            if (!ok) return;
            const { error } = await maConnexion.from('intentions').delete().eq('id', id);
            if (error) { AppModal.alert('❌','Erreur',error.message); return; }
            chargerAgenda();
        }

        function ouvrirModal(iso, dateFr, googleId, heure) {
            document.getElementById('nom_intention').value  = '';
            document.getElementById('nom_donateur').value   = '';
            document.getElementById('commentaire').value    = '';
            document.getElementById('input-date-iso').value = iso;
            document.getElementById('input-google-id').value= googleId;
            document.getElementById('input-heure').value    = heure;
            document.getElementById('modal-title').innerText = dateFr + ' à ' + heure;
            document.getElementById('modal-saisie').style.display = 'flex';
        }

        function fermerModal() { document.getElementById('modal-saisie').style.display = 'none'; }

        async function enregistrerIntention() {
            const date_messe      = document.getElementById('input-date-iso').value;
            const google_event_id = document.getElementById('input-google-id').value;
            const nom_intention   = document.getElementById('nom_intention').value.trim();
            const heure_brute     = document.getElementById('input-heure').value.replace('h',':');
            const commentaire     = document.getElementById('commentaire').value.trim();
            if (!nom_intention) { AppModal.alert('⚠️','Champ manquant',"Veuillez indiquer l'intention."); return; }
            const { error } = await maConnexion.from('intentions').insert([{
                date_messe, google_event_id,
                heure_messe:    heure_brute,
                nom_intention,
                type_intention: document.getElementById('type_intention').value,
                nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
                commentaire,
                statut:         'valide',
                email_donateur: 'non@renseigne.fr',
                mail_envoye:    true
            }]);
            if (error) { AppModal.alert('❌','Erreur',error.message); return; }
            fermerModal();
            showToast('✅ Intention enregistrée');
            chargerAgenda();
        }

        async function validerRecherche() {
            const val = document.getElementById('date-picker').value;
            if (!val) return;

            const noResult = document.getElementById('no-result');
            noResult.classList.remove('visible');

            // 1. Chercher dans la liste déjà affichée
            let trouve = false;
            document.querySelectorAll('#liste-globale .messe-item').forEach(item => {
                const match = item.getAttribute('data-iso') === val;
                item.style.display = match ? '' : 'none';
                if (match) trouve = true;
            });

            if (trouve) return;

            // 2. Pas trouvé dans la liste locale → appel direct Google Calendar
            const btnRecherche = document.querySelector('.search-container .btn-primary');
            if (btnRecherche) btnRecherche.textContent = 'Recherche…';
            try {
                const tMin = new Date(val + 'T00:00:00').toISOString();
                const tMax = new Date(val + 'T23:59:59').toISOString();
                const url  = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                    + `?key=${GOOGLE_API_KEY}&timeMin=${tMin}&timeMax=${tMax}`
                    + `&singleEvents=true&orderBy=startTime&maxResults=50`;
                const resp = await fetch(url);
                const data = await resp.json();
                const messes = (data.items || []).filter(e => /messe/i.test((e.summary || '')));

                if (messes.length > 0) {
                    // Injecter les messes trouvées dans la liste pour que renderTimes fonctionne
                    // Réutiliser le rendu existant via les time-chips
                    document.querySelectorAll('#liste-globale .messe-item').forEach(i => i.style.display = 'none');
                    const liste = document.getElementById('liste-globale');
                    messes.forEach(e => {
                        const dt    = new Date(e.start.dateTime || e.start.date);
                        const heure = dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
                        const fakeItem = document.createElement('div');
                        fakeItem.className = 'messe-item';
                        fakeItem.setAttribute('data-iso', val);
                        fakeItem.setAttribute('data-event-id', e.id);
                        fakeItem.innerHTML = `<span>${new Date(val+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span><span style="color:var(--rubric);font-family:'Cinzel',serif;">${heure}</span>`;
                        liste.appendChild(fakeItem);
                        fakeItem.style.display = '';
                        trouve = true;
                    });
                    // Déclencher le rendu des créneaux comme si on avait cliqué
                    if (typeof renderTimesForDate === 'function') renderTimesForDate(val);
                }
            } catch(e) {
                console.error('Erreur Google Calendar recherche :', e);
            } finally {
                if (btnRecherche) btnRecherche.textContent = 'Rechercher';
            }

            if (!trouve) {
                noResult.classList.add('visible');
                const dateObj = new Date(val + 'T00:00:00');
                noResult.dataset.dateIso = val;
                noResult.dataset.dateFr  = dateObj.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
            }
        }

        function ouvrirModalPrivee() {
            const noResult   = document.getElementById('no-result');
            const iso        = noResult.dataset.dateIso;
            const dateFr     = noResult.dataset.dateFr;
            const heureInput = document.getElementById('heure-privee-recherche').value || '09:00';
            const [hh, mm]   = heureInput.split(':');
            ouvrirModal(iso, dateFr + ' (Messe privée)', 'prive_' + iso, `${hh}h${mm}`);
        }

        window.onload = chargerAgenda;
    </script>


    <!-- ══════════════════════════════════════════════════
         MODAL PROPRE DE LA MESSE
    ══════════════════════════════════════════════════ -->
    <div id="modal-propre" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;">
      <div style="background:#fffdf7;border-radius:10px;max-width:680px;width:100%;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.25);">
        <div style="background:#1a1108;border-radius:10px 10px 0 0;padding:16px 20px;display:flex;align-items:center;gap:10px;">
          <div style="flex:1;">
            <div id="propre-date-label" style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;color:#b8962a;text-transform:uppercase;margin-bottom:4px;"></div>
            <input id="propre-fete-input" type="text" style="font-family:'Cinzel',serif;font-size:.95rem;color:#f5f0e4;background:transparent;border:none;border-bottom:1px solid #b8962a55;width:100%;outline:none;padding:2px 0;letter-spacing:.04em;" placeholder="Nom de la fete..."/>
          </div>
          <button onclick="fermerModalPropre()" style="background:none;border:none;color:#b8962a;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;flex-shrink:0;">&#10005;</button>
        </div>
        <div style="background:#f5f0e4;border-bottom:1px solid #d4c9a8;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="display:flex;border:1px solid #b8962a;border-radius:6px;overflow:hidden;">
            <button id="btn-lang-la" onclick="setPropreLang('la')" style="padding:6px 16px;background:#b8962a;color:#fff;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">LATIN</button>
            <button id="btn-lang-fr" onclick="setPropreLang('fr')" style="padding:6px 16px;background:transparent;color:#b8962a;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">FRAN&#199;AIS</button>
          </div>
          <div style="flex:1;"></div>
          <button onclick="exportPropreDocx()" style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:7px 14px;background:#1a1108;color:#b8962a;border:none;border-radius:6px;cursor:pointer;">&#128196; .docx</button>
          <button onclick="exportPropreJpeg()" style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:7px 14px;background:#1a1108;color:#f5f0e4;border:none;border-radius:6px;cursor:pointer;">&#128247; .jpg</button>
        </div>
        <div id="propre-pieces" style="padding:20px;display:flex;flex-direction:column;gap:18px;max-height:65vh;overflow-y:auto;font-family:Georgia,serif;"></div>
        <div style="padding:12px 20px;border-top:1px solid #d4c9a8;text-align:center;">
          <button onclick="fermerModalPropre()" style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:#8b7355;cursor:pointer;">Fermer</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.3/dist/index.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
    // ── Propres de la Messe — Supabase ─────────────────────────────────
    var _propresLang    = 'la';
    var _propresData    = null;
    var _propresDateISO = null;

    var PIECE_COLORS = {
        introit:'#1a1108', collecte:'#5a3e1b', epitre:'#1a4a2a',
        graduel:'#3a1a4a', trait:'#3a1a4a', alleluia:'#3a1a4a',
        evangile:'#8b1a1a', offertoire:'#1a3a5a', secrete:'#5a3e1b',
        preface:'#4a2a1a', communion:'#1a1108', postcommunion:'#5a3e1b'
    };

    function escH(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function ouvrirPropre(dateISO, dateFr) {
        var parts = dateISO.split('-').map(Number);
        var ordo  = Ordo1962.getDay(parts[0], parts[1], parts[2]);
        var massKey = (typeof Ordo1962.getProperKey === 'function') ? Ordo1962.getProperKey(ordo) : null;

        document.getElementById('propre-date-label').textContent  = dateFr;
        document.getElementById('propre-fete-input').value = (ordo && ordo.fete) ? ordo.fete : '';
        _propresDateISO = dateISO;

        document.getElementById('propre-pieces').innerHTML =
            '<div style="text-align:center;padding:40px;color:#8b7355;font-size:.85rem;letter-spacing:.1em;">Chargement\u2026</div>';
        document.getElementById('modal-propre').style.display = 'flex';

        if (!massKey) {
            document.getElementById('propre-pieces').innerHTML =
                '<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;font-size:1rem;">Propre non disponible pour ce jour.</div>';
            return;
        }

        try {
            var resp = await maConnexion
                .from('propers')
                .select('part_code, part_label, reference, text_la, text_fr, display_order')
                .eq('mass_key', massKey)
                .order('display_order', { ascending: true });

            if (resp.error) throw resp.error;
            _propresData = resp.data && resp.data.length ? resp.data : null;
            renderProprePieces();
        } catch(e) {
            console.error('Erreur propre:', e);
            document.getElementById('propre-pieces').innerHTML =
                '<div style="color:#8b1a1a;padding:20px;font-size:.9rem;">Erreur de chargement : ' + escH(String(e.message || e)) + '</div>';
        }
    }

    function setPropreLang(lang) {
        _propresLang = lang;
        var btnLa = document.getElementById('btn-lang-la');
        var btnFr = document.getElementById('btn-lang-fr');
        btnLa.style.background = lang === 'la' ? '#b8962a' : 'transparent';
        btnLa.style.color      = lang === 'la' ? '#fff'    : '#b8962a';
        btnFr.style.background = lang === 'fr' ? '#b8962a' : 'transparent';
        btnFr.style.color      = lang === 'fr' ? '#fff'    : '#b8962a';
        renderProprePieces();
    }

    function renderProprePieces() {
        var c = document.getElementById('propre-pieces');
        if (!_propresData) {
            c.innerHTML = '<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;font-size:1rem;">Propre non disponible pour ce jour.</div>';
            return;
        }
        var lang = _propresLang;
        c.innerHTML = _propresData.map(function(p) {
            var txt = (lang === 'la' ? p.text_la : p.text_fr) || (lang === 'la' ? p.text_fr : p.text_la) || '';
            var col = PIECE_COLORS[p.part_code] || '#1a1108';
            var ref = p.reference ? '<span style="font-size:.85em;color:#8b7355;font-style:italic;margin-left:8px;">' + escH(p.reference) + '</span>' : '';
            return '<div>'
                + '<div style="font-family:\'Cinzel\',serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:' + col + ';border-bottom:1px solid ' + col + '22;padding-bottom:4px;margin-bottom:8px;display:flex;align-items:baseline;gap:4px;">'
                + '<span>' + escH(p.part_label) + '</span>' + ref
                + '</div>'
                + '<div style="font-size:1.05rem;line-height:1.75;color:#1a1108;white-space:pre-wrap;">' + escH(txt) + '</div>'
                + '</div>';
        }).join('');
    }

    function fermerModalPropre() {
        document.getElementById('modal-propre').style.display = 'none';
        _propresData = null;
    }

    // ── Export .docx ────────────────────────────────────────────────
    function exportPropreDocx() {
        if (!_propresData || typeof docx === 'undefined') return;
        var D = docx;
        var fete   = document.getElementById('propre-fete-input').value || 'Propre de la Messe';
        var dateFr = document.getElementById('propre-date-label').textContent;
        var lang   = _propresLang;
        var children = [
            new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{after:80},
                children:[new D.TextRun({text:fete.toUpperCase(), bold:true, size:28, font:'Calibri'})] }),
            new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{after:300},
                children:[new D.TextRun({text:dateFr, italics:true, size:22, font:'Calibri', color:'5a3e1b'})] })
        ];
        _propresData.forEach(function(p) {
            var txt   = (lang === 'la' ? p.text_la : p.text_fr) || (lang === 'la' ? p.text_fr : p.text_la) || '';
            var titre = p.reference ? (p.part_label.toUpperCase() + '  \u2014  ' + p.reference) : p.part_label.toUpperCase();
            children.push(new D.Paragraph({ spacing:{before:240,after:80},
                children:[new D.TextRun({text:titre, bold:true, size:20, font:'Calibri', color:'8b1a1a'})] }));
            children.push(new D.Paragraph({ spacing:{after:160},
                children:[new D.TextRun({text:txt, size:22, font:'Calibri'})] }));
        });
        D.Packer.toBlob(new D.Document({sections:[{properties:{},children:children}]}))
            .then(function(blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'PROPRE_' + _propresDateISO + '.docx';
                a.click();
            });
    }

    // ── Export JPEG ─────────────────────────────────────────────────
    function exportPropreJpeg() {
        if (!_propresData) return;
        var fete   = document.getElementById('propre-fete-input').value || 'Propre de la Messe';
        var dateFr = document.getElementById('propre-date-label').textContent;
        var lang   = _propresLang;
        var PAGE_W = 827;

        var rows = _propresData.map(function(p) {
            var txt = (lang === 'la' ? p.text_la : p.text_fr) || (lang === 'la' ? p.text_fr : p.text_la) || '';
            var col = PIECE_COLORS[p.part_code] || '#1a1108';
            var ref = p.reference ? (' \u2014 ' + p.reference) : '';
            return '<div style="margin-bottom:14px;">'
                + '<div style="font-family:Cinzel,serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:' + col + ';border-bottom:0.5px solid ' + col + '33;padding-bottom:3px;margin-bottom:6px;">'
                + escH(p.part_label) + escH(ref) + '</div>'
                + '<div style="font-family:Georgia,serif;font-size:12px;line-height:1.65;white-space:pre-wrap;">' + escH(txt) + '</div>'
                + '</div>';
        }).join('');

        var iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + PAGE_W + 'px;height:1px;border:none;visibility:hidden';
        document.body.appendChild(iframe);
        var idoc = iframe.contentDocument;
        idoc.open();
        idoc.write('<!DOCTYPE html><html><head><meta charset="utf-8">'
            + '<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">'
            + '<style>*{margin:0;padding:0;box-sizing:border-box;}body{width:' + PAGE_W + 'px;background:#fff;color:#1a1108;padding:38px 52px;font-family:Georgia,serif;}</style>'
            + '</head><body>'
            + '<div style="font-family:Cinzel,serif;font-size:17px;font-weight:700;text-align:center;letter-spacing:.18em;margin-bottom:4px;">' + escH(fete) + '</div>'
            + '<div style="font-style:italic;text-align:center;color:#8b7355;font-size:13px;margin-bottom:12px;">' + escH(dateFr) + '</div>'
            + '<div style="text-align:center;color:#b8962a;letter-spacing:.5em;margin-bottom:14px;font-size:10px;">&#10022; &nbsp; &#10022; &nbsp; &#10022;</div>'
            + '<div style="border-top:1.5px solid #b8962a;margin-bottom:18px;"></div>'
            + rows + '</body></html>');
        idoc.close();

        setTimeout(function() {
            var bodyH = idoc.body.scrollHeight;
            iframe.style.height = bodyH + 'px';
            setTimeout(function() {
                html2canvas(idoc.body, {
                    scale:2, useCORS:true, allowTaint:true,
                    backgroundColor:'#ffffff', logging:false,
                    width:PAGE_W, height:bodyH,
                    windowWidth:PAGE_W, windowHeight:bodyH
                }).then(function(canvas) {
                    document.body.removeChild(iframe);
                    canvas.toBlob(function(blob) {
                        var a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'PROPRE_' + _propresDateISO + '.jpg';
                        a.click();
                    }, 'image/jpeg', 0.93);
                });
            }, 50);
        }, 900);
    }
    </script>

</body>
