<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calendrier — AppMesse</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1a1108">
<link rel="stylesheet" href="style.css">

<style>
/* ══════════════════════════════════════════════════════════
   CALENDRIER — style widget agenda sombre
══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    background: #1a1108;
    color: #f0e8d5;
    min-height: 100vh;
    padding-bottom: calc(70px + env(safe-area-inset-bottom,0px));
}

/* ── Header mois ─────────────────────────────────────────── */
.cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top,0px) + 18px) 20px 10px;
    background: #1a1108;
    position: sticky; top: 0; z-index: 100;
}
.cal-mois-label {
    font-family: 'Cinzel', serif; font-size: 1.15rem;
    font-weight: 600; color: #f0e8d5; letter-spacing: .04em;
}
.cal-nav-btns { display: flex; gap: 0; align-items: center; }
.cal-nav-btn {
    background: none; border: none; color: #9a9080;
    font-size: 1.3rem; padding: 6px 14px; cursor: pointer;
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
}
.cal-nav-btn:hover { color: #f0e8d5; }
.cal-add-btn {
    background: #b8962a; border: none; border-radius: 50%;
    width: 36px; height: 36px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; color: #1a1108; font-weight: bold;
    box-shadow: 0 2px 8px rgba(184,150,42,.35);
    transition: transform .15s, box-shadow .15s;
}
.cal-add-btn:active { transform: scale(.93); }

/* ── Jours de la semaine ─────────────────────────────────── */
.cal-dow-row {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 4px; margin-bottom: 2px;
}
.cal-dow {
    text-align: center;
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .1em; color: #6a6055;
    padding: 6px 0; text-transform: uppercase;
}
.cal-dow:last-child { color: #8b1a1a; } /* Dimanche */

/* ── Grille calendrier ───────────────────────────────────── */
.cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 4px; gap: 2px 0;
}

/* ── Cellule jour ────────────────────────────────────────── */
.cal-cell {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 2px; cursor: pointer; border-radius: 8px;
    transition: background .12s; min-height: 52px;
    position: relative;
}
.cal-cell:active { background: rgba(255,255,255,.06); }
.cal-cell.autre-mois { opacity: .25; pointer-events: none; }
.cal-cell.aujourd-hui .cal-jour-num {
    background: #b8962a; color: #1a1108;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
}
.cal-cell.selectionne .cal-jour-num {
    background: rgba(184,150,42,.25);
    border: 1.5px solid #b8962a;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
}
.cal-cell.dimanche .cal-jour-num { color: #c04040; }

.cal-jour-num {
    font-family: 'Cinzel', serif; font-size: .78rem;
    color: #d0c8b8; line-height: 1;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
}

/* ── Pastilles événements ────────────────────────────────── */
.cal-pips {
    display: flex; gap: 3px; flex-wrap: wrap;
    justify-content: center; margin-top: 3px;
    max-width: 44px;
}
.cal-pip {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
}
/* Statut intention uniquement — pas de couleur liturgique */
.cal-pip.libre   { background: transparent; border: 1.5px solid #4a7060; } /* contour vert = libre */
.cal-pip.attrib  { background: #b8962a; }                                   /* or plein = attribuée */
.cal-pip.attente { background: #c07030; }                                   /* orange = en attente */

/* ── Séparateur semaine ──────────────────────────────────── */
.cal-week-sep {
    grid-column: 1 / -1;
    height: 1px; background: rgba(255,255,255,.04);
    margin: 1px 8px;
}

/* ── Panneau détail du jour sélectionné ──────────────────── */
.cal-detail {
    margin: 8px 12px 0; border-radius: 12px;
    background: #231a0e; border: 1px solid rgba(184,150,42,.12);
    overflow: hidden; min-height: 48px;
    transition: all .2s ease;
}
.cal-detail-empty {
    padding: 20px; text-align: center;
    font-family: 'EB Garamond', serif; font-style: italic;
    color: #5a5045; font-size: .9rem;
}
.cal-detail-date {
    font-family: 'Cinzel', serif; font-size: .6rem;
    letter-spacing: .15em; text-transform: uppercase;
    color: #b8962a; padding: 12px 16px 6px;
    border-bottom: 1px solid rgba(255,255,255,.05);
}
.cal-legende {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 16px 4px;
    font-family: 'Cinzel', serif; font-size: .48rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #4a4035;
}
.cal-legende .cal-pip { margin: 0; }

.cal-detail-ordo {
    padding: 6px 16px; font-family: 'EB Garamond', serif;
    font-style: italic; font-size: .85rem; color: #9a8f7a;
    border-bottom: 1px solid rgba(255,255,255,.04);
}

/* Carte messe dans le détail */
.detail-messe {
    padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.04);
    display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: background .12s;
}
.detail-messe:active { background: rgba(255,255,255,.04); }
.detail-messe:last-child { border-bottom: none; }

.detail-messe-heure {
    font-family: 'Cinzel', serif; font-size: .65rem;
    color: #b8962a; flex-shrink: 0; padding-top: 2px;
    letter-spacing: .05em; min-width: 38px;
}
.detail-messe-info { flex: 1; }
.detail-messe-type {
    font-family: 'Cinzel', serif; font-size: .6rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #7a7060; margin-bottom: 2px;
}
.detail-messe-intention {
    font-family: 'EB Garamond', serif; font-size: .95rem;
    color: #f0e8d5; line-height: 1.4;
}
.detail-messe-donateur {
    font-family: 'EB Garamond', serif; font-size: .8rem;
    font-style: italic; color: #7a7060; margin-top: 1px;
}
.detail-messe-pretre {
    font-family: 'Cinzel', serif; font-size: .5rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #b8962a; opacity: .75; margin-top: 3px;
}
.detail-messe-status {
    display: flex; align-items: center; gap: 6px; margin-top: 4px;
}
.status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.status-libre  { background: #5a8055; }
.status-valide { background: #b8962a; }
.status-attente{ background: #8b5a2a; }
.status-label {
    font-family: 'Cinzel', serif; font-size: .5rem;
    letter-spacing: .1em; text-transform: uppercase; color: #5a5045;
}

.detail-messe-btn {
    background: rgba(184,150,42,.12); border: 1px solid rgba(184,150,42,.2);
    border-radius: 4px; padding: 6px 12px;
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #b8962a; cursor: pointer; white-space: nowrap;
    flex-shrink: 0; align-self: center;
    transition: background .15s;
}
.detail-messe-btn:hover { background: rgba(184,150,42,.22); }
.detail-messe-btn-edit {
    background: transparent; border-color: rgba(184,150,42,.35);
    color: rgba(184,150,42,.7);
}
.detail-messe-btn-edit:hover { background: rgba(184,150,42,.1); color: #b8962a; }

/* ── Toast ───────────────────────────────────────────────── */
#toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2a1e0e; border: 1px solid rgba(184,150,42,.3);
    color: #f0e8d5; border-radius: 6px; padding: 10px 20px;
    font-family: 'EB Garamond', serif; font-size: .9rem;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 500;
    white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modale saisie ───────────────────────────────────────── */
#modal-saisie {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.7); align-items: flex-end;
    justify-content: center;
    padding: 0 0 env(safe-area-inset-bottom,0px);
}
#modal-saisie.open { display: flex; }
.modal-content {
    background: #231a0e; border-radius: 16px 16px 0 0;
    width: 100%; max-width: 640px; max-height: 85vh;
    overflow-y: auto; padding: 20px 20px;
    border-top: 2px solid rgba(184,150,42,.3);
}
.modal-content h3 {
    font-family: 'Cinzel', serif; font-size: .85rem;
    letter-spacing: .1em; color: #b8962a;
    margin: 0 0 16px; text-align: center;
}
.modal-content label {
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #7a7060; display: block; margin: 12px 0 4px;
}
.modal-content input[type=text],
.modal-content input[type=date],
.modal-content input[type=time],
.modal-content select,
.modal-content textarea {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px; color: #f0e8d5;
    font-family: 'EB Garamond', serif; font-size: 1rem;
    outline: none;
}
.modal-content input:focus,
.modal-content select:focus,
.modal-content textarea:focus {
    border-color: rgba(184,150,42,.4);
}
.modal-content select option { background: #231a0e; }
.modal-row { display: flex; gap: 12px; }
.modal-row > div { flex: 1; }
.btn-save {
    width: 100%; margin-top: 16px; padding: 14px;
    background: #b8962a; border: none; border-radius: 8px;
    font-family: 'Cinzel', serif; font-size: .7rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #1a1108; font-weight: 700; cursor: pointer;
}
.btn-close-modal {
    width: 100%; margin-top: 8px; padding: 12px;
    background: none; border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; color: #7a7060; cursor: pointer;
    font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .1em;
}
.pretre-chip {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px; background: rgba(255,255,255,.04);
    font-family: 'Cinzel', serif; font-size: .55rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #7a7060; cursor: pointer; transition: all .15s;
}
.pretre-chip.actif {
    background: rgba(184,150,42,.15);
    border-color: rgba(184,150,42,.4); color: #b8962a;
}
</style>
</head>
<body>
<div id="menu-container"></div>

<!-- ════════════ HEADER ════════════ -->
<div class="cal-header">
    <span class="cal-mois-label" id="cal-mois-label">Octobre 2026</span>
    <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="changerMois(-1)">‹</button>
        <button class="cal-nav-btn" onclick="changerMois(1)">›</button>
        <button class="cal-add-btn" onclick="ouvrirModalLibre()" title="Ajouter une intention">+</button>
    </div>
</div>

<!-- ════════════ JOURS DE LA SEMAINE ════════════ -->
<div class="cal-dow-row">
    <div class="cal-dow">L</div>
    <div class="cal-dow">M</div>
    <div class="cal-dow">M</div>
    <div class="cal-dow">J</div>
    <div class="cal-dow">V</div>
    <div class="cal-dow">S</div>
    <div class="cal-dow">D</div>
</div>

<!-- ════════════ GRILLE ════════════ -->
<div class="cal-grid" id="cal-grid"></div>

<!-- ════════════ DÉTAIL JOUR ════════════ -->
<div class="cal-detail" id="cal-detail">
    <div class="cal-detail-empty">Sélectionnez un jour</div>
</div>

<!-- ════════════ TOAST ════════════ -->

<!-- ════════════ MODALE SAISIE ════════════ -->
<div id="modal-saisie">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <input type="hidden" id="input-date-iso">
        <input type="hidden" id="input-google-id">

                <div>
                    <label>Date</label>

                </div>
                <div>
                    <label>Heure</label>

            <div>
                <label>Type</label>
                <select id="type_intention">
                    <option value="Défunt">✝ Défunt</option>

        <button class="btn-close-modal" onclick="fermerModal()">Fermer</button>
    </div>
</div>


<!-- ════ MODALE PROPRE (partagée avec accueil) ════ -->
<div id="modal-propre-acc" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;">
  <div style="background:var(--vellum-light);border-radius:10px;max-width:680px;width:100%;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.25);">
    <div style="background:var(--dark-bg);border-radius:10px 10px 0 0;padding:16px 20px;display:flex;align-items:center;gap:10px;">
      <div style="flex:1;">
        <div id="propre-acc-date" style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;color:#b8962a;text-transform:uppercase;margin-bottom:4px;"></div>
        <div id="propre-acc-fete" style="font-family:'Cinzel',serif;font-size:.95rem;color:#f5f0e4;letter-spacing:.04em;"></div>
      </div>
      <button onclick="fermerPropreAcc()" style="background:none;border:none;color:#b8962a;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;flex-shrink:0;">✕</button>

      <div style="display:flex;border:1px solid #b8962a;border-radius:6px;overflow:hidden;">
        <button id="propre-acc-btn-la" onclick="setPropraAccLang('la')" style="padding:6px 16px;background:#b8962a;color:#fff;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">LATIN</button>
        <button id="propre-acc-btn-fr" onclick="setPropraAccLang('fr')" style="padding:6px 16px;background:transparent;color:#b8962a;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">FRANÇAIS</button>

      <div id="propre-acc-multi" style="display:none;border:1px solid #8b1a1a;border-radius:6px;overflow:hidden;"></div>
    </div>
    <div id="propre-acc-pieces" style="padding:20px;display:flex;flex-direction:column;gap:18px;max-height:65vh;overflow-y:auto;font-family:Georgia,serif;"></div>
    <div style="padding:12px 20px;border-top:1px solid var(--border-soft);text-align:center;">
      <button onclick="fermerPropreAcc()" style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:var(--ink-muted);cursor:pointer;">Fermer</button>
    </div>
  </div>

<script>

const GOOGLE_API_KEY  = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
const CALENDAR_ID     = 'saintlouisenville67@gmail.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzA4wI1QmU4s8fVx8Nd3yeLxheo1kifLyQpuxNLvlxl4g1Q3yXAQ3pyuGKVSR40JT1/exec';

const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin',
                 'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
// Alias utilisé par ouvrirPropreAccueil (même tableau, format court)
const MOIS = ['janvier','février','mars','avril','mai','juin',
              'juillet','août','septembre','octobre','novembre','décembre'];

// ── État ──────────────────────────────────────────────────
let _annee    = new Date().getFullYear();
let _mois     = new Date().getMonth(); // 0-based
let _jourSel  = null;
let _gcalEvents  = [];
let _intentions  = [];
let _ordoCache   = {};
let _gcalCache   = {}; // cache par mois : clé = 'YYYY-MM'

// ── Utilitaires ───────────────────────────────────────────
const PRETRES = {
    'molin':  '✝ Abbé Molin',
    'legall': '✝ Abbé Le Gall',
};

function selectAbbe(id) {
    document.getElementById('input-pretre').value = id;
    ['molin','legall'].forEach(a => {
        const btn = document.getElementById('chip-'+a);
        if (btn) btn.classList.toggle('actif', a === id);
    });
}
function pretreLabel(id) {
    return PRETRES[id] || (id ? '✝ ' + id : '');
}

function isoLocal(d) {
    return d.getFullYear() + '-'
        + String(d.getMonth()+1).padStart(2,'0') + '-'
        + String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function pipColor(c) {
    return {Blanc:'#d4af37',Rouge:'#9b2020',Vert:'#3a6644',
            Violet:'#5c2d7a',Rose:'#d4688a',Noir:'#444'}[c] || '#9a8f7a';
}

// ── Ordo ──────────────────────────────────────────────────
function getOrdo(iso) {
    if (_ordoCache[iso]) return _ordoCache[iso];
    const [y,m,d] = iso.split('-').map(Number);
    const o = (typeof Ordo1962 !== 'undefined')
        ? Ordo1962.getDay(y, m, d) : null;
    if (o) _ordoCache[iso] = o;
    return o;
}

// ── Données pour un jour ──────────────────────────────────
function messesduJour(iso) {
    // Messes Google Calendar
    const gcalMesses = _gcalEvents.filter(e => {
        const start = e.start.dateTime || e.start.date;
        return start.startsWith(iso) && /^(messe|grand.?messe)/i.test((e.summary||'').trim());
    });

    // Messes privées enregistrées dans Supabase
    const privees = _intentions.filter(i =>
        i.date_messe === iso &&
        i.google_event_id && i.google_event_id.startsWith('prive_')
    ).map(i => ({
        id:      i.google_event_id,
        summary: 'Messe privée',
        start:   { dateTime: iso + 'T' + (i.heure_messe || '09:00').replace('h',':') + ':00' },
        _prive:  true,
    }));

    return [...gcalMesses, ...privees];
}

function intentionDuJour(googleId, iso, heure, _deja = null) {
    // 1. Match exact par google_event_id (le plus fiable)
    const byId = _intentions.find(i => i.google_event_id === googleId);
    if (byId) { if (_deja) _deja.add(byId.id); return byId; }

    // 2. Pour les messes privées : match par google_event_id préfixe 'prive_' + date
    if (googleId && googleId.startsWith('prive_')) return null; // déjà géré par byId

    // 3. Fallback par date + heure (messes récurrentes dont l'ID varie)
    // _deja évite qu'une même intention soit rattachée à deux messes distinctes
    const candidat = _intentions.find(i =>
        i.date_messe === iso &&
        i.heure_messe === heure &&
        !i.google_event_id?.startsWith('prive_') &&
        (i.statut === 'valide' || i.statut === 'en_attente' || i.en_edition) &&
        (!_deja || !_deja.has(i.id))
    ) || null;
    if (candidat && _deja) _deja.add(candidat.id);
    return candidat;
}

// ── Rendu du calendrier ───────────────────────────────────
function renderCalendrier() {
    document.getElementById('cal-mois-label').textContent =
        MOIS_FR[_mois] + ' ' + _annee;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const today    = new Date(); today.setHours(0,0,0,0);
    const todayISO = isoLocal(today);
    const premier  = new Date(_annee, _mois, 1);
    // Lundi=0, Dimanche=6 (convention widget)
    let dowPremier = (premier.getDay() + 6) % 7;

    // Jours du mois précédent pour compléter
    for (let i = 0; i < dowPremier; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell autre-mois';
        grid.appendChild(cell);
    }

    const nbJours = new Date(_annee, _mois + 1, 0).getDate();
    for (let jour = 1; jour <= nbJours; jour++) {
        const d   = new Date(_annee, _mois, jour);
        const iso = isoLocal(d);
        const dow = (d.getDay() + 6) % 7; // 0=lun, 6=dim
        const isDim = dow === 6;
        const isToday = iso === todayISO;
        const isSel   = iso === _jourSel;

        const messes = messesduJour(iso);
        const ordo   = getOrdo(iso);

        // Pastilles
        let pips = '';
        const _dejaJour = new Set();
        messes.forEach(e => {
            const heure  = new Date(e.start.dateTime||e.start.date)
                .toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            const intent = intentionDuJour(e.id, iso, heure, _dejaJour);
            // Pastille = statut intention UNIQUEMENT (pas couleur liturgique)
            let cls = 'libre';
            if (intent) {
                cls = intent.statut === 'valide' ? 'attrib' : 'attente';
            }
            pips += `<span class="cal-pip ${cls}"></span>`;
        });

        const cell = document.createElement('div');
        cell.className = 'cal-cell' +
            (isDim  ? ' dimanche'   : '') +
            (isToday? ' aujourd-hui': '') +
            (isSel  ? ' selectionne': '');
        cell.innerHTML = `<div class="cal-jour-num">${jour}</div>
            ${pips ? `<div class="cal-pips">${pips}</div>` : ''}`;
        cell.addEventListener('click', () => selectionnerJour(iso));
        grid.appendChild(cell);

        // Séparateur après le dimanche (fin de semaine)
        if (isDim && jour < nbJours) {
            const sep = document.createElement('div');
            sep.className = 'cal-week-sep';
            grid.appendChild(sep);
        }
    }

    // Afficher le détail si un jour est sélectionné
    if (_jourSel && _jourSel.startsWith(`${_annee}-${String(_mois+1).padStart(2,'0')}`)) {
        renderDetail(_jourSel);
    } else {
        document.getElementById('cal-detail').innerHTML =
            '<div class="cal-detail-empty">Sélectionnez un jour</div>';
    }
}

// ── Sélection d'un jour ───────────────────────────────────
function selectionnerJour(iso) {
    _jourSel = iso;
    renderCalendrier();
    // Scroll vers le détail
    setTimeout(() => {
        document.getElementById('cal-detail')
            .scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 50);
}

// ── Rendu du détail ───────────────────────────────────────
function renderDetail(iso) {
    const detail = document.getElementById('cal-detail');
    const d      = new Date(iso + 'T12:00:00');
    const jours  = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const dateFr = jours[d.getDay()] + ' ' + d.getDate() + ' ' +
        MOIS_FR[d.getMonth()].toLowerCase() + ' ' + d.getFullYear();

    const ordo   = getOrdo(iso);
    const messes = messesduJour(iso);

    let html = `<div class="cal-detail-date">${dateFr}</div>`;

    if (ordo?.fete) {
        html += `<div class="cal-detail-ordo">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                background:${pipColor(ordo.couleur||'')};margin-right:6px;vertical-align:middle"></span>
            ${escH(ordo.fete)}
        </div>`;
    }

    // Bouton propre du jour (toujours présent)
    html += `<div style="padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);">
        <button onclick="ouvrirPropreAccueil('${iso}')"
            style="width:100%;padding:10px;background:rgba(184,150,42,.1);
            border:1px solid rgba(184,150,42,.2);border-radius:6px;
            font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;
            text-transform:uppercase;color:#b8962a;cursor:pointer;
            transition:background .15s;">
            📖 Propre de la Messe
        </button>
    </div>`;

    if (!messes.length) {
        html += `<div class="cal-detail-empty">Aucune messe ce jour</div>
        <div style="padding:10px 16px;">
            <button onclick="ouvrirModalPrive('${iso}')"
                style="width:100%;padding:10px;background:rgba(184,150,42,.1);
                border:1px solid rgba(184,150,42,.2);border-radius:6px;
                font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;
                text-transform:uppercase;color:#b8962a;cursor:pointer;">
                + Messe privée
            </button>
        </div>`;
    } else {
        // Légende pastilles
        html += `<div class="cal-legende">
            <span class="cal-pip libre"></span><span>Libre</span>
            <span class="cal-pip attente" style="margin-left:10px"></span><span>En attente</span>
            <span class="cal-pip attrib"  style="margin-left:10px"></span><span>Attribuée</span>
        </div>`;
        const _dejaDetail = new Set();
        messes.forEach(e => {
            const dateObj = new Date(e.start.dateTime || e.start.date);
            const heure   = dateObj.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            const heureFr = heure.replace(':','h');
            const intent  = intentionDuJour(e.id, iso, heure, _dejaDetail);
            const summary = e.summary || '';
            const typeLabel = e._prive                          ? 'Messe privée'
                            : /grand.?messe/i.test(summary)  ? 'Grand-Messe'
                            : /solennelle/i.test(summary)     ? 'Messe solennelle'
                            : /chantée/i.test(summary)        ? 'Messe chantée'
                            : /paul\s*vi/i.test(summary)      ? 'Messe (Missel de Paul VI)'
                            : /anticipée/i.test(summary)      ? 'Messe anticipée'
                            : 'Messe lue';

            let statusDot = '', statusLabel = '', btnHtml = '';
            if (!intent) {
                statusDot   = '<span class="status-dot status-libre"></span>';
                statusLabel = 'Libre';
                btnHtml     = `<button class="detail-messe-btn"
                    onclick="ouvrirModal('${iso}','','${escH(e.id)}','${heure}')">
                    + Intention
                </button>`;
            } else if (intent.statut === 'valide') {
                statusDot   = '<span class="status-dot status-valide"></span>';
                statusLabel = 'Attribuée';
                btnHtml     = `<button class="detail-messe-btn detail-messe-btn-edit"
                    data-supaid="${intent.id}"
                    onclick="ouvrirModalModif(this.dataset.supaid)">
                    ✎ Modifier
                </button>`;
            } else {
                statusDot   = '<span class="status-dot status-attente"></span>';
                statusLabel = 'En attente';
                btnHtml     = `<button class="detail-messe-btn detail-messe-btn-edit"
                    data-supaid="${intent.id}"
                    onclick="ouvrirModalModif(this.dataset.supaid)">
                    ✎ Modifier
                </button>`;
            }

            html += `<div class="detail-messe">
                <div class="detail-messe-heure">${heureFr}</div>
                <div class="detail-messe-info">
                    <div class="detail-messe-type">${escH(typeLabel)}</div>
                    <div class="detail-messe-intention">
                        ${intent ? escH(intent.nom_intention||'') : '—'}
                    </div>
                    ${intent?.nom_donateur ? `<div class="detail-messe-donateur">${escH(intent.nom_donateur)}</div>` : ''}
                    ${intent ? `<div class="detail-messe-pretre">${pretreLabel(intent.pretre_id)}</div>` : ''}
                    <div class="detail-messe-status">
                        ${statusDot}

                    </div>

            </div>`;
        });
        // Bouton messe privée toujours disponible, même quand des créneaux existent
        html += `<div style="padding:10px 16px;">
            <button onclick="ouvrirModalPrive('${iso}')"
                style="width:100%;padding:10px;background:rgba(184,150,42,.07);
                border:1px solid rgba(184,150,42,.15);border-radius:6px;
                font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;
                text-transform:uppercase;color:rgba(184,150,42,.7);cursor:pointer;
                font-style:italic;transition:background .15s;"
                onmouseover="this.style.background='rgba(184,150,42,.13)';this.style.color='#b8962a'"
                onmouseout="this.style.background='rgba(184,150,42,.07)';this.style.color='rgba(184,150,42,.7)'">
                + Messe privée
            </button>
        </div>`;
    }

    detail.innerHTML = html;
}

// ── Navigation mois ───────────────────────────────────────
function changerMois(delta) {
    _mois += delta;
    if (_mois < 0)  { _mois = 11; _annee--; }
    if (_mois > 11) { _mois = 0;  _annee++; }
    renderCalendrier();
    chargerMois();
}

// ── Chargement données ────────────────────────────────────
function showSpinner(show) {
    let sp = document.getElementById('cal-spinner');
    if (!sp) {
        sp = document.createElement('div');
        sp.id = 'cal-spinner';
        sp.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:500;background:rgba(26,17,8,.85);border-radius:50%;
            width:44px;height:44px;display:flex;align-items:center;justify-content:center;
            font-size:1.2rem;`;
        sp.textContent = '⏳';
        document.body.appendChild(sp);
    }
    sp.style.display = show ? 'flex' : 'none';
}

async function chargerMois() {
    if (typeof maConnexion === 'undefined') { setTimeout(chargerMois, 300); return; }

    const moisKey = `${_annee}-${String(_mois+1).padStart(2,'0')}`;

    // Spinner visible
    showSpinner(true);

    try {
        // Cache GCal : ne re-requêter que si le mois n'est pas déjà chargé
        if (!_gcalCache[moisKey]) {
            const tMin = new Date(_annee, _mois, 1).toISOString();
            const tMax = new Date(_annee, _mois + 1, 1).toISOString();
            const gcalResp = await fetch(
                `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                + `?key=${GOOGLE_API_KEY}`
                + `&timeMin=${tMin}&timeMax=${tMax}`
                + `&singleEvents=true&orderBy=startTime&maxResults=250`
            );
            const gcalData = await gcalResp.json();
            _gcalCache[moisKey] = gcalData.items || [];
        }
        _gcalEvents = _gcalCache[moisKey];

        // Supabase : toujours frais (intentions peuvent changer)
        const { data } = await maConnexion
            .from('intentions').select('*')
            .order('date_messe', { ascending: true });
        _intentions = data || [];

        renderCalendrier();
        if (_jourSel) renderDetail(_jourSel);
    } catch(e) {
        console.error('Erreur chargement:', e);
    } finally {
        showSpinner(false);
    }

    // Précharger les mois adjacents en arrière-plan
    setTimeout(() => prechargerAdjacents(), 500);
}

async function prechargerAdjacents() {
    for (const delta of [-1, 1]) {
        const d = new Date(_annee, _mois + delta, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if (_gcalCache[key]) continue;
        const tMin = new Date(d.getFullYear(), d.getMonth(), 1).toISOString();
        const tMax = new Date(d.getFullYear(), d.getMonth() + 1, 1).toISOString();
        try {
            const resp = await fetch(
                `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                + `?key=${GOOGLE_API_KEY}`
                + `&timeMin=${tMin}&timeMax=${tMax}`
                + `&singleEvents=true&orderBy=startTime&maxResults=250`
            );
            const data = await resp.json();
            _gcalCache[key] = data.items || [];
        } catch(e) { /* silencieux */ }
    }
}

async function enregistrerIntention() {
    let date_messe        = document.getElementById('input-date-iso').value;
    const google_event_id = document.getElementById('input-google-id').value;
    const nom_intention   = document.getElementById('nom_intention').value.trim();
    let heure_brute       = document.getElementById('input-heure').value.replace('h',':');
    const pretre_id       = document.getElementById('input-pretre').value || 'molin';
    const supaId          = document.getElementById('input-supa-id').value;

    // Toujours prendre date et heure depuis les champs visibles si disponibles
    const libreDate  = document.getElementById('libre-date').value;
    const libreHeure = document.getElementById('libre-heure').value;
    if (libreDate)  date_messe  = libreDate;
    if (libreHeure) heure_brute = libreHeure;
    if (!nom_intention) { AppModal.alert('⚠️','Intention manquante','Veuillez indiquer une intention.'); return; }
    if (!date_messe)    { AppModal.alert('⚠️','Date manquante','Veuillez indiquer une date.'); return; }

    let error;
    if (supaId) {
        // Modification : UPDATE direct par id — ne pas toucher google_event_id
        ({ error } = await maConnexion.from('intentions').update({
            date_messe,
            heure_messe:    heure_brute,
            nom_intention,
            type_intention: document.getElementById('type_intention').value,
            nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
            commentaire:    document.getElementById('commentaire').value.trim(),
            statut:         'valide',
            pretre_id,
        }).eq('id', supaId));
    } else {
        // Doublon check pour les intentions sans google_event_id (messes privées)
        // L'upsert gère seul les conflits quand google_event_id est présent.
        if (!google_event_id) {
            const { data: doublon } = await maConnexion.from('intentions')
                .select('id')
                .eq('date_messe', date_messe)
                .eq('heure_messe', heure_brute)
                .eq('statut', 'valide')
                .maybeSingle();
            if (doublon) {
                AppModal.alert('⛔','Créneau indisponible','Une intention validée existe déjà à cette date et cette heure.');
                return;
            }
        }
        // Création : upsert sur google_event_id
        ({ error } = await maConnexion.from('intentions').upsert([{
            date_messe, google_event_id,
            heure_messe:    heure_brute,
            nom_intention,
            type_intention: document.getElementById('type_intention').value,
            nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
            commentaire:    document.getElementById('commentaire').value.trim(),
            statut:         'valide',
            email_donateur: 'non@renseigne.fr',
            mail_envoye:    true,
            pretre_id,
        }], { onConflict: 'google_event_id', ignoreDuplicates: false }));
    }

    if (error) { AppModal.alert('❌','Erreur',error.message); return; }
    fermerModal();
    showToast('✅ Intention enregistrée');
    await chargerMois();
}

function init() {
    if (typeof maConnexion === 'undefined') { setTimeout(init, 200); return; }

    // Lire les paramètres URL (venant de l'accueil)
    const params = new URLSearchParams(window.location.search);
    const dateParam  = params.get('date');
    const gidParam   = params.get('gid');
    const heureParam = params.get('heure');

    if (dateParam) {
        // Naviguer au bon mois
        const d = new Date(dateParam + 'T12:00:00');
        _annee = d.getFullYear();
        _mois  = d.getMonth();
        _jourSel = dateParam;
    }

    renderCalendrier();
    chargerMois().then(() => {
        // Ouvrir la modale après chargement si paramètres présents
        if (dateParam && gidParam) {
            ouvrirModal(dateParam, '', gidParam, heureParam || '');
            // Nettoyer l'URL sans recharger
            history.replaceState({}, '', 'calendrier.html');
        }
    });
}
init();

</script>
