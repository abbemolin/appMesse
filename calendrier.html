<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calendrier — AppMesse</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1a1108">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   CALENDRIER — style widget agenda sombre
══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    background: #1a1108;
    color: #f0e8d5;
    min-height: 100vh;
    padding-bottom: calc(70px + env(safe-area-inset-bottom,0px));
}

/* ── Header mois ─────────────────────────────────────────── */
.cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top,0px) + 18px) 20px 10px;
    background: #1a1108;
    position: sticky; top: 0; z-index: 100;
}
.cal-mois-label {
    font-family: 'Cinzel', serif; font-size: 1.15rem;
    font-weight: 600; color: #f0e8d5; letter-spacing: .04em;
}
.cal-nav-btns { display: flex; gap: 0; align-items: center; }
.cal-nav-btn {
    background: none; border: none; color: #9a9080;
    font-size: 1.3rem; padding: 6px 14px; cursor: pointer;
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
}
.cal-nav-btn:hover { color: #f0e8d5; }
.cal-add-btn {
    background: #b8962a; border: none; border-radius: 50%;
    width: 36px; height: 36px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; color: #1a1108; font-weight: bold;
    box-shadow: 0 2px 8px rgba(184,150,42,.35);
    transition: transform .15s, box-shadow .15s;
}
.cal-add-btn:active { transform: scale(.93); }

/* ── Jours de la semaine ─────────────────────────────────── */
.cal-dow-row {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 4px; margin-bottom: 2px;
}
.cal-dow {
    text-align: center;
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .1em; color: #6a6055;
    padding: 6px 0; text-transform: uppercase;
}
.cal-dow:last-child { color: #8b1a1a; } /* Dimanche */

/* ── Grille calendrier ───────────────────────────────────── */
.cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 4px; gap: 2px 0;
}

/* ── Cellule jour ────────────────────────────────────────── */
.cal-cell {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 2px; cursor: pointer; border-radius: 8px;
    transition: background .12s; min-height: 52px;
    position: relative;
}
.cal-cell:active { background: rgba(255,255,255,.06); }
.cal-cell.autre-mois { opacity: .25; pointer-events: none; }
.cal-cell.aujourd-hui .cal-jour-num {
    background: #b8962a; color: #1a1108;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
}
.cal-cell.selectionne .cal-jour-num {
    background: rgba(184,150,42,.25);
    border: 1.5px solid #b8962a;
    border-radius: 50%; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
}
.cal-cell.dimanche .cal-jour-num { color: #c04040; }

.cal-jour-num {
    font-family: 'Cinzel', serif; font-size: .78rem;
    color: #d0c8b8; line-height: 1;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
}

/* ── Pastilles événements ────────────────────────────────── */
.cal-pips {
    display: flex; gap: 2px; flex-wrap: wrap;
    justify-content: center; margin-top: 3px;
    max-width: 44px;
}
.cal-pip {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
}
.cal-pip.libre   { background: #5a8055; }   /* vert = libre */
.cal-pip.attrib  { background: #b8962a; }   /* or = attribuée */
.cal-pip.attente { background: #8b5a2a; }   /* brun = en attente */

/* Couleurs liturgiques */
.cal-pip.Blanc  { background: #d4af37; }
.cal-pip.Rouge  { background: #9b2020; }
.cal-pip.Vert   { background: #3a6644; }
.cal-pip.Violet { background: #5c2d7a; }
.cal-pip.Rose   { background: #d4688a; }
.cal-pip.Noir   { background: #555; }

/* ── Séparateur semaine ──────────────────────────────────── */
.cal-week-sep {
    grid-column: 1 / -1;
    height: 1px; background: rgba(255,255,255,.04);
    margin: 1px 8px;
}

/* ── Panneau détail du jour sélectionné ──────────────────── */
.cal-detail {
    margin: 8px 12px 0; border-radius: 12px;
    background: #231a0e; border: 1px solid rgba(184,150,42,.12);
    overflow: hidden; min-height: 48px;
    transition: all .2s ease;
}
.cal-detail-empty {
    padding: 20px; text-align: center;
    font-family: 'EB Garamond', serif; font-style: italic;
    color: #5a5045; font-size: .9rem;
}
.cal-detail-date {
    font-family: 'Cinzel', serif; font-size: .6rem;
    letter-spacing: .15em; text-transform: uppercase;
    color: #b8962a; padding: 12px 16px 6px;
    border-bottom: 1px solid rgba(255,255,255,.05);
}
.cal-detail-ordo {
    padding: 6px 16px; font-family: 'EB Garamond', serif;
    font-style: italic; font-size: .85rem; color: #9a8f7a;
    border-bottom: 1px solid rgba(255,255,255,.04);
}

/* Carte messe dans le détail */
.detail-messe {
    padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.04);
    display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: background .12s;
}
.detail-messe:active { background: rgba(255,255,255,.04); }
.detail-messe:last-child { border-bottom: none; }

.detail-messe-heure {
    font-family: 'Cinzel', serif; font-size: .65rem;
    color: #b8962a; flex-shrink: 0; padding-top: 2px;
    letter-spacing: .05em; min-width: 38px;
}
.detail-messe-info { flex: 1; }
.detail-messe-type {
    font-family: 'Cinzel', serif; font-size: .6rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #7a7060; margin-bottom: 2px;
}
.detail-messe-intention {
    font-family: 'EB Garamond', serif; font-size: .95rem;
    color: #f0e8d5; line-height: 1.4;
}
.detail-messe-donateur {
    font-family: 'EB Garamond', serif; font-size: .8rem;
    font-style: italic; color: #7a7060; margin-top: 1px;
}
.detail-messe-status {
    display: flex; align-items: center; gap: 6px; margin-top: 4px;
}
.status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.status-libre  { background: #5a8055; }
.status-valide { background: #b8962a; }
.status-attente{ background: #8b5a2a; }
.status-label {
    font-family: 'Cinzel', serif; font-size: .5rem;
    letter-spacing: .1em; text-transform: uppercase; color: #5a5045;
}

.detail-messe-btn {
    background: rgba(184,150,42,.12); border: 1px solid rgba(184,150,42,.2);
    border-radius: 4px; padding: 6px 12px;
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #b8962a; cursor: pointer; white-space: nowrap;
    flex-shrink: 0; align-self: center;
    transition: background .15s;
}
.detail-messe-btn:hover { background: rgba(184,150,42,.22); }

/* ── Toast ───────────────────────────────────────────────── */
#toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2a1e0e; border: 1px solid rgba(184,150,42,.3);
    color: #f0e8d5; border-radius: 6px; padding: 10px 20px;
    font-family: 'EB Garamond', serif; font-size: .9rem;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 500;
    white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modale saisie ───────────────────────────────────────── */
#modal-saisie {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.7); align-items: flex-end;
    justify-content: center;
    padding: 0 0 env(safe-area-inset-bottom,0px);
}
#modal-saisie.open { display: flex; }
.modal-content {
    background: #231a0e; border-radius: 16px 16px 0 0;
    width: 100%; max-width: 640px; max-height: 85vh;
    overflow-y: auto; padding: 20px 20px;
    border-top: 2px solid rgba(184,150,42,.3);
}
.modal-content h3 {
    font-family: 'Cinzel', serif; font-size: .85rem;
    letter-spacing: .1em; color: #b8962a;
    margin: 0 0 16px; text-align: center;
}
.modal-content label {
    font-family: 'Cinzel', serif; font-size: .52rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #7a7060; display: block; margin: 12px 0 4px;
}
.modal-content input[type=text],
.modal-content input[type=date],
.modal-content input[type=time],
.modal-content select,
.modal-content textarea {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px; color: #f0e8d5;
    font-family: 'EB Garamond', serif; font-size: 1rem;
    outline: none;
}
.modal-content input:focus,
.modal-content select:focus,
.modal-content textarea:focus {
    border-color: rgba(184,150,42,.4);
}
.modal-content select option { background: #231a0e; }
.modal-row { display: flex; gap: 12px; }
.modal-row > div { flex: 1; }
.btn-save {
    width: 100%; margin-top: 16px; padding: 14px;
    background: #b8962a; border: none; border-radius: 8px;
    font-family: 'Cinzel', serif; font-size: .7rem;
    letter-spacing: .12em; text-transform: uppercase;
    color: #1a1108; font-weight: 700; cursor: pointer;
}
.btn-close-modal {
    width: 100%; margin-top: 8px; padding: 12px;
    background: none; border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; color: #7a7060; cursor: pointer;
    font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .1em;
}
.pretre-chip {
    padding: 8px 14px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px; background: rgba(255,255,255,.04);
    font-family: 'Cinzel', serif; font-size: .55rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: #7a7060; cursor: pointer; transition: all .15s;
}
.pretre-chip.actif {
    background: rgba(184,150,42,.15);
    border-color: rgba(184,150,42,.4); color: #b8962a;
}
</style>
</head>
<body>
<div id="menu-container"></div>

<!-- ════════════ HEADER ════════════ -->
<div class="cal-header">
    <span class="cal-mois-label" id="cal-mois-label">Octobre 2026</span>
    <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="changerMois(-1)">‹</button>
        <button class="cal-nav-btn" onclick="changerMois(1)">›</button>
        <button class="cal-add-btn" onclick="ouvrirModalLibre()" title="Ajouter une intention">+</button>
    </div>
</div>

<!-- ════════════ JOURS DE LA SEMAINE ════════════ -->
<div class="cal-dow-row">
    <div class="cal-dow">L</div>
    <div class="cal-dow">M</div>
    <div class="cal-dow">M</div>
    <div class="cal-dow">J</div>
    <div class="cal-dow">V</div>
    <div class="cal-dow">S</div>
    <div class="cal-dow">D</div>
</div>

<!-- ════════════ GRILLE ════════════ -->
<div class="cal-grid" id="cal-grid"></div>

<!-- ════════════ DÉTAIL JOUR ════════════ -->
<div class="cal-detail" id="cal-detail">
    <div class="cal-detail-empty">Sélectionnez un jour</div>
</div>

<!-- ════════════ TOAST ════════════ -->
<div id="toast"></div>

<!-- ════════════ MODALE SAISIE ════════════ -->
<div id="modal-saisie">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <input type="hidden" id="input-date-iso">
        <input type="hidden" id="input-google-id">
        <input type="hidden" id="input-heure">
        <div id="libre-date-heure" style="display:none;flex-direction:column;">
            <div class="modal-row">
                <div>
                    <label>Date</label>
                    <input type="date" id="libre-date" style="width:100%">
                </div>
                <div>
                    <label>Heure</label>
                    <input type="time" id="libre-heure" value="09:00" style="width:100%">
                </div>
            </div>
        </div>
        <label>Intention pour</label>
        <input type="text" id="nom_intention" placeholder="ex : Défunts famille Dupont">
        <div class="modal-row">
            <div>
                <label>Type</label>
                <select id="type_intention">
                    <option value="Défunt">✝ Défunt</option>
                    <option value="Vivant">🙏 Vivant</option>
                    <option value="Action de grâce">✨ Action de grâce</option>
                </select>
            </div>
            <div>
                <label>Demandeur</label>
                <input type="text" id="nom_donateur" placeholder="Mme Dupont">
            </div>
        </div>
        <label>Abbé célébrant</label>
        <div style="display:flex;gap:8px;margin-bottom:4px;">
            <button type="button" class="pretre-chip actif" id="chip-molin"
                onclick="selectAbbe('molin')">Abbé Molin</button>
            <button type="button" class="pretre-chip" id="chip-legall"
                onclick="selectAbbe('legall')">Abbé Le Gall</button>
        </div>
        <input type="hidden" id="input-pretre" value="molin">
        <label>Note privée</label>
        <textarea id="commentaire" rows="2"></textarea>
        <button class="btn-save" onclick="enregistrerIntention()">✅ Confirmer l'intention</button>
        <button class="btn-close-modal" onclick="fermerModal()">Fermer</button>
    </div>
</div>

<script src="ordo1962.js"></script>
<script src="menu.js"></script>
<script>
const GOOGLE_API_KEY  = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
const CALENDAR_ID     = 'saintlouisenville67@gmail.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzA4wI1QmU4s8fVx8Nd3yeLxheo1kifLyQpuxNLvlxl4g1Q3yXAQ3pyuGKVSR40JT1/exec';

const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin',
                 'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ── État ──────────────────────────────────────────────────
let _annee    = new Date().getFullYear();
let _mois     = new Date().getMonth(); // 0-based
let _jourSel  = null;
let _gcalEvents  = [];
let _intentions  = [];
let _ordoCache   = {};

// ── Utilitaires ───────────────────────────────────────────
function isoLocal(d) {
    return d.getFullYear() + '-'
        + String(d.getMonth()+1).padStart(2,'0') + '-'
        + String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function pipColor(c) {
    return {Blanc:'#d4af37',Rouge:'#9b2020',Vert:'#3a6644',
            Violet:'#5c2d7a',Rose:'#d4688a',Noir:'#444'}[c] || '#9a8f7a';
}

// ── Ordo ──────────────────────────────────────────────────
function getOrdo(iso) {
    if (_ordoCache[iso]) return _ordoCache[iso];
    const [y,m,d] = iso.split('-').map(Number);
    const o = (typeof Ordo1962 !== 'undefined')
        ? Ordo1962.getDay(y, m, d) : null;
    if (o) _ordoCache[iso] = o;
    return o;
}

// ── Données pour un jour ──────────────────────────────────
function messesduJour(iso) {
    return _gcalEvents.filter(e => {
        const start = e.start.dateTime || e.start.date;
        return start.startsWith(iso) && /^(messe|grand.?messe)/i.test((e.summary||'').trim());
    });
}

function intentionDuJour(googleId, iso, heure) {
    return _intentions.find(i =>
        i.google_event_id === googleId ||
        (i.date_messe === iso && i.heure_messe === heure &&
         (i.statut === 'valide' || i.en_edition))
    ) || null;
}

// ── Rendu du calendrier ───────────────────────────────────
function renderCalendrier() {
    document.getElementById('cal-mois-label').textContent =
        MOIS_FR[_mois] + ' ' + _annee;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';

    const today    = new Date(); today.setHours(0,0,0,0);
    const todayISO = isoLocal(today);
    const premier  = new Date(_annee, _mois, 1);
    // Lundi=0, Dimanche=6 (convention widget)
    let dowPremier = (premier.getDay() + 6) % 7;

    // Jours du mois précédent pour compléter
    for (let i = 0; i < dowPremier; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell autre-mois';
        grid.appendChild(cell);
    }

    const nbJours = new Date(_annee, _mois + 1, 0).getDate();
    for (let jour = 1; jour <= nbJours; jour++) {
        const d   = new Date(_annee, _mois, jour);
        const iso = isoLocal(d);
        const dow = (d.getDay() + 6) % 7; // 0=lun, 6=dim
        const isDim = dow === 6;
        const isToday = iso === todayISO;
        const isSel   = iso === _jourSel;

        const messes = messesduJour(iso);
        const ordo   = getOrdo(iso);

        // Pastilles
        let pips = '';
        messes.forEach(e => {
            const heure  = new Date(e.start.dateTime||e.start.date)
                .toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            const intent = intentionDuJour(e.id, iso, heure);
            let cls = 'libre';
            if (intent) {
                cls = intent.statut === 'valide' ? 'attrib' : 'attente';
            }
            // Couleur liturgique si pas de messe attribuée
            if (!intent && ordo?.couleur) {
                const valides = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];
                if (valides.includes(ordo.couleur)) cls = ordo.couleur;
            }
            pips += `<span class="cal-pip ${cls}"></span>`;
        });

        const cell = document.createElement('div');
        cell.className = 'cal-cell' +
            (isDim  ? ' dimanche'   : '') +
            (isToday? ' aujourd-hui': '') +
            (isSel  ? ' selectionne': '');
        cell.innerHTML = `<div class="cal-jour-num">${jour}</div>
            ${pips ? `<div class="cal-pips">${pips}</div>` : ''}`;
        cell.addEventListener('click', () => selectionnerJour(iso));
        grid.appendChild(cell);

        // Séparateur après le dimanche (fin de semaine)
        if (isDim && jour < nbJours) {
            const sep = document.createElement('div');
            sep.className = 'cal-week-sep';
            grid.appendChild(sep);
        }
    }

    // Afficher le détail si un jour est sélectionné
    if (_jourSel && _jourSel.startsWith(`${_annee}-${String(_mois+1).padStart(2,'0')}`)) {
        renderDetail(_jourSel);
    } else {
        document.getElementById('cal-detail').innerHTML =
            '<div class="cal-detail-empty">Sélectionnez un jour</div>';
    }
}

// ── Sélection d'un jour ───────────────────────────────────
function selectionnerJour(iso) {
    _jourSel = iso;
    renderCalendrier();
    // Scroll vers le détail
    setTimeout(() => {
        document.getElementById('cal-detail')
            .scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 50);
}

// ── Rendu du détail ───────────────────────────────────────
function renderDetail(iso) {
    const detail = document.getElementById('cal-detail');
    const d      = new Date(iso + 'T12:00:00');
    const jours  = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const dateFr = jours[d.getDay()] + ' ' + d.getDate() + ' ' +
        MOIS_FR[d.getMonth()].toLowerCase() + ' ' + d.getFullYear();

    const ordo   = getOrdo(iso);
    const messes = messesduJour(iso);

    let html = `<div class="cal-detail-date">${dateFr}</div>`;

    if (ordo?.fete) {
        html += `<div class="cal-detail-ordo">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                background:${pipColor(ordo.couleur||'')};margin-right:6px;vertical-align:middle"></span>
            ${escH(ordo.fete)}
        </div>`;
    }

    if (!messes.length) {
        html += `<div class="cal-detail-empty">Aucune messe ce jour</div>`;
    } else {
        messes.forEach(e => {
            const dateObj = new Date(e.start.dateTime || e.start.date);
            const heure   = dateObj.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            const heureFr = heure.replace(':','h');
            const intent  = intentionDuJour(e.id, iso, heure);
            const summary = e.summary || '';
            const typeLabel = /grand.?messe/i.test(summary) ? 'Grand-Messe'
                            : /solennelle/i.test(summary)    ? 'Messe solennelle'
                            : /chantée/i.test(summary)       ? 'Messe chantée'
                            : 'Messe lue';

            let statusDot = '', statusLabel = '', btnHtml = '';
            if (!intent) {
                statusDot   = '<span class="status-dot status-libre"></span>';
                statusLabel = 'Libre';
                btnHtml     = `<button class="detail-messe-btn"
                    onclick="ouvrirModal('${iso}','','${escH(e.id)}','${heure}')">
                    + Intention
                </button>`;
            } else if (intent.statut === 'valide') {
                statusDot   = '<span class="status-dot status-valide"></span>';
                statusLabel = 'Attribuée';
            } else {
                statusDot   = '<span class="status-dot status-attente"></span>';
                statusLabel = 'En attente';
            }

            html += `<div class="detail-messe">
                <div class="detail-messe-heure">${heureFr}</div>
                <div class="detail-messe-info">
                    <div class="detail-messe-type">${escH(typeLabel)}</div>
                    <div class="detail-messe-intention">
                        ${intent ? escH(intent.nom_intention||'') : '—'}
                    </div>
                    ${intent?.nom_donateur ? `<div class="detail-messe-donateur">${escH(intent.nom_donateur)}</div>` : ''}
                    <div class="detail-messe-status">
                        ${statusDot}
                        <span class="status-label">${statusLabel}</span>
                    </div>
                </div>
                ${btnHtml}
            </div>`;
        });
    }

    detail.innerHTML = html;
}

// ── Navigation mois ───────────────────────────────────────
function changerMois(delta) {
    _mois += delta;
    if (_mois < 0)  { _mois = 11; _annee--; }
    if (_mois > 11) { _mois = 0;  _annee++; }
    renderCalendrier();
    chargerMois();
}

// ── Chargement données ────────────────────────────────────
async function chargerMois() {
    if (typeof maConnexion === 'undefined') { setTimeout(chargerMois, 300); return; }

    const tMin = new Date(_annee, _mois - 1, 1);
    const tMax = new Date(_annee, _mois + 2, 0);

    try {
        const [gcalResp, { data }] = await Promise.all([
            fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
                + `?key=${GOOGLE_API_KEY}&timeMin=${tMin.toISOString()}`
                + `&timeMax=${tMax.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=300`),
            maConnexion.from('intentions').select('*').order('date_messe', { ascending: true })
        ]);

        const gcalData = await gcalResp.json();
        _gcalEvents = gcalData.items || [];
        _intentions = data || [];

        renderCalendrier();
        if (_jourSel) renderDetail(_jourSel);
    } catch(e) {
        console.error('Erreur chargement:', e);
    }
}

// ── Modales ───────────────────────────────────────────────
function escH(t) {
    return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ouvrirModal(dateISO, dateFr, googleId, heure) {
    document.getElementById('input-date-iso').value  = dateISO;
    document.getElementById('input-google-id').value = googleId || 'libre';
    document.getElementById('input-heure').value     = heure || '';
    document.getElementById('modal-title').textContent = dateFr || dateISO;
    document.getElementById('libre-date-heure').style.display =
        (googleId === 'libre' || !googleId) ? 'flex' : 'none';
    if (googleId === 'libre' || !googleId) {
        document.getElementById('libre-date').value  = dateISO || '';
        document.getElementById('libre-heure').value = '09:00';
    }
    document.getElementById('nom_intention').value = '';
    document.getElementById('nom_donateur').value  = '';
    document.getElementById('commentaire').value   = '';
    document.getElementById('type_intention').value = 'Défunt';
    selectAbbe('molin');
    document.getElementById('modal-saisie').classList.add('open');
    setTimeout(() => document.getElementById('nom_intention').focus(), 300);
}

function ouvrirModalLibre() {
    ouvrirModal(_jourSel || isoLocal(new Date()), '', 'libre', '');
}

function fermerModal() {
    document.getElementById('modal-saisie').classList.remove('open');
    selectAbbe('molin');
}

document.getElementById('modal-saisie').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-saisie')) fermerModal();
});

function selectAbbe(id) {
    document.getElementById('input-pretre').value = id;
    ['molin','legall'].forEach(a => {
        document.getElementById('chip-'+a).classList.toggle('actif', a === id);
    });
}

async function enregistrerIntention() {
    let date_messe        = document.getElementById('input-date-iso').value;
    const google_event_id = document.getElementById('input-google-id').value;
    const nom_intention   = document.getElementById('nom_intention').value.trim();
    let heure_brute       = document.getElementById('input-heure').value.replace('h',':');
    const pretre_id       = document.getElementById('input-pretre').value || 'molin';

    if (!date_messe || google_event_id === 'libre') {
        date_messe  = document.getElementById('libre-date').value;
        heure_brute = document.getElementById('libre-heure').value;
    }
    if (!nom_intention) { alert('Veuillez indiquer une intention.'); return; }
    if (!date_messe)    { alert('Veuillez indiquer une date.'); return; }

    const { error } = await maConnexion.from('intentions').upsert([{
        date_messe, google_event_id,
        heure_messe:    heure_brute,
        nom_intention,
        type_intention: document.getElementById('type_intention').value,
        nom_donateur:   document.getElementById('nom_donateur').value.trim() || 'Paroisse',
        commentaire:    document.getElementById('commentaire').value.trim(),
        statut:         'valide',
        email_donateur: 'non@renseigne.fr',
        mail_envoye:    true,
        pretre_id,
    }], { onConflict: 'google_event_id', ignoreDuplicates: false });

    if (error) { alert('Erreur : ' + error.message); return; }
    fermerModal();
    showToast('✅ Intention enregistrée');
    await chargerMois();
}

// ── Init ──────────────────────────────────────────────────
function init() {
    if (typeof maConnexion === 'undefined') { setTimeout(init, 200); return; }
    renderCalendrier();
    chargerMois();
}
init();
</script>
