// ═══════════════════════════════════════════════════════════════════════
// ÉTAT
// ═══════════════════════════════════════════════════════════════════════
let weekOffset = 1;      // 1 = semaine prochaine (par défaut)
let semaineData = [];    // 7 jours [{dateFr, iso, dow, sousTitre, couleur, horaires, notes}]
let annonces    = [];    // annonces avec dans_newsletter=true

// ═══════════════════════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════════════════════
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, dur=3500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
function log(msg) {
  const el = document.getElementById('send-log');
  el.classList.add('visible');
  el.textContent += '[' + new Date().toLocaleTimeString('fr-FR') + '] ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}
function setStatus(msg, type='') {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = type;
}

// Lundi de la semaine contenant "date" (ISO)
function lundiDeSemaine(date) {
  const d = new Date(date);
  const dow = d.getDay(); // 0=dim
  const diff = (dow === 0) ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function isoDate(d) {
  return d.toISOString().split('T')[0];
}

function dateDebut() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  return lundiDeSemaine(now);
}

const JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS_FR  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function dateFr(d) {
  return JOURS_FR[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_FR[d.getMonth()];
}

function weekLabel() {
  const debut = dateDebut();
  const fin   = new Date(debut); fin.setDate(fin.getDate() + 6);
  return dateFr(debut) + ' – ' + dateFr(fin);
}

// ═══════════════════════════════════════════════════════════════════════
// CHARGEMENT GOOGLE CALENDAR (fetch direct, comme calendrier_semaine.html)
// ═══════════════════════════════════════════════════════════════════════
async function fetchGcalEvents(timeMin, timeMax) {
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
    + `?key=${GOOGLE_API_KEY}`
    + `&timeMin=${timeMin}&timeMax=${timeMax}`
    + `&singleEvents=true&orderBy=startTime&maxResults=200`;
  try {
    const r = await fetch(url);
    if (!r.ok) { console.warn('[GCal]', r.status); return []; }
    const data = await r.json();
    return data.items || [];
  } catch(e) {
    console.warn('[GCal]', e);
    return [];
  }
}

// Heures en minutes depuis minuit
function toMinutes(str) {
  if (!str) return 0;
  const m = str.match(/(\d+):(\d+)/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : 0;
}

function formatHeure(str) {
  if (!str) return '';
  const m = str.match(/T(\d+):(\d+)/);
  return m ? m[1]+'h'+m[2].padStart(2,'0') : '';
}

function isMesse(summary) {
  return /\bmesse\b/i.test(summary) || /\bgrand.?messe\b/i.test(summary) || /\bmissa\b/i.test(summary);
}

// ═══════════════════════════════════════════════════════════════════════
// ORDO 1962 — calculé localement via ordo1962.js (même lib que calendrier_semaine.html)
// ═══════════════════════════════════════════════════════════════════════
function getOrdoMap(lundi) {
  const map = {};
  if (typeof Ordo1962 === 'undefined') return map;
  for (let i = 0; i < 7; i++) {
    const d = new Date(lundi); d.setDate(d.getDate() + i);
    const iso = isoDate(d);
    map[iso] = Ordo1962.getDay(d.getFullYear(), d.getMonth()+1, d.getDate());
  }
  return map;
}

// ═══════════════════════════════════════════════════════════════════════
// CHARGEMENT INTENTIONS (Supabase — même table que calendrier_semaine.html)
// ═══════════════════════════════════════════════════════════════════════
async function fetchIntentions(isoFrom, isoTo) {
  if (typeof maConnexion === 'undefined') return [];
  try {
    const { data } = await maConnexion
      .from('intentions')
      .select('date_messe,heure_messe,nom_intention,type_intention,google_event_id')
      .eq('statut','valide')
      .gte('date_messe', isoFrom)
      .lte('date_messe', isoTo);
    return data || [];
  } catch(e) { return []; }
}

// ═══════════════════════════════════════════════════════════════════════
// CONSTRUCTION DE SEMAINEDATA
// ═══════════════════════════════════════════════════════════════════════
async function chargerSemaine() {
  const lundi   = dateDebut();
  const dimanche = new Date(lundi); dimanche.setDate(dimanche.getDate() + 6);
  const isoMin  = isoDate(lundi);
  const isoMax  = isoDate(dimanche);

  document.getElementById('week-label').textContent = weekLabel();
  setStatus('⏳ Chargement du calendrier…', 'loading');

  // Initialiser les 7 jours
  const jours = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(lundi); d.setDate(d.getDate() + i);
    jours.push({
      date:      d,
      iso:       isoDate(d),
      dateFr:    dateFr(d),
      dow:       d.getDay(),
      sousTitre: '',
      couleur:   'Blanc',
      horaires:  [],
      notes:     [],
    });
  }

  // Lancer les requêtes en parallèle
  const tMin = lundi.toISOString();
  const tMax = new Date(dimanche.getTime() + 86400000).toISOString();

  const [events, intentions] = await Promise.all([
    fetchGcalEvents(tMin, tMax),
    fetchIntentions(isoMin, isoMax),
  ]);

  // Ordo 1962 calculé localement
  const ordoMap = getOrdoMap(lundi);
  jours.forEach(j => {
    const o = ordoMap[j.iso];
    if (o) {
      j.sousTitre = o.fete   || '';
      j.couleur   = o.couleur || 'Blanc';
    }
  });

  // Map intentions : clé = date_messe+'T'+heure_messe OU google_event_id
  const intentMap = {};
  (intentions || []).forEach(i => {
    const key1 = i.date_messe + 'T' + (i.heure_messe||'').substring(0,5);
    if (!intentMap[key1]) intentMap[key1] = i;
    if (i.google_event_id) intentMap['id_'+i.google_event_id] = i;
  });

  // Mapper les événements GCal → horaires
  events.forEach(ev => {
    const startDt = ev.start?.dateTime;
    const startD  = ev.start?.date;
    if (!startDt && !startD) return;
    const isoJ = startDt ? startDt.split('T')[0] : startD;
    const jour  = jours.find(j => j.iso === isoJ);
    if (!jour) return;

    if (startD && !startDt) {
      // Événement toute la journée → note
      jour.notes.push(ev.summary || '');
      return;
    }

    const heure    = formatHeure(startDt);
    const heureEnd = ev.end?.dateTime ? formatHeure(ev.end.dateTime) : '';
    const bold     = isMesse(ev.summary || '');
    let   label    = ev.summary || '';

    // Intention de messe
    const key1 = startDt.substring(0,16).replace('T','T');  // "2026-11-10T18:30"
    const int  = intentMap['id_'+ev.id] || intentMap[key1] || null;
    if (int && bold) {
      let nomInt = int.nom_intention || '';
      if (int.type_intention === 'defunt') nomInt += ' ✝';
      label += ' (' + nomInt + ')';
    }

    const heureAffiche = (heureEnd && !bold) ? heure+'–'+heureEnd : heure;
    jour.horaires.push({ heure: heureAffiche, label, labelHtml: escHtml(label), bold });
  });

  // Trier par heure
  jours.forEach(j => {
    j.horaires.sort((a,b) => toMinutes(a.heure) - toMinutes(b.heure));
  });

  semaineData = jours;
}

// ═══════════════════════════════════════════════════════════════════════
// CHARGEMENT ANNONCES
// ═══════════════════════════════════════════════════════════════════════
async function chargerAnnonces() {
  const today = new Date().toISOString().split('T')[0];
  try {
    const url = SUPABASE_URL + '/rest/v1/annonces'
      + '?select=*'
      + '&actif=eq.true'
      + '&dans_newsletter=eq.true'
      + '&or=(date_debut.is.null,date_debut.lte.' + today + ')'
      + '&or=(date_fin.is.null,date_fin.gte.' + today + ')'
      + '&order=prioritaire.desc,ordre.asc,created_at.desc';
    const r = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY }
    });
    if (!r.ok) return [];
    return await r.json();
  } catch(e) {
    console.error('[Annonces]', e);
    return [];
  }
}

// ═══════════════════════════════════════════════════════════════════════
// GÉNÉRATION HTML EMAIL (format template Brevo)
// ═══════════════════════════════════════════════════════════════════════
function genCalendrierHTML() {
  // Priorité : HTML généré par calendrier_semaine.html (via localStorage)
  try {
    const saved = localStorage.getItem('newsletter_calendrier_html');
    if (saved) return saved;
  } catch(e) {}

  // Fallback : reconstruire depuis semaineData
  const C_BLEU      = '#023199';
  const C_BEIGE     = '#F7F2EA';
  const C_BEIGE_DIM = '#EADFCC';
  const C_TEXTE     = '#333333';
  const C_GRIS      = '#6D6D6C';
  const C_NOTE      = '#8b2020';
  const PASTILLE    = {
    Blanc:  ['○', '#9A8F7F'],
    Rouge:  ['●', '#B3261E'],
    Vert:   ['●', '#2E7D32'],
    Violet: ['●', '#6A1B9A'],
    Rose:   ['●', '#D46A92'],
    Noir:   ['●', '#222222'],
  };

  let html = `<table width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Palatino,Georgia,serif;max-width:600px;font-size:16px;line-height:1.4;">`;

  semaineData.forEach(jour => {
    const dimanche = jour.dow === 0;
    const fond = dimanche ? C_BEIGE_DIM : C_BEIGE;
    const fete = jour.sousTitre || '';

    // Bandeau du jour
    html += `<tr><td colspan="2" bgcolor="${fond}" style="background-color:${fond};border-left:4px solid ${C_BLEU};padding:9px 12px;">`;
    html += `<span style="font-weight:bold;color:${C_BLEU};font-size:17px;">${escHtml(jour.dateFr)}</span>`;
    if (fete) {
      const p = PASTILLE[jour.couleur];
      const pastille = p ? `<span style="color:${p[1]};font-size:14px;" title="Couleur liturgique : ${escHtml(jour.couleur.toLowerCase())}">${p[0]}</span> ` : '';
      html += `<br>${pastille}<span style="color:${C_GRIS};font-size:14px;font-style:italic;">${escHtml(fete)}</span>`;
    }
    html += `</td></tr>`;
    html += `<tr><td colspan="2" style="font-size:1px;line-height:6px;">&nbsp;</td></tr>`;

    // Notes
    (jour.notes || []).forEach(note => {
      const nHtml = typeof note === 'object' ? (note.html || '') : escHtml(note || '');
      html += `<tr><td colspan="2" style="padding:3px 0 3px 16px;color:${C_NOTE};font-size:16px;font-style:italic;">${nHtml}</td></tr>`;
    });

    // Horaires
    (jour.horaires || []).forEach(h => {
      const labelContent = h.labelHtml || escHtml(h.label || '');
      let styleHeure, styleLabel;
      if (h.bold) {
        styleHeure = `color:${C_BLEU};font-weight:bold;`;
        styleLabel = `color:${C_BLEU};font-weight:bold;`;
      } else if (!h.heure) {
        styleHeure = `color:${C_GRIS};`;
        styleLabel = `color:${C_GRIS};font-style:italic;`;
      } else {
        styleHeure = `color:${C_GRIS};`;
        styleLabel = `color:${C_TEXTE};`;
      }
      html += `<tr>`;
      html += `<td width="84" valign="top" style="width:84px;padding:3px 0 3px 16px;font-size:15px;${styleHeure}white-space:nowrap;">${escHtml(h.heure||'')}</td>`;
      html += `<td valign="top" style="padding:3px 0;font-size:16px;${styleLabel}">${labelContent}</td>`;
      html += `</tr>`;
    });

    html += `<tr><td colspan="2" style="font-size:1px;line-height:18px;">&nbsp;</td></tr>`;
  });

  html += `</table>`;
  return html;
}

function genAnnonceHTML(a) {
  const imgPart = a.image_url
    ? `<th width="25%" style="font-weight:normal" valign="top">

}

function updateAnnoncesResume() {
  const wrap = document.getElementById('annonces-resume');
  const list = document.getElementById('ann-list');
  document.getElementById('ann-count').textContent = annonces.length;
  list.innerHTML = annonces.length
    ? annonces.map(a => `<li>${escHtml(a.titre)}</li>`).join('')
    : '<li><em>Aucune annonce marquée pour la newsletter</em></li>';
  wrap.classList.toggle('visible', true);
}

function updatePreview() {
  emailHtml = genEmailHTML();
  const frame = document.getElementById('preview-frame');
  const wrap  = document.getElementById('preview-wrap');

  // Écrire dans l'iframe
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(emailHtml);
  doc.close();
  wrap.classList.add('visible');

  // Ajuster la hauteur
  setTimeout(() => {
    frame.style.height = (doc.documentElement.scrollHeight + 20) + 'px';
  }, 300);
}

// ENVOI BREVO
// ═══════════════════════════════════════════════════════════════════════
function getSubject() {
  const lundi   = dateDebut();
  const dimanche = new Date(lundi); dimanche.setDate(dimanche.getDate() + 6);
  const opts = { day:'numeric', month:'long' };
  return `Annonces paroissiales — semaine du ${lundi.toLocaleDateString('fr-FR', opts)} au ${dimanche.toLocaleDateString('fr-FR', opts)}`;
}

async function envoyerNewsletter() {
  const subject = getSubject();
  log('Préparation de la campagne…');
  log('Objet : ' + subject);

  const payload = {
    name: 'Newsletter ' + new Date().toLocaleDateString('fr-FR'),
    subject: subject,
    sender: { name: 'Paroisse La Croix Glorieuse', email: 'contact@croix-glorieuse.org' },
    type: 'classic',
    htmlContent: emailHtml,
    recipients: { listIds: [BREVO_LIST_ID] },
    scheduledAt: null,
  };

  try {
    // 1. Créer la campagne
    log('Création de la campagne Brevo…');
    const r1 = await fetch('https://api.brevo.com/v3/emailCampaigns', {
      method: 'POST',
      headers: {
        'api-key': BREVO_API_KEY,
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      },
      body: JSON.stringify(payload),
    });

    if (!r1.ok) {
      const err = await r1.text();
      throw new Error(`Création échouée (${r1.status}) : ${err}`);
    }
    const data1 = await r1.json();
    const campaignId = data1.id;
    log(`✅ Campagne créée (id=${campaignId})`);

    // 2. Envoyer immédiatement
    log('Envoi immédiat…');
    const r2 = await fetch(`https://api.brevo.com/v3/emailCampaigns/${campaignId}/sendNow`, {
      method: 'POST',
      headers: {
        'api-key': BREVO_API_KEY,
        'Content-Type': 'application/json',
      },
    });

    if (!r2.ok) {
      const err = await r2.text();
      throw new Error(`Envoi échoué (${r2.status}) : ${err}`);
    }

    log('✅ Newsletter envoyée avec succès à la liste #' + BREVO_LIST_ID + ' !');
    setStatus('✅ Newsletter envoyée ! ' + new Date().toLocaleTimeString('fr-FR'), 'ok');
    toast('✅ Newsletter envoyée !', 5000);

    // Désactiver les boutons d'envoi
    document.getElementById('btn-send-init').disabled = true;
    document.getElementById('confirm-box').classList.remove('visible');

  } catch(e) {
    log('❌ Erreur : ' + e.message);
    setStatus('❌ Erreur lors de l\'envoi : ' + e.message, 'err');
    toast('❌ Erreur : ' + e.message, 7000);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// CHARGEMENT COMPLET
// ═══════════════════════════════════════════════════════════════════════
async function chargerTout() {
  document.getElementById('btn-preview').disabled  = true;
  document.getElementById('btn-send-init').disabled = true;
  document.getElementById('preview-wrap').classList.remove('visible');
  document.getElementById('confirm-box').classList.remove('visible');
  document.getElementById('send-log').classList.remove('visible');
  document.getElementById('send-log').textContent = '';

  try {
    setStatus('⏳ Chargement des annonces…', 'loading');

    // Vérifier si le calendrier vient de calendrier_semaine.html (localStorage)
    const srcDiv = document.getElementById('calendrier-source');
    let calSource = '';
    try {
      const savedHtml  = localStorage.getItem('newsletter_calendrier_html');
      const savedLundi = localStorage.getItem('newsletter_calendrier_lundi');
      if (savedHtml && savedLundi) {
        // Calculer le lundi de la semaine affichée
        const lundiAttendu = isoDate(dateDebut());
        if (savedLundi === lundiAttendu) {
          calSource = 'calendrier_semaine';
          srcDiv.style.display = '';
          srcDiv.style.background = '#e8f5e9';
          srcDiv.style.color = '#1b5e20';
          srcDiv.style.border = '1px solid #a5d6a7';
          srcDiv.textContent = '✅ Calendrier importé depuis calendrier_semaine.html';
        } else {
          srcDiv.style.display = '';
          srcDiv.style.background = '#fff3e0';
          srcDiv.style.color = '#e65100';
          srcDiv.style.border = '1px solid #ffcc80';
          srcDiv.textContent = `⚠️ Calendrier en mémoire (semaine du ${savedLundi}) ne correspond pas à la semaine affichée — rechargé depuis Google Calendar`;
        }
      } else {
        srcDiv.style.display = '';
        srcDiv.style.background = '#e3f2fd';
        srcDiv.style.color = '#0d47a1';
        srcDiv.style.border = '1px solid #90caf9';
        srcDiv.textContent = '📅 Calendrier chargé depuis Google Calendar — allez dans calendrier_semaine.html pour le valider et l\'importer ici';
      }
    } catch(e) {}

    await Promise.all([
      calSource === 'calendrier_semaine' ? Promise.resolve() : chargerSemaine(),
      chargerAnnonces().then(r => { annonces = r; }),
    ]);

    updateAnnoncesResume();
    setStatus(
      `✅ Semaine du ${weekLabel()} — ${annonces.length} annonce(s)`,
      'ok'
    );
    document.getElementById('btn-preview').disabled  = false;
    document.getElementById('btn-send-init').disabled = false;

    // Générer l'aperçu automatiquement
    updatePreview();

  } catch(e) {
    setStatus('❌ Erreur : ' + e.message, 'err');
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-refresh').addEventListener('click', chargerTout);

  document.getElementById('btn-prev').addEventListener('click', () => {
    weekOffset--;
    chargerTout();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    weekOffset++;
    chargerTout();

  document.getElementById('btn-preview').addEventListener('click', () => {
    updatePreview();
    document.getElementById('preview-wrap').scrollIntoView({ behavior:'smooth' });
  });

  document.getElementById('btn-send-init').addEventListener('click', () => {
    // Mettre à jour la description de confirmation
    document.getElementById('confirm-desc').textContent =
      `La newsletter "${getSubject()}" sera envoyée à tous les abonnés de la liste Brevo #${BREVO_LIST_ID}. Cette action est irréversible.`;
    document.getElementById('confirm-box').classList.add('visible');
    document.getElementById('confirm-box').scrollIntoView({ behavior:'smooth' });
  });

  document.getElementById('btn-confirm-send').addEventListener('click', () => {
    document.getElementById('btn-confirm-send').disabled = true;
    document.getElementById('btn-cancel-send').disabled  = true;
    envoyerNewsletter();
  });

  document.getElementById('btn-cancel-send').addEventListener('click', () => {
    document.getElementById('confirm-box').classList.remove('visible');
  });

  // Chargement initial — semaine suivante
  chargerTout();
});
