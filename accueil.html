<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accueil — AppMesse</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1108">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <script>
        if ("serviceWorker" in navigator)
            window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    </script>
    <style>
    /* ════════════════════════════════════════════════════════
       HERO LITURGIQUE
    ════════════════════════════════════════════════════════ */
    .hero {
        position: relative;
        background: var(--dark-bg);
        overflow: hidden;
        padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0;
        animation: heroIn .5s ease both;
    }
    @keyframes heroIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    /* Croix en filigrane */
    .hero-cross {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        opacity: .055; pointer-events: none;
        width: 220px; height: 280px;
    }

    /* Navigation ±jour — zones invisibles sur les bords */
    .hero-nav {
        position: absolute; top: 0; bottom: 0; width: 52px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 10; opacity: 0;
        transition: opacity .2s;
        -webkit-tap-highlight-color: transparent;
    }
    .hero-nav:active, .hero-nav:hover { opacity: 1; }
    .hero-nav-left  { left: 0; }
    .hero-nav-right { right: 0; }
    .hero-nav-arrow {
        font-family: 'Cinzel', serif; font-size: 1.2rem;
        color: var(--gold); font-weight: 300; line-height: 1;
        text-shadow: 0 0 12px rgba(184,150,42,.4);
    }

    /* Corps du hero */
    .hero-body {
        position: relative; z-index: 2;
        text-align: center; padding: 0 60px 0;
    }

    /* Paroisse */
    .hero-paroisse {
        font-family: 'Cinzel', serif; font-size: .48rem;
        letter-spacing: .32em; text-transform: uppercase;
        color: rgba(184,150,42,.6); display: block; margin-bottom: 14px;
    }

    /* Fête du jour */
    .hero-fete {
        font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700;
        color: #f5f0e4; letter-spacing: .04em; line-height: 1.2;
        display: block; margin-bottom: 5px;
        text-shadow: 0 1px 18px rgba(0,0,0,.4);
    }
    .hero-fete.loading { opacity: .35; font-size: .85rem; font-weight: 400; font-style: italic; }

    /* Classe liturgique */
    .hero-classe {
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: rgba(184,150,42,.7); display: block; margin-bottom: 16px;
    }

    /* Date + navigation */
    .hero-date-row {
        display: flex; align-items: center; justify-content: center; gap: 0;
        margin-bottom: 20px;
    }
    .hero-date {
        font-family: 'EB Garamond', serif; font-size: 1rem;
        color: rgba(240,230,184,.65); font-style: italic;
        letter-spacing: .04em; padding: 0 8px;
    }

    /* Ornement de séparation */
    .hero-ornament {
        display: flex; align-items: center; gap: 0; margin-bottom: 0;
    }
    .hero-ornament-line {
        flex: 1; height: 1px;
        background: linear-gradient(to right, transparent, rgba(184,150,42,.35), transparent);
    }
    .hero-ornament-gem {
        color: var(--gold); font-size: .5rem;
        letter-spacing: .5em; padding: 0 12px; opacity: .7;
    }

    /* Liseré couleur liturgique — bas du hero */
    .hero-couleur-bar {
        height: 3px; width: 100%; margin-top: 20px;
        transition: background .6s ease;
    }
    .hero-couleur-bar.Blanc  { background: linear-gradient(to right, #d4af37, #f0e6b8, #d4af37); }
    .hero-couleur-bar.Rouge  { background: linear-gradient(to right, #6b1010, #9b2020, #6b1010); }
    .hero-couleur-bar.Vert   { background: linear-gradient(to right, #1e4028, #3a6644, #1e4028); }
    .hero-couleur-bar.Violet { background: linear-gradient(to right, #3a1a52, #5c2d7a, #3a1a52); }
    .hero-couleur-bar.Rose   { background: linear-gradient(to right, #8c3050, #d4688a, #8c3050); }
    .hero-couleur-bar.Noir   { background: linear-gradient(to right, #0a0804, #1a1108, #0a0804); }
    .hero-couleur-bar.defaut { background: linear-gradient(to right, transparent, rgba(184,150,42,.3), transparent); }

    /* ════════════════════════════════════════════════════════
       PILL INTENTIONS EN ATTENTE
    ════════════════════════════════════════════════════════ */
    .pending-pill {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        margin: 14px 0 18px; padding: 0;
    }
    .pending-pill-inner {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 16px 7px 12px;
        border: 1px solid var(--border-soft); border-radius: 20px;
        background: var(--vellum-light);
        text-decoration: none; transition: all .2s;
    }
    .pending-pill-inner:hover { border-color: var(--rubric); background: rgba(139,26,26,.04); }
    .pending-pill-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--border-soft); flex-shrink: 0;
        transition: background .3s;
    }
    .pending-pill-dot.has-pending { background: var(--rubric); box-shadow: 0 0 0 3px rgba(139,26,26,.15); }
    .pending-pill-text {
        font-family: 'Cinzel', serif; font-size: .56rem;
        letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink-muted); transition: color .3s;
    }
    .pending-pill-text.has-pending { color: var(--rubric); }

    /* ════════════════════════════════════════════════════════
       SÉPARATEUR DE SECTION
    ════════════════════════════════════════════════════════ */
    .section-sep {
        display: flex; align-items: center; gap: 10px;
        margin: 0 0 16px;
    }
    .section-sep-line { flex: 1; height: 1px; background: var(--border-soft); }
    .section-sep-label {
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .22em; text-transform: uppercase;
        color: var(--rubric); white-space: nowrap;
    }

    /* ════════════════════════════════════════════════════════
       CARTES DE MESSE
    ════════════════════════════════════════════════════════ */
    .messe-card {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 10px;
        position: relative;
        box-shadow: 0 1px 8px var(--shadow);
        animation: cardIn .4s ease both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* Filet coloré à gauche */
    .messe-card::before {
        content: ''; position: absolute;
        left: 0; top: 0; bottom: 0; width: 3px;
    }
    .messe-card.libre::before { background: rgba(200,190,170,.5); }
    .messe-card.prise::before { background: var(--gold); }

    /* En-tête de carte */
    .messe-card-head {
        display: flex; align-items: center; gap: 12px;
        padding: 11px 14px 11px 16px;
        border-bottom: 1px solid var(--border-soft);
    }
    .messe-card-heure {
        font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700;
        color: var(--rubric); line-height: 1; flex-shrink: 0;
        letter-spacing: -.01em;
    }
    .messe-card-heure small {
        font-size: .5rem; font-weight: 400; color: var(--rubric);
        letter-spacing: .1em; display: block; margin-top: 2px; opacity: .75;
    }
    .messe-card-sep {
        width: 1px; height: 28px; background: var(--border-soft); flex-shrink: 0;
    }
    .messe-card-type {
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink-muted); flex: 1;
    }

    /* Bloc fête/ordo */
    .messe-card-ordo {
        padding: 8px 14px 0 16px;
        display: flex; align-items: center; gap: 7px;
    }
    .ordo-pip-sm {
        width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .ordo-pip-sm.Blanc  { background: #d4af37; }
    .ordo-pip-sm.Rouge  { background: #9b2020; }
    .ordo-pip-sm.Vert   { background: #3a6644; }
    .ordo-pip-sm.Violet { background: #5c2d7a; }
    .ordo-pip-sm.Rose   { background: #d4688a; }
    .ordo-pip-sm.Noir   { background: var(--dark-bg); }
    .ordo-fete-sm {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .9rem; color: var(--ink-soft); line-height: 1.3;
        flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Bloc intention */
    .messe-card-intention {
        padding: 10px 14px 10px 16px;
    }
    .intention-rubric-sm {
        font-family: 'Cinzel', serif; font-size: .47rem;
        letter-spacing: .2em; text-transform: uppercase;
        color: var(--gold); display: block; margin-bottom: 4px;
    }
    .intention-nom-sm {
        font-family: 'Cinzel', serif; font-size: 1rem;
        color: var(--ink); line-height: 1.25; display: block;
        letter-spacing: .02em;
    }
    .intention-type-sm {
        display: inline-flex; align-items: center; gap: 5px;
        margin-top: 5px;
        font-family: 'Cinzel', serif; font-size: .46rem;
        letter-spacing: .14em; text-transform: uppercase;
        padding: 2px 9px; border-radius: 10px;
    }
    .intention-type-sm.Défunt  { background: rgba(26,17,8,.07); color: var(--ink-soft); border: 1px solid rgba(26,17,8,.12); }
    .intention-type-sm.Vivant  { background: rgba(58,102,68,.08); color: var(--green); border: 1px solid rgba(58,102,68,.18); }
    .intention-type-sm.grace   { background: rgba(184,150,42,.1); color: var(--ink-muted); border: 1px solid rgba(184,150,42,.22); }
    .intention-type-dot { width: 5px; height: 5px; border-radius: 50%; }
    .intention-libre {
        font-family: 'EB Garamond', serif; font-style: italic;
        font-size: .9rem; color: var(--ink-muted); opacity: .7;
    }
    .intention-commentaire-sm {
        font-family: 'EB Garamond', serif; font-size: .82rem;
        color: var(--ink-muted); font-style: italic; margin-top: 4px;
        display: block; line-height: 1.4;
    }

    /* Pied de carte — actions */
    .messe-card-foot {
        display: flex; align-items: center; gap: 0;
        border-top: 1px solid var(--border-soft);
    }
    .messe-card-action {
        flex: 1; padding: 10px 8px; text-align: center; cursor: pointer;
        font-family: 'Cinzel', serif; font-size: .5rem;
        letter-spacing: .12em; text-transform: uppercase;
        color: var(--ink-muted); background: none; border: none;
        border-right: 1px solid var(--border-soft);
        transition: all .15s; min-height: 38px;
        display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .messe-card-action:last-child { border-right: none; }
    .messe-card-action:active { background: var(--vellum); color: var(--ink); }
    .messe-card-action.primary { color: var(--rubric); }
    .messe-card-action.gold { color: var(--gold); }

    /* Aucune messe */
    .no-messe-card {
        background: var(--vellum-light); border: 1px solid var(--border-soft);
        border-radius: 3px; padding: 28px 20px; text-align: center;
        margin-bottom: 10px; animation: cardIn .4s ease both;
    }
    .no-messe-icon { font-size: 1.6rem; opacity: .35; display: block; margin-bottom: 10px; }
    .no-messe-label {
        font-family: 'EB Garamond', serif; font-style: italic;
        color: var(--ink-muted); font-size: .95rem;
    }

    /* ════════════════════════════════════════════════════════
       ERREUR CONNEXION
    ════════════════════════════════════════════════════════ */
    .conn-error {
        display: none; align-items: center; gap: 8px;
        margin: 8px 0; padding: 8px 12px;
        background: rgba(139,26,26,.06); border-radius: 3px;
        border-left: 3px solid var(--rubric);
    }
    .conn-error.visible { display: flex; }
    .conn-error-text {
        font-family: 'Cinzel', serif; font-size: .52rem;
        letter-spacing: .1em; color: var(--rubric);
    }
    /* ── Mode sombre — accueil ───────────────────────────── */
    @media (prefers-color-scheme: dark) {
        .propre-piece-head { filter: brightness(1.4); }
        .hero { /* déjà sombre par nature — fond --ink */ }
        .pending-pill-inner { background: var(--vellum-light); border-color: var(--border-soft); }
        .messe-card { background: var(--vellum-light); border-color: var(--border-soft); }
        .messe-card-head { background: var(--vellum); border-color: var(--border-soft); }
        .no-messe-card { background: var(--vellum-light); border-color: var(--border-soft); }
        .section-sep-line { background: var(--border-soft); }
    }
    </style>
</head>

<script>
const GOOGLE_API_KEY  = 'AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ';
const CALENDAR_ID     = 'saintlouisenville67@gmail.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzA4wI1QmU4s8fVx8Nd3yeLxheo1kifLyQpuxNLvlxl4g1Q3yXAQ3pyuGKVSR40JT1/exec';
const COULEURS_VALIDES = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];
const CLASSE_LABEL = { 'I':'Fête de Ire classe','II':'Fête de IIe classe','III':'IIIe classe','IV':'IVe classe' };
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

function isoLocal(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Navigation ±jour ─────────────────────────────────────
let _jourOffset = 0;

function dateNaviguee() {
    const d = new Date();
    d.setDate(d.getDate() + _jourOffset);
    d.setHours(0,0,0,0);
    return d;
}

function afficherDateHero(d) {
    const label = JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
    document.getElementById('hero-date').textContent = label;
}

function naviguerJour(delta) {
    _jourOffset += delta;
    const d = dateNaviguee();
    afficherDateHero(d);
    chargerJour();
}

// ── Hero — mise à jour ordo ───────────────────────────────
function mettreAJourHero(ordo) {
    const feteEl   = document.getElementById('hero-fete');
    const classeEl = document.getElementById('hero-classe');
    const barEl    = document.getElementById('hero-couleur-bar');

    if (!ordo || !ordo.fete) {
        feteEl.textContent = 'Férie';
        feteEl.classList.add('loading');
        classeEl.textContent = '';
        barEl.className = 'hero-couleur-bar defaut';
        return;
    }

    feteEl.textContent = ordo.fete;
    feteEl.classList.remove('loading');
    classeEl.textContent = CLASSE_LABEL[ordo.classe] || ordo.classe || '';

    const couleur = COULEURS_VALIDES.includes(ordo.couleur) ? ordo.couleur : 'defaut';
    barEl.className = 'hero-couleur-bar ' + couleur;
}

// ── Intentions en attente ─────────────────────────────────
let lastKnownCount = -1;
async function countPendingIntentions() {
    const { count } = await maConnexion.from('intentions')
        .select('*', { count:'exact', head:true }).eq('statut','en_attente');
    const n = count || 0;
    const dot  = document.getElementById('pending-dot');
    const text = document.getElementById('pending-text');
    if (n > 0) {
        dot.classList.add('has-pending');
        text.classList.add('has-pending');
        text.textContent = n + ' intention' + (n > 1 ? 's' : '') + ' en attente';
    } else {
        dot.classList.remove('has-pending');
        text.classList.remove('has-pending');
        text.textContent = 'Aucune demande en attente';
    }
    if ('serviceWorker' in navigator && Notification.permission === 'granted') {
        const sw = await navigator.serviceWorker.ready;
        sw.active.postMessage({ type:'CHECK_INTENTIONS', count:n, lastCount:lastKnownCount });
    }
    lastKnownCount = n;
}

// ── Chargement du jour ────────────────────────────────────
async function chargerJour() {
    const listDiv = document.getElementById('today-masses-list');
    listDiv.innerHTML = '<div class="no-messe-card"><span class="no-messe-icon" style="animation:pulse .8s ease infinite alternate">✦</span><span class="no-messe-label">Chargement…</span></div>';

    const today   = dateNaviguee();
    const isoDate = isoLocal(today);
    const ordo    = Ordo1962.getDay(today.getFullYear(), today.getMonth()+1, today.getDate());
    const massKey = (typeof Ordo1962.getProperKey === 'function') ? Ordo1962.getProperKey(ordo) : null;

    mettreAJourHero(ordo);

    try {
        const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
        const [{ data: intentions }, gcalResp] = await Promise.all([
            maConnexion.from('intentions').select('*').eq('date_messe', isoDate).eq('statut','valide'),
            fetch('https://www.googleapis.com/calendar/v3/calendars/' + CALENDAR_ID
                + '/events?key=' + GOOGLE_API_KEY
                + '&timeMin=' + today.toISOString()
                + '&timeMax=' + tomorrow.toISOString()
                + '&singleEvents=true&orderBy=startTime')
        ]);

        const gcalData = await gcalResp.json();
        const messes = (gcalData.items || []).filter(e =>
            /^(messe|grand.?messe)/i.test((e.summary || '').trim()));

        const couleur = COULEURS_VALIDES.includes(ordo && ordo.couleur) ? ordo.couleur : null;

        if (!messes.length) {
            listDiv.innerHTML = renderNoMesse(isoDate, massKey);
            return;
        }

        listDiv.innerHTML = messes.map((evt, idx) => {
            const dt  = new Date(evt.start.dateTime || evt.start.date);
            const hh  = dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
            const [h, m] = hh.split(':');
            const _s = (evt.summary||'').toLowerCase();
        const typeMesse = _s.includes('solennelle') ? 'Grand-Messe solennelle'
                        : /grand.?messe/i.test(evt.summary)  ? 'Grand-Messe'
                        : _s.includes('chantée')             ? 'Messe chantée'
                        : _s.includes('anticipée')           ? 'Messe anticipée'
                        : 'Messe lue';
            let intention = (intentions||[]).find(i => i.google_event_id === evt.id);
            if (!intention) intention = (intentions||[]).find(i =>
                (i.heure_messe||'').substring(0,5) === hh.substring(0,5));

            return renderMesseCard({
                h, m, typeMesse, ordo: idx === 0 ? ordo : null,
                couleur: idx === 0 ? couleur : null,
                intention, isoDate, massKey, evt, idx
            });
        }).join('');

    } catch(err) {
        console.error(err);
        listDiv.innerHTML = '<div class="no-messe-card"><span class="no-messe-label" style="color:var(--rubric);">Erreur de chargement</span></div>';
    }
}

// ── Rendu d'une carte de messe ────────────────────────────
function renderMesseCard({ h, m, typeMesse, ordo, couleur, intention, isoDate, massKey, evt, idx }) {
    const estLibre = !intention;
    const delay    = idx * 80;

    // Ordo badge (premier panneau uniquement)
    let ordoblock = '';
    if (ordo && ordo.fete && couleur) {
        ordoblock = `<div class="messe-card-ordo">
            <span class="ordo-pip-sm ${couleur}"></span>
            <span class="ordo-fete-sm">${escH(ordo.fete)}</span>
        </div>`;
    }

    // Intention
    let intentionBlock;
    if (estLibre) {
        intentionBlock = `<div class="messe-card-intention">
            <span class="intention-rubric-sm">Intention de Messe</span>
            <span class="intention-libre">Libre — aucune intention assignée</span>
        </div>`;
    } else {
        const tc = intention.type_intention === 'Défunt' ? 'Défunt'
                 : intention.type_intention === 'Vivant' ? 'Vivant' : 'grace';
        const dotColor = tc === 'Défunt' ? 'var(--ink-soft)' : tc === 'Vivant' ? 'var(--green)' : '#b8962a';
        const comm = intention.commentaire
            ? `<span class="intention-commentaire-sm">${escH(intention.commentaire)}</span>` : '';
        intentionBlock = `<div class="messe-card-intention">
            <span class="intention-rubric-sm">Intention de Messe</span>
            <span class="intention-nom-sm">${escH(intention.nom_intention)}</span>
            <span class="intention-type-sm ${tc}">
                <span class="intention-type-dot" style="background:${dotColor}"></span>
                ${escH(intention.type_intention)}
            </span>
            ${comm}
        </div>`;
    }

    // Actions pied de carte
    const proprebtn = massKey
        ? `<button class="messe-card-action gold" onclick="ouvrirPropreAccueil('${isoDate}')">✦ Propre</button>` : '';
    const attribuer = estLibre
        ? `<button class="messe-card-action primary" onclick="ouvrirAttribution('${isoDate}','${escH(evt.id)}','${h}h${m}')">✍ Attribuer</button>` : '';

    return `<div class="messe-card ${estLibre?'libre':'prise'}" style="animation-delay:${delay}ms">
        <div class="messe-card-head">
            <div class="messe-card-heure">${h}<small>h${m==='00'?'':m}</small></div>
            <div class="messe-card-sep"></div>
            <div class="messe-card-type">${escH(typeMesse)}</div>
        </div>
        ${ordoblock}
        ${intentionBlock}
        <div class="messe-card-foot">
            ${proprebtn}
            ${attribuer}
        </div>
    </div>`;
}

function renderNoMesse(isoDate, massKey) {
    const proprebtn = massKey
        ? `<button onclick="ouvrirPropreAccueil('${isoDate}')" style="margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:9px 20px;background:var(--dark-bg);color:var(--gold);border:none;border-radius:2px;cursor:pointer;">✦ Propre de la Messe</button>`
        : '';
    return `<div class="no-messe-card">
        <span class="no-messe-icon">🕯</span>
        <span class="no-messe-label">Aucune messe célébrée ce jour</span>
        ${proprebtn ? '<div style="margin-top:4px;">'+proprebtn+'</div>' : ''}
    </div>`;
}

// ── Attribution ───────────────────────────────────────────
function ouvrirAttribution(isoDate, googleId, heure) {
    // Redirige vers le calendrier pour la date concernée
    window.location.href = 'calendrier.html';
}

// ── Init ──────────────────────────────────────────────────
async function initDashboard() {
    if (typeof maConnexion === 'undefined') { setTimeout(initDashboard, 300); return; }
    try {
        const { error } = await maConnexion.from('intentions').select('id').limit(1);
        if (error) throw error;
        document.getElementById('conn-error').classList.remove('visible');
        countPendingIntentions();
        chargerJour();
    } catch {
        document.getElementById('conn-error').classList.add('visible');
        document.getElementById('pending-text').textContent = 'Erreur de connexion';
    }
}

async function demanderPermissionNotification() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    if (Notification.permission === 'default') {
        setTimeout(async () => {
            const p = await Notification.requestPermission();
            if (p === 'granted') AppModal.alert('🔔','Notifications activées',"Vous serez averti dès qu'une nouvelle intention arrive.");
        }, 2000);
    }
}

window.onload = () => {
    afficherDateHero(dateNaviguee());
    initDashboard();
    demanderPermissionNotification();
    setInterval(() => { countPendingIntentions(); chargerJour(); }, 5*60*1000);
};

st.textContent = '@keyframes pulse{from{opacity:.3}to{opacity:1}}';

<!-- ── Propre modal script ──────────────────────────────── -->
<script>
var _propreAccLang = 'la', _propreAccData = null;
var PIECE_COLORS_ACC = {
    introit:'#4a2a1a',collecte:'#5a3e1b',epitre:'#2a3a2a',
    graduel:'#3a1a4a',trait:'#3a1a4a',alleluia:'#3a1a4a',
    evangile:'#8b1a1a',offertoire:'#1a3a5a',secrete:'#5a3e1b',
    preface:'#4a2a1a',communion:'#1a1108',postcommunion:'#5a3e1b'
};
var MULTI_MESSES_ACC = {
    'temporal/1/0':[{key:'temporal/1/0',label:'Messe de Minuit'},{key:'temporal/1/0b',label:"Messe de l'Aurore"},{key:'temporal/1/0c',label:'Messe du Jour'}],
    'sanctoral/11/2':[{key:'sanctoral/11/2',label:'1re Messe'},{key:'sanctoral/11/2b',label:'2e Messe'},{key:'sanctoral/11/2c',label:'3e Messe'}]
};
var COMMUN_KEYS_ACC = {martyr:'sanctoral/1/13',martyrs:'sanctoral/1/15',confesseur_pont:'sanctoral/1/4',confesseur:'sanctoral/1/1',vierge:'sanctoral/10/3',veuve:'sanctoral/10/8'};

function getCommunKeyAcc(ordo) {
    if (!ordo||ordo.source!=='sanctoral') return null;
    var f=(ordo.fete||'').toLowerCase(),c=(ordo.couleur||'').toLowerCase();
    if (c==='rouge') return f.includes('martyrs')?COMMUN_KEYS_ACC.martyrs:COMMUN_KEYS_ACC.martyr;
    if (f.includes('pape')||f.includes('évêque')||f.includes('archevêque')) return COMMUN_KEYS_ACC.confesseur_pont;
    if (f.includes('vierge')&&!f.includes('martyr')) return COMMUN_KEYS_ACC.vierge;
    if (f.includes('reine')||f.includes('veuve')) return COMMUN_KEYS_ACC.veuve;
    return COMMUN_KEYS_ACC.confesseur;
}
function escHA(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderPropreAccPieces(){
    var c=document.getElementById('propre-acc-pieces');
    if(!_propreAccData){c.innerHTML='<div style="text-align:center;padding:30px;color:var(--ink-muted);font-style:italic;">Propre non disponible.</div>';return;}
    c.innerHTML=_propreAccData.map(function(p){
        var txt=(_propreAccLang==='la'?p.text_la:p.text_fr)||(_propreAccLang==='la'?p.text_fr:p.text_la)||'';
        var col=PIECE_COLORS_ACC[p.part_code]||'#1a1108';
        var ref=p.reference?'<span style="font-size:.85em;color:var(--ink-muted);font-style:italic;margin-left:8px;">'+escHA(p.reference)+'</span>':'';
        var badge=p._du_commun?'<span style="font-size:.7em;color:var(--ink-muted);font-style:italic;margin-left:8px;">du commun</span>':'';
        return '<div><div style="font-family:\'Cinzel\',serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:'+col+';border-bottom:1px solid '+col+'22;padding-bottom:4px;margin-bottom:8px;display:flex;align-items:baseline;gap:4px;"><span>'+escHA(p.part_label.replace(' (commun)',''))+'</span>'+ref+badge+'</div><div style="font-size:1.05rem;line-height:1.75;color:var(--ink);white-space:pre-wrap;">'+escHA(txt)+'</div></div>';
    }).join('');
}
function setPropraAccLang(l){_propreAccLang=l;document.getElementById('propre-acc-btn-la').style.background=l==='la'?'#b8962a':'transparent';document.getElementById('propre-acc-btn-la').style.color=l==='la'?'#fff':'#b8962a';document.getElementById('propre-acc-btn-fr').style.background=l==='fr'?'#b8962a':'transparent';document.getElementById('propre-acc-btn-fr').style.color=l==='fr'?'#fff':'#b8962a';renderPropreAccPieces();}
function renderMultiAcc(baseKey,activeKey){var sel=document.getElementById('propre-acc-multi');var cfg=MULTI_MESSES_ACC[baseKey];if(!cfg){sel.style.display='none';return;}sel.style.display='flex';sel.innerHTML=cfg.map(function(m){var a=m.key===activeKey;return '<button onclick="switchMesseAcc(\''+m.key+'\',\''+baseKey+'\')" style="padding:6px 12px;border:none;cursor:pointer;font-family:\'Cinzel\',serif;font-size:.62rem;letter-spacing:.06em;background:'+(a?'#8b1a1a':'transparent')+';color:'+(a?'#fff':'#8b1a1a')+';">'+m.label+'</button>';}).join('');}
async function switchMesseAcc(newKey,baseKey){document.getElementById('propre-acc-pieces').innerHTML='<div style="text-align:center;padding:40px;color:var(--ink-muted);">Chargement…</div>';renderMultiAcc(baseKey,newKey);var resp=await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',newKey).order('display_order',{ascending:true});_propreAccData=resp.data&&resp.data.length?resp.data:null;var cfg=MULTI_MESSES_ACC[baseKey];var m=cfg&&cfg.find(function(x){return x.key===newKey;});if(m)document.getElementById('propre-acc-fete').textContent=document.getElementById('propre-acc-fete').textContent.split(' — ')[0]+' — '+m.label;renderPropreAccPieces();}
async function ouvrirPropreAccueil(isoDate){
    var parts=isoDate.split('-').map(Number);
    var ordo=Ordo1962.getDay(parts[0],parts[1],parts[2]);
    var massKey=(typeof Ordo1962.getProperKey==='function')?Ordo1962.getProperKey(ordo):null;
    var d=new Date(parts[0],parts[1]-1,parts[2]);
    document.getElementById('propre-acc-date').textContent=d.getDate()+' '+MOIS[d.getMonth()]+' '+parts[0];
    document.getElementById('propre-acc-fete').textContent=ordo&&ordo.fete?ordo.fete:'';
    document.getElementById('propre-acc-pieces').innerHTML='<div style="text-align:center;padding:40px;color:var(--ink-muted);">Chargement…</div>';
    document.getElementById('modal-propre-acc').style.display='flex';
    if(!massKey){document.getElementById('propre-acc-multi').style.display='none';document.getElementById('propre-acc-pieces').innerHTML='<div style="text-align:center;padding:30px;color:var(--ink-muted);font-style:italic;">Propre non disponible pour ce jour.</div>';return;}
    renderMultiAcc(massKey,massKey);
    if(MULTI_MESSES_ACC[massKey])document.getElementById('propre-acc-fete').textContent=((ordo&&ordo.fete)?ordo.fete:'')+' — '+MULTI_MESSES_ACC[massKey][0].label;
    try{
        var resp=await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',massKey).order('display_order',{ascending:true});
        if(resp.error)throw resp.error;
        var data=resp.data&&resp.data.length?resp.data:null;
        if(data&&ordo&&ordo.source==='sanctoral'){var codes=new Set(data.map(function(p){return p.part_code;}));var att=['introit','collecte','epitre','graduel','evangile','offertoire','secrete','communion','postcommunion'];var manq=att.filter(function(p){return!codes.has(p);});if(manq.length>0){var ck=getCommunKeyAcc(ordo);if(ck){var rc=await maConnexion.from('propers').select('part_code,part_label,reference,text_la,text_fr,display_order').eq('mass_key',ck).in('part_code',manq);if(!rc.error&&rc.data&&rc.data.length){var cp=rc.data.map(function(p){return Object.assign({},p,{_du_commun:true,part_label:p.part_label+' (commun)'});});data=data.concat(cp).sort(function(a,b){return a.display_order-b.display_order;});}}}}
        _propreAccData=data;renderPropreAccPieces();
    }catch(e){document.getElementById('propre-acc-pieces').innerHTML='<div style="color:#8b1a1a;padding:20px;">Erreur : '+escHA(String(e.message||e))+'</div>';}
}
function fermerPropreAcc(){document.getElementById('modal-propre-acc').style.display='none';_propreAccData=null;}
document.getElementById('modal-propre-acc').addEventListener('click',function(e){if(e.target===this)fermerPropreAcc();});
</script>
