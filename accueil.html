<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tableau de bord — Messes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1108">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/192/4f46e5/cross.png">
    <link rel="stylesheet" href="style.css">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
    <style>
    /* ── En-tête ──────────────────────────────────────────── */
    .db-header { text-align:center; padding:24px 0 16px; position:relative; }
    .db-paroisse {
        font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em;
        color:var(--rubric); text-transform:uppercase; display:block; margin-bottom:10px;
    }
    .db-cross {
        display:block; opacity:.1; position:absolute; top:0; left:50%;
        transform:translateX(-50%); pointer-events:none; z-index:0;
    }
    .db-title-wrap { position:relative; z-index:1; }
    .db-title {
        font-family:'Cinzel',serif; font-size:1.55rem; font-weight:700;
        color:var(--ink); letter-spacing:.09em; text-transform:uppercase;
        margin:0 0 2px; line-height:1.1;
    }
    .db-date {
        font-family:'EB Garamond',serif; font-size:.9rem; color:var(--ink-muted);
        font-style:italic; letter-spacing:.04em; margin:6px 0 0;
    }
    .db-ornament { color:var(--gold); font-size:.65rem; letter-spacing:.55em; margin:10px 0 0; opacity:.75; }
    .db-status { margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px; }

    /* ── Bandeau en attente ───────────────────────────────── */
    .pending-banner {
        margin:4px 0 20px; border:1px solid var(--border); border-top:3px solid var(--gold);
        border-radius:2px; background:var(--vellum-light); padding:22px 20px 18px;
        text-align:center; position:relative; box-shadow:0 2px 12px var(--shadow); overflow:hidden;
    }
    .pending-banner::before {
        content:'✝'; position:absolute; font-size:9rem; color:var(--gold); opacity:.045;
        left:50%; top:50%; transform:translate(-50%,-50%);
        font-family:'Cinzel',serif; pointer-events:none; line-height:1;
    }
    .pending-label {
        font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.24em; color:var(--rubric);
        text-transform:uppercase; display:block; margin-bottom:8px; position:relative;
    }
    .pending-number {
        font-family:'Cinzel',serif; font-size:5.5rem; font-weight:700; color:var(--ink);
        line-height:1; position:relative; display:block; letter-spacing:-.02em;
    }
    .pending-number.has-pending { color:var(--rubric); text-shadow:0 2px 16px rgba(139,26,26,.18); }
    .pending-sub {
        font-family:'EB Garamond',serif; font-size:.88rem; color:var(--ink-muted);
        font-style:italic; margin-top:4px; position:relative; display:block;
    }
    .pending-rule {
        border:none; border-top:1px solid var(--border-soft); margin:14px 0 12px; position:relative;
    }
    .pending-rule::before {
        content:'✦'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        background:var(--vellum-light); padding:0 8px; color:var(--gold); font-size:.55rem;
    }
    .pending-cta {
        display:inline-block; font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.16em;
        color:var(--rubric); text-decoration:none; text-transform:uppercase;
        padding:9px 22px; border:1px solid var(--border-soft); border-radius:2px; transition:all .2s; position:relative;
    }
    .pending-cta:hover { border-color:var(--border); background:var(--gold-pale); color:var(--ink); }
    .pending-cta::after { content:' →'; }

    /* ── Section offices ──────────────────────────────────── */
    .offices-section { margin-bottom:8px; }
    .offices-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .offices-title { font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.22em; color:var(--rubric); text-transform:uppercase; flex:1; }
    .offices-rule { flex:1; border:none; border-top:1px solid var(--border-soft); margin:0; }
    .offices-rule-left { max-width:20px; }
    .offices-loading { text-align:center; padding:32px 0; color:var(--ink-muted); font-style:italic; font-size:.9rem; }

    /* ── Panneau de chancel ───────────────────────────────── */
    .chancel-panel {
        background:var(--vellum-light); border:1px solid var(--border-soft);
        border-radius:2px; margin-bottom:14px; box-shadow:0 2px 10px var(--shadow);
        overflow:hidden; animation:fadeInUp .4s ease both;
    }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* Bandeau liturgique — couleur du jour en haut du panneau */
    .chancel-ordo {
        display:flex; align-items:center; gap:10px;
        padding:7px 14px 7px 12px;
        border-bottom:1px solid var(--border-soft);
    }
    /* Couleurs liturgiques */
    .ordo-pip {
        width:10px; height:10px; border-radius:50%; flex-shrink:0;
        box-shadow:0 0 0 2px rgba(255,255,255,.6), 0 0 0 3px rgba(0,0,0,.12);
    }
    .ordo-pip.Blanc  { background:#f0ece0; box-shadow:0 0 0 2px #c9a840, 0 0 0 3px rgba(0,0,0,.1); }
    .ordo-pip.Rouge  { background:#9b2020; }
    .ordo-pip.Vert   { background:#3a6644; }
    .ordo-pip.Violet { background:#5c2d7a; }
    .ordo-pip.Rose   { background:#d4688a; }
    .ordo-pip.Noir   { background:#1a1108; }

    .ordo-fete {
        font-family:'EB Garamond',serif; font-style:italic; font-size:.88rem;
        color:var(--ink-soft); flex:1; line-height:1.3;
    }
    .ordo-classe {
        font-family:'Cinzel',serif; font-size:.58rem; font-weight:700;
        letter-spacing:.1em; color:var(--ink-muted); white-space:nowrap; flex-shrink:0;
    }
    /* Couleur de la bande de fond selon la couleur liturgique */
    .chancel-ordo.bg-Blanc  { background:rgba(240,236,224,.45); }
    .chancel-ordo.bg-Rouge  { background:rgba(155,32,32,.07); }
    .chancel-ordo.bg-Vert   { background:rgba(58,102,68,.07); }
    .chancel-ordo.bg-Violet { background:rgba(92,45,122,.07); }
    .chancel-ordo.bg-Rose   { background:rgba(212,104,138,.08); }
    .chancel-ordo.bg-Noir   { background:rgba(26,17,8,.06); }

    /* Bordure gauche colorée sur le panneau selon classe */
    .chancel-panel.classe-I   { border-left:4px solid var(--gold); }
    .chancel-panel.classe-II  { border-left:4px solid var(--border-soft); }
    .chancel-panel.classe-III { border-left:4px solid rgba(200,190,170,.5); }
    .chancel-panel.classe-IV  { border-left:4px solid rgba(200,190,170,.3); }

    /* Heure + info messe */
    .chancel-top { display:flex; align-items:center; border-bottom:1px solid var(--border-soft); }
    .chancel-heure {
        font-family:'Cinzel',serif; font-size:1.6rem; font-weight:700; color:var(--rubric);
        line-height:1; padding:14px 18px; border-right:1px solid var(--border-soft);
        min-width:90px; text-align:center; background:rgba(139,26,26,.04); letter-spacing:-.02em;
    }
    .chancel-heure small {
        display:block; font-size:.52rem; letter-spacing:.18em; color:var(--rubric);
        opacity:.7; margin-top:3px; font-weight:400;
    }
    .chancel-info { padding:12px 16px; flex:1; }
    .chancel-nom { font-family:'EB Garamond',serif; font-size:1rem; font-style:italic; color:var(--ink); font-weight:600; line-height:1.3; }
    .chancel-type { font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.14em; color:var(--ink-muted); text-transform:uppercase; margin-top:3px; }

    /* Carte de chœur — intention */
    .choeur-card {
        padding:11px 18px 13px; background:var(--vellum);
        border-top:1px dashed var(--border-soft); position:relative;
    }
    .choeur-card::before {
        content:''; position:absolute; inset:5px; border:1px solid var(--border);
        border-radius:1px; opacity:.12; pointer-events:none;
    }
    .choeur-rubric {
        font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.2em; color:var(--rubric);
        text-transform:uppercase; display:block; margin-bottom:5px; opacity:.8;
    }
    .choeur-intention { font-family:'EB Garamond',serif; font-size:.98rem; font-style:italic; color:var(--ink); line-height:1.45; }
    .choeur-type-badge { display:inline-block; margin-left:6px; font-size:.72rem; vertical-align:middle; }
    .choeur-vide { font-family:'EB Garamond',serif; font-size:.88rem; font-style:italic; color:var(--ink-muted); opacity:.75; }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="db-header">
            <svg class="db-cross" width="160" height="200" viewBox="0 0 160 200" fill="none">
                <rect x="66" y="0" width="28" height="200" fill="#b8962a"/>
                <rect x="0"  y="55" width="160" height="28" fill="#b8962a"/>
            </svg>
            <div class="db-title-wrap">
                <span class="db-paroisse">Paroisse La Croix Glorieuse</span>
                <div class="db-title">Bonjour</div>
                <div class="db-title" style="font-size:1rem;opacity:.6;">Tableau de bord</div>
                <!-- Navigation date -->
                <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 0;">
                    <button id="btn-jour-prev" onclick="naviguerJour(-1)" title="Jour précédent"
                        style="background:none;border:none;cursor:pointer;color:var(--gold);font-size:1.1rem;opacity:.7;padding:4px 8px;line-height:1;font-family:'Cinzel',serif;letter-spacing:.02em;"
                        aria-label="Jour précédent">&#8249;</button>
                    <div id="db-date" class="db-date" style="cursor:default;"></div>
                    <button id="btn-jour-next" onclick="naviguerJour(1)" title="Jour suivant"
                        style="background:none;border:none;cursor:pointer;color:var(--gold);font-size:1.1rem;opacity:.7;padding:4px 8px;line-height:1;font-family:'Cinzel',serif;letter-spacing:.02em;"
                        aria-label="Jour suivant">&#8250;</button>
                </div>
                <div class="db-ornament">✦ ✦ ✦</div>
                <div class="db-status">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text" class="status-text">Connexion&hellip;</span>
                </div>
            </div>
        </div>

        <div class="pending-banner">
            <span class="pending-label">Intentions en attente de traitement</span>
            <span id="pending-intentions" class="pending-number">&mdash;</span>
            <span id="pending-sub"        class="pending-sub">&nbsp;</span>
            <hr class="pending-rule">
            <a href="intentions.html" class="pending-cta">Traiter les demandes</a>
        </div>

        <div class="offices-section">
            <div class="offices-header">
                <hr class="offices-rule offices-rule-left">
                <span class="offices-title">✝ Offices du jour</span>
                <hr class="offices-rule">
            </div>
            <div id="today-masses-list">
                <div class="offices-loading">Chargement&hellip;</div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <!-- ── Modale propre de la Messe ──────────────────────── -->
    <div id="modal-propre-acc" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;">
      <div style="background:#fffdf7;border-radius:10px;max-width:680px;width:100%;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.25);">
        <div style="background:#1a1108;border-radius:10px 10px 0 0;padding:16px 20px;display:flex;align-items:center;gap:10px;">
          <div style="flex:1;">
            <div id="propre-acc-date" style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;color:#b8962a;text-transform:uppercase;margin-bottom:4px;"></div>
            <div id="propre-acc-fete" style="font-family:'Cinzel',serif;font-size:.95rem;color:#f5f0e4;letter-spacing:.04em;"></div>
          </div>
          <button onclick="fermerPropreAcc()" style="background:none;border:none;color:#b8962a;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;flex-shrink:0;">&#10005;</button>
        </div>
        <div style="background:#f5f0e4;border-bottom:1px solid #d4c9a8;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="display:flex;border:1px solid #b8962a;border-radius:6px;overflow:hidden;">
            <button id="propre-acc-btn-la" onclick="setPropraAccLang('la')" style="padding:6px 16px;background:#b8962a;color:#fff;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">LATIN</button>
            <button id="propre-acc-btn-fr" onclick="setPropraAccLang('fr')" style="padding:6px 16px;background:transparent;color:#b8962a;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;">FRAN&#199;AIS</button>
          </div>
          <div id="propre-acc-multi" style="display:none;border:1px solid #8b1a1a;border-radius:6px;overflow:hidden;"></div>
        </div>
        <div id="propre-acc-pieces" style="padding:20px;display:flex;flex-direction:column;gap:18px;max-height:65vh;overflow-y:auto;font-family:Georgia,serif;"></div>
        <div style="padding:12px 20px;border-top:1px solid #d4c9a8;text-align:center;">
          <button onclick="fermerPropreAcc()" style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:#8b7355;cursor:pointer;">Fermer</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="ordo1962.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
    const GOOGLE_API_KEY = "AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ";
    const CALENDAR_ID    = "saintlouisenville67@gmail.com";
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzA4wI1QmU4s8fVx8Nd3yeLxheo1kifLyQpuxNLvlxl4g1Q3yXAQ3pyuGKVSR40JT1/exec';

    // Extrait "YYYY-MM-DD" en heure locale (évite le décalage UTC)
    function isoLocal(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const j = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${j}`;
    }

    // ── Date courante naviguée ──────────────────────────────
    var _jourOffset = 0; // 0 = aujourd'hui, -1 = hier, +1 = demain

    function dateNaviguee() {
        var d = new Date();
        d.setDate(d.getDate() + _jourOffset);
        d.setHours(0,0,0,0);
        return d;
    }

    function afficherDate(d) {
        const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
        const mois  = ['janvier','février','mars','avril','mai','juin',
                        'juillet','août','septembre','octobre','novembre','décembre'];
        document.getElementById('db-date').textContent =
            jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()] + ' ' + d.getFullYear();
        // Flèche retour : discrète si on est aujourd'hui
        var btnNext = document.getElementById('btn-jour-next');
        if (btnNext) btnNext.style.opacity = _jourOffset >= 7 ? '.25' : '.7';
    }

    function naviguerJour(delta) {
        _jourOffset += delta;
        var d = dateNaviguee();
        afficherDate(d);
        getTodayMasses();
    }

    // ── Date initiale ────────────────────────────────────────
    (function() {
        afficherDate(dateNaviguee());
    })();

    // ── Correspondances classe → étoiles liturgiques ────────
    const CLASSE_LABEL = { 'I':'✦ Fête de Ire classe', 'II':'✦ Fête de IIe classe', 'III':'IIIe classe', 'IV':'IVe classe' };

    // ── Couleurs liturgiques → classes CSS ─────────────────
    const COULEURS_VALIDES = ['Blanc','Rouge','Vert','Violet','Rose','Noir'];

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function initDashboard() {
        if (typeof maConnexion === "undefined") { setTimeout(initDashboard, 500); return; }
        try {
            const { error } = await maConnexion.from("intentions").select("id").limit(1);
            if (error) throw error;
            document.getElementById("status-dot").style.background = "#4a7c59";
            document.getElementById("status-text").textContent = "Base de données prête";
            countPendingIntentionsAvecNotif();
            getTodayMasses();
        } catch (err) {
            document.getElementById("status-dot").style.background = "var(--rubric)";
            document.getElementById("status-text").textContent = "Erreur de connexion";
        }
    }

    let lastKnownCount = -1;

    async function countPendingIntentionsAvecNotif() {
        const { count } = await maConnexion.from('intentions')
            .select('*', { count:'exact', head:true }).eq('statut','en_attente');
        const n = count || 0;
        const el  = document.getElementById('pending-intentions');
        const sub = document.getElementById('pending-sub');
        el.textContent = n;
        if (n > 0) {
            el.classList.add('has-pending');
            sub.textContent = n === 1 ? 'demande attend votre réponse' : 'demandes attendent votre réponse';
        } else {
            el.classList.remove('has-pending');
            sub.textContent = 'Aucune demande en attente';
        }
        if ('serviceWorker' in navigator && Notification.permission === 'granted') {
            const sw = await navigator.serviceWorker.ready;
            sw.active.postMessage({ type:'CHECK_INTENTIONS', count:n, lastCount:lastKnownCount });
        }
        lastKnownCount = n;
    }

    async function getTodayMasses() {
        const listDiv = document.getElementById("today-masses-list");
        try {
            const today   = dateNaviguee();
            const isoDate = isoLocal(today);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

            // ── 3 requêtes parallèles ────────────────────────
            // Ordo calculé localement — moteur Ordo1962 (missel de 1962)
            const ordo = Ordo1962.getDay(today.getFullYear(), today.getMonth()+1, today.getDate());
            const massKey = (typeof Ordo1962.getProperKey === 'function') ? Ordo1962.getProperKey(ordo) : null;

            const [
                { data: intentions },
                gcalResp
            ] = await Promise.all([
                maConnexion.from("intentions")
                    .select("*").eq("date_messe", isoDate).eq("statut","valide"),
                fetch("https://www.googleapis.com/calendar/v3/calendars/" + CALENDAR_ID
                    + "/events?key=" + GOOGLE_API_KEY
                    + "&timeMin=" + today.toISOString()
                    + "&timeMax=" + tomorrow.toISOString()
                    + "&singleEvents=true&orderBy=startTime")
            ]);

            const gcalData  = await gcalResp.json();
            const estMesse  = e => ["messe","messe chantée","messe anticipée"]
                                    .includes(e.summary.toLowerCase().trim());
            const messes    = (gcalData.items || []).filter(estMesse);

            // ── Bandeau ordo liturgique (commun à toutes les messes du jour) ──
            const couleur = (ordo && COULEURS_VALIDES.includes(ordo.couleur)) ? ordo.couleur : null;
            const fete    = ordo ? ordo.fete   : null;
            const classe  = ordo ? ordo.classe : null;

            // Bouton propre
            const proprebtn = massKey ? `
                <button onclick="ouvrirPropreAccueil('${isoDate}')"
                    style="margin-top:12px;display:inline-flex;align-items:center;gap:7px;
                    font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
                    padding:8px 18px;background:var(--ink);color:var(--gold);border:1px solid var(--gold)44;
                    border-radius:2px;cursor:pointer;transition:opacity .2s;"
                    onmouseover="this.style.opacity='.75'" onmouseout="this.style.opacity='1'">
                    ✝&nbsp; Propre de la Messe
                </button>` : '';

            if (messes.length === 0) {
                const ordoHtml = fete ? `
                    <div class="chancel-ordo bg-${couleur}">
                        <span class="ordo-pip ${couleur}"></span>
                        <span class="ordo-fete">${fete}</span>
                        <span class="ordo-classe">${CLASSE_LABEL[classe] || classe}</span>
                    </div>` : '';
                listDiv.innerHTML = `
                    <div class="chancel-panel classe-${classe || 'III'}" style="border-top:3px solid var(--border-soft);">
                        ${ordoHtml}
                        <div style="padding:20px 18px;text-align:center;color:var(--ink-muted);font-style:italic;font-size:.92rem;">
                            🕯️ Aucune messe célébrée ce jour
                        </div>
                        ${proprebtn ? `<div style="text-align:center;padding:0 18px 18px;">${proprebtn}</div>` : ''}
                    </div>`;
                return;
            }

            listDiv.innerHTML = messes.map((e, idx) => {
                const dateObj  = new Date(e.start.dateTime || e.start.date);
                const hh       = dateObj.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
                const [h, m]   = hh.split(":");

                let intention = (intentions || []).find(i => i.google_event_id === e.id);
                if (!intention) intention = (intentions || []).find(i =>
                    (i.heure_messe || "").substring(0,5) === hh.substring(0,5));

                const nomMesse  = e.summary.charAt(0).toUpperCase() + e.summary.slice(1).toLowerCase();
                const typeMesse = e.summary.toLowerCase().includes('chantée')  ? 'Messe chantée'
                                : e.summary.toLowerCase().includes('anticipée') ? 'Messe anticipée'
                                : 'Messe lue';

                // Bandeau ordo — affiché sur le premier panneau seulement
                const ordoHtml = (idx === 0 && fete) ? `
                    <div class="chancel-ordo bg-${couleur}">
                        <span class="ordo-pip ${couleur}"></span>
                        <span class="ordo-fete">${fete}</span>
                        <span class="ordo-classe">${CLASSE_LABEL[classe] || classe || ''}</span>
                    </div>` : '';

                // Carte de chœur
                let choeurHTML = '';
                if (intention) {
                    const icone = intention.type_intention === 'Défunt' ? '✝️'
                                : intention.type_intention === 'Vivant' ? '🙏' : '✨';
                    choeurHTML = `
                        <div class="choeur-card">
                            <span class="choeur-rubric">Intention de Messe</span>
                            <span class="choeur-intention">${intention.nom_intention}
                                <span class="choeur-type-badge">${icone}</span>
                            </span>
                        </div>`;
                } else {
                    choeurHTML = `
                        <div class="choeur-card">
                            <span class="choeur-rubric">Intention de Messe</span>
                            <span class="choeur-vide">🕯️ Pas d'intention assignée</span>
                        </div>`;
                }

                // Bouton propre sur le premier panneau seulement
                const proprebtnPanel = (idx === 0 && proprebtn)
                    ? `<div style="padding:0 18px 16px;">${proprebtn}</div>`
                    : '';

                return `
                    <div class="chancel-panel classe-${classe || 'III'}" style="animation-delay:${idx*.1}s">
                        ${ordoHtml}
                        <div class="chancel-top">
                            <div class="chancel-heure">${h}<small>h&nbsp;${m}</small></div>
                            <div class="chancel-info">
                                <div class="chancel-nom">${nomMesse}</div>
                                <div class="chancel-type">${typeMesse}</div>
                            </div>
                        </div>
                        ${choeurHTML}
                        ${proprebtnPanel}
                    </div>`;
            }).join("");

        } catch (err) {
            console.error(err);
            listDiv.innerHTML = `<div class="offices-loading" style="color:var(--rubric);">Erreur de chargement des offices.</div>`;
        }
    }

    async function demanderPermissionNotification() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        if (Notification.permission === 'default') {
            setTimeout(async () => {
                const perm = await Notification.requestPermission();
                if (perm === 'granted') AppModal.alert('🔔','Notifications activées',"Vous serez averti dès qu'une nouvelle intention arrive.");
            }, 2000);
        }
    }

    async function lancerAction(action) {
        const btnId  = 'btn-' + action;
        const iconId = 'icon-' + action;
        const btn  = document.getElementById(btnId);
        const icon = document.getElementById(iconId);
        btn.disabled = true;
        icon.textContent = '⏳';
        showToast('⏳ Script lancé — patientez 10-15 secondes…');
        try {
            await fetch(APPS_SCRIPT_URL + '?action=' + action, { mode: 'no-cors' });
            icon.textContent = '✅';
            showToast('✅ Terminé');
            setTimeout(() => {
                if (action === 'importer') countPendingIntentionsAvecNotif();
                icon.textContent = action === 'importer' ? '📥' : '📤';
                btn.disabled = false;
            }, 3000);
        } catch(e) {
            icon.textContent = '❌';
            showToast("❌ Erreur — vérifiez l'URL du script");
            btn.disabled = false;
        }
    }

    window.onload = function() {
        initDashboard();
        demanderPermissionNotification();
        setInterval(() => { countPendingIntentionsAvecNotif(); getTodayMasses(); }, 5*60*1000);
    };
    </script>
    <script>
    // ── Propre de la Messe — Accueil ───────────────────────
    var _propreAccLang = 'la';
    var _propreAccData = null;
    var _propreAccBaseKey = null;

    var PIECE_COLORS_ACC = {
        introit:'#4a2a1a', collecte:'#5a3e1b', epitre:'#2a3a2a',
        graduel:'#3a1a4a', trait:'#3a1a4a', alleluia:'#3a1a4a',
        evangile:'#8b1a1a', offertoire:'#1a3a5a', secrete:'#5a3e1b',
        preface:'#4a2a1a', communion:'#1a1108', postcommunion:'#5a3e1b'
    };

    var MULTI_MESSES_ACC = {
        'temporal/1/0': [
            { key: 'temporal/1/0',  label: 'Messe de Minuit' },
            { key: 'temporal/1/0b', label: 'Messe de l\'Aurore' },
            { key: 'temporal/1/0c', label: 'Messe du Jour' }
        ],
        'sanctoral/11/2': [
            { key: 'sanctoral/11/2',  label: '1re Messe' },
            { key: 'sanctoral/11/2b', label: '2e Messe' },
            { key: 'sanctoral/11/2c', label: '3e Messe' }
        ]
    };

    var COMMUN_KEYS_ACC = {
        martyr: 'sanctoral/1/13', martyrs: 'sanctoral/1/15',
        confesseur_pont: 'sanctoral/1/4', confesseur: 'sanctoral/1/1',
        vierge: 'sanctoral/10/3', veuve: 'sanctoral/10/8'
    };

    function getCommunKeyAcc(ordo) {
        if (!ordo || ordo.source !== 'sanctoral') return null;
        var fete = (ordo.fete || '').toLowerCase();
        var col  = (ordo.couleur || '').toLowerCase();
        if (col === 'rouge') return fete.includes('martyrs') ? COMMUN_KEYS_ACC.martyrs : COMMUN_KEYS_ACC.martyr;
        if (fete.includes('pape') || fete.includes('évêque') || fete.includes('archevêque')) return COMMUN_KEYS_ACC.confesseur_pont;
        if (fete.includes('vierge') && !fete.includes('martyr')) return COMMUN_KEYS_ACC.vierge;
        if (fete.includes('reine') || fete.includes('veuve')) return COMMUN_KEYS_ACC.veuve;
        return COMMUN_KEYS_ACC.confesseur;
    }

    function escHA(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderPropreAccPieces() {
        var c = document.getElementById('propre-acc-pieces');
        if (!_propreAccData) {
            c.innerHTML = '<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;">Propre non disponible.</div>';
            return;
        }
        c.innerHTML = _propreAccData.map(function(p) {
            var txt = (_propreAccLang === 'la' ? p.text_la : p.text_fr) || (_propreAccLang === 'la' ? p.text_fr : p.text_la) || '';
            var col = PIECE_COLORS_ACC[p.part_code] || '#1a1108';
            var ref = p.reference ? '<span style="font-size:.85em;color:#8b7355;font-style:italic;margin-left:8px;">' + escHA(p.reference) + '</span>' : '';
            var badge = p._du_commun ? '<span style="font-size:.7em;color:#8b7355;font-style:italic;margin-left:8px;font-family:\'EB Garamond\',serif;text-transform:none;letter-spacing:0;">du commun</span>' : '';
            return '<div>'
                + '<div style="font-family:\'Cinzel\',serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:'+col+';border-bottom:1px solid '+col+'22;padding-bottom:4px;margin-bottom:8px;display:flex;align-items:baseline;gap:4px;">'
                + '<span>' + escHA(p.part_label.replace(' (commun)','')) + '</span>' + ref + badge
                + '</div>'
                + '<div style="font-size:1.05rem;line-height:1.75;color:#1a1108;white-space:pre-wrap;">' + escHA(txt) + '</div>'
                + '</div>';
        }).join('');
    }

    function setPropraAccLang(lang) {
        _propreAccLang = lang;
        document.getElementById('propre-acc-btn-la').style.background = lang === 'la' ? '#b8962a' : 'transparent';
        document.getElementById('propre-acc-btn-la').style.color      = lang === 'la' ? '#fff' : '#b8962a';
        document.getElementById('propre-acc-btn-fr').style.background = lang === 'fr' ? '#b8962a' : 'transparent';
        document.getElementById('propre-acc-btn-fr').style.color      = lang === 'fr' ? '#fff' : '#b8962a';
        renderPropreAccPieces();
    }

    function renderMultiAcc(baseKey, activeKey) {
        var sel = document.getElementById('propre-acc-multi');
        var cfg = MULTI_MESSES_ACC[baseKey];
        if (!cfg) { sel.style.display = 'none'; return; }
        sel.style.display = 'flex';
        sel.innerHTML = cfg.map(function(m) {
            var active = m.key === activeKey;
            return '<button onclick="switchMesseAcc(\'' + m.key + '\',\'' + baseKey + '\')" style="'
                + 'padding:6px 12px;border:none;cursor:pointer;font-family:\'Cinzel\',serif;font-size:.62rem;letter-spacing:.06em;'
                + 'background:' + (active ? '#8b1a1a' : 'transparent') + ';'
                + 'color:' + (active ? '#fff' : '#8b1a1a') + ';">'
                + m.label + '</button>';
        }).join('');
    }

    async function switchMesseAcc(newKey, baseKey) {
        document.getElementById('propre-acc-pieces').innerHTML = '<div style="text-align:center;padding:40px;color:#8b7355;font-size:.85rem;">Chargement…</div>';
        renderMultiAcc(baseKey, newKey);
        var cfg = MULTI_MESSES_ACC[baseKey];
        var m = cfg && cfg.find(function(x){ return x.key === newKey; });
        if (m) document.getElementById('propre-acc-fete').textContent =
            document.getElementById('propre-acc-fete').textContent.split(' — ')[0] + ' — ' + m.label;
        var resp = await maConnexion.from('propers')
            .select('part_code, part_label, reference, text_la, text_fr, display_order')
            .eq('mass_key', newKey).order('display_order', { ascending: true });
        _propreAccData = resp.data && resp.data.length ? resp.data : null;
        renderPropreAccPieces();
    }

    async function ouvrirPropreAccueil(isoDate) {
        var parts = isoDate.split('-').map(Number);
        var ordo  = Ordo1962.getDay(parts[0], parts[1], parts[2]);
        var massKey = (typeof Ordo1962.getProperKey === 'function') ? Ordo1962.getProperKey(ordo) : null;
        var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
        var d = new Date(parts[0], parts[1]-1, parts[2]);

        document.getElementById('propre-acc-date').textContent =
            d.getDate() + ' ' + mois[d.getMonth()] + ' ' + parts[0];
        document.getElementById('propre-acc-fete').textContent = ordo && ordo.fete ? ordo.fete : '';
        document.getElementById('propre-acc-pieces').innerHTML =
            '<div style="text-align:center;padding:40px;color:#8b7355;font-size:.85rem;">Chargement…</div>';
        document.getElementById('modal-propre-acc').style.display = 'flex';

        if (!massKey) {
            document.getElementById('propre-acc-multi').style.display = 'none';
            document.getElementById('propre-acc-pieces').innerHTML =
                '<div style="text-align:center;padding:30px;color:#8b7355;font-style:italic;">Propre non disponible pour ce jour.</div>';
            return;
        }

        _propreAccBaseKey = massKey;
        renderMultiAcc(massKey, massKey);
        if (MULTI_MESSES_ACC[massKey]) {
            document.getElementById('propre-acc-fete').textContent =
                (ordo && ordo.fete ? ordo.fete : '') + ' — ' + MULTI_MESSES_ACC[massKey][0].label;
        }

        try {
            var resp = await maConnexion.from('propers')
                .select('part_code, part_label, reference, text_la, text_fr, display_order')
                .eq('mass_key', massKey).order('display_order', { ascending: true });
            if (resp.error) throw resp.error;
            var data = resp.data && resp.data.length ? resp.data : null;

            // Fallback commun des saints
            if (data && ordo && ordo.source === 'sanctoral') {
                var codes = new Set(data.map(function(p){ return p.part_code; }));
                var attendus = ['introit','collecte','epitre','graduel','evangile','offertoire','secrete','communion','postcommunion'];
                var manquants = attendus.filter(function(p){ return !codes.has(p); });
                if (manquants.length > 0) {
                    var communKey = getCommunKeyAcc(ordo);
                    if (communKey) {
                        var rc = await maConnexion.from('propers')
                            .select('part_code, part_label, reference, text_la, text_fr, display_order')
                            .eq('mass_key', communKey).in('part_code', manquants);
                        if (!rc.error && rc.data && rc.data.length) {
                            var communPieces = rc.data.map(function(p){ return Object.assign({}, p, {_du_commun:true, part_label: p.part_label + ' (commun)'}); });
                            data = data.concat(communPieces).sort(function(a,b){ return a.display_order - b.display_order; });
                        }
                    }
                }
            }

            _propreAccData = data;
            renderPropreAccPieces();
        } catch(e) {
            document.getElementById('propre-acc-pieces').innerHTML =
                '<div style="color:#8b1a1a;padding:20px;">Erreur : ' + escHA(String(e.message||e)) + '</div>';
        }
    }

    function fermerPropreAcc() {
        document.getElementById('modal-propre-acc').style.display = 'none';
        _propreAccData = null;
    }

    // Fermer en cliquant sur le fond
    document.getElementById('modal-propre-acc').addEventListener('click', function(e) {
        if (e.target === this) fermerPropreAcc();
    });
    </script>
