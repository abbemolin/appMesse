<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tableau de bord — Messes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1108">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/192/4f46e5/cross.png">
    <link rel="stylesheet" href="style.css">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <div class="page-header">
            <span class="rubric-tag">Paroisse La Croix Glorieuse</span>
            <h1>Tableau de bord</h1>
            <div class="ornament">✦ ✦ ✦</div>
            <div class="status-row">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text" class="status-text">Connexion&hellip;</span>
            </div>
        </div>

        <div class="cards-grid">
            <div class="card">
                <span class="card-label">En attente</span>
                <div id="pending-intentions" class="card-number">&mdash;</div>
                <a href="intentions.html" class="btn-link">Traiter</a>
            </div>
            <div class="card">
                <span class="card-label" id="label-annee">Messes</span>
                <div id="count-annee" class="card-number">&mdash;</div>
                <a href="calendrier.html" class="btn-link">Calendrier</a>
            </div>
            <div class="card card-full">
                <span class="card-label">Offices du jour</span>
                <div id="today-masses-list">
                    <p style="color:var(--ink-muted);font-size:.88rem;margin:0;font-style:italic;">Chargement&hellip;</p>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
    const GOOGLE_API_KEY = "AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ";
    const CALENDAR_ID    = "saintlouisenville67@gmail.com";

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function initDashboard() {
        if (typeof maConnexion === "undefined") { setTimeout(initDashboard, 500); return; }
        try {
            const { error } = await maConnexion.from("intentions").select("id").limit(1);
            if (error) throw error;
            document.getElementById("status-dot").style.background = "#4a7c59";
            document.getElementById("status-text").textContent = "Base de données prête";
            countPendingIntentionsAvecNotif();
            countAnnee();
            getTodayMasses();
        } catch (err) {
            document.getElementById("status-dot").style.background = "var(--rubric)";
            document.getElementById("status-text").textContent = "Erreur de connexion";
        }
    }

    async function countAnnee() {
        const year = new Date().getFullYear();
        const { count } = await maConnexion.from("intentions")
            .select("*", { count: "exact", head: true })
            .eq("statut", "valide").like("date_messe", year + "%");
        document.getElementById("label-annee").textContent = "Messes " + year;
        document.getElementById("count-annee").textContent = count || 0;
    }

    async function getTodayMasses() {
        const listDiv = document.getElementById("today-masses-list");
        try {
            const today = new Date();
            const tzOffset = today.getTimezoneOffset() * 60000;
            const localISODate = (new Date(today - tzOffset)).toISOString().split("T")[0];
            today.setHours(0,0,0,0);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
            const { data: intentions } = await maConnexion.from("intentions")
                .select("*").eq("date_messe", localISODate).eq("statut", "valide");
            const url = "https://www.googleapis.com/calendar/v3/calendars/" + CALENDAR_ID +
                "/events?key=" + GOOGLE_API_KEY +
                "&timeMin=" + today.toISOString() + "&timeMax=" + tomorrow.toISOString() +
                "&singleEvents=true&orderBy=startTime";
            const data = await (await fetch(url)).json();
            const estUneMesse = e => ["messe","messe chantée","messe anticipée"].includes(e.summary.toLowerCase().trim());
            const messes = (data.items || []).filter(estUneMesse);
            if (messes.length === 0) {
                listDiv.innerHTML = "<p style='color:var(--ink-muted);font-size:.88rem;margin:0;font-style:italic;'>Aucune messe aujourd\u2019hui.</p>";
                return;
            }
            listDiv.innerHTML = messes.map(e => {
                const dateObj = new Date(e.start.dateTime || e.start.date);
                const heureGo = dateObj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
                let intention = (intentions || []).find(i => i.google_event_id === e.id);
                if (!intention) intention = (intentions || []).find(i => (i.heure_messe || "").substring(0,5) === heureGo.substring(0,5));
                const emoji = !intention ? "" : (intention.type_intention === "Défunt" ? "✝️" : intention.type_intention === "Vivant" ? "🙏" : "✨");
                const chip = intention
                    ? "<span class='intention-chip'>" + emoji + " " + intention.nom_intention + "</span>"
                    : "<span class='intention-chip vide'>🕯️ Pas d\u2019intention</span>";
                return "<div class='messe-item-home'>" +
                    "<div><span class='messe-heure'>" + heureGo.replace(":", "h") + "</span>" +
                    " <span class='messe-titre'>" + e.summary + "</span></div>" +
                    chip + "</div>";
            }).join("");
        } catch (err) {
            listDiv.innerHTML = "<p style='color:var(--rubric);font-size:.85rem;margin:0;font-style:italic;'>Erreur de chargement.</p>";
        }
    }

    let lastKnownCount = -1;

    async function demanderPermissionNotification() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        if (Notification.permission === 'default') {
            setTimeout(async () => {
                const perm = await Notification.requestPermission();
                if (perm === 'granted') AppModal.alert('🔔', 'Notifications activées', 'Vous serez averti dès qu\'une nouvelle intention arrive.');
            }, 2000);
        }
    }

    async function verifierNouvellesIntentions(count) {
        if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') return;
        const sw = await navigator.serviceWorker.ready;
        sw.active.postMessage({ type: 'CHECK_INTENTIONS', count, lastCount: lastKnownCount });
        lastKnownCount = count;
    }

    async function countPendingIntentionsAvecNotif() {
        const { count } = await maConnexion.from('intentions')
            .select('*', { count: 'exact', head: true }).eq('statut', 'en_attente');
        const n = count || 0;
        document.getElementById('pending-intentions').textContent = n;
        verifierNouvellesIntentions(n);
    }

    window.onload = function() {
        initDashboard();
        demanderPermissionNotification();
        setInterval(function() {
            countPendingIntentionsAvecNotif();
            countAnnee();
            getTodayMasses();
        }, 5 * 60 * 1000);
    };
    </script>
</body>
</html>
