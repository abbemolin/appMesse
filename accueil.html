<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tableau de bord — Messes</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1108">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/192/4f46e5/cross.png">
    <link rel="stylesheet" href="style.css">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
    <style>
    /* ── En-tête ───────────────────────────────── */
    .db-header {
        text-align: center;
        padding: 24px 0 18px;
        position: relative;
    }
    .db-paroisse {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .28em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 10px;
    }
    .db-cross {
        display: block;
        margin: 0 auto 10px;
        opacity: .13;
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 0;
    }
    .db-title-wrap { position: relative; z-index: 1; }
    .db-title {
        font-family: 'Cinzel', serif;
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: .09em;
        text-transform: uppercase;
        margin: 0 0 2px;
        line-height: 1.1;
    }
    .db-date {
        font-family: 'EB Garamond', serif;
        font-size: .9rem;
        color: var(--ink-muted);
        font-style: italic;
        letter-spacing: .04em;
        margin: 6px 0 0;
    }
    .db-ornament {
        color: var(--gold);
        font-size: .65rem;
        letter-spacing: .55em;
        margin: 10px 0 0;
        opacity: .75;
    }
    .db-status {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    /* ── Bandeau intentions en attente ─────────── */
    .pending-banner {
        margin: 4px 0 20px;
        border: 1px solid var(--border);
        border-top: 3px solid var(--gold);
        border-radius: 2px;
        background: var(--vellum-light);
        padding: 22px 20px 18px;
        text-align: center;
        position: relative;
        box-shadow: 0 2px 12px var(--shadow);
        overflow: hidden;
    }
    /* filigrane croix derrière le chiffre */
    .pending-banner::before {
        content: '✝';
        position: absolute;
        font-size: 9rem;
        color: var(--gold);
        opacity: .045;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Cinzel', serif;
        pointer-events: none;
        line-height: 1;
    }
    .pending-label {
        font-family: 'Cinzel', serif;
        font-size: .58rem;
        letter-spacing: .24em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 8px;
        position: relative;
    }
    .pending-number {
        font-family: 'Cinzel', serif;
        font-size: 5.5rem;
        font-weight: 700;
        color: var(--ink);
        line-height: 1;
        position: relative;
        display: block;
        letter-spacing: -.02em;
    }
    .pending-number.has-pending {
        color: var(--rubric);
        text-shadow: 0 2px 16px rgba(139,26,26,.18);
    }
    .pending-sub {
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        color: var(--ink-muted);
        font-style: italic;
        margin-top: 4px;
        position: relative;
        display: block;
    }
    .pending-rule {
        border: none;
        border-top: 1px solid var(--border-soft);
        margin: 14px 0 12px;
        position: relative;
    }
    .pending-rule::before {
        content: '✦';
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        background: var(--vellum-light);
        padding: 0 8px;
        color: var(--gold);
        font-size: .55rem;
    }
    .pending-cta {
        display: inline-block;
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .16em;
        color: var(--rubric);
        text-decoration: none;
        text-transform: uppercase;
        padding: 9px 22px;
        border: 1px solid var(--border-soft);
        border-radius: 2px;
        transition: all .2s;
        position: relative;
    }
    .pending-cta:hover {
        border-color: var(--border);
        background: var(--gold-pale);
        color: var(--ink);
    }
    .pending-cta::after { content: ' →'; }

    /* ── Panneau offices du jour ────────────────── */
    .offices-section {
        margin-bottom: 8px;
    }
    .offices-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
    }
    .offices-title {
        font-family: 'Cinzel', serif;
        font-size: .62rem;
        letter-spacing: .22em;
        color: var(--rubric);
        text-transform: uppercase;
        flex: 1;
    }
    .offices-rule {
        flex: 1;
        border: none;
        border-top: 1px solid var(--border-soft);
        margin: 0;
    }
    .offices-rule-left { max-width: 20px; }

    /* Bloc "panneau de chancel" pour chaque messe */
    .chancel-panel {
        background: var(--vellum-light);
        border: 1px solid var(--border-soft);
        border-top: 3px solid var(--ink);
        border-radius: 2px;
        margin-bottom: 14px;
        box-shadow: 0 2px 10px var(--shadow);
        overflow: hidden;
        animation: fadeInUp .4s ease both;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Ligne heure + titre */
    .chancel-top {
        display: flex;
        align-items: center;
        gap: 0;
        border-bottom: 1px solid var(--border-soft);
    }
    .chancel-heure {
        font-family: 'Cinzel', serif;
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--rubric);
        line-height: 1;
        padding: 14px 18px 14px 18px;
        border-right: 1px solid var(--border-soft);
        min-width: 90px;
        text-align: center;
        background: rgba(139,26,26,.04);
        letter-spacing: -.02em;
    }
    .chancel-heure small {
        display: block;
        font-size: .52rem;
        letter-spacing: .18em;
        color: var(--rubric);
        opacity: .7;
        margin-top: 3px;
        font-weight: 400;
    }
    .chancel-info {
        padding: 12px 16px;
        flex: 1;
    }
    .chancel-nom {
        font-family: 'EB Garamond', serif;
        font-size: 1rem;
        font-style: italic;
        color: var(--ink);
        font-weight: 600;
        line-height: 1.3;
    }
    .chancel-type {
        font-family: 'Cinzel', serif;
        font-size: .52rem;
        letter-spacing: .14em;
        color: var(--ink-muted);
        text-transform: uppercase;
        margin-top: 3px;
    }

    /* Carte de chœur — intention */
    .choeur-card {
        margin: 0;
        padding: 11px 18px 13px;
        background: var(--vellum);
        border-top: 1px dashed var(--border-soft);
        position: relative;
    }
    .choeur-card::before {
        content: '';
        position: absolute;
        inset: 5px 5px 5px 5px;
        border: 1px solid var(--border);
        border-radius: 1px;
        opacity: .12;
        pointer-events: none;
    }
    .choeur-rubric {
        font-family: 'Cinzel', serif;
        font-size: .52rem;
        letter-spacing: .2em;
        color: var(--rubric);
        text-transform: uppercase;
        display: block;
        margin-bottom: 5px;
        opacity: .8;
    }
    .choeur-intention {
        font-family: 'EB Garamond', serif;
        font-size: .98rem;
        font-style: italic;
        color: var(--ink);
        line-height: 1.45;
    }
    .choeur-type-badge {
        display: inline-block;
        margin-left: 6px;
        font-size: .72rem;
        vertical-align: middle;
    }
    .choeur-vide {
        font-family: 'EB Garamond', serif;
        font-size: .88rem;
        font-style: italic;
        color: var(--ink-muted);
        opacity: .75;
    }

    /* État chargement */
    .offices-loading {
        text-align: center;
        padding: 32px 0;
        color: var(--ink-muted);
        font-style: italic;
        font-size: .9rem;
    }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <main>
        <!-- En-tête -->
        <div class="db-header">
            <svg class="db-cross" width="160" height="200" viewBox="0 0 160 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="66" y="0" width="28" height="200" fill="#b8962a"/>
                <rect x="0" y="55" width="160" height="28" fill="#b8962a"/>
            </svg>
            <div class="db-title-wrap">
                <span class="db-paroisse">Paroisse La Croix Glorieuse</span>
                <div class="db-title">Tableau de bord</div>
                <div id="db-date" class="db-date"></div>
                <div class="db-ornament">✦ ✦ ✦</div>
                <div class="db-status">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text" class="status-text">Connexion&hellip;</span>
                </div>
            </div>
        </div>

        <!-- Bandeau intentions en attente -->
        <div class="pending-banner">
            <span class="pending-label">Intentions en attente de traitement</span>
            <span id="pending-intentions" class="pending-number">&mdash;</span>
            <span id="pending-sub" class="pending-sub">&nbsp;</span>
            <hr class="pending-rule">
            <a href="intentions.html" class="pending-cta">Traiter les demandes</a>
        </div>

        <!-- Offices du jour -->
        <div class="offices-section">
            <div class="offices-header">
                <hr class="offices-rule offices-rule-left">
                <span class="offices-title">✝ Offices du jour</span>
                <hr class="offices-rule">
            </div>
            <div id="today-masses-list">
                <div class="offices-loading">Chargement&hellip;</div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="modal.js"></script>
    <script>
    const GOOGLE_API_KEY = "AIzaSyAI5N6lamviexKaPR-WoOP4006m5IClDoQ";
    const CALENDAR_ID    = "saintlouisenville67@gmail.com";

    // ── Date liturgique ─────────────────────────────
    (function() {
        const now  = new Date();
        const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
        const mois  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
        const txt = jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()] + ' ' + now.getFullYear();
        document.getElementById('db-date').textContent = txt;
    })();

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function initDashboard() {
        if (typeof maConnexion === "undefined") { setTimeout(initDashboard, 500); return; }
        try {
            const { error } = await maConnexion.from("intentions").select("id").limit(1);
            if (error) throw error;
            document.getElementById("status-dot").style.background = "#4a7c59";
            document.getElementById("status-text").textContent = "Base de données prête";
            countPendingIntentionsAvecNotif();
            getTodayMasses();
        } catch (err) {
            document.getElementById("status-dot").style.background = "var(--rubric)";
            document.getElementById("status-text").textContent = "Erreur de connexion";
        }
    }

    let lastKnownCount = -1;

    async function countPendingIntentionsAvecNotif() {
        const { count } = await maConnexion.from('intentions')
            .select('*', { count: 'exact', head: true }).eq('statut', 'en_attente');
        const n = count || 0;
        const el  = document.getElementById('pending-intentions');
        const sub = document.getElementById('pending-sub');
        el.textContent = n;
        if (n > 0) {
            el.classList.add('has-pending');
            sub.textContent = n === 1 ? 'demande attend votre réponse' : 'demandes attendent votre réponse';
        } else {
            el.classList.remove('has-pending');
            sub.textContent = 'Aucune demande en attente';
        }
        // notifications
        if ('serviceWorker' in navigator && Notification.permission === 'granted') {
            const sw = await navigator.serviceWorker.ready;
            sw.active.postMessage({ type: 'CHECK_INTENTIONS', count: n, lastCount: lastKnownCount });
        }
        lastKnownCount = n;
    }

    async function getTodayMasses() {
        const listDiv = document.getElementById("today-masses-list");
        try {
            const today = new Date();
            const tzOffset = today.getTimezoneOffset() * 60000;
            const localISODate = (new Date(today - tzOffset)).toISOString().split("T")[0];
            today.setHours(0,0,0,0);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

            const { data: intentions } = await maConnexion.from("intentions")
                .select("*").eq("date_messe", localISODate).eq("statut", "valide");

            const url = "https://www.googleapis.com/calendar/v3/calendars/" + CALENDAR_ID
                + "/events?key=" + GOOGLE_API_KEY
                + "&timeMin=" + today.toISOString()
                + "&timeMax=" + tomorrow.toISOString()
                + "&singleEvents=true&orderBy=startTime";
            const data = await (await fetch(url)).json();

            const estUneMesse = e => ["messe","messe chantée","messe anticipée"]
                .includes(e.summary.toLowerCase().trim());
            const messes = (data.items || []).filter(estUneMesse);

            if (messes.length === 0) {
                listDiv.innerHTML = `
                    <div class="chancel-panel" style="border-top-color:var(--border-soft);">
                        <div style="padding:20px 18px;text-align:center;color:var(--ink-muted);font-style:italic;font-size:.92rem;">
                            🕯️ Aucune messe célébrée aujourd'hui
                        </div>
                    </div>`;
                return;
            }

            listDiv.innerHTML = messes.map((e, idx) => {
                const dateObj = new Date(e.start.dateTime || e.start.date);
                const hh = dateObj.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
                const [h, m] = hh.split(":");

                // Trouver l'intention associée
                let intention = (intentions || []).find(i => i.google_event_id === e.id);
                if (!intention) intention = (intentions || []).find(i =>
                    (i.heure_messe || "").substring(0,5) === hh.substring(0,5));

                const nomMesse = e.summary.charAt(0).toUpperCase() + e.summary.slice(1).toLowerCase();

                // Type de messe pour le sous-titre
                const typeMesse = e.summary.toLowerCase().includes('chantée') ? 'Messe chantée'
                    : e.summary.toLowerCase().includes('anticipée') ? 'Messe anticipée'
                    : 'Messe lue';

                // Carte de chœur — intention
                let choeurHTML = '';
                if (intention) {
                    const icone = intention.type_intention === 'Défunt' ? '✝️'
                        : intention.type_intention === 'Vivant' ? '🙏' : '✨';
                    choeurHTML = `
                        <div class="choeur-card">
                            <span class="choeur-rubric">Intention de Messe</span>
                            <span class="choeur-intention">
                                ${intention.nom_intention}
                                <span class="choeur-type-badge">${icone}</span>
                            </span>
                        </div>`;
                } else {
                    choeurHTML = `
                        <div class="choeur-card">
                            <span class="choeur-rubric">Intention de Messe</span>
                            <span class="choeur-vide">🕯️ Pas d'intention assignée</span>
                        </div>`;
                }

                return `
                    <div class="chancel-panel" style="animation-delay:${idx * .1}s">
                        <div class="chancel-top">
                            <div class="chancel-heure">
                                ${h}<small>h ${m}</small>
                            </div>
                            <div class="chancel-info">
                                <div class="chancel-nom">${nomMesse}</div>
                                <div class="chancel-type">${typeMesse}</div>
                            </div>
                        </div>
                        ${choeurHTML}
                    </div>`;
            }).join("");

        } catch (err) {
            listDiv.innerHTML = `<div class="offices-loading" style="color:var(--rubric);">Erreur de chargement des offices.</div>`;
        }
    }

    async function demanderPermissionNotification() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        if (Notification.permission === 'default') {
            setTimeout(async () => {
                const perm = await Notification.requestPermission();
                if (perm === 'granted') AppModal.alert('🔔', 'Notifications activées', "Vous serez averti dès qu'une nouvelle intention arrive.");
            }, 2000);
        }
    }

    window.onload = function() {
        initDashboard();
        demanderPermissionNotification();
        setInterval(function() {
            countPendingIntentionsAvecNotif();
            getTodayMasses();
        }, 5 * 60 * 1000);
    };
    </script>
</body>
</html>
